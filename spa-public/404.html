<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // Plain static servers (Python http.server, etc.) can't do SPA
    // fallback rewrites.  Store the original path so the SPA can
    // recover it via history.replaceState after the redirect, then
    // go to the app root where BrowserRouter takes over.
    sessionStorage.setItem('__aether_redirect', location.pathname + location.search + location.hash);
    location.replace('/v2/');
  </script>
</head>
<body>
  <a href="/v2/">Click here if you are not redirected automatically.</a>
</body>
</html>

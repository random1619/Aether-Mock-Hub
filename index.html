<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aether Mocks — a premium computer-based test platform. Browse, search, and conquer 1,000+ mock tests with a focused, professional exam experience." />
    <title>Aether Mocks — Premium CBT Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- KaTeX stylesheet: vendor question/solution HTML ships pre-rendered .katex markup -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <script>
      // Apply saved theme before first paint (light is default).
      (function () {
        try {
          var db = JSON.parse(localStorage.getItem('aether-db') || 'null');
          var t = (db && db.settings && db.settings.theme) || 'light';
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

      ],
      "correctIndex": 3,
      "explanation": "The &quot;exit policy&quot; introduced as part of India&#x27;s industrial and economic reforms primarily aimed to permit firms to close down unviable, chronically loss-making operations and easily retrench surplus labor. This policy was essential for improving industrial efficiency and resource reallocation. / \u092d\u093e\u0930\u0924 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0914\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0939\u093f\u0938\u094d\u0938\u0947 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092a\u0947\u0936 \u0915\u0940 \u0917\u0908 &quot;\u0928\u093f\u0915\u093e\u0938 \u0928\u0940\u0924\u093f&quot; (exit policy) \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u092b\u0930\u094d\u092e\u094b\u0902 \u0915\u094b \u0905\u0932\u093e\u092d\u0915\u093e\u0930\u0940, \u0932\u0917\u093e\u0924\u093e\u0930 \u0928\u0941\u0915\u0938\u093e\u0928 \u092e\u0947\u0902 \u091a\u0932 \u0930\u0939\u0947 \u0915\u093e\u0930\u094d\u092f\u094b\u0902 \u0915\u094b \u092c\u0902\u0926 \u0915\u0930\u0928\u0947 \u0914\u0930 \u0905\u0924\u093f\u0930\u093f\u0915\u094d\u0924 \u0936\u094d\u0930\u092e \u0915\u094b \u0906\u0938\u093e\u0928\u0940 \u0938\u0947 \u0939\u091f\u093e\u0928\u0947 \u0915\u0940 \u0905\u0928\u0941\u092e\u0924\u093f \u0926\u0947\u0928\u093e \u0925\u093e\u0964 \u092f\u0939 \u0928\u0940\u0924\u093f \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0926\u0915\u094d\u0937\u0924\u093e \u0914\u0930 \u0938\u0902\u0938\u093e\u0927\u0928 \u092a\u0941\u0928: \u0906\u0935\u0902\u091f\u0928 \u092e\u0947\u0902 \u0938\u0941\u0927\u093e\u0930 \u0915\u0947 \u0932\u093f\u090f \u0906\u0935\u0936\u094d\u092f\u0915 \u0925\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q45.</b> Q207. Which plan emphasized heavy industries and public sector development using Mahalanobis model? / \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0924\u0947 \u0939\u0941\u090f \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0914\u0930 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u0915\u093f\u0938 \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e? [Head Constable (AWO)/(TPO) in Delhi Police Examination, 2025, 16 Jan 2026, Shift-2]",
      "options": [
        "First Five-Year Plan / \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Seventh Five-Year Plan / \u0938\u093e\u0924\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Second Five-Year Plan / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Third Five-Year Plan / \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The Second Five-Year Plan (1956-1961) was explicitly based on the Mahalanobis model. It aggressively emphasized rapid industrialization, particularly the development of basic and heavy industries (like steel plants at Bhilai, Durgapur, and Rourkela) driven strictly by the state-owned public sector. / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-1961) \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0925\u0940\u0964 \u0907\u0938\u0928\u0947 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u092a\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e, \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 (\u091c\u0948\u0938\u0947 \u092d\u093f\u0932\u093e\u0908, \u0926\u0941\u0930\u094d\u0917\u093e\u092a\u0941\u0930 \u0914\u0930 \u0930\u093e\u0909\u0930\u0915\u0947\u0932\u093e \u092e\u0947\u0902 \u0938\u094d\u091f\u0940\u0932 \u092a\u094d\u0932\u093e\u0902\u091f) \u0915\u0947 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u091c\u094b \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u0902\u091a\u093e\u0932\u093f\u0924 \u0939\u094b\u0924\u0947 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q46.</b> Q208. Which of the following reflects the core shift in planning ideology after the 1991 reforms? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u092c\u093e\u0926 \u0928\u093f\u092f\u094b\u091c\u0928 \u0935\u093f\u091a\u093e\u0930\u0927\u093e\u0930\u093e (planning ideology) \u092e\u0947\u0902 \u092e\u0941\u0916\u094d\u092f \u092c\u0926\u0932\u093e\u0935 \u0915\u094b \u0926\u0930\u094d\u0936\u093e\u0924\u093e \u0939\u0948? [Head Constable (AWO)/(TPO) in Delhi Police Examination, 2025, 20 Jan 2026, Shift-1]",
      "options": [
        "From directive to indicative planning / \u0906\u0926\u0947\u0936\u093e\u0924\u094d\u092e\u0915 (directive) \u0938\u0947 \u0938\u093e\u0902\u0915\u0947\u0924\u093f\u0915 (indicative) \u092f\u094b\u091c\u0928\u093e \u0915\u0940 \u0913\u0930",
        "From mixed to command economy / \u092e\u093f\u0936\u094d\u0930\u093f\u0924 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0938\u0947 \u0906\u0926\u0947\u0936 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e (command economy) \u0915\u0940 \u0913\u0930",
        "From production to employment-centric planning / \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0938\u0947 \u0930\u094b\u091c\u0917\u093e\u0930-\u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0928\u093f\u092f\u094b\u091c\u0928 \u0915\u0940 \u0913\u0930",
        "From indicative to directive planning / \u0938\u093e\u0902\u0915\u0947\u0924\u093f\u0915 (indicative) \u0938\u0947 \u0906\u0926\u0947\u0936\u093e\u0924\u094d\u092e\u0915 (directive) \u092f\u094b\u091c\u0928\u093e \u0915\u0940 \u0913\u0930"
      ],
      "correctIndex": 0,
      "explanation": "The historic 1991 economic reforms marked a massive paradigm shift in national economic planning. The core change was moving from &#x27;Directive Planning&#x27; (where government controlled major sectors) to &#x27;Indicative Planning&#x27; (where government acts as a facilitator while market forces drive growth). / \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1991 \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0928\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0906\u0930\u094d\u0925\u093f\u0915 \u092f\u094b\u091c\u0928\u093e \u092e\u0947\u0902 \u090f\u0915 \u092c\u0921\u093c\u0947 \u092c\u0926\u0932\u093e\u0935 \u0915\u094b \u091a\u093f\u0939\u094d\u0928\u093f\u0924 \u0915\u093f\u092f\u093e\u0964 \u092e\u0941\u0916\u094d\u092f \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 &#x27;\u0906\u0926\u0947\u0936\u093e\u0924\u094d\u092e\u0915 \u092f\u094b\u091c\u0928\u093e&#x27; (\u091c\u0939\u093e\u0902 \u0938\u0930\u0915\u093e\u0930 \u092a\u094d\u0930\u092e\u0941\u0916 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u094b \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u0915\u0930\u0924\u0940 \u0925\u0940) \u0938\u0947 &#x27;\u0938\u093e\u0902\u0915\u0947\u0924\u093f\u0915 \u092f\u094b\u091c\u0928\u093e&#x27; (\u091c\u0939\u093e\u0902 \u0938\u0930\u0915\u093e\u0930 \u090f\u0915 \u0938\u0942\u0924\u094d\u0930\u0927\u093e\u0930 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u0940 \u0939\u0948 \u091c\u092c\u0915\u093f \u092c\u093e\u091c\u093e\u0930 \u0915\u0940 \u0924\u093e\u0915\u0924\u0947\u0902 \u0935\u093f\u0915\u093e\u0938 \u0915\u094b \u0917\u0924\u093f \u0926\u0947\u0924\u0940 \u0939\u0948\u0902) \u0915\u0940 \u0913\u0930 \u092c\u0922\u093c \u0930\u0939\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q47.</b> Q209. Which Five-Year Plan officially adopted the Industrial Policy Resolution of 1956? / \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0928\u0947 1956 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a \u0915\u094b \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u092a\u0928\u093e\u092f\u093e? [Head Constable (AWO)/(TPO) in Delhi Police Examination, 2025, 20 Jan 2026, Shift-2]",
      "options": [
        "First Plan / \u092a\u0939\u0932\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Fourth Plan / \u091a\u094c\u0925\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Sixth Plan / \u091b\u0920\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Second Plan / \u0926\u0942\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "The Second Five-Year Plan (1956-1961), which was famously based on the Mahalanobis model, officially adopted the highly significant Industrial Policy Resolution (IPR) of 1956. This ambitious plan sharply shifted the national focus from agriculture to the rapid development of heavy and basic industries. / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-1961), \u091c\u094b \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0930\u0942\u092a \u0938\u0947 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0925\u0940, \u0928\u0947 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 1956 \u0915\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a (IPR) \u0915\u094b \u0905\u092a\u0928\u093e\u092f\u093e\u0964 \u0907\u0938 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0927\u094d\u092f\u093e\u0928 \u0915\u0943\u0937\u093f \u0938\u0947 \u0939\u091f\u093e\u0915\u0930 \u092d\u093e\u0930\u0940 \u0914\u0930 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0924\u0940\u0935\u094d\u0930 \u0935\u093f\u0915\u093e\u0938 \u0915\u0940 \u0913\u0930 \u092e\u094b\u0921\u093c \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q48.</b> Q210. Which of the following was NOT a direct goal of economic reforms initiated in 1991? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 1991 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u093f\u090f \u0917\u090f \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u093e \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0932\u0915\u094d\u0937\u094d\u092f \u0928\u0939\u0940\u0902 \u0925\u093e? [Head Constable (AWO)/(TPO) in Delhi Police Examination, 2025, 20 Jan 2026, Shift-3]",
      "options": [
        "Transition to market-oriented economy / \u092c\u093e\u091c\u093e\u0930-\u0909\u0928\u094d\u092e\u0941\u0916 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u092e\u0947\u0902 \u0938\u0902\u0915\u094d\u0930\u092e\u0923",
        "Promote self-reliance in defence sector / \u0930\u0915\u094d\u0937\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u092e\u0947\u0902 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e",
        "Correct balance of payments crisis / \u092d\u0941\u0917\u0924\u093e\u0928 \u0938\u0902\u0924\u0941\u0932\u0928 \u0938\u0902\u0915\u091f \u0915\u094b \u0920\u0940\u0915 \u0915\u0930\u0928\u093e",
        "Restore macroeconomic stability / \u0938\u092e\u0937\u094d\u091f\u093f-\u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u094d\u0925\u093f\u0930\u0924\u093e \u092c\u0939\u093e\u0932 \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 1,
      "explanation": "The historic 1991 LPG policies were triggered by a severe Balance of Payments (BoP) crisis. The immediate goals were to correct the BoP deficit, restore macroeconomic stability, and transition to a market-oriented economy. Promoting self-reliance specifically in the core defense sector was NOT a direct goal of this 1991 framework. / \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1991 \u0915\u0940 \u090f\u0932\u092a\u0940\u091c\u0940 \u0928\u0940\u0924\u093f\u092f\u093e\u0902 \u0917\u0902\u092d\u0940\u0930 \u092d\u0941\u0917\u0924\u093e\u0928 \u0938\u0902\u0924\u0941\u0932\u0928 (BoP) \u0938\u0902\u0915\u091f \u0938\u0947 \u0936\u0941\u0930\u0942 \u0939\u0941\u0908 \u0925\u0940\u0902\u0964 \u0924\u0924\u094d\u0915\u093e\u0932 \u0932\u0915\u094d\u0937\u094d\u092f BoP \u0918\u093e\u091f\u0947 \u0915\u094b \u0920\u0940\u0915 \u0915\u0930\u0928\u093e, \u0938\u092e\u0937\u094d\u091f\u093f-\u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u094d\u0925\u093f\u0930\u0924\u093e \u092c\u0939\u093e\u0932 \u0915\u0930\u0928\u093e \u0914\u0930 \u092c\u093e\u091c\u093e\u0930-\u0909\u0928\u094d\u092e\u0941\u0916 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u092e\u0947\u0902 \u0938\u0902\u0915\u094d\u0930\u092e\u0923 \u0915\u0930\u0928\u093e \u0925\u093e\u0964 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092e\u0941\u0916\u094d\u092f \u0930\u0915\u094d\u0937\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u092e\u0947\u0902 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e \u0907\u0938 1991 \u0922\u093e\u0902\u091a\u0947 \u0915\u093e \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0932\u0915\u094d\u0937\u094d\u092f \u0928\u0939\u0940\u0902 \u0925\u093e\u0964",

    {
      "text": "<b>Q49.</b> Q211. During which Plan did India experience &#x27;Plan Holidays&#x27; due to economic instability? / \u0906\u0930\u094d\u0925\u093f\u0915 \u0905\u0938\u094d\u0925\u093f\u0930\u0924\u093e \u0915\u0947 \u0915\u093e\u0930\u0923 \u092d\u093e\u0930\u0924 \u0928\u0947 \u0915\u093f\u0938 \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 &#x27;\u092f\u094b\u091c\u0928\u093e \u0905\u0935\u0915\u093e\u0936&#x27; (Plan Holidays) \u0915\u093e \u0905\u0928\u0941\u092d\u0935 \u0915\u093f\u092f\u093e? [Head Constable (AWO)/(TPO) in Delhi Police Examination, 2025, 21 Jan 2026, Shift-1]",
      "options": [
        "Fourth Plan / \u091a\u094c\u0925\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Seventh Plan / \u0938\u093e\u0924\u0935\u0940\u0902 \u092f\u094b\u091c\u0928\u093e",
        "Third Plan / \u0924\u0940\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Fifth Plan / \u092a\u093e\u0902\u091a\u0935\u0940\u0902 \u092f\u094b\u091c\u0928\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The devastating failure of the Third Five-Year Plan (1961-1966), caused primarily by severe economic drain from wars and droughts, led to intense economic instability. Consequently, the government was forced to declare &quot;Plan Holidays&quot; for three consecutive years (1966-1969) directly after the Third Plan. / \u092f\u0941\u0926\u094d\u0927\u094b\u0902 \u0914\u0930 \u0938\u0942\u0916\u0947 \u0938\u0947 \u0917\u0902\u092d\u0940\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u093f\u0915\u093e\u0938\u0940 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1961-1966) \u0915\u0940 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u0935\u093f\u092b\u0932\u0924\u093e \u0915\u0947 \u0915\u093e\u0930\u0923 \u0924\u0940\u0935\u094d\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u0905\u0938\u094d\u0925\u093f\u0930\u0924\u093e \u092a\u0948\u0926\u093e \u0939\u0941\u0908\u0964 \u092a\u0930\u093f\u0923\u093e\u092e\u0938\u094d\u0935\u0930\u0942\u092a, \u0938\u0930\u0915\u093e\u0930 \u0915\u094b \u0924\u0940\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0920\u0940\u0915 \u092c\u093e\u0926 \u0932\u0917\u093e\u0924\u093e\u0930 \u0924\u0940\u0928 \u0935\u0930\u094d\u0937\u094b\u0902 (1966-1969) \u0915\u0947 \u0932\u093f\u090f &quot;\u092f\u094b\u091c\u0928\u093e \u0905\u0935\u0915\u093e\u0936&quot; \u0918\u094b\u0937\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092e\u091c\u092c\u0942\u0930 \u0939\u094b\u0928\u093e \u092a\u0921\u093c\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q50.</b> Q212. Which measure helped indirectly reduce fiscal deficit after 1991 reforms? / 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u092c\u093e\u0926 \u0915\u093f\u0938 \u0909\u092a\u093e\u092f \u0928\u0947 \u0905\u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0930\u0942\u092a \u0938\u0947 \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0918\u093e\u091f\u0947 \u0915\u094b \u0915\u092e \u0915\u0930\u0928\u0947 \u092e\u0947\u0902 \u092e\u0926\u0926 \u0915\u0940? [Head Constable (AWO)/(TPO) in Delhi Police Examination, 2025, 21 Jan 2026, Shift-2]",
      "options": [
        "Disinvestment in public enterprises / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0909\u0926\u094d\u092f\u092e\u094b\u0902 \u092e\u0947\u0902 \u0935\u093f\u0928\u093f\u0935\u0947\u0936",
        "Import substitution / \u0906\u092f\u093e\u0924 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928",
        "Expansion of subsidies on fertilizers / \u0909\u0930\u094d\u0935\u0930\u0915\u094b\u0902 \u092a\u0930 \u0938\u092c\u094d\u0938\u093f\u0921\u0940 \u0915\u093e \u0935\u093f\u0938\u094d\u0924\u093e\u0930",
        "Launch of Mahatma Gandhi NREGA / \u092e\u0939\u093e\u0924\u094d\u092e\u093e \u0917\u093e\u0902\u0927\u0940 \u0928\u0930\u0947\u0917\u093e \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924"
      ],
      "correctIndex": 0,
      "explanation": "Following the 1991 reforms, the strategic policy of &#x27;Disinvestment&#x27; in Public Sector Enterprises (PSUs) became a cornerstone for economic restructuring. By selling government-held equity shares to private entities, the government raised substantial non-tax revenues, helping to indirectly bridge the budget gap and reduce the fiscal deficit. / 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u092c\u093e\u0926, \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u092e\u094b\u0902 (PSU) \u092e\u0947\u0902 &#x27;\u0935\u093f\u0928\u093f\u0935\u0947\u0936&#x27; \u0915\u0940 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0928\u0940\u0924\u093f \u0906\u0930\u094d\u0925\u093f\u0915 \u092a\u0941\u0928\u0930\u094d\u0917\u0920\u0928 \u0915\u0940 \u0906\u0927\u093e\u0930\u0936\u093f\u0932\u093e \u092c\u0928 \u0917\u0908\u0964 \u0938\u0930\u0915\u093e\u0930\u0940 \u0907\u0915\u094d\u0935\u093f\u091f\u0940 \u0936\u0947\u092f\u0930\u094b\u0902 \u0915\u094b \u0928\u093f\u091c\u0940 \u0938\u0902\u0938\u094d\u0925\u093e\u0913\u0902 \u0915\u094b \u092c\u0947\u091a\u0915\u0930, \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u092a\u0930\u094d\u092f\u093e\u092a\u094d\u0924 \u0917\u0948\u0930-\u0915\u0930 \u0930\u093e\u091c\u0938\u094d\u0935 \u091c\u0941\u091f\u093e\u092f\u093e, \u091c\u093f\u0938\u0938\u0947 \u092c\u091c\u091f \u0905\u0902\u0924\u0930 \u0915\u094b \u092a\u093e\u091f\u0928\u0947 \u0914\u0930 \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0918\u093e\u091f\u0947 \u0915\u094b \u0915\u092e \u0915\u0930\u0928\u0947 \u092e\u0947\u0902 \u0905\u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0930\u0942\u092a \u0938\u0947 \u092e\u0926\u0926 \u092e\u093f\u0932\u0940\u0964",
      "reference": ""

    {
      "text": "<b>Q51.</b> Q213. The second five-year plan was primarily based on which economic model? / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938 \u0906\u0930\u094d\u0925\u093f\u0915 \u092e\u0949\u0921\u0932 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0925\u0940? [SSC CPO, 09 Dec 2025, Shift-1]",
      "options": [
        "Harrod-Domar model / \u0939\u0948\u0930\u094b\u0921-\u0921\u094b\u092e\u0930 \u092e\u0949\u0921\u0932",
        "Feldman model / \u092b\u0947\u0932\u094d\u0921\u092e\u0948\u0928 \u092e\u0949\u0921\u0932",
        "Keynesian model / \u0915\u0940\u0928\u0947\u0938\u093f\u092f\u0928 \u092e\u0949\u0921\u0932",
        "Mahalanobis model / \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932"
      ],
      "correctIndex": 3,
      "explanation": "The Second Five-Year Plan (1956-1961) was explicitly based on the Mahalanobis model, developed by Indian statistician P.C. Mahalanobis. It emphasized rapid industrialization, particularly the development of basic and heavy industries like iron and steel, aiming to create a self-reliant economy. / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-1961) \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u093e\u0902\u0916\u094d\u092f\u093f\u0915\u0940\u0935\u093f\u0926\u094d \u092a\u0940.\u0938\u0940. \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u0926\u094d\u0935\u093e\u0930\u093e \u0935\u093f\u0915\u0938\u093f\u0924 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0925\u0940\u0964 \u0907\u0938\u0928\u0947 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u092c\u0928\u093e\u0928\u0947 \u0915\u0947 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0938\u0947 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923, \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0932\u094b\u0939\u093e \u0914\u0930 \u0907\u0938\u094d\u092a\u093e\u0924 \u091c\u0948\u0938\u0947 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e\u0964",

    {
      "text": "<b>Q52.</b> Q214. How would one characterize the trajectory of India&#x27;s industrial sector during the Five-Year Plans up to 1990? / 1990 \u0924\u0915 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u092a\u094d\u0930\u0915\u094d\u0937\u0947\u092a\u0935\u0915\u094d\u0930 (trajectory) \u0915\u0940 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0915\u094d\u092f\u093e \u0939\u094b\u0917\u0940? [SSC CPO, 09 Dec 2025, Shift-1]",
      "options": [
        "Consistently surpassing projected growth rates across all sectors / \u0938\u092d\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u092e\u0947\u0902 \u0905\u0928\u0941\u092e\u093e\u0928\u093f\u0924 \u0935\u093f\u0915\u093e\u0938 \u0926\u0930 \u0915\u094b \u0932\u0917\u093e\u0924\u093e\u0930 \u092a\u093e\u0930 \u0915\u0930\u0928\u093e",

        "Being predominantly propelled by private sector innovation and capital infusion, with minimal governmental intervention / \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0928\u094d\u092f\u0942\u0928\u0924\u092e \u0938\u0930\u0915\u093e\u0930\u0940 \u0939\u0938\u094d\u0924\u0915\u094d\u0937\u0947\u092a \u0915\u0947 \u0938\u093e\u0925 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0928\u0935\u093e\u091a\u093e\u0930 \u0914\u0930 \u092a\u0942\u0902\u091c\u0940 \u0928\u093f\u0935\u0947\u0936 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u0902\u091a\u093e\u0932\u093f\u0924 \u0939\u094b\u0928\u093e"
      ],
      "correctIndex": 1,
      "explanation": "Up to 1990, India&#x27;s industrial strategy focused heavily on state-led import substitution. While this led to the successful establishment of a diversified heavy industry base (steel, machinery), it was heavily plagued by severe inefficiencies, restrictive licensing rules (License Raj), and frequent failures to meet planned growth targets. / 1990 \u0924\u0915, \u092d\u093e\u0930\u0924 \u0915\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u0906\u092f\u093e\u0924 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928 \u092a\u0930 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0925\u0940\u0964 \u092f\u0926\u094d\u092f\u092a\u093f \u0907\u0938\u0938\u0947 \u090f\u0915 \u0935\u093f\u0935\u093f\u0927 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917 \u0906\u0927\u093e\u0930 (\u0938\u094d\u091f\u0940\u0932, \u092e\u0936\u0940\u0928\u0930\u0940) \u0915\u0940 \u0938\u092b\u0932 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0939\u0941\u0908, \u0932\u0947\u0915\u093f\u0928 \u092f\u0939 \u0917\u0902\u092d\u0940\u0930 \u0905\u0915\u094d\u0937\u092e\u0924\u093e\u0913\u0902, \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093e\u0924\u094d\u092e\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0928\u093f\u092f\u092e\u094b\u0902 (\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c) \u0914\u0930 \u0928\u093f\u092f\u094b\u091c\u093f\u0924 \u0935\u093f\u0915\u093e\u0938 \u0932\u0915\u094d\u0937\u094d\u092f\u094b\u0902 \u0915\u094b \u092a\u0942\u0930\u093e \u0915\u0930\u0928\u0947 \u092e\u0947\u0902 \u0932\u0917\u093e\u0924\u093e\u0930 \u0935\u093f\u092b\u0932\u0924\u093e\u0913\u0902 \u0938\u0947 \u092c\u0941\u0930\u0940 \u0924\u0930\u0939 \u0917\u094d\u0930\u0938\u094d\u0924 \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q53.</b> Q215. Which of the following statements regarding small scale industries in India is correct? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0932\u0918\u0941 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0938\u0902\u092c\u0902\u0927 \u092e\u0947\u0902 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0915\u0925\u0928 \u0938\u0939\u0940 \u0939\u0948? [SSC CPO, 09 Dec 2025, Shift-1]",
      "options": [
        "They are classified based on number of workers employed. / \u0909\u0928\u094d\u0939\u0947\u0902 \u0928\u093f\u092f\u094b\u091c\u093f\u0924 \u0936\u094d\u0930\u092e\u093f\u0915\u094b\u0902 \u0915\u0940 \u0938\u0902\u0916\u094d\u092f\u093e \u0915\u0947 \u0906\u0927\u093e\u0930 \u092a\u0930 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964",
        "They are identified by annual turnover only. / \u0909\u0928\u0915\u0940 \u092a\u0939\u091a\u093e\u0928 \u0915\u0947\u0935\u0932 \u0935\u093e\u0930\u094d\u0937\u093f\u0915 \u0915\u093e\u0930\u094b\u092c\u093e\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u0915\u0940 \u091c\u093e\u0924\u0940 \u0939\u0948\u0964",
        "They are classified based on capital investment in assets. / \u0909\u0928\u094d\u0939\u0947\u0902 \u0938\u0902\u092a\u0924\u094d\u0924\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u092a\u0942\u0902\u091c\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u0947 \u0906\u0927\u093e\u0930 \u092a\u0930 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964",
        "They are defined solely by export volume. / \u0909\u0928\u094d\u0939\u0947\u0902 \u0915\u0947\u0935\u0932 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u092e\u093e\u0924\u094d\u0930\u093e \u0926\u094d\u0935\u093e\u0930\u093e \u092a\u0930\u093f\u092d\u093e\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964"
      ],
      "correctIndex": 2,
      "explanation": "In India, the official classification of Micro, Small, and Medium Enterprises (MSMEs), including small scale industries, was historically based strictly on the limit of capital investment in plant and machinery. Recent revisions updated this to a composite criteria involving both capital investment and annual turnover. / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902, \u0932\u0918\u0941 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0938\u0939\u093f\u0924 \u0938\u0942\u0915\u094d\u0937\u094d\u092e, \u0932\u0918\u0941 \u0914\u0930 \u092e\u0927\u094d\u092f\u092e \u0909\u0926\u094d\u092f\u092e\u094b\u0902 (MSMEs) \u0915\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0935\u0930\u094d\u0917\u0940\u0915\u0930\u0923 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u092f\u0902\u0924\u094d\u0930 \u0914\u0930 \u092e\u0936\u0940\u0928\u0930\u0940 \u092e\u0947\u0902 \u092a\u0942\u0902\u091c\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u0940 \u0938\u0940\u092e\u093e \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0925\u093e\u0964 \u0939\u093e\u0932 \u0915\u0947 \u0938\u0902\u0936\u094b\u0927\u0928\u094b\u0902 \u0928\u0947 \u0907\u0938\u0947 \u090f\u0915 \u0938\u092e\u0917\u094d\u0930 \u092e\u093e\u0928\u0926\u0902\u0921 \u092e\u0947\u0902 \u0905\u0926\u094d\u092f\u0924\u0928 \u0915\u093f\u092f\u093e \u0939\u0948 \u091c\u093f\u0938\u092e\u0947\u0902 \u092a\u0942\u0902\u091c\u0940 \u0928\u093f\u0935\u0947\u0936 \u0914\u0930 \u0935\u093e\u0930\u094d\u0937\u093f\u0915 \u0915\u093e\u0930\u094b\u092c\u093e\u0930 \u0926\u094b\u0928\u094b\u0902 \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q54.</b> Q218. What is the impact of PSU disinvestment on the government&#x27;s financial structure? / \u0938\u0930\u0915\u093e\u0930 \u0915\u0940 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0902\u0930\u091a\u0928\u093e \u092a\u0930 PSU \u0935\u093f\u0928\u093f\u0935\u0947\u0936 \u0915\u093e \u0915\u094d\u092f\u093e \u092a\u094d\u0930\u092d\u093e\u0935 \u092a\u0921\u093c\u0924\u093e \u0939\u0948? [SSC CPO, 10 Dec 2025, Shift-1]",
      "options": [
        "It reduces government&#x27;s financial assets / \u092f\u0939 \u0938\u0930\u0915\u093e\u0930 \u0915\u0940 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0902\u092a\u0924\u094d\u0924\u093f \u0915\u094b \u0915\u092e \u0915\u0930\u0924\u093e \u0939\u0948",
        "It increases government&#x27;s liabilities / \u092f\u0939 \u0938\u0930\u0915\u093e\u0930 \u0915\u0940 \u0926\u0947\u0928\u0926\u093e\u0930\u093f\u092f\u094b\u0902 \u0915\u094b \u092c\u0922\u093c\u093e\u0924\u093e \u0939\u0948",
        "It increases the government&#x27;s earnings permanently / \u092f\u0939 \u0938\u0930\u0915\u093e\u0930 \u0915\u0940 \u0915\u092e\u093e\u0908 \u0915\u094b \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u092c\u0922\u093c\u093e\u0924\u093e \u0939\u0948",
        "It does not affect finances at all / \u092f\u0939 \u0935\u093f\u0924\u094d\u0924 \u0915\u094b \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u092a\u094d\u0930\u092d\u093e\u0935\u093f\u0924 \u0928\u0939\u0940\u0902 \u0915\u0930\u0924\u093e \u0939\u0948"
      ],
      "correctIndex": 0,
      "explanation": "Disinvestment involves the government liquidating or selling its equity stakes in Public Sector Undertakings (PSUs) to private buyers. Since equity shares represent the government&#x27;s accumulated financial wealth, selling them directly reduces the government&#x27;s total capital/financial assets, converting that long-term asset into an immediate cash receipt. / \u0935\u093f\u0928\u093f\u0935\u0947\u0936 \u092e\u0947\u0902 \u0938\u0930\u0915\u093e\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u092a\u0915\u094d\u0930\u092e\u094b\u0902 (PSU) \u092e\u0947\u0902 \u0905\u092a\u0928\u0940 \u0907\u0915\u094d\u0935\u093f\u091f\u0940 \u0939\u093f\u0938\u094d\u0938\u0947\u0926\u093e\u0930\u0940 \u0915\u094b \u0928\u093f\u091c\u0940 \u0916\u0930\u0940\u0926\u093e\u0930\u094b\u0902 \u0915\u094b \u092c\u0947\u091a\u0928\u093e \u092f\u093e \u092c\u0947\u091a\u0928\u093e \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0964 \u091a\u0942\u0902\u0915\u093f \u0907\u0915\u094d\u0935\u093f\u091f\u0940 \u0936\u0947\u092f\u0930 \u0938\u0930\u0915\u093e\u0930 \u0915\u0947 \u0938\u0902\u091a\u093f\u0924 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0927\u0928 \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902, \u0907\u0938\u0932\u093f\u090f \u0909\u0928\u094d\u0939\u0947\u0902 \u0938\u0940\u0927\u0947 \u092c\u0947\u091a\u0928\u0947 \u0938\u0947 \u0938\u0930\u0915\u093e\u0930 \u0915\u0940 \u0915\u0941\u0932 \u092a\u0942\u0902\u091c\u0940/\u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0902\u092a\u0924\u094d\u0924\u093f \u0915\u092e \u0939\u094b \u091c\u093e\u0924\u0940 \u0939\u0948, \u091c\u093f\u0938\u0938\u0947 \u0935\u0939 \u0926\u0940\u0930\u094d\u0918\u0915\u093e\u0932\u093f\u0915 \u0938\u0902\u092a\u0924\u094d\u0924\u093f \u0924\u0924\u094d\u0915\u093e\u0932 \u0928\u0915\u0926 \u092a\u094d\u0930\u093e\u092a\u094d\u0924\u093f \u092e\u0947\u0902 \u092c\u0926\u0932 \u091c\u093e\u0924\u0940 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q55.</b> Q219. Which year marked the beginning of India&#x27;s First Five-Year Plan? / \u0915\u093f\u0938 \u0935\u0930\u094d\u0937 \u092d\u093e\u0930\u0924 \u0915\u0940 \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 \u0939\u0941\u0908? [SSC CPO, 10 Dec 2025, Shift-1]",
      "options": [
        "1949 / 1949",
        "1950 / 1950",
        "1952 / 1952",
        "1951 / 1951"
      ],
      "correctIndex": 3,
      "explanation": "India&#x27;s ambitious First Five-Year Plan was officially launched by Prime Minister Jawaharlal Nehru exactly in the year 1951 and concluded in 1956. Heavily based on the Harrod-Domar economic model, this foundational plan primarily focused on accelerating the development of the primary sector, particularly agricultural expansion. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u094b \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u091c\u0935\u093e\u0939\u0930\u0932\u093e\u0932 \u0928\u0947\u0939\u0930\u0942 \u0926\u094d\u0935\u093e\u0930\u093e \u0920\u0940\u0915 \u0935\u0930\u094d\u0937 1951 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e \u0914\u0930 1956 \u092e\u0947\u0902 \u0938\u0902\u092a\u0928\u094d\u0928 \u0939\u0941\u0906\u0964 \u0939\u0948\u0930\u094b\u0921-\u0921\u094b\u092e\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u092e\u0949\u0921\u0932 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924, \u0907\u0938 \u0906\u0927\u093e\u0930\u092d\u0942\u0924 \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0935\u093f\u0915\u093e\u0938, \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0915\u0943\u0937\u093f \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u092e\u0947\u0902 \u0924\u0947\u091c\u0940 \u0932\u093e\u0928\u0947 \u092a\u0930 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q56.</b> Q221. Which of the following industrial sectors were prioritized during the Second Five-Year Plan? / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u094b \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0940 \u0917\u0908 \u0925\u0940? [SSC CPO, 10 Dec 2025, Shift-2]",
      "options": [
        "Textile industry and advertising industry / \u0915\u092a\u0921\u093c\u093e \u0909\u0926\u094d\u092f\u094b\u0917 \u0914\u0930 \u0935\u093f\u091c\u094d\u091e\u093e\u092a\u0928 \u0909\u0926\u094d\u092f\u094b\u0917",
        "Iron and steel industry, fertilizer industry, heavy engineering, and lignite projects / \u0932\u094b\u0939\u093e \u0914\u0930 \u0907\u0938\u094d\u092a\u093e\u0924 \u0909\u0926\u094d\u092f\u094b\u0917, \u0909\u0930\u094d\u0935\u0930\u0915 \u0909\u0926\u094d\u092f\u094b\u0917, \u092d\u093e\u0930\u0940 \u0907\u0902\u091c\u0940\u0928\u093f\u092f\u0930\u093f\u0902\u0917 \u0914\u0930 \u0932\u093f\u0917\u094d\u0928\u093e\u0907\u091f \u092a\u0930\u093f\u092f\u094b\u091c\u0928\u093e\u090f\u0902",
        "Cottage industry and consumer goods industry / \u0915\u0941\u091f\u0940\u0930 \u0909\u0926\u094d\u092f\u094b\u0917 \u0914\u0930 \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0935\u0938\u094d\u0924\u0941 \u0909\u0926\u094d\u092f\u094b\u0917",
        "Handicrafts and Information technology / \u0939\u0938\u094d\u0924\u0936\u093f\u0932\u094d\u092a \u0914\u0930 \u0938\u0942\u091a\u0928\u093e \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940"
      ],
      "correctIndex": 1,
      "explanation": "The Second Five-Year Plan (1956-1961), based on the Mahalanobis model, strategically shifted the economic focus from agriculture to rapid industrialization. It heavily prioritized the massive development of the public sector and core basic and heavy industries like iron and steel, establishing major steel plants in Bhilai, Durgapur, and Rourkela. / \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-1961) \u0928\u0947 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0915\u0943\u0937\u093f \u0938\u0947 \u0924\u0940\u0935\u094d\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0915\u0940 \u0913\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u093f\u092f\u093e\u0964 \u0907\u0938\u0928\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0914\u0930 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0924\u0925\u093e \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u091c\u0948\u0938\u0947 \u0932\u094b\u0939\u093e \u0914\u0930 \u0907\u0938\u094d\u092a\u093e\u0924 \u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u093f\u0915\u093e\u0938 \u0915\u094b \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0940, \u091c\u093f\u0938\u0938\u0947 \u092d\u093f\u0932\u093e\u0908, \u0926\u0941\u0930\u094d\u0917\u093e\u092a\u0941\u0930 \u0914\u0930 \u0930\u093e\u0909\u0930\u0915\u0947\u0932\u093e \u092e\u0947\u0902 \u092a\u094d\u0930\u092e\u0941\u0916 \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\u0930 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0939\u0941\u090f\u0964",

    {
      "text": "<b>Q57.</b> Q222. What was the primary objective of the &quot;Gadgil Formula&quot;? / &quot;\u0917\u093e\u0921\u0917\u093f\u0932 \u092b\u0949\u0930\u094d\u092e\u0942\u0932\u093e&quot; \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u094d\u092f\u093e \u0925\u093e? [SSC CPO, 10 Dec 2025, Shift-2]",
      "options": [
        "To focus on industrial growth in economically weaker states / \u0906\u0930\u094d\u0925\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0915\u092e\u091c\u094b\u0930 \u0930\u093e\u091c\u094d\u092f\u094b\u0902 \u092e\u0947\u0902 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u0930\u0928\u093e",
        "To provide equal financial support to all regions, regardless of their specific needs / \u0938\u092d\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u094b \u0909\u0928\u0915\u0940 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0906\u0935\u0936\u094d\u092f\u0915\u0924\u093e\u0913\u0902 \u0915\u0940 \u092a\u0930\u0935\u093e\u0939 \u0915\u093f\u090f \u092c\u093f\u0928\u093e \u0938\u092e\u093e\u0928 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0939\u093e\u092f\u0924\u093e \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u093e",
        "To determine the allocation of central assistance for state plans in India / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0930\u093e\u091c\u094d\u092f \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u0947 \u0932\u093f\u090f \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u0938\u0939\u093e\u092f\u0924\u093e \u0915\u093e \u0906\u0935\u0902\u091f\u0928 \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u093f\u0924 \u0915\u0930\u0928\u093e",
        "To distributes resources according to the state&#x27;s economic outputs / \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930 \u0938\u0902\u0938\u093e\u0927\u0928\u094b\u0902 \u0915\u094b \u0935\u093f\u0924\u0930\u093f\u0924 \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The Gadgil Formula, formulated by the eminent social scientist D.R. Gadgil in 1969, was a definitive economic framework designed specifically to determine the objective and transparent allocation of central plan assistance to state governments in India based on factors like population and per capita income. / 1969 \u092e\u0947\u0902 \u092a\u094d\u0930\u0916\u094d\u092f\u093e\u0924 \u0938\u092e\u093e\u091c \u0935\u0948\u091c\u094d\u091e\u093e\u0928\u093f\u0915 \u0921\u0940.\u0906\u0930. \u0917\u093e\u0921\u0917\u093f\u0932 \u0926\u094d\u0935\u093e\u0930\u093e \u0924\u0948\u092f\u093e\u0930 \u0917\u093e\u0921\u0917\u093f\u0932 \u092b\u0949\u0930\u094d\u092e\u0942\u0932\u093e, \u090f\u0915 \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0906\u0930\u094d\u0925\u093f\u0915 \u0922\u093e\u0902\u091a\u093e \u0925\u093e \u091c\u093f\u0938\u0947 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u091c\u0928\u0938\u0902\u0916\u094d\u092f\u093e \u0914\u0930 \u092a\u094d\u0930\u0924\u093f \u0935\u094d\u092f\u0915\u094d\u0924\u093f \u0906\u092f \u091c\u0948\u0938\u0947 \u0915\u093e\u0930\u0915\u094b\u0902 \u0915\u0947 \u0906\u0927\u093e\u0930 \u092a\u0930 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0930\u093e\u091c\u094d\u092f \u0938\u0930\u0915\u093e\u0930\u094b\u0902 \u0915\u094b \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0938\u0939\u093e\u092f\u0924\u093e \u0915\u0947 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f\u092a\u0942\u0930\u094d\u0923 \u0914\u0930 \u092a\u093e\u0930\u0926\u0930\u094d\u0936\u0940 \u0906\u0935\u0902\u091f\u0928 \u0915\u094b \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0921\u093f\u091c\u093c\u093e\u0907\u0928 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q58.</b> Q223. What role did Small-Scale Industries (SSIs) play in the 6th Five-Year Plan&#x27;s trade strategy? / \u091b\u0920\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0940 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0930\u0923\u0928\u0940\u0924\u093f \u092e\u0947\u0902 \u0932\u0918\u0941 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 (SSI) \u0928\u0947 \u0915\u094d\u092f\u093e \u092d\u0942\u092e\u093f\u0915\u093e \u0928\u093f\u092d\u093e\u0908? [SSC CPO, 10 Dec 2025, Shift-2]",
      "options": [
        "They were promoted as key exporters and employment generators / \u0909\u0928\u094d\u0939\u0947\u0902 \u092a\u094d\u0930\u092e\u0941\u0916 \u0928\u093f\u0930\u094d\u092f\u093e\u0924\u0915\u094b\u0902 \u0914\u0930 \u0930\u094b\u091c\u0917\u093e\u0930 \u0938\u0943\u091c\u0915\u094b\u0902 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092a\u094d\u0930\u091a\u093e\u0930\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e",
        "They were discouraged in favor of large-scale units / \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u0915\u0940 \u0907\u0915\u093e\u0907\u092f\u094b\u0902 \u0915\u0947 \u092a\u0915\u094d\u0937 \u092e\u0947\u0902 \u0909\u0928\u094d\u0939\u0947\u0902 \u0939\u0924\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e",
        "They were expected to focus only on local markets / \u0909\u0928\u0938\u0947 \u0915\u0947\u0935\u0932 \u0938\u094d\u0925\u093e\u0928\u0940\u092f \u092c\u093e\u091c\u093e\u0930\u094b\u0902 \u092a\u0930 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0940 \u0909\u092e\u094d\u092e\u0940\u0926 \u0925\u0940",
        "They were merged with public sector units / \u0909\u0928\u094d\u0939\u0947\u0902 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u0907\u0915\u093e\u0907\u092f\u094b\u0902 \u0915\u0947 \u0938\u093e\u0925 \u092e\u093f\u0932\u093e \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e"
      ],
      "correctIndex": 0,
      "explanation": "During the Sixth Five-Year Plan (1980-1985), Small-Scale Industries (SSIs) were strategically recognized as vital engines for widespread economic growth. The government aggressively promoted them as key drivers for generating massive grassroots employment and significantly boosting the nation&#x27;s export capabilities with minimal capital investment. / \u091b\u0920\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1980-1985) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928, \u0932\u0918\u0941 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 (SSIs) \u0915\u094b \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0935\u094d\u092f\u093e\u092a\u0915 \u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0915\u0947 \u0932\u093f\u090f \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0907\u0902\u091c\u0928 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092e\u093e\u0928\u094d\u092f\u0924\u093e \u0926\u0940 \u0917\u0908 \u0925\u0940\u0964 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0909\u0928\u094d\u0939\u0947\u0902 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u091c\u092e\u0940\u0928\u0940 \u0938\u094d\u0924\u0930 \u092a\u0930 \u0930\u094b\u091c\u0917\u093e\u0930 \u092a\u0948\u0926\u093e \u0915\u0930\u0928\u0947 \u0914\u0930 \u0928\u094d\u092f\u0942\u0928\u0924\u092e \u092a\u0942\u0902\u091c\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u0947 \u0938\u093e\u0925 \u0926\u0947\u0936 \u0915\u0940 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094d\u0937\u092e\u0924\u093e\u0913\u0902 \u0915\u094b \u0915\u093e\u092b\u0940 \u0939\u0926 \u0924\u0915 \u092c\u0922\u093c\u093e\u0928\u0947 \u0915\u0947 \u092a\u094d\u0930\u092e\u0941\u0916 \u091a\u093e\u0932\u0915\u094b\u0902 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u093f\u092f\u093e\u0964",

      "text": "<b>Q59.</b> Q224. The Rural Landless Employment Guarantee Programme (RLEGP) was initiated in the _____ Five-Year Plan. / \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u092d\u0942\u092e\u093f\u0939\u0940\u0928 \u0930\u094b\u091c\u0917\u093e\u0930 \u0917\u093e\u0930\u0902\u091f\u0940 \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e (RLEGP) \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e? [SSC CPO, 11 Dec 2025, Shift-1]",
      "options": [
        "Fourth / \u091a\u094c\u0925\u0940",
        "Fifth / \u092a\u093e\u0902\u091a\u0935\u0940\u0902",
        "Seventh / \u0938\u093e\u0924\u0935\u0940\u0902",
        "Sixth / \u091b\u0920\u0940"
      ],
      "correctIndex": 3,
      "explanation": "The Rural Landless Employment Guarantee Programme (RLEGP) was an extremely crucial poverty alleviation initiative systematically launched by the Indian Government on August 15, 1983, exactly during the Sixth Five-Year Plan. Its primary goal was expanding employment opportunities for landless households. / \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u092d\u0942\u092e\u093f\u0939\u0940\u0928 \u0930\u094b\u091c\u0917\u093e\u0930 \u0917\u093e\u0930\u0902\u091f\u0940 \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e (RLEGP) \u090f\u0915 \u0905\u0924\u094d\u092f\u0902\u0924 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0917\u0930\u0940\u092c\u0940 \u0909\u0928\u094d\u092e\u0942\u0932\u0928 \u092a\u0939\u0932 \u0925\u0940 \u091c\u093f\u0938\u0947 \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0926\u094d\u0935\u093e\u0930\u093e 15 \u0905\u0917\u0938\u094d\u0924, 1983 \u0915\u094b \u0920\u0940\u0915 \u091b\u0920\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0932\u0915\u094d\u0937\u094d\u092f \u092d\u0942\u092e\u093f\u0939\u0940\u0928 \u092a\u0930\u093f\u0935\u093e\u0930\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0930\u094b\u091c\u0917\u093e\u0930 \u0915\u0947 \u0905\u0935\u0938\u0930\u094b\u0902 \u0915\u093e \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0915\u0930\u0928\u093e \u0925\u093e\u0964",

      "text": "<b>Q60.</b> Q225. The 7th Five-Year Plan is credited with laying the foundation for which of the following major economic reform eras in India? / 7\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u094b \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092a\u094d\u0930\u092e\u0941\u0916 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930 \u092f\u0941\u0917 \u0915\u0940 \u0928\u0940\u0902\u0935 \u0930\u0916\u0928\u0947 \u0915\u093e \u0936\u094d\u0930\u0947\u092f \u0926\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948? [SSC CPO, 11 Dec 2025, Shift-1]",
      "options": [

      ],
      "correctIndex": 1,
      "explanation": "The Seventh Five-Year Plan (1985-1990), introduced under Rajiv Gandhi&#x27;s leadership, shifted India&#x27;s economic focus. By heavily emphasizing massive technological upgrades, encouraging industrial modernization, and championing the private sector&#x27;s growth, it robustly laid the critical foundation for the transformative 1991 economic liberalization reforms. / \u0930\u093e\u091c\u0940\u0935 \u0917\u093e\u0902\u0927\u0940 \u0915\u0947 \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 7\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1985-1990) \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u093e \u0906\u0930\u094d\u0925\u093f\u0915 \u092b\u094b\u0915\u0938 \u092c\u0926\u0932 \u0926\u093f\u092f\u093e\u0964 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0924\u0915\u0928\u0940\u0915\u0940 \u0909\u0928\u094d\u0928\u092f\u0928, \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0906\u0927\u0941\u0928\u093f\u0915\u0940\u0915\u0930\u0923 \u0915\u094b \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u0930\u0928\u0947 \u0914\u0930 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0935\u093f\u0915\u093e\u0938 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u092a\u0930 \u092d\u093e\u0930\u0940 \u091c\u094b\u0930 \u0926\u0947\u0915\u0930, \u0907\u0938\u0928\u0947 1991 \u0915\u0947 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940 \u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u090f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0928\u0940\u0902\u0935 \u0930\u0916\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q61.</b> Q228. Which of the following Five-Year Plans marked a strategic transition in India&#x27;s economic policy, shifting the primary focus from agriculture to the development of heavy industries and industrialization? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f \u092e\u0947\u0902 \u090f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 \u0915\u094b \u091a\u093f\u0939\u094d\u0928\u093f\u0924 \u0915\u093f\u092f\u093e, \u091c\u093f\u0938\u092e\u0947\u0902 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0927\u094d\u092f\u093e\u0928 \u0915\u0943\u0937\u093f \u0938\u0947 \u0939\u091f\u093e\u0915\u0930 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0914\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0915\u0947 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e? [SSC CPO, 12 Dec 2025, Shift-1]",
      "options": [
        "First Five-Year Plan / \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Fourth Five-Year Plan / \u091a\u094c\u0925\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Second Five-Year Plan / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Fifth Five-Year Plan / \u092a\u093e\u0902\u091a\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The Second Five-Year Plan (1956-1961), heavily influenced by the Mahalanobis model, orchestrated a massive, definitive strategic shift in India&#x27;s macroeconomic policy. While the First Plan prioritized agricultural stability, the Second Plan aggressively pushed for rapid industrialization, pouring immense capital specifically into building foundational heavy industries like iron and steel. / \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u0938\u0947 \u0915\u093e\u092b\u0940 \u092a\u094d\u0930\u092d\u093e\u0935\u093f\u0924 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-1961) \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0935\u094d\u092f\u093e\u092a\u0915 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f \u092e\u0947\u0902 \u090f\u0915 \u092c\u0921\u093c\u093e, \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u092c\u0926\u0932\u093e\u0935 \u0915\u093f\u092f\u093e\u0964 \u091c\u092c\u0915\u093f \u092a\u0939\u0932\u0940 \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u0915\u0943\u0937\u093f \u0938\u094d\u0925\u093f\u0930\u0924\u093e \u0915\u094b \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0940 \u0925\u0940, \u0926\u0942\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u092a\u0930 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e, \u091c\u093f\u0938\u092e\u0947\u0902 \u0932\u094b\u0939\u093e \u0914\u0930 \u0938\u094d\u091f\u0940\u0932 \u091c\u0948\u0938\u0947 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u092e\u0947\u0902 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0940 \u092a\u0942\u0902\u091c\u0940 \u0932\u0917\u093e\u0908 \u0917\u0908\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q62.</b> Q229. Which of the following Five-Year Plans in India was notably criticized for its substantial dependence on foreign loans to finance the import of machinery and capital goods? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0940 \u092e\u0936\u0940\u0928\u0930\u0940 \u0914\u0930 \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0947 \u0906\u092f\u093e\u0924 \u0915\u094b \u0935\u093f\u0924\u094d\u0924\u092a\u094b\u0937\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0935\u093f\u0926\u0947\u0936\u0940 \u090b\u0923\u094b\u0902 \u092a\u0930 \u0915\u093e\u092b\u0940 \u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0915\u0947 \u0932\u093f\u090f \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0906\u0932\u094b\u091a\u0928\u093e \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC CPO, 12 Dec 2025, Shift-1]",
      "options": [
        "Second Five-Year Plan / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Fourth Five-Year Plan / \u091a\u094c\u0925\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Sixth Five-Year Plan / \u091b\u0920\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Eighth Five-Year Plan / \u0906\u0920\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e"
      ],
      "correctIndex": 0,
      "explanation": "The Second Five-Year Plan inherently demanded colossal capital investments to rapidly set up heavy steel plants and massive industrial infrastructure. To swiftly execute this ambitious Mahalanobis strategy, India had to import vast quantities of expensive advanced machinery, forcing the government to heavily rely on foreign loans and leading to a severe foreign exchange crisis. / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u092d\u093e\u0930\u0940 \u0938\u094d\u091f\u0940\u0932 \u092a\u094d\u0932\u093e\u0902\u091f \u0914\u0930 \u092c\u0921\u093c\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u0947 \u0915\u094b \u0924\u0947\u091c\u0940 \u0938\u0947 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0940 \u092a\u0942\u0902\u091c\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u0940 \u092e\u093e\u0902\u0917 \u0915\u0940\u0964 \u0907\u0938 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u0930\u0923\u0928\u0940\u0924\u093f \u0915\u094b \u0924\u0947\u091c\u0940 \u0938\u0947 \u0928\u093f\u0937\u094d\u092a\u093e\u0926\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f, \u092d\u093e\u0930\u0924 \u0915\u094b \u092c\u0921\u093c\u0940 \u092e\u093e\u0924\u094d\u0930\u093e \u092e\u0947\u0902 \u092e\u0939\u0902\u0917\u0940 \u0909\u0928\u094d\u0928\u0924 \u092e\u0936\u0940\u0928\u0930\u0940 \u0915\u093e \u0906\u092f\u093e\u0924 \u0915\u0930\u0928\u093e \u092a\u0921\u093c\u093e, \u091c\u093f\u0938\u0938\u0947 \u0938\u0930\u0915\u093e\u0930 \u0915\u094b \u0935\u093f\u0926\u0947\u0936\u0940 \u090b\u0923\u094b\u0902 \u092a\u0930 \u092d\u093e\u0930\u0940 \u0928\u093f\u0930\u094d\u092d\u0930 \u0939\u094b\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092e\u091c\u092c\u0942\u0930 \u0939\u094b\u0928\u093e \u092a\u0921\u093c\u093e \u0914\u0930 \u090f\u0915 \u0917\u0902\u092d\u0940\u0930 \u0935\u093f\u0926\u0947\u0936\u0940 \u092e\u0941\u0926\u094d\u0930\u093e \u0938\u0902\u0915\u091f \u092a\u0948\u0926\u093e \u0939\u094b \u0917\u092f\u093e\u0964",
      "reference": ""

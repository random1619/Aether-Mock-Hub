    {
      "text": "<b>Q63.</b> Q230. During India&#x27;s Third Five-Year Plan, which of the following significant events posed major challenges to industrial and trade development? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0926\u094c\u0930\u093e\u0928, \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0918\u091f\u0928\u093e \u0928\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0914\u0930 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0935\u093f\u0915\u093e\u0938 \u0915\u0947 \u0932\u093f\u090f \u092c\u0921\u093c\u0940 \u091a\u0941\u0928\u094c\u0924\u093f\u092f\u093e\u0901 \u092a\u0947\u0936 \u0915\u0940\u0902? [SSC CPO, 12 Dec 2025, Shift-2]",
      "options": [
        "Global economic recession, severely impacting Indian exports / \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0906\u0930\u094d\u0925\u093f\u0915 \u092e\u0902\u0926\u0940, \u091c\u093f\u0938\u0928\u0947 \u092d\u093e\u0930\u0924\u0940\u092f \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b \u0917\u0902\u092d\u0940\u0930 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u092d\u093e\u0935\u093f\u0924 \u0915\u093f\u092f\u093e",
        "Initiation of economic liberalization policies, attracting foreign investment / \u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0928\u0940\u0924\u093f\u092f\u094b\u0902 \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924, \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u094b \u0906\u0915\u0930\u094d\u0937\u093f\u0924 \u0915\u0930\u0928\u093e",
        "Implementation of the Green Revolution has shifted in focus towards agriculture / \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0915\u0947 \u0915\u093e\u0930\u094d\u092f\u093e\u0928\u094d\u0935\u092f\u0928 \u0928\u0947 \u0915\u0943\u0937\u093f \u0915\u0940 \u0913\u0930 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u093f\u092f\u093e \u0939\u0948",
        "Major wars and droughts leading to resource constraints / \u092a\u094d\u0930\u092e\u0941\u0916 \u092f\u0941\u0926\u094d\u0927 \u0914\u0930 \u0938\u0942\u0916\u0947 \u091c\u093f\u0938\u0915\u0947 \u0915\u093e\u0930\u0923 \u0938\u0902\u0938\u093e\u0927\u0928 \u0915\u0940 \u0915\u092e\u0940 \u0939\u0941\u0908"
      ],
      "correctIndex": 3,
      "explanation": "India&#x27;s ambitious Third Five-Year Plan (1961-1966) failed drastically to meet its targets. The nation&#x27;s economy was severely derailed by catastrophic external shocks: the massive Sino-Indian War of 1962, the Indo-Pakistani War of 1965, and a devastating, unprecedented national drought in 1965-66, which severely strained financial resources. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1961-1966) \u0905\u092a\u0928\u0947 \u0932\u0915\u094d\u0937\u094d\u092f\u094b\u0902 \u0915\u094b \u092a\u0942\u0930\u093e \u0915\u0930\u0928\u0947 \u092e\u0947\u0902 \u092c\u0941\u0930\u0940 \u0924\u0930\u0939 \u0935\u093f\u092b\u0932 \u0930\u0939\u0940\u0964 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u092c\u093e\u0939\u0930\u0940 \u091d\u091f\u0915\u094b\u0902 \u0938\u0947 \u0926\u0947\u0936 \u0915\u0940 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0917\u0902\u092d\u0940\u0930 \u0930\u0942\u092a \u0938\u0947 \u092a\u091f\u0930\u0940 \u0938\u0947 \u0909\u0924\u0930 \u0917\u0908: 1962 \u0915\u093e \u0935\u093f\u0936\u093e\u0932 \u091a\u0940\u0928-\u092d\u093e\u0930\u0924 \u092f\u0941\u0926\u094d\u0927, 1965 \u0915\u093e \u092d\u093e\u0930\u0924-\u092a\u093e\u0915 \u092f\u0941\u0926\u094d\u0927, \u0914\u0930 1965-66 \u092e\u0947\u0902 \u090f\u0915 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940, \u0905\u092d\u0942\u0924\u092a\u0942\u0930\u094d\u0935 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u0942\u0916\u093e, \u091c\u093f\u0938\u0928\u0947 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0902\u0938\u093e\u0927\u0928\u094b\u0902 \u092a\u0930 \u0917\u0902\u092d\u0940\u0930 \u0926\u092c\u093e\u0935 \u0921\u093e\u0932\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q64.</b> Q231. What was the time frame for the first five year plan in India? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0940 \u0938\u092e\u092f\u093e\u0935\u0927\u093f \u0915\u094d\u092f\u093e \u0925\u0940? [SSC CHSL Tier-2, 10 Apr 2026, Shift-1]",
      "options": [
        "1948-1953 / 1948-1953",
        "1951-1956 / 1951-1956",
        "1956-1961 / 1956-1961",
        "1961-1966 / 1961-1966"
      ],
      "correctIndex": 1,
      "explanation": "The First Five-Year Plan of India was officially launched in 1951 and covered the period strictly up to 1956. Based heavily on the Harrod-Domar economic model, this foundational plan primarily focused on the development of the primary sector, specifically aiming to resolve the severe food crisis by investing massively in agriculture. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 1951 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940 \u0914\u0930 \u0907\u0938\u0915\u0940 \u0905\u0935\u0927\u093f 1956 \u0924\u0915 \u0925\u0940\u0964 \u0939\u0948\u0930\u094b\u0921-\u0921\u094b\u092e\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u092e\u0949\u0921\u0932 \u092a\u0930 \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0906\u0927\u093e\u0930\u093f\u0924, \u0907\u0938 \u0906\u0927\u093e\u0930\u092d\u0942\u0924 \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u093f\u092f\u093e, \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0915\u0943\u0937\u093f \u092e\u0947\u0902 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0928\u093f\u0935\u0947\u0936 \u0915\u0930\u0915\u0947 \u0917\u0902\u092d\u0940\u0930 \u0916\u093e\u0926\u094d\u092f \u0938\u0902\u0915\u091f \u0915\u094b \u0939\u0932 \u0915\u0930\u0928\u0947 \u0915\u093e \u0932\u0915\u094d\u0937\u094d\u092f \u0930\u0916\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q65.</b> Q232. Who among the following was the chairman of planning commission under third five year plan? / \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0924\u0939\u0924 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0947 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0925\u0947? [SSC CHSL Tier-2, 10 Apr 2026, Shift-1]",
      "options": [
        "Gulzarilal Nanda / \u0917\u0941\u0932\u091c\u093c\u093e\u0930\u0940\u0932\u093e\u0932 \u0928\u0902\u0926\u093e",
        "Morarji Desai / \u092e\u094b\u0930\u093e\u0930\u091c\u0940 \u0926\u0947\u0938\u093e\u0908",
        "Jawaharlal Nehru / \u091c\u0935\u093e\u0939\u0930\u0932\u093e\u0932 \u0928\u0947\u0939\u0930\u0942",
        "Lal Bahadur Shastri / \u0932\u093e\u0932 \u092c\u0939\u093e\u0926\u0941\u0930 \u0936\u093e\u0938\u094d\u0924\u094d\u0930\u0940"
      ],
      "correctIndex": 2,
      "explanation": "The Prime Minister of India acts as the ex-officio chairman of the Planning Commission. During the launch and crucial early years of the Third Five-Year Plan (1961-1966), Jawaharlal Nehru was the Prime Minister and thus exclusively served as its chairman. / \u092d\u093e\u0930\u0924 \u0915\u0947 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0947 \u092a\u0926\u0947\u0928 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964 \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1961-1966) \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 \u0914\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0936\u0941\u0930\u0941\u0906\u0924\u0940 \u0935\u0930\u094d\u0937\u094b\u0902 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928, \u091c\u0935\u093e\u0939\u0930\u0932\u093e\u0932 \u0928\u0947\u0939\u0930\u0942 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0925\u0947 \u0914\u0930 \u0907\u0938 \u092a\u094d\u0930\u0915\u093e\u0930 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0907\u0938\u0915\u0947 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q66.</b> Q233. The Second Five Year Plan (1956-1961), often associated with the Mahalanobis Model, marked a significant shift in India&#x27;s development strategy. What was the primary focus of this plan? / \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u0938\u0947 \u091c\u0941\u0921\u093c\u0940 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-1961) \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0935\u093f\u0915\u093e\u0938 \u0930\u0923\u0928\u0940\u0924\u093f \u092e\u0947\u0902 \u090f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092c\u0926\u0932\u093e\u0935 \u0915\u094b \u091a\u093f\u0939\u094d\u0928\u093f\u0924 \u0915\u093f\u092f\u093e\u0964 \u0907\u0938 \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u092b\u094b\u0915\u0938 \u0915\u094d\u092f\u093e \u0925\u093e? [SSC CGL Mains, 2025]",
      "options": [
        "Rapid industrialization with a particular emphasis on the development of basic and heavy industries. / \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u0935\u093f\u0936\u0947\u0937 \u091c\u094b\u0930 \u0926\u0947\u0928\u0947 \u0915\u0947 \u0938\u093e\u0925 \u0924\u0940\u0935\u094d\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923\u0964",
        "Maximizing the role of the private sector in the &#x27;commanding heights&#x27; of the economy. / \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0947 &#x27;\u0915\u092e\u093e\u0902\u0921\u093f\u0902\u0917 \u0939\u093e\u0907\u091f\u094d\u0938&#x27; \u092e\u0947\u0902 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u092d\u0942\u092e\u093f\u0915\u093e \u0915\u094b \u0905\u0927\u093f\u0915\u0924\u092e \u0915\u0930\u0928\u093e\u0964",
        "Achieving immediate self-sufficiency in food grain production through the Green Revolution. / \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0916\u093e\u0926\u094d\u092f\u093e\u0928\u094d\u0928 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u092e\u0947\u0902 \u0924\u0924\u094d\u0915\u093e\u0932 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u0930\u0928\u093e\u0964",
        "Establishing an export-oriented economy to integrate rapidly with global trade markets. / \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u092c\u093e\u091c\u093e\u0930\u094b\u0902 \u0915\u0947 \u0938\u093e\u0925 \u0924\u0947\u091c\u0940 \u0938\u0947 \u090f\u0915\u0940\u0915\u0943\u0924 \u0939\u094b\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u090f\u0915 \u0928\u093f\u0930\u094d\u092f\u093e\u0924-\u0909\u0928\u094d\u092e\u0941\u0916 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u0930\u0928\u093e\u0964"
      ],
      "correctIndex": 0,
      "explanation": "The Second Five-Year Plan, architected by P.C. Mahalanobis, radically shifted India&#x27;s economic focus entirely away from agriculture directly to rapid industrialization. It aimed to build a robust foundation for self-reliance by prioritizing massive investments in heavy and basic industries, including the establishment of major public sector steel plants. / \u092a\u0940.\u0938\u0940. \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u0926\u094d\u0935\u093e\u0930\u093e \u0924\u0948\u092f\u093e\u0930 \u0915\u0940 \u0917\u0908 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u092b\u094b\u0915\u0938 \u0915\u094b \u0915\u0943\u0937\u093f \u0938\u0947 \u0939\u091f\u093e\u0915\u0930 \u0938\u0940\u0927\u0947 \u0924\u0940\u0935\u094d\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0915\u0940 \u0913\u0930 \u092e\u094b\u0921\u093c \u0926\u093f\u092f\u093e\u0964 \u0907\u0938\u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u092d\u093e\u0930\u0940 \u0914\u0930 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u092e\u0947\u0902 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0928\u093f\u0935\u0947\u0936 \u0915\u094b \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0947\u0915\u0930 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0915\u0947 \u0932\u093f\u090f \u090f\u0915 \u092e\u091c\u092c\u0942\u0924 \u0928\u0940\u0902\u0935 \u092c\u0928\u093e\u0928\u093e \u0925\u093e, \u091c\u093f\u0938\u092e\u0947\u0902 \u092a\u094d\u0930\u092e\u0941\u0916 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\u0930\u094b\u0902 \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q67.</b> Q234. Which of the following was a primary objective of &#x27;Liberalization&#x27; within the New Economic Policy (NEP) of 1991? / 1991 \u0915\u0940 \u0928\u0908 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f (NEP) \u0915\u0947 \u0905\u0902\u0924\u0930\u094d\u0917\u0924 &#x27;\u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923&#x27; \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094d\u092f\u093e \u0925\u093e? [SSC CGL Mains, 2025]",
      "options": [
        "Strengthening the MRTP Act to restrict the expansion of large business houses. / \u092c\u0921\u093c\u0947 \u0935\u094d\u092f\u093e\u092a\u093e\u0930\u093f\u0915 \u0918\u0930\u093e\u0928\u094b\u0902 \u0915\u0947 \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0915\u094b \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u090f\u092e\u0906\u0930\u091f\u0940\u092a\u0940 (MRTP) \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0915\u094b \u092e\u091c\u092c\u0942\u0924 \u0915\u0930\u0928\u093e\u0964",
        "Expanding the list of industries reserved exclusively for the public sector. / \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0932\u093f\u090f \u0906\u0930\u0915\u094d\u0937\u093f\u0924 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0940 \u0938\u0942\u091a\u0940 \u0915\u093e \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0915\u0930\u0928\u093e\u0964",
        "Increasing the peak customs duty on imports to protect domestic industries. / \u0918\u0930\u0947\u0932\u0942 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0940 \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u0915\u0947 \u0932\u093f\u090f \u0906\u092f\u093e\u0924 \u092a\u0930 \u091a\u0930\u092e \u0938\u0940\u092e\u093e \u0936\u0941\u0932\u094d\u0915 \u092c\u0922\u093c\u093e\u0928\u093e\u0964",
        "Abolishing industrial licensing for most industries to encourage private entry. / \u0928\u093f\u091c\u0940 \u092a\u094d\u0930\u0935\u0947\u0936 \u0915\u094b \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0905\u0927\u093f\u0915\u093e\u0902\u0936 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930\u0928\u093e\u0964"
      ],
      "correctIndex": 3,
      "explanation": "The core philosophy of the historic 1991 Liberalization reforms was to massively unchain the Indian economy from rigid state control. Its most transformative, primary objective was permanently dismantling the infamous &quot;License Raj&quot; by abolishing mandatory industrial licensing for almost all sectors, thereby actively encouraging immense private sector investment. / \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1991 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u0926\u0930\u094d\u0936\u0928 \u092d\u093e\u0930\u0924\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u0915\u0920\u094b\u0930 \u0930\u093e\u091c\u094d\u092f \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u0938\u0947 \u092e\u0941\u0915\u094d\u0924 \u0915\u0930\u0928\u093e \u0925\u093e\u0964 \u0907\u0938\u0915\u093e \u0938\u092c\u0938\u0947 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940, \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0932\u0917\u092d\u0917 \u0938\u092d\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0915\u094b \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930\u0915\u0947 \u0915\u0941\u0916\u094d\u092f\u093e\u0924 &quot;\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c&quot; \u0915\u094b \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u0916\u0924\u094d\u092e \u0915\u0930\u0928\u093e \u0925\u093e, \u091c\u093f\u0938\u0938\u0947 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0928\u093f\u0935\u0947\u0936 \u0915\u094b \u0938\u0915\u094d\u0930\u093f\u092f \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e \u0938\u0915\u0947\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q68.</b> Q235. What was the &#x27;License Raj&#x27; (or Permit Raj) that existed from 1947 to 1990? / 1947 \u0938\u0947 1990 \u0924\u0915 \u092e\u094c\u091c\u0942\u0926 &#x27;\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c&#x27; (\u092f\u093e \u092a\u0930\u092e\u093f\u091f \u0930\u093e\u091c) \u0915\u094d\u092f\u093e \u0925\u093e? [Delhi Police Constable, 27 Dec 2025, Shift-1]",
      "options": [
        "A tax collection system / \u090f\u0915 \u0915\u0930 \u0938\u0902\u0917\u094d\u0930\u0939 \u092a\u094d\u0930\u0923\u093e\u0932\u0940",
        "A system of government permissions (licenses) needed to start or expand a business / \u0935\u094d\u092f\u0935\u0938\u093e\u092f \u0936\u0941\u0930\u0942 \u0915\u0930\u0928\u0947 \u092f\u093e \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0906\u0935\u0936\u094d\u092f\u0915 \u0938\u0930\u0915\u093e\u0930\u0940 \u0905\u0928\u0941\u092e\u0924\u093f\u092f\u094b\u0902 (\u0932\u093e\u0907\u0938\u0947\u0902\u0938) \u0915\u0940 \u090f\u0915 \u092a\u094d\u0930\u0923\u093e\u0932\u0940",
        "A system of land distribution / \u092d\u0942\u092e\u093f \u0935\u093f\u0924\u0930\u0923 \u0915\u0940 \u090f\u0915 \u092a\u094d\u0930\u0923\u093e\u0932\u0940",
        "A foreign trade policy / \u090f\u0915 \u0935\u093f\u0926\u0947\u0936 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0928\u0940\u0924\u093f"
      ],
      "correctIndex": 1,
      "explanation": "The &#x27;License Raj&#x27; (or Permit Raj) strictly refers to the highly restrictive, heavily bureaucratized system of regulations that strictly governed the Indian economy from independence until the 1991 reforms. Under this rigid socialist framework, private companies required exhaustive, multi-layered government licenses just to establish a business or expand factory capacity. / &#x27;\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c&#x27; (\u092f\u093e \u092a\u0930\u092e\u093f\u091f \u0930\u093e\u091c) \u0938\u0947 \u0924\u093e\u0924\u094d\u092a\u0930\u094d\u092f \u0928\u093f\u092f\u092e\u094b\u0902 \u0915\u0940 \u0909\u0938 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093e\u0924\u094d\u092e\u0915, \u092d\u093e\u0930\u0940 \u0928\u094c\u0915\u0930\u0936\u093e\u0939\u0940 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0938\u0947 \u0939\u0948 \u091c\u093f\u0938\u0928\u0947 \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0938\u0947 \u0932\u0947\u0915\u0930 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0924\u0915 \u092d\u093e\u0930\u0924\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u0915\u093f\u092f\u093e\u0964 \u0907\u0938 \u0915\u0920\u094b\u0930 \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u0947 \u0915\u0947 \u0924\u0939\u0924, \u0928\u093f\u091c\u0940 \u0915\u0902\u092a\u0928\u093f\u092f\u094b\u0902 \u0915\u094b \u0935\u094d\u092f\u0935\u0938\u093e\u092f \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u0930\u0928\u0947 \u092f\u093e \u0915\u093e\u0930\u0916\u093e\u0928\u0947 \u0915\u0940 \u0915\u094d\u0937\u092e\u0924\u093e \u092c\u0922\u093c\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0935\u094d\u092f\u093e\u092a\u0915, \u092c\u0939\u0941-\u0938\u094d\u0924\u0930\u0940\u092f \u0938\u0930\u0915\u093e\u0930\u0940 \u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0915\u0940 \u0906\u0935\u0936\u094d\u092f\u0915\u0924\u093e \u0925\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q69.</b> Q236. The &#x27;Eighth Five-Year Plan&#x27; (1992-97) was the first plan to be launched after what event? / &#x27;\u0906\u0920\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e&#x27; (1992-97) \u0915\u093f\u0938 \u0918\u091f\u0928\u093e \u0915\u0947 \u092c\u093e\u0926 \u0936\u0941\u0930\u0942 \u0915\u0940 \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0940 \u092a\u0939\u0932\u0940 \u092f\u094b\u091c\u0928\u093e \u0925\u0940? [Delhi Police Constable, 27 Dec 2025, Shift-1]",
      "options": [
        "The Green Revolution / \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f",
        "The Bank Nationalization / \u092c\u0948\u0902\u0915 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f\u0915\u0930\u0923",
        "The 1991 Economic Reforms / 1991 \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930",
        "The formation of NITI Aayog / \u0928\u0940\u0924\u093f \u0906\u092f\u094b\u0917 \u0915\u093e \u0917\u0920\u0928"
      ],
      "correctIndex": 2,
      "explanation": "The Eighth Five-Year Plan (1992\u20131997) holds immense historical importance as it was the very first national economic plan officially launched immediately following the radical structural transformation of the 1991 LPG (Liberalization, Privatization, Globalization) Economic Reforms. Driven by PM Narasimha Rao, it aggressively shifted India towards an open, free-market framework. / \u0906\u0920\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1992-1997) \u0915\u093e \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u092e\u0939\u0924\u094d\u0935 \u092c\u0939\u0941\u0924 \u0905\u0927\u093f\u0915 \u0939\u0948 \u0915\u094d\u092f\u094b\u0902\u0915\u093f \u092f\u0939 1991 \u0915\u0947 \u090f\u0932\u092a\u0940\u091c\u0940 (\u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923, \u0928\u093f\u091c\u0940\u0915\u0930\u0923, \u0935\u0948\u0936\u094d\u0935\u0940\u0915\u0930\u0923) \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0906\u092e\u0942\u0932\u091a\u0942\u0932 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 \u0915\u0947 \u0924\u0941\u0930\u0902\u0924 \u092c\u093e\u0926 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u092a\u0939\u0932\u0940 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0906\u0930\u094d\u0925\u093f\u0915 \u092f\u094b\u091c\u0928\u093e \u0925\u0940\u0964 \u092a\u0940\u090f\u092e \u0928\u0930\u0938\u093f\u092e\u094d\u0939\u093e \u0930\u093e\u0935 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u0902\u091a\u093e\u0932\u093f\u0924, \u0907\u0938\u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u094b \u090f\u0915 \u0916\u0941\u0932\u0947, \u092e\u0941\u0915\u094d\u0924-\u092c\u093e\u091c\u093e\u0930 \u0922\u093e\u0902\u091a\u0947 \u0915\u0940 \u0913\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u094d\u0925\u093e\u0928\u093e\u0902\u0924\u0930\u093f\u0924 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q70.</b> Q237. What is the full form of &#x27;NEP&#x27; in the context of the 1991 reforms? / 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0938\u0902\u0926\u0930\u094d\u092d \u092e\u0947\u0902 &#x27;NEP&#x27; \u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0930\u0942\u092a \u0915\u094d\u092f\u093e \u0939\u0948? [Delhi Police Constable, 27 Dec 2025, Shift-1]",
      "options": [
        "New Economic Policy / \u0928\u0908 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f (New Economic Policy)",
        "National Education Policy / \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0936\u093f\u0915\u094d\u0937\u093e \u0928\u0940\u0924\u093f (National Education Policy)",
        "National Employment Program / \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0930\u094b\u091c\u0917\u093e\u0930 \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e (National Employment Program)",
        "New Export Policy / \u0928\u0908 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0928\u0940\u0924\u093f (New Export Policy)"
      ],
      "correctIndex": 0,
      "explanation": "In the strict historical context of India&#x27;s 1991 structural reforms, &#x27;NEP&#x27; explicitly stands for the &quot;New Economic Policy.&quot; Launched aggressively by Finance Minister Dr. Manmohan Singh to combat a catastrophic balance of payments crisis, the NEP radically abolished the restrictive License Raj and fundamentally opened the Indian economy to foreign direct investment. / \u092d\u093e\u0930\u0924 \u0915\u0947 1991 \u0915\u0947 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0938\u0902\u0926\u0930\u094d\u092d \u092e\u0947\u0902, &#x27;NEP&#x27; \u0915\u093e \u0905\u0930\u094d\u0925 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 &quot;\u0928\u0908 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f&quot; (New Economic Policy) \u0939\u0948\u0964 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u092d\u0941\u0917\u0924\u093e\u0928 \u0938\u0902\u0924\u0941\u0932\u0928 \u0938\u0902\u0915\u091f \u0938\u0947 \u0928\u093f\u092a\u091f\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0935\u093f\u0924\u094d\u0924 \u092e\u0902\u0924\u094d\u0930\u0940 \u0921\u0949. \u092e\u0928\u092e\u094b\u0939\u0928 \u0938\u093f\u0902\u0939 \u0926\u094d\u0935\u093e\u0930\u093e \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u090f\u0928\u0908\u092a\u0940 \u0928\u0947 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093e\u0924\u094d\u092e\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e \u0914\u0930 \u092d\u093e\u0930\u0924\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u0947 \u0932\u093f\u090f \u0916\u094b\u0932 \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q71.</b> Q238. What status is given to high-performing Public Sector Undertakings (PSUs) to give them more autonomy? / \u0909\u091a\u094d\u091a \u092a\u094d\u0930\u0926\u0930\u094d\u0936\u0928 \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u092a\u0915\u094d\u0930\u092e\u094b\u0902 (PSUs) \u0915\u094b \u0905\u0927\u093f\u0915 \u0938\u094d\u0935\u093e\u092f\u0924\u094d\u0924\u0924\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u094c\u0928 \u0938\u093e \u0926\u0930\u094d\u091c\u093e \u0926\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948? [Delhi Police Constable, 27 Dec 2025, Shift-1]",
      "options": [
        "Blue Chip / \u092c\u094d\u0932\u0942 \u091a\u093f\u092a",
        "A-Grade / \u090f-\u0917\u094d\u0930\u0947\u0921",
        "Star Company / \u0938\u094d\u091f\u093e\u0930 \u0915\u0902\u092a\u0928\u0940",
        "Navratna / \u0928\u0935\u0930\u0924\u094d\u0928"

    closeBtn.addEventListener('click', closeModal);

    // Close if clicking outside content box
    paletteModal.addEventListener('click', (e) => {
        if(e.target === paletteModal) closeModal();
    });

    // keyboard
    document.addEventListener('keydown',(e)=>{
      if(e.target.tagName === 'INPUT') return;
      if(e.key==='ArrowLeft') go(-1);
      if(e.key==='ArrowRight') go(1);
    });
  }

  function initTheme(){
    const saved = localStorage.getItem('qa_theme');
    if(saved==='dark'){ 
        document.body.classList.add('dark-mode'); 
        state.darkMode=true; 
    }
    updateThemeIcon();
    themeToggle.addEventListener('click', ()=>{
      state.darkMode = !state.darkMode;
      document.body.classList.toggle('dark-mode', state.darkMode);
      localStorage.setItem('qa_theme', state.darkMode?'dark':'light');
      updateThemeIcon();
      if(state.submitted) buildCharts(state.lastResultData);
    });
  }
  function updateThemeIcon(){
    const i = themeToggle.querySelector('i');
    i.classList.toggle('fa-moon', !state.darkMode);
    i.classList.toggle('fa-sun',  state.darkMode);
  }

  function initFullscreen() {
    // Integrated into Header Timer
    const timerDisplay = document.getElementById('headerTimerDisp');
    if (!timerDisplay) return;

    timerDisplay.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    });
  }

  function initFontSizeControls() {
      const fontBtn = document.getElementById('fontToggleBtn');
      const fontSizes = [16, 18, 20, 22, 24]; // Larger sizes for clarity
      let fontIndex = 0; // Starts at 16px

      fontBtn.addEventListener('click', () => {
          fontIndex = (fontIndex + 1) % fontSizes.length;
          state.currentFontSize = fontSizes[fontIndex];
          // Update the CSS Variable, not the root element
          document.documentElement.style.setProperty('--dynamic-size', state.currentFontSize + 'px');
      });
  }

  function initLanguageSwitcher() {
      // Toggle order: Both -> Hindi -> English -> Both
      const langOrder = ['both', 'hn', 'en'];

      langToggleBtn.addEventListener('click', () => {
          const currentIndex = langOrder.indexOf(state.currentLang);
          const nextIndex = (currentIndex + 1) % langOrder.length;
          state.currentLang = langOrder[nextIndex];

          updateLangButton();
          renderQuestion(state.current);
      });
  }

  function updateLangButton() {
      let label = 'BILI';
      if (state.currentLang === 'hn') label = 'HIN';
      if (state.currentLang === 'en') label = 'ENG';
      langToggleBtn.textContent = label;
  }

  function translateText(text) {
      if (!text) return text;
      if (state.currentLang === 'both') return text;

      // Check if string has HTML tags to decide between simple split and DOM traversal
      const hasTags = /<[a-z][\s\S]*>/i.test(text);

      if (hasTags) {
          const div = document.createElement('div');
          div.innerHTML = text;
          walkAndTranslate(div);
          return div.innerHTML;
      } else {
          // Plain text path
          if (text.includes(' / ')) {
              const parts = text.split(' / ');
              if (parts.length >= 2) {
                  const en = parts[0];
                  const hn = parts.slice(1).join(' / ');
                  return state.currentLang === 'hn' ? hn.trim() : en.trim();
              }
          }
          return text;
      }
  }

  function walkAndTranslate(node) {
      if (node.nodeType === 3) { // Text node
          const val = node.nodeValue;
          if (val && val.includes(' / ')) {
              const parts = val.split(' / ');
              if (parts.length >= 2) {
                  const en = parts[0];
                  const hn = parts.slice(1).join(' / ');
                  node.nodeValue = state.currentLang === 'hn' ? hn.trim() : en.trim();
              }
          }
      } else if (node.nodeType === 1) { // Element node
          for (let i = 0; i < node.childNodes.length; i++) {
              walkAndTranslate(node.childNodes[i]);
          }
      }
  }


  function initSwipeNavigation() {
    let touchStartX = 0;
    let touchEndX = 0;
    let touchStartY = 0;
    let touchEndY = 0;
    const swipeThreshold = 50; // Minimum distance for a swipe
    const swipeRatio = 0.5; // Vertical distance should be less than half of horizontal

    const swipeArea = document.querySelector('.quiz-main');

    swipeArea.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    swipeArea.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipe();
    }, { passive: true });

    function handleSwipe() {
        if (state.submitted && !state.inReviewMode) return;

        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;

        if (Math.abs(dx) > swipeThreshold && Math.abs(dy) < Math.abs(dx) * swipeRatio) {
            if (dx < 0) {
                go(1); // Swiped left
            } else {
                go(-1); // Swiped right
            }
        }
    }
  }

  // ----- Timer -----
  function initTimer(){
    const start = Date.now();
    const duration = state.totalTime*1000;
    const end = start + duration;
    tick(); state.timerInterval = setInterval(tick, 1000);
    function tick(){
      const now = Date.now();
      const left = Math.max(0, end-now);
      const m = String(Math.floor(left/60000)).padStart(2,'0');
      const s = String(Math.floor((left%60000)/1000)).padStart(2,'0');

      // Sidebar timer
      document.getElementById('minutes').textContent = m;
      document.getElementById('seconds').textContent = s;

      // Header timer (NEW)
      const headerTimer = document.getElementById('headerTimerDisp');
      if(headerTimer) headerTimer.textContent = `${m}:${s}`;

      const pct = (left/duration)*100;
      const bar = document.getElementById('timeProgress');
      bar.style.width = pct + '%';
      if(left<=0){ clearInterval(state.timerInterval); submitQuiz(); }
      else if(pct<25) bar.className='progress-bar bg-danger';
      else if(pct<50) bar.className='progress-bar bg-warning';
      else bar.className='progress-bar bg-primary';
    }
  }

  // ----- Sidebar tiles -----
  function buildQuestionTiles(){
    qListGrid.innerHTML = '';
    quizData.questions.forEach((_,i)=>{
      const d = document.createElement('div');
      d.className='q-tile'; d.textContent=i+1;
      d.addEventListener('click', ()=>{
        // Close modal IMMEDIATELY upon clicking, before rendering or anything else
        document.getElementById('paletteModal').classList.remove('show');

        if(!state.submitted) updateTime();
        renderQuestion(i);
      });
      qListGrid.appendChild(d);
    });
  }

  function updateTiles(){
    document.querySelectorAll('.q-tile').forEach((el,idx)=>{
      el.className='q-tile'; // Reset
      if(state.submitted){
          if(state.answers[idx] === quizData.questions[idx].correctIndex) el.classList.add('review-correct');
          else if(state.answers[idx] !== null) el.classList.add('review-incorrect');
          else el.classList.add('review-unattempted');
      } else {
        if(state.answers[idx] !== null) el.classList.add('answered');
        if(state.markedForReview[idx]) el.classList.add('marked');
      }
      if(idx === state.current) el.classList.add('current');
    });
  }

  // ----- Render question -----
  function renderQuestion(idx){
    if (idx < 0 || idx >= quizData.questions.length) return;

    // Stop previous Question Timer
    if (state.qTimerInterval) clearInterval(state.qTimerInterval);

    state.current=idx;
    const q=quizData.questions[idx];

    // Live Accuracy Calculation
    let accuracyBadge = '';
    if (quizData.leaderboard && quizData.leaderboard.question_stats && quizData.leaderboard.question_stats[idx]) {
        const stats = quizData.leaderboard.question_stats[idx];
        if(stats.total > 0) {
            const acc = Math.round((stats.correct / stats.total) * 100);
            accuracyBadge = `<span class="q-accuracy" title="Based on ${stats.total} Telegram users"><i class="fas fa-bullseye me-1"></i>${acc}%</span>`;
        }
    }

    // --- Marking Scheme Badge Logic ---
    let markHtml = '';
    const posMark = 1; // Assuming +1 for correct
    const negMark = state.negativeMark;

    if (!state.submitted) {
        // Live Mode: Show full scheme
        markHtml = `<span class="q-marks" title="Marking Scheme"><i class="fas fa-star-half-alt me-1"></i>+${posMark} / -${negMark}</span>`;
    } else {
        // Review Mode: Show result
        const userAns = state.answers[idx];
        const isCorrect = userAns === q.correctIndex;
        const isSkipped = userAns === null;

        if (isSkipped) {
             markHtml = `<span class="q-marks text-muted">0</span>`;
        } else if (isCorrect) {
             markHtml = `<span class="q-marks positive">+${posMark}</span>`;
        } else {
             markHtml = `<span class="q-marks negative">-${negMark}</span>`;
        }
    }

    // Question Card HTML
    // Updated: Completely removed bottom margin and padding from header row
    // Updated: Trimmed q.text and removed internal indentation artifacts from JSON source
    let textContent = q.text;
    if(typeof textContent === 'string') {
        textContent = textContent.trim();
        // Regex to replace newline followed by whitespace with a single space
        // This collapses the indentation from the JSON string which causes layout gaps
        textContent = textContent.replace(/\n\s+/g, ' '); 
    }

    let questionHtml=`
      <div class="card-ui">
        <div class="d-flex justify-content-between align-items-center mb-0 pb-0 border-bottom-0" style="min-height: 24px;">
            <div class="q-meta-container">
                <h5 class="fw-bold m-0" style="line-height:1;">Question ${idx+1}</h5>
                <span class="q-timer"><i class="fas fa-stopwatch me-1"></i><span id="qTimerDisp">0s</span></span>
                ${markHtml}
                ${accuracyBadge}
            </div>
            ${q.reference ? `<div class="small opacity-75">${q.reference}</div>` : ''}
        </div>
        <!-- Removed mt-2 for tighter spacing -->
        <div class="q-text mt-2">${translateText(textContent)}</div>
        <div class="options">`;
    q.options.forEach((opt,i)=>{
      let cls='option-btn';
      // User selection logic for Live Mode
      if(state.answers[idx]===i) cls+=' selected';

      // Review Mode Logic
      if(state.submitted){
        if(i===q.correctIndex) cls+=' correct';
        else if(state.answers[idx]===i) cls+=' incorrect';
      }

      // Add Checkmark span (only visible via CSS if selected)
      questionHtml += `<button class="${cls}" data-i="${i}">
          <span>${translateText(opt)}</span>
          <span class="user-check"><i class="fas fa-check-circle"></i></span>
      </button>`;
    });
    const translatedExplanation = translateText(q.explanation || 'Not available.');
    questionHtml += `</div>
        ${state.submitted ? `<div class="explanation mt-3"><strong>Explanation:</strong> ${translatedExplanation}</div>` : ''}
      </div>
    `;
    questionArea.innerHTML = questionHtml;

    // Start per-question timer logic (Visual only)
    if (!state.submitted) {
        // Start from time already spent
        let secondsSpent = Math.floor(state.timePerQ[idx] || 0);
        const timerEl = document.getElementById('qTimerDisp');
        if(timerEl) {
            timerEl.textContent = secondsSpent + 's';
            state.qTimerInterval = setInterval(() => {
                secondsSpent++;
                timerEl.textContent = secondsSpent + 's';
            }, 1000);
        }
    } else {
        // Show static time if submitted
         const timerEl = document.getElementById('qTimerDisp');
         if(timerEl) timerEl.textContent = Math.floor(state.timePerQ[idx] || 0) + 's';
    }


    // Navigation Buttons HTML
    let buttonsHtml = `
      <button id="prevBtn" class="btn btn-outline-secondary btn-nav"><i class="fas fa-chevron-left me-2"></i>Previous</button>
      <button id="markBtn" class="btn btn-outline-info btn-nav">
          ${state.markedForReview[idx] ? '<i class="fas fa-bookmark me-2"></i>Unmark' : '<i class="far fa-bookmark me-2"></i>Mark for Review'}
      </button>
      <button id="nextBtn" class="btn btn-primary btn-nav">Next<i class="fas fa-chevron-right ms-2"></i></button>
    `;
    quizNav.innerHTML = buttonsHtml;


    // Add event listeners to new elements
    document.getElementById('prevBtn').addEventListener('click', () => go(-1));
    document.getElementById('nextBtn').addEventListener('click', () => go(1));
    document.getElementById('markBtn').addEventListener('click', toggleMark);

    if(state.submitted) {
        document.getElementById('markBtn').style.display = 'none';
    }

    document.querySelectorAll('.option-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(state.submitted) return;
        clickSound.currentTime=0; clickSound.play();
        const i = parseInt(btn.dataset.i);
        state.answers[state.current] = (state.answers[state.current] === i) ? null : i; // Allow un-selecting
        renderQuestion(state.current); // Re-render to show selection change
        updateStats();
        updateTiles();
      });
    });

    updateTiles();
    updateProgress();

    // Sound for review mode
    if(state.inReviewMode && state.lastSoundIdx!==idx){
      state.lastSoundIdx=idx;
      const isAttempted = state.answers[idx]!==null;
      const isCorrect = isAttempted && state.answers[idx]===q.correctIndex;
      if(isAttempted){
        setTimeout(()=>{ (isCorrect?correctSound:wrongSound).play(); }, 250);
      }
    }
  }

  function go(dir){
    const i = state.current + dir;
    if(i>=0 && i<quizData.questions.length){
      if(!state.submitted) updateTime();
      renderQuestion(i);
    }
  }

  function toggleMark() {
    state.markedForReview[state.current] = !state.markedForReview[state.current];
    renderQuestion(state.current); // Re-render to update button text
    updateTiles();
    updateStats();
  }

  function updateTime(){
    const now = new Date();
    state.timePerQ[state.current] += (now - state.startTime)/1000;
    state.startTime = now;
  }

  function updateStats() {
    const answeredCount = state.answers.filter(a => a !== null).length;
    const markedCount = state.markedForReview.filter(m => m).length;
    const totalCount = quizData.questions.length;
    document.getElementById('statAnswered').textContent = answeredCount;
    document.getElementById('statUnanswered').textContent = totalCount - answeredCount;
    document.getElementById('statMarked').textContent = markedCount;
    document.getElementById('statTotal').textContent = totalCount;
  }

  function updateProgress() {
      const answeredCount = state.answers.filter(a => a !== null).length;
      const totalCount = quizData.questions.length;
      const percent = totalCount > 0 ? (answeredCount / totalCount) * 100 : 0;
      const progressBar = document.getElementById('thinProgressBarInner');
      if (progressBar) {
          progressBar.style.width = `${percent}%`;
      }
  }

  // ----- Submit & Results -----
  function submitQuiz(){
    if(state.submitted) return;

    // Explicitly CLOSE the palette if it is open
    document.getElementById('paletteModal').classList.remove('show');

    clearInterval(state.timerInterval);
    if(state.qTimerInterval) clearInterval(state.qTimerInterval); // Stop question timer

    updateTime();
    state.submitted=true;

    let correct=0, incorrect=0, unattempted=0, score=0, neg=0;
    state.answers.forEach((a,i)=>{
      if(a===null){ unattempted++; }
      else if(a===quizData.questions[i].correctIndex){ correct++; score+=1; }
      else { incorrect++; score-=state.negativeMark; neg+=state.negativeMark; }
    });

    state.avgTime = state.timePerQ.reduce((s,t)=>s+t,0)/quizData.questions.length;
    const pct = (score/quizData.questions.length)*100;

    questionArea.style.display = 'none';
    quizNav.style.display = 'none';
    submitBtn.style.display = 'none';
    document.querySelector('.quiz-main-header').style.display = 'none';

    renderResults({correct, incorrect, unattempted, score, neg, pct});
    resultsContainer.style.display = 'block';

    updateTiles();

    if(pct>=70){ confetti(); correctSound.play(); }
    else if(pct<50){ wrongSound.play(); }
  }

  function renderResults(resData) {
      const { correct, incorrect, unattempted, score, neg, pct } = resData;
      const total = quizData.questions.length;
      state.lastResultData = resData; // Save for redrawing charts on theme change

      let html = `
        <div class="text-center">
            <h2 class="fw-bold">Quiz Completed!</h2>
            <p>Here is your performance summary.</p>
            <div class="final-score">${pct.toFixed(1)}%</div>
            <div class="fs-4 fw-bold mb-4">${score.toFixed(2)} / ${total}</div>
        </div>

        <ul class="nav nav-pills justify-content-center mb-3 results-tabs" id="pills-tab" role="tablist">
          <li class="nav-item" role="presentation"><button class="nav-link active" id="pills-summary-tab" data-bs-toggle="pill" data-bs-target="#pills-summary" type="button" role="tab">Summary</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" id="pills-analysis-tab" data-bs-toggle="pill" data-bs-target="#pills-analysis" type="button" role="tab">Analysis</button></li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
          <div class="tab-pane fade show active" id="pills-summary" role="tabpanel">
            <div class="row g-3">
                <div class="col-md-6"><div class="p-3 bg-light rounded d-flex justify-content-between"><span>Total Questions</span><span class="fw-bold">${total}</span></div></div>
                <div class="col-md-6"><div class="p-3 bg-light rounded d-flex justify-content-between"><span>Correct</span><span class="fw-bold text-success">${correct}</span></div></div>
                <div class="col-md-6"><div class="p-3 bg-light rounded d-flex justify-content-between"><span>Incorrect</span><span class="fw-bold text-danger">${incorrect}</span></div></div>
                <div class="col-md-6"><div class="p-3 bg-light rounded d-flex justify-content-between"><span>Unattempted</span><span class="fw-bold text-warning">${unattempted}</span></div></div>
                <div class="col-md-6"><div class="p-3 bg-light rounded d-flex justify-content-between"><span>Negative Marks</span><span class="fw-bold text-danger">-${neg.toFixed(2)}</span></div></div>
            </div>
          </div>
          <div class="tab-pane fade" id="pills-analysis" role="tabpanel">
            <div class="chart-container mb-3"><canvas id="performanceChart"></canvas></div>
            <div class="chart-container" style="height: 300px;"><canvas id="timeAnalysisChart"></canvas></div>

            <h5 class="fw-bold mt-5 mb-3 text-center">Telegram Leaderboard</h5>
            <div id="leaderboardSection"></div>
          </div>
        </div>
        <div class="text-center mt-4">
            <button id="reviewBtn" class="btn btn-primary btn-lg"><i class="fas fa-search me-2"></i>Review Answers</button>
        </div>
      `;
      resultsContainer.innerHTML = html;

      document.getElementById('reviewBtn').addEventListener('click', reviewMode);

      // Render Leaderboard
      const lbSection = document.getElementById('leaderboardSection');
      if (quizData.leaderboard && quizData.leaderboard.rankings && quizData.leaderboard.rankings.length > 0) {
          let lbHtml = `<table class="leaderboard-table">
              <thead><tr><th>Rank</th><th>User</th><th>Score</th><th>Acc</th></tr></thead>
              <tbody>`;

          quizData.leaderboard.rankings.forEach((rank, i) => {
              const rankClass = i < 3 ? `rank-${i+1}` : '';
              lbHtml += `<tr>
                  <td class="${rankClass}">#${i+1}</td>
                  <td>${rank.name}</td>
                  <td>${rank.score.toFixed(1)}</td>
                  <td>${rank.accuracy.toFixed(0)}%</td>
              </tr>`;
          });

          lbHtml += `</tbody></table>`;
          lbSection.innerHTML = lbHtml;
      } else {
          lbSection.innerHTML = `<div class="text-muted small text-center p-3">No Telegram comparison data available yet.</div>`;
      }

      // Trigger chart build after tab is shown
      const analysisTab = document.getElementById('pills-analysis-tab');
      analysisTab.addEventListener('shown.bs.tab', () => buildCharts(resData), { once: true });
  }

  let performanceChartInstance, timeAnalysisChartInstance;
  function buildCharts(res){
    const {correct, incorrect, unattempted} = res;
    Chart.defaults.color = state.darkMode ? '#e8eaed' : '#6c757d';

    if (performanceChartInstance) performanceChartInstance.destroy();
    performanceChartInstance = new Chart(document.getElementById('performanceChart').getContext('2d'),{
      type:'doughnut',
      data:{ labels:['Correct','Incorrect','Unattempted'],
        datasets:[{ data:[correct,incorrect,unattempted],
          backgroundColor:['#20c997','#e63946','#ffb703'], borderWidth: 0 }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} }
    });

    const labels = Array.from({length:quizData.questions.length},(_,i)=>`Q${i+1}`);
    const correctTimes = state.timePerQ.map((t,i) => state.answers[i] === quizData.questions[i].correctIndex ? t : 0);
    const incorrectTimes = state.timePerQ.map((t,i) => (state.answers[i] !== null && state.answers[i] !== quizData.questions[i].correctIndex) ? t : 0);

    if(timeAnalysisChartInstance) timeAnalysisChartInstance.destroy();
    timeAnalysisChartInstance = new Chart(document.getElementById('timeAnalysisChart').getContext('2d'),{
      type:'bar',
      data:{ labels,
        datasets:[
          {label:'Correct', data:correctTimes, backgroundColor:'rgba(32, 201, 151, 0.7)'},
          {label:'Incorrect', data:incorrectTimes, backgroundColor:'rgba(230, 57, 70, 0.7)'}
        ]},
      options:{ responsive:true, maintainAspectRatio:false, indexAxis: 'x',
        scales:{ x:{stacked:true, grid: {color: state.darkMode ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)'}},
                 y:{stacked:true, title:{display:true,text:'Time (s)'}, grid: {color: state.darkMode ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)'}} },
      }
    });
  }

  function reviewMode(){
    state.inReviewMode=true; state.lastSoundIdx=-1;
    questionArea.style.display='block';
    quizNav.style.display = 'flex';
    resultsContainer.style.display='none';
    document.querySelector('.quiz-main-header').style.display = 'flex';
    renderQuestion(0);
  }

  function confetti(){
    const colors=['#6a5af9','#f72585','#20c997','#ffb703'];
    for(let i=0;i<100;i++){
      const d=document.createElement('div');
      d.style.cssText=`position:fixed;width:10px;height:10px;top:-10px;left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};z-index:1300;`;
      document.body.appendChild(d);
      const dy = Math.random()*500+500, rot = Math.random()*360;
      const anim = d.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${dy}px) rotate(${rot}deg)`,opacity:0}],
        {duration:Math.random()*2000+2000, easing:'ease-out'});
      anim.onfinish=()=>d.remove();
    }
  }
})();
</script>

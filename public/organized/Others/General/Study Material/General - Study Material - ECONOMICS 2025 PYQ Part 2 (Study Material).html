      "explanation": "During the highly ambitious, heavily industrialized Second Five-Year Plan (1956-1961), the Indian government successfully established three major massive public sector steel plants with crucial foreign collaboration: Rourkela (Odisha), Bhilai, and Durgapur. Therefore, Statement I is absolutely correct. However, the massive Bokaro Steel Plant was officially established much later during the Third Five-Year Plan, making Statement II incorrect. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940, \u092d\u093e\u0930\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-1961) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928, \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0935\u093f\u0926\u0947\u0936\u0940 \u0938\u0939\u092f\u094b\u0917 \u0915\u0947 \u0938\u093e\u0925 \u0924\u0940\u0928 \u092a\u094d\u0930\u092e\u0941\u0916 \u092c\u0921\u093c\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\u0930\u094b\u0902 \u0915\u0940 \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u0940: \u0930\u093e\u0909\u0930\u0915\u0947\u0932\u093e (\u0913\u0921\u093f\u0936\u093e), \u092d\u093f\u0932\u093e\u0908 \u0914\u0930 \u0926\u0941\u0930\u094d\u0917\u093e\u092a\u0941\u0930\u0964 \u0907\u0938\u0932\u093f\u090f, \u0915\u0925\u0928 I \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0938\u0939\u0940 \u0939\u0948\u0964 \u0939\u093e\u0932\u093e\u0902\u0915\u093f, \u0935\u093f\u0936\u093e\u0932 \u092c\u094b\u0915\u093e\u0930\u094b \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\     {
      "text": "<b>Q26.</b> India&#x27;s announcement of the New Economic Policy (NEP) was a direct consequence of agreeing to conditionalities set by which two international organizations? / \u092d\u093e\u0930\u0924 \u0926\u094d\u0935\u093e\u0930\u093e \u0928\u0908 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f (NEP) \u0915\u0940 \u0918\u094b\u0937\u0923\u093e \u0915\u093f\u0928 \u0926\u094b \u0905\u0902\u0924\u0930\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u0902\u0917\u0920\u0928\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u093f\u0924 \u0936\u0930\u094d\u0924\u094b\u0902 \u092a\u0930 \u0938\u0939\u092e\u0924 \u0939\u094b\u0928\u0947 \u0915\u093e \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u092a\u0930\u093f\u0923\u093e\u092e \u0925\u0940? [DP HCM 2025, 07 Jan 2026, Shift-1]",
      "options": [

        "World Trade Organization (WTO) and United Nations (UN) / \u0935\u093f\u0936\u094d\u0935 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0938\u0902\u0917\u0920\u0928 (WTO) \u0914\u0930 \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0930\u093e\u0937\u094d\u091f\u094d\u0930 (UN)",
        "European Union (EU) and G20 Summit / \u092f\u0942\u0930\u094b\u092a\u0940\u092f \u0938\u0902\u0918 (EU) \u0914\u0930 G20 \u0936\u093f\u0916\u0930 \u0938\u092e\u094d\u092e\u0947\u0932\u0928"
      ],
      "correctIndex": 0,
      "explanation": "The incredibly severe and historic Balance of Payments (BoP) economic crisis in 1991 forcefully compelled the terrified Indian government to urgently approach the International Monetary Fund (IMF) and the World Bank (IBRD) for a massive emergency bailout loan. These highly powerful institutions agreed, but heavily imposed exceptionally strict structural reform conditionalities, birthing the NEP. / 1991 \u092e\u0947\u0902 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0917\u0902\u092d\u0940\u0930 \u0914\u0930 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u092d\u0941\u0917\u0924\u093e\u0928 \u0938\u0902\u0924\u0941\u0932\u0928 (BoP) \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0902\u0915\u091f \u0928\u0947 \u0921\u0930\u0940 \u0939\u0941\u0908 \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0915\u094b \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0906\u092a\u093e\u0924\u0915\u093e\u0932\u0940\u0928 \u092c\u0947\u0932\u0906\u0909\u091f \u090b\u0923 \u0915\u0947 \u0932\u093f\u090f \u0924\u0924\u094d\u0915\u093e\u0932 \u0905\u0902\u0924\u0930\u094d\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092e\u0941\u0926\u094d\u0930\u093e \u0915\u094b\u0937 (IMF) \u0914\u0930 \u0935\u093f\u0936\u094d\u0935 \u092c\u0948\u0902\u0915 (IBRD) \u0938\u0947 \u0938\u0902\u092a\u0930\u094d\u0915 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092e\u091c\u092c\u0942\u0930 \u0915\u093f\u092f\u093e\u0964 \u092f\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0938\u0902\u0938\u094d\u0925\u093e\u0928 \u0938\u0939\u092e\u0924 \u0939\u0941\u090f, \u0932\u0947\u0915\u093f\u0928 \u090f\u0928\u0908\u092a\u0940 (NEP) \u0915\u094b \u091c\u0928\u094d\u092e \u0926\u0947\u0924\u0947 \u0939\u0941\u090f \u0905\u0938\u093e\u0927\u093e\u0930\u0923 \u0930\u0942\u092a \u0938\u0947 \u0938\u0916\u094d\u0924 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0938\u0941\u0927\u093e\u0930 \u0936\u0930\u094d\u0924\u094b\u0902 \u0915\u094b \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0932\u093e\u0917\u0942 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q27.</b> What was the primary focus of India&#x27;s First Five Year Plan (1951-1956)? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1951-1956) \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u092b\u094b\u0915\u0938 \u0915\u094d\u092f\u093e \u0925\u093e? [DP HCM 2025, 07 Jan 2026, Shift-1]",
      "options": [
        "Development of heavy and basic industries / \u092d\u093e\u0930\u0940 \u0914\u0930 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u093e \u0935\u093f\u0915\u093e\u0938",
        "Expansion of the service sector and IT industries. / \u0938\u0947\u0935\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0914\u0930 \u0906\u0908\u091f\u0940 (IT) \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u093e \u0935\u093f\u0938\u094d\u0924\u093e\u0930\u0964",
        "Poverty alleviation and employment generation programs / \u0917\u0930\u0940\u092c\u0940 \u0909\u0928\u094d\u092e\u0942\u0932\u0928 \u0914\u0930 \u0930\u094b\u091c\u0917\u093e\u0930 \u0938\u0943\u091c\u0928 \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e",
        "Agricultural development, including irrigation and power projects / \u0915\u0943\u0937\u093f \u0935\u093f\u0915\u093e\u0938, \u091c\u093f\u0938\u092e\u0947\u0902 \u0938\u093f\u0902\u091a\u093e\u0908 \u0914\u0930 \u092c\u093f\u091c\u0932\u0940 \u092a\u0930\u093f\u092f\u094b\u091c\u0928\u093e\u090f\u0902 \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0902"
      ],
      "correctIndex": 3,
      "explanation": "India&#x27;s ambitious First Five-Year Plan (1951-1956), heavily and successfully based exactly on the Harrod-Domar economic model, primarily and aggressively focused on the rapid developmental expansion of the foundational primary sector, specifically absolute agricultural development. This crucially involved massive, unprecedented state investments in giant multi-purpose irrigation and hydroelectric power projects like the Bhakra Nangal Dam. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1951-1956), \u091c\u094b \u0939\u0948\u0930\u094b\u0921-\u0921\u094b\u092e\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u092e\u0949\u0921\u0932 \u092a\u0930 \u092d\u093e\u0930\u0940 \u0914\u0930 \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u0906\u0927\u093e\u0930\u093f\u0924 \u0925\u0940, \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092e\u0942\u0932\u092d\u0942\u0924 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0935\u093f\u0915\u093e\u0938\u093e\u0924\u094d\u092e\u0915 \u0935\u093f\u0938\u094d\u0924\u093e\u0930, \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092a\u0942\u0930\u094d\u0923 \u0915\u0943\u0937\u093f \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0925\u0940\u0964 \u0907\u0938\u092e\u0947\u0902 \u092d\u093e\u0916\u0921\u093c\u093e \u0928\u0902\u0917\u0932 \u092c\u093e\u0902\u0927 \u091c\u0948\u0938\u0940 \u0935\u093f\u0936\u093e\u0932 \u092c\u0939\u0941\u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f\u0940\u092f \u0938\u093f\u0902\u091a\u093e\u0908 \u0914\u0930 \u092a\u0928\u092c\u093f\u091c\u0932\u0940 \u092a\u0930\u093f\u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u092e\u0947\u0902 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u0905\u092d\u0942\u0924\u092a\u0942\u0930\u094d\u0935 \u0930\u093e\u091c\u094d\u092f \u0928\u093f\u0935\u0947\u0936 \u0936\u093e\u092e\u093f\u0932 \u0925\u0947\u0964",

    {
      "text": "<b>Q28.</b> Which of the following measures was taken to reform the external sector in 1991? / 1991 \u092e\u0947\u0902 \u092c\u093e\u0939\u0930\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 (external sector) \u092e\u0947\u0902 \u0938\u0941\u0927\u093e\u0930 \u0915\u0947 \u0932\u093f\u090f \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0909\u092a\u093e\u092f \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e? [DP HCM 2025, 07 Jan 2026, Shift-2]",
      "options": [
        "Introduction of capital account convertibility / \u092a\u0942\u0902\u091c\u0940 \u0916\u093e\u0924\u093e \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0940\u092f\u0924\u093e (capital account convertibility) \u0915\u093e \u092a\u0930\u093f\u091a\u092f",
        "Complete deregulation of foreign investment / \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923-\u092e\u0941\u0915\u094d\u0924 \u0939\u094b\u0928\u093e",
        "Replacement of Import Substitution by Export Promotion / \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0938\u0902\u0935\u0930\u094d\u0927\u0928 \u0926\u094d\u0935\u093e\u0930\u093e \u0906\u092f\u093e\u0924 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928 \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928",
        "Withdrawal from the WTO / \u0935\u093f\u0936\u094d\u0935 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0938\u0902\u0917\u0920\u0928 (WTO) \u0938\u0947 \u0935\u093e\u092a\u0938\u0940"
      ],
      "correctIndex": 2,
      "explanation": "During the historic, landmark 1991 economic reforms in India, a massive, absolutely profound external sector policy shift was the complete replacement of the rigid, heavily inward-looking Import Substitution industrialization strategy explicitly with a highly dynamic, aggressive Export Promotion policy designed to flawlessly integrate the Indian economy globally. / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1991 \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928, \u090f\u0915 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0917\u0939\u0930\u093e \u092c\u093e\u0939\u0930\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u093e \u0928\u0940\u0924\u093f\u0917\u0924 \u092c\u0926\u0932\u093e\u0935 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0917\u0924\u093f\u0936\u0940\u0932, \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0938\u0902\u0935\u0930\u094d\u0927\u0928 \u0928\u0940\u0924\u093f \u0915\u0947 \u0938\u093e\u0925 \u0915\u0920\u094b\u0930, \u092d\u093e\u0930\u0940 \u0905\u0902\u0924\u0930\u094d\u092e\u0941\u0916\u0940 \u0906\u092f\u093e\u0924 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0930\u0923\u0928\u0940\u0924\u093f \u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928 \u0925\u093e, \u091c\u093f\u0938\u0947 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092d\u093e\u0930\u0924\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u0924\u094d\u0930\u0941\u091f\u093f\u0939\u0940\u0928 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915\u0940\u0915\u0943\u0924 \u0915\u0930\u0928\u0947 \u0915\u       "reference": ""

      "text": "<b>Q29.</b> Which Five Year Plan saw the launch of the famous slogan &#x27;Garibi Hatao&#x27; (Abolish Poverty)? / \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092e\u0947\u0902 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0928\u093e\u0930\u093e &#x27;\u0917\u0930\u0940\u092c\u0940 \u0939\u091f\u093e\u0913&#x27; (Abolish Poverty) \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e? [DP HCM 2025, 07 Jan 2026, Shift-2]",
      "options": [
        "First Five Year Plan / \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Fifth Five Year Plan / \u092a\u093e\u0902\u091a\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Third Five Year Plan / \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Seventh / \u0938\u093e\u0924\u0935\u0940\u0902"
      ],
      "correctIndex": 1,
      "explanation": "The highly influential and emotionally iconic political slogan &#x27;Garibi Hatao&#x27; (Abolish Poverty) was prominently coined and masterfully utilized by Prime Minister Indira Gandhi. It became the absolute central, defining, and driving theme specifically of the massive Fifth Five Year Plan (1974-1979), which was strategically drafted by D.P. Dhar to focus aggressively on poverty eradication. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u092d\u093e\u0935\u0936\u093e\u0932\u0940 \u0914\u0930 \u092d\u093e\u0935\u0928\u093e\u0924\u094d\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 \u0930\u093e\u091c\u0928\u0940\u0924\u093f\u0915 \u0928\u093e\u0930\u093e &#x27;\u0917\u0930\u0940\u092c\u0940 \u0939\u091f\u093e\u0913&#x27; (\u0917\u0930\u0940\u092c\u0940 \u0909\u0928\u094d\u092e\u0942\u0932\u0928) \u092a\u094d\u0930\u092e\u0941\u0916\u0924\u093e \u0938\u0947 \u0917\u0922\u093c\u093e \u0917\u092f\u093e \u0925\u093e \u0914\u0930 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0907\u0902\u0926\u093f\u0930\u093e \u0917\u093e\u0902\u0927\u0940 \u0926\u094d\u0935\u093e\u0930\u093e \u0909\u0924\u094d\u0915\u0943\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u092f\u0939 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0936\u093e\u0932 \u092a\u093e\u0902\u091a\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1974-1979) \u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f, \u092a\u093e\u0930\u093f\u092d\u093e\u0937\u093f\u0915 \u0914\u0930 \u092a\u094d\u0930\u0947\u0930\u0915 \u0935\u093f\u0937\u092f \u092c\u0928 \u0917\u092f\u093e, \u091c\u093f\u0938\u0947 \u0917\u0930\u0940\u092c\u0940 \u0909\u0928\u094d\u092e\u0942\u0932\u0928 \u092a\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0921\u0940.\u092a\u0940. \u0927\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u0924\u0948\u092f\u093e\u0930 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q30.</b> The Industrial Policy Resolution of 1956 significantly emphasized the role of which sector in India&#x27;s industrialization? / 1956 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u092a\u094d\u0930\u0938\u094d\u0924\u093e\u0935 \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u092e\u0947\u0902 \u0915\u093f\u0938 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u092d\u0942\u092e\u093f\u0915\u093e \u092a\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e? [DP HCM 2025, 08 Jan 2026, Shift-1]",
      "options": [
        "Public sector, as the primary engine of growth / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930, \u0935\u093f\u0915\u093e\u0938 \u0915\u0947 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0907\u0902\u091c\u0928 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902",
        "Private sector, with minimal government intervention / \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930, \u0928\u094d\u092f\u0942\u0928\u0924\u092e \u0938\u0930\u0915\u093e\u0930\u0940 \u0939\u0938\u094d\u0924\u0915\u094d\u0937\u0947\u092a \u0915\u0947 \u0938\u093e\u0925",
        "Cooperative sector, with decentralized production / \u0938\u0939\u0915\u093e\u0930\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930, \u0935\u093f\u0915\u0947\u0902\u0926\u094d\u0930\u0940\u0915\u0943\u0924 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0947 \u0938\u093e\u0925",
        "Joint sector, with equal partnership between state and private entities / \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0915\u094d\u0937\u0947\u0924\u094d\u0930, \u0930\u093e\u091c\u094d\u092f \u0914\u0930 \u0928\u093f\u091c\u0940 \u0938\u0902\u0938\u094d\u0925\u093e\u0913\u0902 \u0915\u0947 \u092c\u0940\u091a \u0938\u092e\u093e\u0928 \u0938\u093e\u091d\u0947\u0926\u093e\u0930\u0940 \u0915\u0947 \u0938\u093e\u0925"
      ],
      "correctIndex": 0,
      "explanation": "The highly historic Industrial Policy Resolution (IPR) of 1956, often universally called the &quot;economic constitution&quot; of India, was deeply and heavily influenced by the strict socialist pattern of society. It significantly and aggressively emphasized the central, absolutely dominant role of the massive Public Sector explicitly as the sole primary engine for immense industrial growth and heavy infrastructure development. / 1956 \u0915\u093e \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u092a\u094d\u0930\u0938\u094d\u0924\u093e\u0935 (IPR), \u091c\u093f\u0938\u0947 \u0905\u0915\u094d\u0938\u0930 \u0938\u093e\u0930\u094d\u0935\u092d\u094c\u092e\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0924 \u0915\u093e &quot;\u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0902\u0935\u093f\u0927\u093e\u0928&quot; \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948, \u0938\u092e\u093e\u091c \u0915\u0947 \u0938\u0916\u094d\u0924 \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u092a\u0948\u091f\u0930\u094d\u0928 \u0938\u0947 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u092d\u093e\u0935\u093f\u0924 \u0925\u093e\u0964 \u0907\u0938\u0928\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0914\u0930 \u092d\u093e\u0930\u0940 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u0947 \u0915\u0947 \u0935\u093f\u0915\u093e\u0938 \u0915\u0947 \u0932\u093f\u090f \u090f\u0915\u092e\u093e\u0924\u094d\u0930 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0907\u0902\u091c\u0928 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0935\u093f\u0936\u093e\u0932 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f, \u092a\u0942\u0930\u094d\u0923 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u092e\u0941\u0916 \u092d\u0942\u092e\u093f\u0915\u093e \u092a\u0930 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e\u0964",

    },
    {
      "text": "<b>Q31.</b> Which of the following correctly describes the term &#x27;Liberalization&#x27; in the 1991 reforms? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u092e\u0947\u0902 &#x27;\u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923&#x27; (Liberalization) \u0936\u092c\u094d\u0926 \u0915\u093e \u0938\u0939\u0940 \u0935\u0930\u094d\u0923\u0928 \u0915\u0930\u0924\u093e \u0939\u0948? [DP HCM 2025, 09 Jan 2026, Shift-1]",
      "options": [
        "Reduction in foreign exchange reserves / \u0935\u093f\u0926\u0947\u0936\u0940 \u092e\u0941\u0926\u094d\u0930\u093e \u092d\u0902\u0921\u093e\u0930 \u092e\u0947\u0902 \u0915\u092e\u0940",
        "Privatization of all public sector banks / \u0938\u092d\u0940 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u092c\u0948\u0902\u0915\u094b\u0902 \u0915\u093e \u0928\u093f\u091c\u0940\u0915\u0930\u0923",
        "Closing down of loss-making PSUs / \u0928\u0941\u0915\u0938\u093e\u0928 \u092e\u0947\u0902 \u091a\u0932 \u0930\u0939\u0947 \u092a\u0940\u090f\u0938\u092f\u0942 (PSUs) \u0915\u094b \u092c\u0902\u0926 \u0915\u0930\u0928\u093e",
        "Removal of industrial licensing and price controls / \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0914\u0930 \u092e\u0942\u0932\u094d\u092f \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u0915\u094b \u0939\u091f\u093e\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "In the incredibly landmark 1991 LPG (Liberalization, Privatization, Globalization) economic reforms of India, &#x27;Liberalization&#x27; specifically and fundamentally referred to fiercely freeing the domestic economy from excessive, suffocating state controls. This was primarily and monumentally achieved by ruthlessly dismantling the notorious &#x27;License Raj,&#x27; virtually removing strict industrial licensing requirements and price controls. / \u092d\u093e\u0930\u0924 \u0915\u0947 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1991 \u090f\u0932\u092a\u0940\u091c\u0940 (\u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923, \u0928\u093f\u091c\u0940\u0915\u0930\u0923, \u0935\u0948\u0936\u094d\u0935\u0940\u0915\u0930\u0923) \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u092e\u0947\u0902, &#x27;\u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923&#x27; \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u092e\u094c\u0932\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0918\u0930\u0947\u0932\u0942 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u0905\u0924\u094d\u092f\u0927\u093f\u0915, \u0926\u092e\u0918\u094b\u0902\u091f\u0942 \u0930\u093e\u091c\u094d\u092f \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923\u094b\u0902 \u0938\u0947 \u092e\u0941\u0915\u094d\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u0902\u0926\u0930\u094d\u092d\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e\u0964 \u092f\u0939 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u0941\u0916\u094d\u092f\u093e\u0924 &#x27;\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c&#x27; \u0915\u094b \u092c\u0947\u0930\u0939\u092e\u0940 \u0938\u0947 \u0916\u0924\u094d\u092e \u0915\u0930\u0928\u0947, \u0935\u0938\u094d\u0924\u0941\u0924\u0903 \u0938\u0916\u094d\u0924 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0906\u0935\u0936\u094d\u092f\u0915\u0924\u093e\u0913\u0902 \u0914\u0930 \u092e\u0942\u0932\u094d\u092f \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923\u094b\u0902 \u0915\u094b \u0939\u091f\u093e\u0915\u0930 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q32.</b> What was a primary reason for implementing the industrial licensing system in India during the planning era? / \u0928\u093f\u092f\u094b\u091c\u0928 \u092f\u0941\u0917 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0932\u093e\u0917\u0942 \u0915\u0930\u0928\u0947 \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0915\u093e\u0930\u0923 \u0915\u094d\u092f\u093e \u0925\u093e? [DP HCM 2025, 09 Jan 2026, Shift-1]",
      "options": [
        "To encourage foreign direct investment and technology transfer / \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0914\u0930 \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940 \u0939\u0938\u094d\u0924\u093e\u0902\u0924\u0930\u0923 \u0915\u094b \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u0930\u0928\u093e",
        "To simplify the process of starting new businesses / \u0928\u090f \u0935\u094d\u092f\u0935\u0938\u093e\u092f \u0936\u0941\u0930\u0942 \u0915\u0930\u0928\u0947 \u0915\u0940 \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e \u0915\u094b \u0938\u0930\u0932 \u092c\u0928\u093e\u0928\u093e",
        "To prevent monopolies and ensure balanced regional development / \u090f\u0915\u093e\u0927\u093f\u0915\u093e\u0930 \u0915\u094b \u0930\u094b\u0915\u0928\u093e \u0914\u0930 \u0938\u0902\u0924\u0941\u0932\u093f\u0924 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u0940\u092f \u0935\u093f\u0915\u093e\u0938 \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0928\u093e",
        "To boost consumer goods production rapidly / \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0947 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u094b \u0924\u0947\u091c\u0940 \u0938\u0947 \u092c\u0922\u093c\u093e\u0928\u093e"
      ],
      "correctIndex": 2,
      "explanation": "During the strict post-independence planning era (pre-1991), the powerful Government of India strictly implemented the rigorous and exhaustive industrial licensing system (License Raj) primarily to deliberately and forcefully prevent the dangerous concentration of massive economic power (monopolies) strictly in the hands of a few wealthy private capitalists, thereby heavily ensuring equitable, balanced regional development. / \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0915\u0947 \u092c\u093e\u0926 \u0915\u0947 \u0938\u0916\u094d\u0924 \u0928\u093f\u092f\u094b\u091c\u0928 \u092f\u0941\u0917 (1991 \u0938\u0947 \u092a\u0942\u0930\u094d\u0935) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928, \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0915\u0920\u094b\u0930 \u0914\u0930 \u0938\u0902\u092a\u0942\u0930\u094d\u0923 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 (\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c) \u0915\u094b \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u091c\u093e\u0928\u092c\u0942\u091d\u0915\u0930 \u0914\u0930 \u092c\u0932\u092a\u0942\u0930\u094d\u0935\u0915 \u0915\u0941\u091b \u0927\u0928\u0940 \u0928\u093f\u091c\u0940 \u092a\u0942\u0902\u091c\u0940\u092a\u0924\u093f\u092f\u094b\u0902 \u0915\u0947 \u0939\u093e\u0925\u094b\u0902 \u092e\u0947\u0902 \u0935\u093f\u0936\u093e\u0932 \u0906\u0930\u094d\u0925\u093f\u0915 \u0936\u0915\u094d\u0924\u093f (\u090f\u0915\u093e\u0927\u093f\u0915\u093e\u0930) \u0915\u0947 \u0916\u0924\u0930\u0928\u093e\u0915 \u0938\u0902\u0915\u0947\u0902\u0926\u094d\u0930\u0923 \u0915\u094b \u0930\u094b\u0915\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0932\u093e\u0917\u0942 \u0915\u093f\u092f\u093e, \u091c\u093f\u0938\u0938\u0947 \u0928\u094d\u092f\u093e\u092f\u0938\u0902\u0917\u0924, \u0938\u0902\u0924\u0941\u0932\u093f\u0924 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u0940\u092f \u0935\u093f\u0915\u093e\u0938 \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0939\u094b \u0938\u0915\u0947\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q33.</b> Which of the following was NOT a direct feature of the 1991 economic reforms in India? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 1991 \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0940 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0928\u0939\u0940\u0902 \u0925\u0940? [DP HCM 2025, 09 Jan 2026, Shift-2]",
      "options": [
        "Abolition of industrial licensing for most sectors / \u0905\u0927\u093f\u0915\u093e\u0902\u0936 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0915\u093e \u0909\u0928\u094d\u092e\u0942\u0932\u0928",
        "Introduction of FRBM Act to ensure fiscal discipline / \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0905\u0928\u0941\u0936\u093e\u0938\u0928 \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f FRBM \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0915\u093e \u092a\u0930\u093f\u091a\u092f",
        "Devaluation of the Indian rupee / \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u0941\u092a\u092f\u0947 \u0915\u093e \u0905\u0935\u092e\u0942\u0932\u094d\u092f\u0928",
        "Reduction in import tariffs and removal of quantitative restrictions / \u0906\u092f\u093e\u0924 \u0936\u0941\u0932\u094d\u0915 \u092e\u0947\u0902 \u0915\u092e\u0940 \u0914\u0930 \u092e\u093e\u0924\u094d\u0930\u093e\u0924\u094d\u092e\u0915 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u094b\u0902 \u0915\u094b \u0939\u091f\u093e\u0928\u093e"
      ],
      "correctIndex": 1,
      "explanation": "The highly strict Fiscal Responsibility and Budget Management (FRBM) Act was officially enacted much later precisely in 2003 to formally institutionalize financial discipline and reduce fiscal deficit. It was absolutely and definitely not a direct feature or immediate component of the historic 1991 economic reforms (LPG), which primarily featured the abolition of the License Raj and massive tariff reductions. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u0916\u094d\u0924 \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0909\u0924\u094d\u0924\u0930\u0926\u093e\u092f\u093f\u0924\u094d\u0935 \u0914\u0930 \u092c\u091c\u091f \u092a\u094d\u0930\u092c\u0902\u0927\u0928 (FRBM) \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u092c\u0939\u0941\u0924 \u092c\u093e\u0926 \u092e\u0947\u0902 2003 \u092e\u0947\u0902 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0905\u0928\u0941\u0936\u093e\u0938\u0928 \u0915\u094b \u0914\u092a\u091a\u093e\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u0938\u094d\u0925\u093e\u0917\u0924 \u092c\u0928\u093e\u0928\u0947 \u0914\u0930 \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0918\u093e\u091f\u0947 \u0915\u094b \u0915\u092e \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0905\u0927\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u092f\u0939 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1991 \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 (LPG) \u0915\u0940 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u092f\u093e \u0924\u0924\u094d\u0915\u093e\u0932 \u0918\u091f\u0915 \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0914\u0930 \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0928\u0939\u0940\u0902 \u0925\u093e, \u091c\u093f\u0938\u092e\u0947\u0902 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c \u0915\u093e \u0909\u0928\u094d\u092e\u0942\u0932\u0928 \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u091f\u0948\u0930\u093f\u092b \u092e\u0947\u0902 \u0915\u092e\u0940 \u0936\u093e\u092e\u093f\u0932 \u0925\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q34.</b> What was the primary role of the Planning Commission in India&#x27;s economic development until 1990? / 1990 \u0924\u0915 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u092e\u0947\u0902 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0940 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u092d\u0942\u092e\u093f\u0915\u093e \u0915\u094d\u092f\u093e \u0925\u0940? [DP HCM 2025, 09 Jan 2026, Shift-2]",
      "options": [
        "To prepare and formulate Five Year Plans for economic development / \u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0915\u0947 \u0932\u093f\u090f \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u090f\u0901 \u0924\u0948\u092f\u093e\u0930 \u0915\u0930\u0928\u093e \u0914\u0930 \u092c\u0928\u093e\u0928\u093e",
        "To implement government policies and projects at the ground level / \u091c\u092e\u0940\u0928\u0940 \u0938\u094d\u0924\u0930 \u092a\u0930 \u0938\u0930\u0915\u093e\u0930\u0940 \u0928\u0940\u0924\u093f\u092f\u094b\u0902 \u0914\u0930 \u092a\u0930\u093f\u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u094b \u0932\u093e\u0917\u0942 \u0915\u0930\u0928\u093e",
        "To resolve inter-state disputes over resource allocation / \u0938\u0902\u0938\u093e\u0927\u0928 \u0906\u0935\u0902\u091f\u0928 \u092a\u0930 \u0905\u0902\u0924\u0930-\u0930\u093e\u091c\u094d\u092f\u0940\u092f \u0935\u093f\u0935\u093e\u0926\u094b\u0902 \u0915\u094b \u0938\u0941\u0932\u091d\u093e\u0928\u093e",

      ],
      "correctIndex": 0,
      "explanation": "Established powerfully via an executive resolution in 1950, the absolute primary and most vital core role of the Planning Commission of India was to meticulously assess the massive country&#x27;s resources and explicitly, strategically formulate highly comprehensive &#x27;Five Year Plans&#x27; intended exclusively for highly centralized, state-led socio-economic development. / 1950 \u092e\u0947\u0902 \u090f\u0915 \u0915\u093e\u0930\u094d\u092f\u0915\u093e\u0930\u0940 \u0938\u0902\u0915\u0932\u094d\u092a \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0930\u0942\u092a \u0938\u0947 \u0938\u094d\u0925\u093e\u092a\u093f\u0924, \u092d\u093e\u0930\u0924 \u0915\u0947 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0940 \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0914\u0930 \u0938\u092c\u0938\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092e\u0941\u0916\u094d\u092f \u092d\u0942\u092e\u093f\u0915\u093e \u0938\u093e\u0935\u0927\u093e\u0928\u0940\u092a\u0942\u0930\u094d\u0935\u0915 \u0926\u0947\u0936 \u0915\u0947 \u0935\u093f\u0936\u093e\u0932 \u0938\u0902\u0938\u093e\u0927\u0928\u094b\u0902 \u0915\u093e \u0906\u0915\u0932\u0928 \u0915\u0930\u0928\u093e \u0914\u0930 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u0915\u0943\u0924, \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u0938\u093e\u092e\u093e\u091c\u093f\u0915-\u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0915\u0947 \u0932\u093f\u090f &#x27;\u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u090f\u0902&#x27; \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947, \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0924\u0948\u092f\u093e\u0930 \u0915\u0930\u0928\u093e \u0925\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q35.</b> The concept of &#x27;Minimum Government, Maximum Governance&#x27; can be traced to which aspect of the 1991 reforms? / &#x27;\u0928\u094d\u092f\u0942\u0928\u0924\u092e \u0938\u0930\u0915\u093e\u0930, \u0905\u0927\u093f\u0915\u0924\u092e \u0936\u093e\u0938\u0928&#x27; (Minimum Government, Maximum Governance) \u0915\u0940 \u0905\u0935\u0927\u093e\u0930\u0923\u093e \u0915\u093e \u092a\u0924\u093e 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0915\u093f\u0938 \u092a\u0939\u0932\u0942 \u0938\u0947 \u0932\u0917\u093e\u092f\u093e \u091c\u093e \u0938\u0915\u0924\u093e \u0939\u0948? [DP HCM 2025, 10 Jan 2026, Shift-1]",
      "options": [

        "Nationalization of critical industries / \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u093e \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f\u0915\u0930\u0923",
        "Disinvestment and reduced state role in business / \u0935\u093f\u0928\u093f\u0935\u0947\u0936 \u0914\u0930 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u092e\u0947\u0902 \u0930\u093e\u091c\u094d\u092f \u0915\u0940 \u092d\u0942\u092e\u093f\u0915\u093e \u092e\u0947\u0902 \u0915\u092e\u0940"
      ],
      "correctIndex": 3,
      "explanation": "The famous and highly modern governance philosophy of &#x27;Minimum Government, Maximum Governance&#x27; is deeply rooted strictly in the profound economic liberalization reforms initiated in India in 1991. It fundamentally and fiercely advocates for heavily reducing the state&#x27;s direct, monopolistic interference in active commercial business activities primarily through aggressive strategic disinvestment and drastic deregulation. / &#x27;\u0928\u094d\u092f\u0942\u0928\u0924\u092e \u0938\u0930\u0915\u093e\u0930, \u0905\u0927\u093f\u0915\u0924\u092e \u0936\u093e\u0938\u0928&#x27; \u0915\u093e \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0914\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0906\u0927\u0941\u0928\u093f\u0915 \u0936\u093e\u0938\u0928 \u0926\u0930\u094d\u0936\u0928 1991 \u092e\u0947\u0902 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u093f\u090f \u0917\u090f \u0917\u0939\u0928 \u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u092e\u0947\u0902 \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u0928\u093f\u0939\u093f\u0924 \u0939\u0948\u0964 \u092f\u0939 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0935\u093f\u0928\u093f\u0935\u0947\u0936 \u0914\u0930 \u0915\u0920\u094b\u0930 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u092e\u0941\u0915\u094d\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0938\u0915\u094d\u0930\u093f\u092f \u0935\u093e\u0923\u093f\u091c\u094d\u092f\u093f\u0915 \u0935\u094d\u092f\u093e\u0935\u0938\u093e\u092f\u093f\u0915 \u0917\u0924\u093f\u0935\u093f\u0927\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937, \u090f\u0915\u093e\u0927\u093f\u0915\u093e\u0930\u0935\u093e\u0926\u0940 \u0939\u0938\u094d\u0924\u0915\u094d\u0937\u0947\u092a \u0915\u094b \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0915\u092e \u0915\u0930\u0928\u0947 \u0915\u0940 \u0926\u0943\u0922\u093c\u0924\u093e \u0938\u0947 \u0935\u0915\u093e\u0932\u0924 \u0915\u0930\u0924\u093e \u0939\u0948\u0964",
      "reference": ""

    {
      "text": "<b>Q36.</b> A significant focus of land reforms in India after independence was on: / \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0915\u0947 \u092c\u093e\u0926 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092d\u0942\u092e\u093f \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u093e \u090f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092b\u094b\u0915\u0938 \u0915\u093f\u0938 \u092a\u0930 \u0925\u093e? [DP HCM 2025, 10 Jan 2026, Shift-1]",
      "options": [

        "Developing extensive irrigation facilities across all regions / \u0938\u092d\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u092e\u0947\u0902 \u0935\u094d\u092f\u093e\u092a\u0915 \u0938\u093f\u0902\u091a\u093e\u0908 \u0938\u0941\u0935\u093f\u0927\u093e\u090f\u0902 \u0935\u093f\u0915\u0938\u093f\u0924 \u0915\u0930\u0928\u093e"

      "correctIndex": 2,
      "explanation": "Immediately following historic independence, one of the absolutely most critical and profoundly transformative socio-economic priorities of the newly formed Indian government was the comprehensive, ruthless abolition of deeply exploitative intermediary land tenure systems, most notably and famously the oppressive Zamindari, Jagirdari, and Ryotwari systems, to brutally ensure massive agricultural equity. / \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0915\u0947 \u0924\u0941\u0930\u0902\u0924 \u092c\u093e\u0926, \u0928\u0935\u0917\u0920\u093f\u0924 \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0915\u0940 \u092a\u0942\u0930\u094d\u0923 \u0930\u0942\u092a \u0938\u0947 \u0938\u092c\u0938\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0914\u0930 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940 \u0938\u093e\u092e\u093e\u091c\u093f\u0915-\u0906\u0930\u094d\u0925\u093f\u0915 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e\u0913\u0902 \u092e\u0947\u0902 \u0938\u0947 \u090f\u0915, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0915\u0943\u0937\u093f \u0938\u092e\u093e\u0928\u0924\u093e \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0936\u094b\u0937\u0915 \u092e\u0927\u094d\u092f\u0938\u094d\u0925 \u092d\u0942\u092e\u093f \u0915\u093e\u0930\u094d\u092f\u0915\u093e\u0932 \u092a\u094d\u0930\u0923\u093e\u0932\u093f\u092f\u094b\u0902, \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0930\u0942\u092a \u0938\u0947 \u0926\u092e\u0928\u0915\u093e\u0930\u0940 \u091c\u092e\u0940\u0902\u0926\u093e\u0930\u0940, \u091c\u093e\u0917\u0940\u0930\u0926\u093e\u0930\u0940 \u0914\u0930 \u0930\u0948\u092f\u0924\u0935\u093e\u0921\u093c\u0940 \u092a\u094d\u0930\u0923\u093e\u0932\u093f\u092f\u094b\u0902 \u0915\u093e \u0935\u094d\u092f\u093e\u092a\u0915, \u0915\u094d\u0930\u0942\u0930 \u0909\u0928\u094d\u092e\u0942\u0932\u0928 \u0925\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q37.</b> What was a major criticism leveled against India&#x27;s economic policies during the 1947-1990 period? / 1947-1990 \u0915\u0940 \u0905\u0935\u0927\u093f \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f\u092f\u094b\u0902 \u0915\u0940 \u090f\u0915 \u092c\u0921\u093c\u0940 \u0906\u0932\u094b\u091a\u0928\u093e \u0915\u094d\u092f\u093e \u0925\u0940? [DP HCM 2025, 10 Jan 2026, Shift-2]",
      "options": [

      "explanation": "During the highly rigid pre-liberalization era (1947-1990), the closed Indian economy was severely and chronically constrained by the notorious &#x27;License Raj&#x27;. A major, widespread, and universally agreed criticism of this dark period was the excessive, stifling government control over almost all commercial activities, which notoriously led to massive red-tapism and extreme inefficiency in PSUs. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u0920\u094b\u0930 \u092a\u0942\u0930\u094d\u0935-\u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u092f\u0941\u0917 (1947-1990) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928, \u092c\u0902\u0926 \u092d\u093e\u0930\u0924\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0941\u0916\u094d\u092f\u093e\u0924 &#x27;\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c&#x27; \u0926\u094d\u0935\u093e\u0930\u093e \u0917\u0902\u092d\u0940\u0930 \u0914\u0930 \u0932\u0917\u093e\u0924\u093e\u0930 \u0935\u093f\u0935\u0936 \u0925\u0940\u0964 \u0907\u0938 \u0905\u0902\u0927\u0947\u0930\u0947 \u0926\u094c\u0930 \u0915\u0940 \u090f\u0915 \u092c\u0921\u093c\u0940, \u0935\u094d\u092f\u093e\u092a\u0915 \u0914\u0930 \u0938\u0930\u094d\u0935\u092e\u093e\u0928\u094d\u092f \u0906\u0932\u094b\u091a\u0928\u093e \u0932\u0917\u092d\u0917 \u0938\u092d\u0940 \u0935\u094d\u092f\u093e\u0935\u0938\u093e\u092f\u093f\u0915 \u0917\u0924\u093f\u0935\u093f\u0927\u093f\u092f\u094b\u0902 \u092a\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915, \u0926\u092e\u0918\u094b\u0902\u091f\u0942 \u0938\u0930\u0915\u093e\u0930\u0940 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u0925\u093e, \u091c\u093f\u0938\u0915\u0947 \u0915\u093e\u0930\u0923 \u092a\u0940\u090f\u0938\u092f\u0942 (PSUs) \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0932\u093e\u0932\u092b\u0940\u0924\u093e\u0936\u093e\u0939\u0940 \u0914\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0905\u0915\u0941\u0936\u0932\u0924\u093       "explanation": "Dr. Manmohan Singh, an incredibly eminent economist and brilliant visionary, effectively served as the highly transformative Finance Minister of India precisely in 1991 under the newly formed government of Prime Minister P.V. Narasimha Rao. Amidst a devastating, paralyzing Balance of Payments crisis, he boldly presented the historic, paradigm-shifting budget that instantly initiated the massive LPG economic reforms. / \u0921\u0949. \u092e\u0928\u092e\u094b\u0939\u0928 \u0938\u093f\u0902\u0939, \u090f\u0915 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u0916\u094d\u092f\u093e\u0924 \u0905\u0930\u094d\u0925\u0936\u093e\u0938\u094d\u0924\u094d\u0930\u0940 \u0914\u0930 \u0936\u093e\u0928\u0926\u093e\u0930 \u0926\u0942\u0930\u0926\u0930\u094d\u0936\u0940, \u0928\u0947 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u092a\u0940.\u0935\u0940. \u0928\u0930\u0938\u093f\u092e\u094d\u0939\u093e \u0930\u093e\u0935 \u0915\u0940 \u0928\u0935\u0917\u0920\u093f\u0924 \u0938\u0930\u0915\u093e\u0930 \u0915\u0947 \u0924\u0939\u0924 \u0920\u0940\u0915 1991 \u092e\u0947\u0902 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940 \u0935\u093f\u0924\u094d\u0924 \u092e\u0902\u0924\u094d\u0930\u0940 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092a\u094d\u0930\u092d\u093e\u0935\u0940 \u0922\u0902\u0917 \u0938\u0947 \u0915\u093e\u0930\u094d\u092f \u0915\u093f\u092f\u093e\u0964 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940, \u0932\u0915\u0935\u093e\u0917\u094d\u0930\u0938\u094d\u0924 \u092d\u0941\u0917\u0924\u093e\u0928 \u0938\u0902\u0924\u0941\u0932\u0928 \u0938\u0902\u0915\u091f \u0915\u0947 \u092c\u0940\u091a, \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u0938\u093e\u0939\u0938\u092a\u0942\u0930\u094d\u0935\u0915 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u     {
      "text": "<b>Q39.</b> Q201. What was the central economic and regulatory objective of the Monopolies and Restrictive Trade Practices (MRTP) Act of 1969, and how did it reflect the ideological underpinnings of India&#x27;s post-independence industrial policy? / 1969 \u0915\u0947 \u090f\u0915\u093e\u0927\u093f\u0915\u093e\u0930 \u0914\u0930 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093e\u0924\u094d\u092e\u0915 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0935\u094d\u092f\u0935\u0939\u093e\u0930 (MRTP) \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0915\u093e \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u0906\u0930\u094d\u0925\u093f\u0915 \u0914\u0930 \u0935\u093f\u0928\u093f\u092f\u093e\u092e\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u094d\u092f\u093e \u0925\u093e, \u0914\u0930 \u092f\u0939 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0915\u0947 \u092c\u093e\u0926 \u0915\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0915\u0940 \u0935\u0948\u091a\u093e\u0930\u093f\u0915 \u0928\u0940\u0902\u0935 \u0915\u094b \u0915\u0948\u0938\u0947 \u0926\u0930\u094d\u0936\u093e\u0924\u093e \u0939\u0948? [DP HCM 2025, 12 Jan 2026, Shift-1]",
      "options": [
        "To eliminate all forms of government control over domestic industries and enable free-market pricing mechanisms / \u0918\u0930\u0947\u0932\u0942 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u092a\u0930 \u0938\u092d\u0940 \u092a\u094d\u0930\u0915\u093e\u0930 \u0915\u0947 \u0938\u0930\u0915\u093e\u0930\u0940 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u0915\u094b \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930\u0928\u093e \u0914\u0930 \u092e\u0941\u0915\u094d\u0924-\u092c\u093e\u091c\u093e\u0930 \u092e\u0942\u0932\u094d\u092f \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u0923 \u0924\u0902\u0924\u094d\u0930 \u0915\u094b \u0938\u0915\u094d\u0937\u092e \u0915\u0930\u0928\u093e",
        "To promote foreign direct investment by easing trade restrictions for multinational corporations / \u092c\u0939\u0941\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0928\u093f\u0917\u092e\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u094b\u0902 \u092e\u0947\u0902 \u0922\u0940\u0932 \u0926\u0947\u0915\u0930 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e",
        "To liberalize the Indian economy by encouraging large industrial houses to dominate global markets / \u092c\u0921\u093c\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0918\u0930\u093e\u0928\u094b\u0902 \u0915\u094b \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u092c\u093e\u091c\u093e\u0930\u094b\u0902 \u092a\u0930 \u0939\u093e\u0935\u0940 \u0939\u094b\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u0930\u0915\u0947 \u092d\u093e\u0930\u0924\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u0909\u0926\u093e\u0930 \u092c\u0928\u093e\u0928\u093e",
        "To prevent concentration of economic power and regulate anti-competitive practices, in alignment with India&#x27;s commitment to a mixed economy and socialistic pattern of development / \u0906\u0930\u094d\u0925\u093f\u0915 \u0936\u0915\u094d\u0924\u093f \u0915\u0947 \u0938\u0902\u0915\u0947\u0902\u0926\u094d\u0930\u0923 \u0915\u094b \u0930\u094b\u0915\u0928\u093e \u0914\u0930 \u092e\u093f\u0936\u094d\u0930\u093f\u0924 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0914\u0930 \u0935\u093f\u0915\u093e\u0938 \u0915\u0947 \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0938\u094d\u0935\u0930\u0942\u092a \u0915\u0947 \u092a\u094d\u0930\u0924\u093f \u092d\u093e\u0930\u0924 \u0915\u0940 \u092a\u094d\u0930\u0924\u093f\u092c\u0926\u094d\u0927\u0924\u093e \u0915\u0947 \u0905\u0928\u0941\u0930\u0942\u092a \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e-\u0935\u093f\u0930\u094b\u0927\u0940 \u092a\u094d\u0930\u0925\u093e\u0913\u0902 \u0915\u094b \u0935\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "Enacted during the peak of India&#x27;s socialist-leaning economic planning era, the MRTP Act of 1969 was specifically designed to strictly prevent the massive concentration of economic power in the hands of a few wealthy industrial families. It aggressively regulated monopolistic trade practices to ensure fair competition. / \u092d\u093e\u0930\u0924 \u0915\u0947 \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u091d\u0941\u0915\u093e\u0935 \u0935\u093e\u0932\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u093f\u092f\u094b\u091c\u0928 \u092f\u0941\u0917 \u0915\u0947 \u091a\u0930\u092e \u092a\u0930 \u0905\u0927\u093f\u0928\u093f\u092f\u092e\u093f\u0924, 1969 \u0915\u093e \u090f\u092e\u0906\u0930\u091f\u0940\u092a\u0940 \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0915\u0941\u091b \u0927\u0928\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u092a\u0930\u093f\u0935\u093e\u0930\u094b\u0902 \u0915\u0947 \u0939\u093e\u0925\u094b\u0902 \u092e\u0947\u0902 \u0906\u0930\u094d\u0925\u093f\u0915 \u0936\u0915\u094d\u0924\u093f \u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u090f\u0915\u093e\u0917\u094d\u0930\u0924\u093e \u0915\u094b \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u0930\u094b\u0915\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092c\u0928\u093e\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0928\u0947 \u0928\u093f\u0937\u094d\u092a\u0915\u094d\u0937 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u090f\u0915\u093e\u0927\u093f\u0915\u093e\u0930\u0935\u093e\u0926\u0940 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u092a\u094d\u0930\u0925\u093e\u0913\u0902 \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0928\u093f\u092f\u092e\u093       "explanation": "As a cornerstone of the historic 1991 New Economic Policy, the oppressive &#x27;License Raj&#x27; was aggressively dismantled. Industrial licensing was abolished for nearly all industries to promote free-market competition. However, for critical reasons of national security, sectors like Defense equipment, Atomic energy, and Railways remained strictly reserved. / \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1991 \u0915\u0940 \u0928\u0908 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f \u0915\u0940 \u0906\u0927\u093e\u0930\u0936\u093f\u0932\u093e \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902, \u0926\u092e\u0928\u0915\u093e\u0930\u0940 &#x27;\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c&#x27; \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0916\u0924\u094d\u092e \u0915\u0930 \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u092e\u0941\u0915\u094d\u0924-\u092c\u093e\u091c\u093e\u0930 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0932\u0917\u092d\u0917 \u0938\u092d\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930 \u0926\u0940 \u0917\u0908 \u0925\u0940\u0964 \u0939\u093e\u0932\u093e\u0902\u0915\u093f, \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u0915\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0915\u093e\u0930\u0923\u094b\u0902 \u0938\u0947 \u0930\u0915\u094d\u0937\u093e \u0909\u092a\u0915\u0930\u0923, \u092a\u0930\u092e\u093e\u0923\u0941 \u090a\u0930\u094d\u091c\u093e \u0914\u0930 \u0930\u0947\u0932\u0935\u0947 \u091c\u0948\u0938\u0947 \u0915\u094d     {
      "text": "<b>Q41.</b> Q203. Which sector received substantial public sector investment and saw significant growth during India&#x27;s initial planning period (1950s-1980s)? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u092a\u094d\u0930\u093e\u0930\u0902\u092d\u093f\u0915 \u0928\u093f\u092f\u094b\u091c\u0928 \u0905\u0935\u0927\u093f (1950-1980 \u0915\u0947 \u0926\u0936\u0915) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0915\u093f\u0938 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u094b \u092a\u0930\u094d\u092f\u093e\u092a\u094d\u0924 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u093e \u0928\u093f\u0935\u0947\u0936 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0939\u0941\u0906 \u0914\u0930 \u0909\u0938\u092e\u0947\u0902 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0935\u0943\u0926\u094d\u0927\u093f \u0926\u0947\u0916\u0940 \u0917\u0908? [DP HCM 2025, 12 Jan 2026, Shift-2]",

        "Tourism and Hospitality / \u092a\u0930\u094d\u092f\u091f\u0928 \u0914\u0930 \u0906\u0924\u093f\u0925\u094d\u092f"
      ],
      "correctIndex": 0,
      "explanation": "During India&#x27;s initial planning era, particularly starting from the Second Five-Year Plan (1956-1961) based on the Mahalanobis model, the government massively prioritized and directed substantial public sector investment toward &#x27;Heavy and Basic Industries&#x27; to build a self-reliant industrial base. / \u092d\u093e\u0930\u0924 \u0915\u0947 \u092a\u094d\u0930\u093e\u0930\u0902\u092d\u093f\u0915 \u0928\u093f\u092f\u094b\u091c\u0928 \u092f\u0941\u0917 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928, \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-1961) \u0938\u0947 \u0936\u0941\u0930\u0942 \u0939\u094b\u0915\u0930, \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0906\u0927\u093e\u0930 \u092c\u0928\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f &#x27;\u092d\u093e\u0930\u0940 \u0914\u0930 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902&#x27; \u0915\u0940 \u0913\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0940 \u0914\u0930 \u092a\u0930\u094d\u092f\u093e\u092a\u094d\u0924 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0928\u093f\u0935\u0947\u0936 \u0915\u094b \u0928\u093f\u0930\u094d\u0926\u0947\u0936\u093f\u0924 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q42.</b> Q204. Which of the following was a key feature of globalization reforms introduced in India after 1991? / 1991 \u0915\u0947 \u092c\u093e\u0926 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092a\u0947\u0936 \u0915\u093f\u090f \u0917\u090f \u0935\u0948\u0936\u094d\u0935\u0940\u0915\u0930\u0923 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 (globalization reforms) \u0915\u0940 \u090f\u0915 \u092a\u094d\u0930\u092e\u0941\u0916 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u0925\u0940? [DP HCM 2025, 12 Jan 2026, Shift-3]",
      "options": [
        "Replacing dollar with rupee in exports / \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u092e\u0947\u0902 \u0921\u0949\u0932\u0930 \u0915\u094b \u0930\u0941\u092a\u092f\u0947 \u0938\u0947 \u092c\u0926\u0932\u0928\u093e",

        "Increased role of multinational corporations / \u092c\u0939\u0941\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0928\u093f\u0917\u092e\u094b\u0902 (MNCs) \u0915\u0940 \u092c\u0922\u093c\u0924\u0940 \u092d\u0942\u092e\u093f\u0915\u093e",
        "Nationalizing export houses / \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0917\u0943\u0939\u094b\u0902 \u0915\u093e \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f\u0915\u0930\u0923"
      ],
      "correctIndex": 2,
      "explanation": "Following the historic 1991 LPG reforms, the Indian government dismantled protectionist trade barriers. A defining feature of this globalization was opening the domestic economy to foreign competition, which dramatically increased the direct role, investments, and presence of vast Multinational Corporations (MNCs) operating within India. / \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1991 \u0915\u0947 \u090f\u0932\u092a\u0940\u091c\u0940 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u092c\u093e\u0926, \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0938\u0902\u0930\u0915\u094d\u0937\u0923\u0935\u093e\u0926\u0940 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u092c\u093e\u0927\u093e\u0913\u0902 \u0915\u094b \u0916\u0924\u094d\u092e \u0915\u0930 \u0926\u093f\u092f\u093e\u0964 \u0907\u0938 \u0935\u0948\u0936\u094d\u0935\u0940\u0915\u0930\u0923 \u0915\u0940 \u090f\u0915 \u092a\u0930\u093f\u092d\u093e\u0937\u093f\u0924 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0918\u0930\u0947\u0932\u0942 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u0935\u093f\u0926\u0947\u0936\u0940 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0915\u0947 \u0932\u093f\u090f \u0916\u094b\u0932\u0928\u093e \u0925\u093e, \u091c\u093f\u0938\u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 \u092d\u0940\u0924\u0930 \u0915\u093e\u092e \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0947 \u0935\u093f\u0936\u093e\u0932 \u092c\u0939\u0941\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0928\u093f\u0917\u092e\u094b\u0902 (MNCs) \u0915\u0940 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u092d\u0942\u092e\u093f\u0915\u093e, \u0928\u093f\u0935\u0947\u0936 \u0914\u0930 \u0909\u092a\u0938\u094d\u0925\u093f\u0924\u093f \u0915\u094b \u0928\u093e\u091f\u0915\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u092c\u0922\u093c\u093e \u0926\u093f\u092f\u093e\u0964",

      "text": "<b>Q43.</b> Q205. Which plan marked the start of economic liberalisation by ending price controls and rationing? / \u0915\u093f\u0938 \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u092e\u0942\u0932\u094d\u092f \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u0914\u0930 \u0930\u093e\u0936\u0928\u093f\u0902\u0917 \u0915\u094b \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930\u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 (economic liberalisation) \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 \u0915\u094b \u091a\u093f\u0939\u094d\u0928\u093f\u0924 \u0915\u093f\u092f\u093e? [DP HCM 2025, 12 Jan 2026, Shift-3]",
      "options": [

      "correctIndex": 1,
      "explanation": "While full-scale structural economic liberalization exploded during the Eighth Plan (1992-1997), the initial crucial seeds of liberalisation\u2014marked by the gradual ending of strict price controls and extensive rationing systems\u2014were strategically planted during the Sixth Five-Year Plan (1980-1985) under Prime Minister Indira Gandhi. / \u092f\u0926\u094d\u092f\u092a\u093f \u092a\u0942\u0930\u094d\u0923 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0906\u0920\u0935\u0940\u0902 \u092f\u094b\u091c\u0928\u093e (1992-1997) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0935\u093f\u0938\u094d\u092b\u094b\u091f \u0939\u0941\u0906, \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0915\u0947 \u092a\u094d\u0930\u093e\u0930\u0902\u092d\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092c\u0940\u091c - \u0938\u0916\u094d\u0924 \u092e\u0942\u0932\u094d\u092f \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u0914\u0930 \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u093e\u0936\u0928 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0915\u0947 \u0915\u094d\u0930\u092e\u093f\u0915 \u0905\u0902\u0924 \u0926\u094d\u0935\u093e\u0930\u093e \u091a\u093f\u0939\u094d\u0928\u093f\u0924 - \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0907\u0902\u0926\u093f\u0930\u093e \u0917\u093e\u0902\u0927\u0940 \u0915\u0947 \u0924\u0939\u0924 \u091b\u0920\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1980-1985) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u092c\u094b\u090f \u0917\u090f \u0925\u0947\u0964",

      "correctIndex": 2,
      "explanation": "In the Recombination Epoch, precisely around 300,000 to 380,000 years after the Big Bang, the universe finally cooled enough to allow electrons and protons to form neutral hydrogen, clearing the cosmic fog and making space transparent. / \u092a\u0941\u0928\u0930\u094d\u0938\u0902\u092f\u094b\u091c\u0928 \u092f\u0941\u0917 (Recombination Epoch) \u092e\u0947\u0902, \u092c\u093f\u0917 \u092c\u0948\u0902\u0917 \u0915\u0947 \u0932\u0917\u092d\u0917 300,000 \u0938\u0947 380,000 \u0938\u093e\u0932 \u092c\u093e\u0926, \u092c\u094d\u0930\u0939\u094d\u092e\u093e\u0902\u0921 \u0905\u0902\u0924\u0924\u0903 \u0907\u0924\u0928\u093e \u0920\u0902\u0921\u093e \u0939\u094b \u0917\u092f\u093e \u0915\u093f \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u0949\u0928\u094b\u0902 \u0914\u0930 \u092a\u094d\u0930\u094b\u091f\u0949\u0928 \u0915\u094b \u0924\u091f\u0938\u094d\u0925 \u0939\u093e\u0907\u0921\u094d\u0930\u094b\u091c\u0928 \u092c\u0928\u093e\u0928\u0947 \u0915\u0940 \u0905\u0928\u0941\u092e\u0924\u093f \u092e\u093f\u0932 \u0917\u0908, \u091c\u093f\u0938\u0938\u0947 \u092c\u094d\u0930\u0939\u094d\u092e\u093e\u0902\u0921\u0940\u092f \u0915\u094b\u0939\u0930\u093e \u0938\u093e\u092b \u0939\u094b \u0917\u092f\u093e \u0914\u0930 \u0905\u0902\u0924\u0930\u093f\u0915\u094d\u0937 \u092a\u093e\u0930\u0926\u0930\u094d\u0936\u0940 \u0939\u094b \u0917\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q18.</b> Venus is the _____ planet from the sun. / \u0936\u0941\u0915\u094d\u0930 \u0938\u0942\u0930\u094d\u092f \u0938\u0947 _____ \u0917\u094d\u0930\u0939 \u0939\u0948\u0964 [SSC MTS, 05 Feb 2026, Shift-2]",
      "options": [
        "3rd / \u0924\u0940\u0938\u0930\u093e",
        "4th / \u091a\u094c\u0925\u093e",
        "2nd / \u0926\u0942\u0938\u0930\u093e",
        "7th / \u0938\u093e\u0924\u0935\u093e\u0902"
      ],
      "correctIndex": 2,
      "explanation": "Venus is perfectly and securely positioned as the second planet from the Sun in our Solar System, located exactly between Mercury and Earth. Despite not being the absolute closest, it remains the hottest planet. / \u0936\u0941\u0915\u094d\u0930 \u0939\u092e\u093e\u0930\u0947 \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0938\u0942\u0930\u094d\u092f \u0938\u0947 \u0926\u0942\u0938\u0930\u0947 \u0917\u094d\u0930\u0939 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0914\u0930 \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0938\u094d\u0925\u093f\u0924 \u0939\u0948, \u091c\u094b \u0920\u0940\u0915 \u092c\u0941\u0927 \u0914\u0930 \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u0947 \u092c\u0940\u091a \u0938\u094d\u0925\u093f\u0924 \u0939\u0948\u0964 \u0938\u092c\u0938\u0947 \u0915\u0930\u0940\u092c \u0928 \u0939\u094b\u0928\u0947 \u0915\u0947 \u092c\u093e\u0935\u091c\u0942\u0926, \u092f\u0939 \u0938\u092c\u0938\u0947 \u0917\u0930\u094d\u092e \u0917\u094d\u0930\u0939 \u092c\u0928\u093e \u0939\u0941\u0906 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q19.</b> The Galaxies are spread over vast distances, which are measured in _____. / \u0906\u0915\u093e\u0936\u0917\u0902\u0917\u093e\u090f\u0901 (Galaxies) \u0935\u093f\u0936\u093e\u0932 \u0926\u0942\u0930\u093f\u092f\u094b\u0902 \u0924\u0915 \u092b\u0948\u0932\u0940 \u0939\u0941\u0908 \u0939\u0948\u0902, \u091c\u093f\u0928\u094d\u0939\u0947\u0902 _____ \u092e\u0947\u0902 \u092e\u093e\u092a\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964 [SSC MTS, 06 Feb 2026, Shift-3]",
      "options": [
        "light years / \u092a\u094d\u0930\u0915\u093e\u0936 \u0935\u0930\u094d\u0937",
        "kilometres / \u0915\u093f\u0932\u094b\u092e\u0940\u091f\u0930",
        "metres / \u092e\u0940\u091f\u0930",
        "nanometres / \u0928\u0948\u0928\u094b\u092e\u0940\u091f\u0930"
      ],
      "correctIndex": 0,
      "explanation": "Interstellar and intergalactic distances are incredibly enormous, rendering regular units useless. Thus, they are measured strictly in light-years, representing the staggering distance light travels in one complete Earth year (roughly 9.46 trillion km). / \u0924\u093e\u0930\u0947 \u0915\u0947 \u092c\u0940\u091a \u0914\u0930 \u0906\u0915\u093e\u0936\u0917\u0902\u0917\u093e \u0915\u0947 \u092c\u0940\u091a \u0915\u0940 \u0926\u0942\u0930\u093f\u092f\u093e\u0902 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0936\u093e\u0932 \u0939\u0948\u0902, \u091c\u093f\u0938\u0938\u0947 \u0928\u093f\u092f\u092e\u093f\u0924 \u0907\u0915\u093e\u0907\u092f\u093e\u0902 \u092c\u0947\u0915\u093e\u0930 \u0939\u094b \u091c\u093e\u0924\u0940 \u0939\u0948\u0902\u0964 \u0907\u0938 \u092a\u094d\u0930\u0915\u093e\u0930, \u0909\u0928\u094d\u0939\u0947\u0902 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u092a\u094d\u0930\u0915\u093e\u0936-\u0935\u0930\u094d\u0937\u094b\u0902 \u092e\u0947\u0902 \u092e\u093e\u092a\u093e \u091c\u093e\u0924\u093e \u0939\u0948, \u091c\u094b \u090f\u0915 \u092a\u0942\u0930\u094d\u0923 \u092a\u0943\u0925\u094d\u0935\u0940 \u0935\u0930\u094d\u0937 (\u0932\u0917\u092d\u0917 9.46 \u091f\u094d\u0930\u093f\u0932\u093f\u092f\u0928 \u0915\u093f\u092e\u0940) \u092e\u0947\u0902 \u092a\u094d\u0930\u0915\u093e\u0936 \u0926\u094d\u0935\u093e\u0930\u093e \u0924\u092f \u0915\u0940 \u0917\u0908 \u0906\u0936\u094d\u091a\u0930\u094d\u092f\u091c\u0928\u0915 \u0926\u0942\u0930\u0940 \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u0930\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q20.</b> Which of the following planet appears blue from the outer space because of its two-thirds surface is covered by water? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0917\u094d\u0930\u0939 \u092c\u093e\u0939\u0930\u0940 \u0905\u0902\u0924\u0930\u093f\u0915\u094d\u0937 \u0938\u0947 \u0928\u0940\u0932\u093e \u0926\u093f\u0916\u093e\u0908 \u0926\u0947\u0924\u093e \u0939\u0948 \u0915\u094d\u092f\u094b\u0902\u0915\u093f \u0907\u0938\u0915\u0940 \u0926\u094b-\u0924\u093f\u0939\u093e\u0908 \u0938\u0924\u0939 \u092a\u093e\u0928\u0940 \u0938\u0947 \u0922\u0915\u0940 \u0939\u0941\u0908 \u0939\u0948? [SSC MTS, 10 Feb 2026, Shift-1]",
      "options": [
        "Mercury / \u092c\u0941\u0927",
        "Earth / \u092a\u0943\u0925\u094d\u0935\u0940",
        "Venus / \u0936\u0941\u0915\u094d\u0930",
        "Uranus / \u0905\u0930\u0941\u0923 (Uranus)"
      ],
      "correctIndex": 1,
      "explanation": "Earth is famously and accurately referred to globally as the &quot;Blue Planet&quot; precisely because nearly 71% of its physical surface is heavily covered by massive liquid water oceans, which vividly scatter blue light into space. / \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u094b \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0914\u0930 \u0938\u091f\u0940\u0915 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 &quot;\u092c\u094d\u0932\u0942 \u092a\u094d\u0932\u0948\u0928\u0947\u091f&quot; \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948 \u0915\u094d\u092f\u094b\u0902\u0915\u093f \u0907\u0938\u0915\u0940 \u092d\u094c\u0924\u093f\u0915 \u0938\u0924\u0939 \u0915\u093e \u0932\u0917\u092d\u0917 71% \u0939\u093f\u0938\u094d\u0938\u093e \u0935\u093f\u0936\u093e\u0932 \u0924\u0930\u0932 \u092a\u093e\u0928\u0940 \u0915\u0947 \u092e\u0939\u093e\u0938\u093e\u0917\u0930\u094b\u0902 \u0938\u0947 \u0922\u0915\u093e \u0939\u0941\u0906 \u0939\u0948, \u091c\u094b \u0905\u0902\u0924\u0930\u093f\u0915\u094d\u0937 \u092e\u0947\u0902 \u0928\u0940\u0932\u0947 \u092a\u094d\u0930\u0915\u093e\u0936 \u0915\u094b \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u092c\u093f\u0916\u0947\u0930\u0924\u0947 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q21.</b> As of August 2025, Jupiter has _____ moons that are officially recognized by the International Astronomical Union. / \u0905\u0917\u0938\u094d\u0924 2025 \u0924\u0915, \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f \u0915\u0947 \u092a\u093e\u0938 _____ \u091a\u0902\u0926\u094d\u0930\u092e\u093e \u0939\u0948\u0902 \u091c\u093f\u0928\u094d\u0939\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0905\u0902\u0924\u0930\u094d\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0916\u0917\u094b\u0932\u0940\u092f \u0938\u0902\u0918 (IAU) \u0926\u094d\u0935\u093e\u0930\u093e \u092e\u093e\u0928\u094d\u092f\u0924\u093e \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0939\u0948\u0964 [SSC MTS, 11 Feb 2026, Shift-1]",
      "options": [
        "111 / 111",
        "230 / 230",
        "95 / 95",
        "321 / 321"
      ],
      "correctIndex": 2,
      "explanation": "Based entirely on the latest strictly verified astronomical records by the IAU, Jupiter possesses exactly 95 officially recognized natural satellites, prominently including the four massive, historic Galilean moons. / IAU \u0926\u094d\u0935\u093e\u0930\u093e \u0928\u0935\u0940\u0928\u0924\u092e \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0938\u0924\u094d\u092f\u093e\u092a\u093f\u0924 \u0916\u0917\u094b\u0932\u0940\u092f \u0930\u093f\u0915\u0949\u0930\u094d\u0921 \u0915\u0947 \u0906\u0927\u093e\u0930 \u092a\u0930, \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f \u0915\u0947 \u092a\u093e\u0938 \u0920\u0940\u0915 95 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u092e\u093e\u0928\u094d\u092f\u0924\u093e \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u092a\u094d\u0930\u093e\u0915\u0943\u0924\u093f\u0915 \u0909\u092a\u0917\u094d\u0930\u0939 \u0939\u0948\u0902, \u091c\u093f\u0928\u092e\u0947\u0902 \u092a\u094d\u0930\u092e\u0941\u0916 \u0930\u0942\u092a \u0938\u0947 \u091a\u093e\u0930 \u0935\u093f\u0936\u093e\u0932, \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0917\u0948\u0932\u0940\u0932\u093f\u092f\u0928 \u091a\u0902\u0926\u094d\u0930\u092e\u093e \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "\n            <div class=\"context-box\">\n                Q23. Which of the following is an example of celestial body? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0916\u0917\u094b\u0932\u0940\u092f \u092a\u093f\u0902\u0921 (celestial body) \u0915\u093e \u0909\u0926\u093e\u0939\u0930\u0923 \u0939\u0948? [SSC MTS, 16 Feb 2026, Shift-3]<br><br>1. The Sun / 1. \u0938\u0942\u0930\u094d\u092f<br><br>2. The Moon / 2. \u091a\u0902\u0926\u094d\u0930\u092e\u093e\n            </div>\n            <b>Q22.</b> Which of the statements above is/are correct? / \ud83d\udc49 \u0909\u092a\u0930\u094b\u0915\u094d\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e/\u0938\u0947 \u0915\u0925\u0928 \u0938\u0939\u0940 \u0939\u0948/\u0939\u0948\u0902?",
      "options": [
        "Only I / \u0915\u0947\u0935\u0932 I",
        "Only II / \u0915\u0947\u0935\u0932 II",
        "Both I and II / I \u0914\u0930 II \u0926\u094b\u0928\u094b\u0902",
        "Neither I nor II / \u0928 \u0924\u094b I \u0914\u0930 \u0928 \u0939\u0940 II"
      ],
      "correctIndex": 2,
      "explanation": "A celestial body is strictly defined as any massive, naturally occurring physical entity existing permanently in the vast observable universe. Therefore, both the glowing Sun and Earth&#x27;s rocky Moon are absolute prime examples. / \u0916\u0917\u094b\u0932\u0940\u092f \u092a\u093f\u0902\u0921 \u0915\u094b \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0915\u093f\u0938\u0940 \u092d\u0940 \u0935\u093f\u0936\u093e\u0932, \u092a\u094d\u0930\u093e\u0915\u0943\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0939\u094b\u0928\u0947 \u0935\u093e\u0932\u0940 \u092d\u094c\u0924\u093f\u0915 \u0907\u0915\u093e\u0908 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092a\u0930\u093f\u092d\u093e\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 \u091c\u094b \u0935\u093f\u0936\u093e\u0932 \u0905\u0935\u0932\u094b\u0915\u0928 \u092f\u094b\u0917\u094d\u092f \u092c\u094d\u0930\u0939\u094d\u092e\u093e\u0902\u0921 \u092e\u0947\u0902 \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u092e\u094c\u091c\u0942\u0926 \u0939\u0948\u0964 \u0907\u0938\u0932\u093f\u090f, \u091a\u092e\u0915\u0924\u093e \u0939\u0941\u0906 \u0938\u0942\u0930\u094d\u092f \u0914\u0930 \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u093e \u091a\u091f\u094d\u091f\u093e\u0928\u0940 \u091a\u0902\u0926\u094d\u0930\u092e\u093e \u0926\u094b\u0928\u094b\u0902 \u0907\u0938\u0915\u0947 \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u092e\u0941\u0916 \u0909\u0926\u093e\u0939\u0930\u0923 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q23.</b> In 2024, scientists detected the gases carbon dioxide and hydrogen peroxide on &#x27;Charon&#x27;, the largest moon of which planet? / 2024 \u092e\u0947\u0902, \u0935\u0948\u091c\u094d\u091e\u093e\u0928\u093f\u0915\u094b\u0902 \u0928\u0947 \u0915\u093f\u0938 \u0917\u094d\u0930\u0939 \u0915\u0947 \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u0947 \u091a\u0902\u0926\u094d\u0930\u092e\u093e &#x27;\u091a\u093e\u0930\u094b\u0928&#x27; (Charon) \u092a\u0930 \u0915\u093e\u0930\u094d\u092c\u0928 \u0921\u093e\u0907\u0911\u0915\u094d\u0938\u093e\u0907\u0921 \u0914\u0930 \u0939\u093e\u0907\u0921\u094d\u0930\u094b\u091c\u0928 \u092a\u0947\u0930\u094b\u0915\u094d\u0938\u093e\u0907\u0921 \u0917\u0948\u0938\u094b\u0902 \u0915\u093e \u092a\u0924\u093e \u0932\u0917\u093e\u092f\u093e? [SSC MTS, 18 Feb 2026, Shift-1]",
      "options": [
        "Saturn / \u0936\u0928\u093f",
        "Pluto / \u092a\u094d\u0932\u0942\u091f\u094b",
        "Jupiter / \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f",
        "Neptune / \u0935\u0930\u0941\u0923 (Neptune)"
      ],
      "correctIndex": 1,
      "explanation": "Charon is officially and universally recognized as the absolute largest natural moon securely orbiting the extremely distant, icy dwarf planet Pluto. The James Webb Telescope recently detected these specific chemical signatures directly on its frigid surface. / \u091a\u093e\u0930\u094b\u0928 (Charon) \u0915\u094b \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0914\u0930 \u0938\u093e\u0930\u094d\u0935\u092d\u094c\u092e\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u0924\u094d\u092f\u0902\u0924 \u0926\u0942\u0930, \u092c\u0930\u094d\u092b\u0940\u0932\u0947 \u092c\u094c\u0928\u0947 \u0917\u094d\u0930\u0939 \u092a\u094d\u0932\u0942\u091f\u094b \u0915\u0940 \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u092a\u0930\u093f\u0915\u094d\u0930\u092e\u093e \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0947 \u092a\u0942\u0930\u094d\u0923 \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u094d\u0930\u093e\u0915\u0943\u0924\u093f\u0915 \u091a\u0902\u0926\u094d\u0930\u092e\u093e \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092e\u093e\u0928\u094d\u092f\u0924\u093e \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0939\u0948\u0964 \u091c\u0947\u092e\u094d\u0938 \u0935\u0947\u092c \u091f\u0947\u0932\u0940\u0938\u094d\u0915\u094b\u092a \u0928\u0947 \u0939\u093e\u0932 \u0939\u0940 \u092e\u0947\u0902 \u0907\u0938\u0915\u0947 \u092c\u0930\u094d\u092b\u0940\u0932\u0947 \u0938\u0924\u0939 \u092a\u0930 \u0938\u0940\u0927\u0947 \u0907\u0928 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0930\u093e\u0938\u093e\u092f\u0928\u093f\u0915 \u0939\u0938\u094d\u0924\u093e\u0915\u094d\u0937\u0930\u094b\u0902 \u0915\u093e \u092a\u0924\u093e \u0932\u0917\u093e\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q24.</b> A geo-stationary satellite completes one revolution around the Earth in approximately ______ hours. / \u090f\u0915 \u092d\u0942-\u0938\u094d\u0925\u0948\u0924\u093f\u0915 \u0909\u092a\u0917\u094d\u0930\u0939 (geo-stationary satellite) \u0932\u0917\u092d\u0917 ______ \u0918\u0902\u091f\u094b\u0902 \u092e\u0947\u0902 \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u0947 \u091a\u093e\u0930\u094b\u0902 \u0913\u0930 \u090f\u0915 \u091a\u0915\u094d\u0915\u0930 \u092a\u0942\u0930\u093e \u0915\u0930\u0924\u093e \u0939\u0948\u0964 [SSC MTS, 18 Feb 2026, Shift-3]",
      "options": [
        "6 / 6",
        "12 / 12",
        "24 / 24",
        "48 / 48"
      ],
      "correctIndex": 2,
      "explanation": "A highly precise geo-stationary satellite is deliberately placed in a high orbit so that its orbital period perfectly matches the exact 24-hour rotational period of the Earth, effectively making it appear completely stationary over one fixed equatorial point. / \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u091f\u0940\u0915 \u092d\u0942-\u0938\u094d\u0925\u0948\u0924\u093f\u0915 \u0909\u092a\u0917\u094d\u0930\u0939 \u0915\u094b \u091c\u093e\u0928\u092c\u0942\u091d\u0915\u0930 \u090f\u0915 \u0909\u091a\u094d\u091a \u0915\u0915\u094d\u0937\u093e \u092e\u0947\u0902 \u0930\u0916\u093e \u091c\u093e\u0924\u093e \u0939\u0948 \u0924\u093e\u0915\u093f \u0907\u0938\u0915\u0940 \u0915\u0915\u094d\u0937\u0940\u092f \u0905\u0935\u0927\u093f \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u0940 \u0938\u091f\u0940\u0915 24-\u0918\u0902\u091f\u0947 \u0915\u0940 \u0918\u0942\u0930\u094d\u0923\u0928 \u0905\u0935\u0927\u093f \u0938\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u092e\u0947\u0932 \u0916\u093e \u0938\u0915\u0947, \u091c\u093f\u0938\u0938\u0947 \u092f\u0939 \u092a\u094d\u0930\u092d\u093e\u0935\u0940 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u092d\u0942\u092e\u0927\u094d\u092f\u0930\u0947\u0916\u0940\u092f \u092c\u093f\u0902\u0926\u0941 \u092a\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u094d\u0925\u093f\u0930 \u0926\u093f\u0916\u093e\u0908 \u0926\u0947\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q25.</b> The earth is _____ largest planet in size in our solar system. / \u092a\u0943\u0925\u094d\u0935\u0940 \u0939\u092e\u093e\u0930\u0947 \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0906\u0915\u093e\u0930 \u092e\u0947\u0902 _____ \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u093e \u0917\u094d\u0930\u0939 \u0939\u0948\u0964 [SSC MTS, 20 Feb 2026, Shift-2]",
      "options": [
        "second / \u0926\u0942\u0938\u0930\u093e",
        "third / \u0924\u0940\u0938\u0930\u093e",
        "fifth / \u092a\u093e\u0902\u091a\u0935\u093e\u0902",
        "fourth / \u091a\u094c\u0925\u093e"
      ],
      "correctIndex": 2,
      "explanation": "In absolute terms of physical equatorial diameter, Earth securely ranks exactly as the fifth-largest planet in our complete Solar System, positioned directly behind the four colossal gas and ice giants: Jupiter, Saturn, Uranus, and Neptune. / \u092d\u094c\u0924\u093f\u0915 \u092d\u0942\u092e\u0927\u094d\u092f\u0930\u0947\u0916\u0940\u092f \u0935\u094d\u092f\u093e\u0938 \u0915\u0947 \u092a\u0942\u0930\u094d\u0923 \u0938\u0902\u0926\u0930\u094d\u092d \u092e\u0947\u0902, \u092a\u0943\u0925\u094d\u0935\u0940 \u0939\u092e\u093e\u0930\u0947 \u0938\u0902\u092a\u0942\u0930\u094d\u0923 \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0920\u0940\u0915 \u092a\u093e\u0902\u091a\u0935\u0947\u0902 \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u0947 \u0917\u094d\u0930\u0939 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0930\u0948\u0902\u0915 \u0915\u0930\u0924\u0940 \u0939\u0948, \u091c\u094b \u0938\u0940\u0927\u0947 \u091a\u093e\u0930 \u0935\u093f\u0936\u093e\u0932 \u0917\u0948\u0938 \u0914\u0930 \u092c\u0930\u094d\u092b \u0915\u0947 \u0926\u093f\u0917\u094d\u0917\u091c\u094b\u0902: \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f, \u0936\u0928\u093f, \u092f\u0942\u0930\u0947\u0928\u0938 \u0914\u0930 \u0928\u0947\u092a\u091a\u094d\u092f\u0942\u0928 \u0915\u0947 \u0920\u0940\u0915 \u092a\u0940\u091b\u0947 \u0938\u094d\u0925\u093f\u0924 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q26.</b> Why are retrograde orbits of some moons around gas giants considered strong evidence of capture rather than natural formation? / \u0917\u0948\u0938 \u0926\u093f\u0917\u094d\u0917\u091c\u094b\u0902 (gas giants) \u0915\u0947 \u091a\u093e\u0930\u094b\u0902 \u0913\u0930 \u0915\u0941\u091b \u091a\u0902\u0926\u094d\u0930\u092e\u093e\u0913\u0902 \u0915\u0940 \u092a\u094d\u0930\u0924\u093f\u0917\u093e\u092e\u0940 (retrograde) \u0915\u0915\u094d\u0937\u093e\u0913\u0902 \u0915\u094b \u092a\u094d\u0930\u093e\u0915\u0943\u0924\u093f\u0915 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0915\u0947 \u092c\u091c\u093e\u092f \u0909\u0928\u0915\u0947 \u092a\u0915\u0921\u093c\u0947 \u091c\u093e\u0928\u0947 (capture) \u0915\u093e \u092a\u0941\u0916\u094d\u0924\u093e \u0938\u092c\u0942\u0924 \u0915\u094d\u092f\u094b\u0902 \u092e\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948? [DP HCM 2025, 12 Jan 2026, Shift-1]",
      "options": [
        "Moons formed in-situ would orbit in the same direction as the planet&#x27;s rotation. / \u0938\u094d\u0935-\u0938\u094d\u0925\u093e\u0928\u0947 (in-situ) \u092c\u0928\u0928\u0947 \u0935\u093e\u0932\u0947 \u091a\u0902\u0926\u094d\u0930\u092e\u093e \u0917\u094d\u0930\u0939 \u0915\u0947 \u0918\u0942\u0930\u094d\u0923\u0928 \u0915\u0947 \u0938\u092e\u093e\u0928 \u0926\u093f\u0936\u093e \u092e\u0947\u0902 \u0939\u0940 \u092a\u0930\u093f\u0915\u094d\u0930\u092e\u093e \u0915\u0930\u0947\u0902\u0917\u0947\u0964",
        "Retrograde motion contradicts Kepler&#x27;s laws. / \u092a\u094d\u0930\u0924\u093f\u0917\u093e\u092e\u0940 \u0917\u0924\u093f \u0915\u0947\u092a\u094d\u0932\u0930 \u0915\u0947 \u0928\u093f\u092f\u092e\u094b\u0902 \u0915\u093e \u0916\u0902\u0921\u0928 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964",
        "Such orbits are dynamically unstable and short-lived. / \u0910\u0938\u0940 \u0915\u0915\u094d\u0937\u093e\u090f\u0901 \u0917\u0924\u093f\u0936\u0940\u0932 \u0930\u0942\u092a \u0938\u0947 \u0905\u0938\u094d\u0925\u093f\u0930 \u0914\u0930 \u0905\u0932\u094d\u092a\u0915\u093e\u0932\u093f\u0915 \u0939\u094b\u0924\u0940 \u0939\u0948\u0902\u0964",
        "They appear only around terrestrial planets. / \u0935\u0947 \u0915\u0947\u0935\u0932 \u0938\u094d\u0925\u0932\u0940\u092f (\u091a\u091f\u094d\u091f\u093e\u0928\u0940) \u0917\u094d\u0930\u0939\u094b\u0902 \u0915\u0947 \u0906\u0938\u092a\u093e\u0938 \u0926\u093f\u0916\u093e\u0908 \u0926\u0947\u0924\u0947 \u0939\u0948\u0902\u0964"
      ],
      "correctIndex": 0,
      "explanation": "Scientifically, if a moon forms naturally &#x27;in-situ&#x27; from an initial accretion disk, it inherently must orbit in the exact same direction as the host planet&#x27;s spin. A reverse (retrograde) orbit powerfully proves it was a passing object violently captured by extreme gravity. / \u0935\u0948\u091c\u094d\u091e\u093e\u0928\u093f\u0915 \u0930\u0942\u092a \u0938\u0947, \u092f\u0926\u093f \u090f\u0915 \u091a\u0902\u0926\u094d\u0930\u092e\u093e \u090f\u0915 \u092a\u094d\u0930\u093e\u0930\u0902\u092d\u093f\u0915 \u0905\u092d\u093f\u0935\u0943\u0926\u094d\u0927\u093f \u0921\u093f\u0938\u094d\u0915 \u0938\u0947 \u0938\u094d\u0935\u093e\u092d\u093e\u0935\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 &#x27;\u0938\u094d\u0935-\u0938\u094d\u0925\u093e\u0928\u0947&#x27; \u092c\u0928\u0924\u093e \u0939\u0948, \u0924\u094b \u0907\u0938\u0947 \u0938\u094d\u0935\u093e\u092d\u093e\u0935\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092e\u0947\u091c\u092c\u093e\u0928 \u0917\u094d\u0930\u0939 \u0915\u0947 \u0918\u0942\u0930\u094d\u0923\u0928 \u0915\u0947 \u0938\u092e\u093e\u0928 \u0926\u093f\u0936\u093e \u092e\u0947\u0902 \u0939\u0940 \u092a\u0930\u093f\u0915\u094d\u0930\u092e\u093e \u0915\u0930\u0928\u0940 \u091a\u093e\u0939\u093f\u090f\u0964 \u090f\u0915 \u0935\u093f\u092a\u0930\u0940\u0924 (\u092a\u094d\u0930\u0924\u093f\u0917\u093e\u092e\u0940) \u0915\u0915\u094d\u0937\u093e \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0930\u0942\u092a \u0938\u0947 \u0938\u093e\u092c\u093f\u0924 \u0915\u0930\u0924\u0940 \u0939\u0948 \u0915\u093f \u092f\u0939 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0917\u0941\u0930\u0941\u0924\u094d\u0935\u093e\u0915\u0930\u094d\u0937\u0923 \u0926\u094d\u0935\u093e\u0930\u093e \u0939\u093f\u0902\u0938\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u0915\u0921\u093c\u0940 \u0917\u0908 \u090f\u0915 \u0917\u0941\u091c\u0930\u0928\u0947 \u0935\u093e\u0932\u0940 \u0935\u0938\u094d\u0924\u0941 \u0925\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q27.</b> The most commonly used Lagrange points are L1 and L2, located about ______ million kilometres from Earth. / \u0938\u092c\u0938\u0947 \u0905\u0927\u093f\u0915 \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u090f \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 \u0932\u0948\u0917\u094d\u0930\u0947\u0902\u091c \u092c\u093f\u0902\u0926\u0941 (Lagrange points) L1 \u0914\u0930 L2 \u0939\u0948\u0902, \u091c\u094b \u092a\u0943\u0925\u094d\u0935\u0940 \u0938\u0947 \u0932\u0917\u092d\u0917 ______ \u092e\u093f\u0932\u093f\u092f\u0928 \u0915\u093f\u0932\u094b\u092e\u0940\u091f\u0930 \u0915\u0940 \u0926\u0942\u0930\u0940 \u092a\u0930 \u0938\u094d\u0925\u093f\u0924 \u0939\u0948\u0902\u0964 [SSC CHSL Tier-2, 10 Apr 2026, Shift-1]",
      "options": [
        "1.5 / 1.5",
        "150 / 150",
        "15000 / 15000",
        "1500 / 1500"
      ],
      "correctIndex": 0,
      "explanation": "Highly strategic orbital Lagrange points (L1 and L2), where the complex gravitational pulls of the massive Earth and Sun perfectly balance out, are scientifically located precisely at a vast distance of approximately 1.5 million kilometers from the Earth. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0915\u0915\u094d\u0937\u0940\u092f \u0932\u0948\u0917\u094d\u0930\u0947\u0902\u091c \u092c\u093f\u0902\u0926\u0941 (L1 \u0914\u0930 L2), \u091c\u0939\u093e\u0902 \u0935\u093f\u0936\u093e\u0932 \u092a\u0943\u0925\u094d\u0935\u0940 \u0914\u0930 \u0938\u0942\u0930\u094d\u092f \u0915\u0947 \u091c\u091f\u093f\u0932 \u0917\u0941\u0930\u0941\u0924\u094d\u0935\u093e\u0915\u0930\u094d\u0937\u0923 \u0916\u093f\u0902\u091a\u093e\u0935 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u0902\u0924\u0941\u0932\u093f\u0924 \u0939\u094b\u0924\u0947 \u0939\u0948\u0902, \u0935\u0948\u091c\u094d\u091e\u093e\u0928\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u0943\u0925\u094d\u0935\u0940 \u0938\u0947 \u0932\u0917\u092d\u0917 1.5 \u092e\u093f\u0932\u093f\u092f\u0928 \u0915\u093f\u0932\u094b\u092e\u0940\u091f\u0930 \u0915\u0940 \u0935\u093f\u0936\u093e\u0932 \u0926\u0942\u0930\u0940 \u092a\u0930 \u0938\u094d\u0925\u093f\u0924 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q28.</b> Which of the following planets is classified as a gas giant? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u0917\u094d\u0930\u0939 \u0915\u094b \u0917\u0948\u0938 \u0926\u093f\u0917\u094d\u0917\u091c (gas giant) \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948? [Delhi Police Constable, 26 Dec 2025, Shift-3]",
      "options": [
        "Mars / \u092e\u0902\u0917\u0932",
        "Venus / \u0936\u0941\u0915\u094d\u0930",
        "Jupiter / \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f",
        "Earth / \u092a\u0943\u0925\u094d\u0935\u0940"
      ],
      "correctIndex": 2,
      "explanation": "In established planetary classification, the colossal Jupiter and Saturn are definitively categorized exactly as massive &quot;Gas Giants,&quot; as they possess no solid rocky surface and are composed overwhelmingly of deeply swirling hydrogen and helium gases. / \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0917\u094d\u0930\u0939\u0940\u092f \u0935\u0930\u094d\u0917\u0940\u0915\u0930\u0923 \u092e\u0947\u0902, \u0935\u093f\u0936\u093e\u0932 \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f \u0914\u0930 \u0936\u0928\u093f \u0915\u094b \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0936\u093e\u0932 &quot;\u0917\u0948\u0938 \u0926\u093f\u0917\u094d\u0917\u091c\u094b\u0902&quot; (Gas Giants) \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0938\u091f\u0940\u0915 \u0930\u0942\u092a \u0938\u0947 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948, \u0915\u094d\u092f\u094b\u0902\u0915\u093f \u0909\u0928\u0915\u0947 \u092a\u093e\u0938 \u0915\u094b\u0908 \u0920\u094b\u0938 \u091a\u091f\u094d\u091f\u093e\u0928\u0940 \u0938\u0924\u0939 \u0928\u0939\u0940\u0902 \u0939\u0948 \u0914\u0930 \u0935\u0947 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u0918\u0942\u092e\u0924\u0947 \u0939\u0941\u090f \u0939\u093e\u0907\u0921\u094d\u0930\u094b\u091c\u0928 \u0914\u0930 \u0939\u0940\u0932\u093f\u092f\u092e \u0917\u0948\u0938\u094b\u0902 \u0938\u0947 \u092c\u0928\u0947 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q29.</b> Which of the following is the primary reason for Mars&#x27; reddish color? / \u092e\u0902\u0917\u0932 \u0917\u094d\u0930\u0939 \u0915\u0947 \u0932\u093e\u0932 \u0930\u0902\u0917 \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0915\u093e\u0930\u0923 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0939\u0948? [Delhi Police Constable, 29 Dec 2025, Shift-1]",
      "options": [
        "High carbon dioxide atmosphere / \u0909\u091a\u094d\u091a \u0915\u093e\u0930\u094d\u092c\u0928 \u0921\u093e\u0907\u0911\u0915\u094d\u0938\u093e\u0907\u0921 \u0935\u093e\u092f\u0941\u092e\u0902\u0921\u0932",
        "Water ice presence / \u092a\u093e\u0928\u0940 \u0915\u0940 \u092c\u0930\u094d\u092b \u0915\u0940 \u0909\u092a\u0938\u094d\u0925\u093f\u0924\u093f",
        "Iron oxide on the surface / \u0938\u0924\u0939 \u092a\u0930 \u0906\u092f\u0930\u0928 \u0911\u0915\u094d\u0938\u093e\u0907\u0921",
        "Sulfur compounds / \u0938\u0932\u094d\u092b\u0930 \u092f\u094c\u0917\u093f\u0915"
      ],
      "correctIndex": 2,
      "explanation": "Mars is universally dubbed the &quot;Red Planet&quot; strictly due to the massive, overwhelmingly absolute abundance of highly oxidized iron dust (essentially rust, or Iron Oxide) completely blanketing its entire desolate rocky crust and whipping through its atmosphere. / \u092e\u0902\u0917\u0932 \u0917\u094d\u0930\u0939 \u0915\u094b \u0938\u093e\u0930\u094d\u0935\u092d\u094c\u092e\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 &quot;\u0932\u093e\u0932 \u0917\u094d\u0930\u0939&quot; \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948, \u091c\u093f\u0938\u0915\u093e \u0915\u093e\u0930\u0923 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0911\u0915\u094d\u0938\u0940\u0915\u0943\u0924 \u0932\u094c\u0939 \u0927\u0942\u0932 (\u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u091c\u0902\u0917, \u092f\u093e \u0906\u092f\u0930\u0928 \u0911\u0915\u094d\u0938\u093e\u0907\u0921) \u0915\u0940 \u0935\u093f\u0936\u093e\u0932, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u091a\u0941\u0930\u0924\u093e \u0939\u0948 \u091c\u094b \u0907\u0938\u0915\u0947 \u092a\u0942\u0930\u0947 \u0909\u091c\u093e\u0921\u093c \u091a\u091f\u094d\u091f\u093e\u0928\u0940 \u0915\u094d\u0930\u0938\u094d\u091f \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0922\u0915 \u0932\u0947\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0907\u0938\u0915\u0947 \u0935\u093e\u092f\u0941\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0909\u0921\u093c\u0924\u0940 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q30.</b> Which planet has the &quot;Great Red Spot,&quot; a massive, persistent storm that has lasted over 300 years and is visible through telescopes in the planet&#x27;s atmosphere? / \u0915\u093f\u0938 \u0917\u094d\u0930\u0939 \u092a\u0930 &quot;\u0917\u094d\u0930\u0947\u091f \u0930\u0947\u0921 \u0938\u094d\u092a\u0949\u091f&quot; (Great Red Spot) \u0939\u0948, \u091c\u094b \u090f\u0915 \u0935\u093f\u0936\u093e\u0932, \u0932\u0917\u093e\u0924\u093e\u0930 \u091a\u0932\u0928\u0947 \u0935\u093e\u0932\u093e \u0924\u0942\u092b\u093e\u0928 \u0939\u0948 \u091c\u094b 300 \u0938\u0947 \u0905\u0927\u093f\u0915 \u0935\u0930\u094d\u0937\u094b\u0902 \u0924\u0915 \u091a\u0932\u093e \u0939\u0948 \u0914\u0930 \u0917\u094d\u0930\u0939 \u0915\u0947 \u0935\u093e\u092f\u0941\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0926\u0942\u0930\u092c\u0940\u0928 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0926\u093f\u0916\u093e\u0908 \u0926\u0947\u0924\u093e \u0939\u0948? [Delhi Police Constable, 29 Dec 2025, Shift-3]",
      "options": [
        "Saturn / \u0936\u0928\u093f",
        "Jupiter / \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f",
        "Uranus / \u0905\u0930\u0941\u0923 (Uranus)",
        "Neptune / \u0935\u0930\u0941\u0923 (Neptune)"
      ],
      "correctIndex": 1,
      "explanation": "The incredibly iconic &quot;Great Red Spot&quot; is an unbelievably massive, continuously raging high-pressure storm system prominently located exclusively on the gas giant Jupiter. It is so unimaginably immense that it could easily swallow the entire Earth whole. / \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 &quot;\u0917\u094d\u0930\u0947\u091f \u0930\u0947\u0921 \u0938\u094d\u092a\u0949\u091f&quot; \u090f\u0915 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0936\u093e\u0932, \u0932\u0917\u093e\u0924\u093e\u0930 \u0927\u0927\u0915\u0924\u093e \u0939\u0941\u0906 \u0909\u091a\u094d\u091a \u0926\u092c\u093e\u0935 \u0935\u093e\u0932\u093e \u0924\u0942\u092b\u093e\u0928 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0939\u0948 \u091c\u094b \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0917\u0948\u0938 \u0935\u093f\u0936\u093e\u0932 \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f \u092a\u0930 \u092a\u094d\u0930\u092e\u0941\u0916\u0924\u093e \u0938\u0947 \u0938\u094d\u0925\u093f\u0924 \u0939\u0948\u0964 \u092f\u0939 \u0907\u0924\u0928\u093e \u0905\u0915\u0932\u094d\u092a\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0936\u093e\u0932 \u0939\u0948 \u0915\u093f \u092f\u0939 \u0906\u0938\u093e\u0928\u0940 \u0938\u0947 \u092a\u0942\u0930\u0940 \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u094b \u0928\u093f\u0917\u0932 \u0938\u0915\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q31.</b> Which planet has the highest average surface trapping heat in the Solar System due to a dense CO2 atmosphere? / \u0918\u0928\u0947 CO2 \u0935\u093e\u092f\u0941\u092e\u0902\u0921\u0932 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0915\u093f\u0938 \u0917\u094d\u0930\u0939 \u0915\u093e \u0914\u0938\u0924 \u0938\u0924\u0939 \u0924\u093e\u092a (surface trapping heat) \u0938\u092c\u0938\u0947 \u0905\u0927\u093f\u0915 \u0939\u0948? [Delhi Police Constable, 02 Jan 2026, Shift-2]",
      "options": [
        "Venus / \u0936\u0941\u0915\u094d\u0930",
        "Mars / \u092e\u0902\u0917\u0932",
        "Jupiter / \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f",
        "Mercury / \u092c\u0941\u0927"
      ],
      "correctIndex": 0,
      "explanation": "Despite Mercury being the absolute closest to the scorching Sun, Venus tragically suffers from an extreme, devastating runaway greenhouse effect explicitly caused by its incredibly thick, suffocating Carbon Dioxide atmosphere, giving it the hottest average surface temperature. / \u091d\u0941\u0932\u0938\u0924\u0947 \u0938\u0942\u0930\u094d\u092f \u0915\u0947 \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0915\u0930\u0940\u092c \u0939\u094b\u0928\u0947 \u0915\u0947 \u092c\u093e\u0935\u091c\u0942\u0926, \u0936\u0941\u0915\u094d\u0930 \u0926\u0941\u0916\u0926 \u0930\u0942\u092a \u0938\u0947 \u0905\u092a\u0928\u0947 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0918\u0928\u0947, \u0926\u092e\u0918\u094b\u0902\u091f\u0942 \u0915\u093e\u0930\u094d\u092c\u0928 \u0921\u093e\u0907\u0911\u0915\u094d\u0938\u093e\u0907\u0921 \u0935\u093e\u092f\u0941\u092e\u0902\u0921\u0932 \u0915\u0947 \u0915\u093e\u0930\u0923 \u090f\u0915 \u091a\u0930\u092e, \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u092d\u0917\u094b\u0921\u093c\u093e \u0917\u094d\u0930\u0940\u0928\u0939\u093e\u0909\u0938 \u092a\u094d\u0930\u092d\u093e\u0935 (runaway greenhouse effect) \u0938\u0947 \u0917\u094d\u0930\u0938\u094d\u0924 \u0939\u0948, \u091c\u094b \u0907\u0938\u0947 \u0938\u092c\u0938\u0947 \u0917\u0930\u094d\u092e \u0914\u0938\u0924 \u0938\u0924\u0939 \u0924\u093e\u092a\u092e\u093e\u0928 \u0926\u0947\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q32.</b> Which is the least dense giant planet in the solar system? / \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u0915\u093e \u0938\u092c\u0938\u0947 \u0915\u092e \u0918\u0928\u0924\u094d\u0935 \u0935\u093e\u0932\u093e \u0935\u093f\u0936\u093e\u0932 \u0917\u094d\u0930\u0939 (giant planet) \u0915\u094c\u0928 \u0938\u093e \u0939\u0948? [Delhi Police Constable, 03 Jan 2026, Shift-1]",
      "options": [
        "Earth / \u092a\u0943\u0925\u094d\u0935\u0940",
        "Saturn / \u0936\u0928\u093f",
        "Jupiter / \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f",
        "Mars / \u092e\u0902\u0917\u0932"
      ],
      "correctIndex": 1,
      "explanation": "The magnificent gas giant Saturn holds the profound astronomical distinction of being the absolute least dense planet in the entire solar system. Its overall average density is actually so remarkably low that it would theoretically float effortlessly in water. / \u0936\u093e\u0928\u0926\u093e\u0930 \u0917\u0948\u0938 \u0935\u093f\u0936\u093e\u0932 \u0936\u0928\u093f \u092a\u0942\u0930\u0947 \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u092a\u0942\u0930\u094d\u0923 \u0930\u0942\u092a \u0938\u0947 \u0938\u092c\u0938\u0947 \u0915\u092e \u0918\u0928\u0924\u094d\u0935 \u0935\u093e\u0932\u093e \u0917\u094d\u0930\u0939 \u0939\u094b\u0928\u0947 \u0915\u093e \u0917\u0939\u0928 \u0916\u0917\u094b\u0932\u0940\u092f \u0917\u094c\u0930\u0935 \u0930\u0916\u0924\u093e \u0939\u0948\u0964 \u0907\u0938\u0915\u093e \u0938\u092e\u0917\u094d\u0930 \u0914\u0938\u0924 \u0918\u0928\u0924\u094d\u0935 \u0935\u093e\u0938\u094d\u0924\u0935 \u092e\u0947\u0902 \u0907\u0924\u0928\u093e \u0909\u0932\u094d\u0932\u0947\u0916\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u092e \u0939\u0948 \u0915\u093f \u092f\u0939 \u0938\u0948\u0926\u094d\u0927\u093e\u0902\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u093e\u0928\u0940 \u092e\u0947\u0902 \u0906\u0938\u093e\u0928\u0940 \u0938\u0947 \u0924\u0948\u0930 \u0938\u0915\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q33.</b> Which planet in the solar system has the highest gravitational force? / \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u0915\u0947 \u0915\u093f\u0938 \u0917\u094d\u0930\u0939 \u092e\u0947\u0902 \u0917\u0941\u0930\u0941\u0924\u094d\u0935\u093e\u0915\u0930\u094d\u0937\u0923 \u092c\u0932 (gravitational force) \u0938\u092c\u0938\u0947 \u0905\u0927\u093f\u0915 \u0939\u0948? [Delhi Police Constable, 03 Jan 2026, Shift-1]",
      "options": [
        "Earth / \u092a\u0943\u0925\u094d\u0935\u0940",
        "Mars / \u092e\u0902\u0917\u0932",
        "Saturn / \u0936\u0928\u093f",
        "Jupiter / \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f"
      ],
      "correctIndex": 3,
      "explanation": "Because a celestial body&#x27;s gravitational force is directly and strictly proportional to its absolute mass, the colossal gas giant Jupiter\u2014being more than twice as massive as all other planets entirely combined\u2014possesses the undeniably strongest surface gravity. / \u0915\u094d\u092f\u094b\u0902\u0915\u093f \u0915\u093f\u0938\u0940 \u0916\u0917\u094b\u0932\u0940\u092f \u092a\u093f\u0902\u0921 \u0915\u093e \u0917\u0941\u0930\u0941\u0924\u094d\u0935\u093e\u0915\u0930\u094d\u0937\u0923 \u092c\u0932 \u0938\u0940\u0927\u0947 \u0914\u0930 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0909\u0938\u0915\u0947 \u092a\u0942\u0930\u094d\u0923 \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 \u0915\u0947 \u0938\u092e\u093e\u0928\u0941\u092a\u093e\u0924\u0940 \u0939\u094b\u0924\u093e \u0939\u0948, \u0935\u093f\u0936\u093e\u0932 \u0917\u0948\u0938 \u0935\u093f\u0936\u093e\u0932 \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f - \u091c\u094b \u0905\u0928\u094d\u092f \u0938\u092d\u0940 \u0917\u094d\u0930\u0939\u094b\u0902 \u0915\u0947 \u0915\u0941\u0932 \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 \u0938\u0947 \u0926\u094b\u0917\u0941\u0928\u0947 \u0938\u0947 \u092d\u0940 \u0905\u0927\u093f\u0915 \u0935\u093f\u0936\u093e\u0932 \u0939\u0948 - \u0928\u093f\u0930\u094d\u0935\u093f\u0935\u093e\u0926 \u0930\u0942\u092a \u0938\u0947 \u0938\u092c\u0938\u0947 \u092e\u091c\u092c\u0942\u0924 \u0938\u0924\u0939 \u0917\u0941\u0930\u0941\u0924\u094d\u0935\u093e\u0915\u0930\u094d\u0937\u0923 \u0930\u0916\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q34.</b> The Hale-Bopp comet, visible to the naked eye in 1997, was first discovered in which year by independent astronomers? / 1997 \u092e\u0947\u0902 \u0928\u0917\u094d\u0928 \u0906\u0902\u0916\u094b\u0902 \u0938\u0947 \u0926\u093f\u0916\u093e\u0908 \u0926\u0947\u0928\u0947 \u0935\u093e\u0932\u0947 \u0939\u0947\u0932-\u092c\u0949\u092a (Hale-Bopp) \u0927\u0942\u092e\u0915\u0947\u0924\u0941 \u0915\u0940 \u0916\u094b\u091c \u092a\u0939\u0932\u0940 \u092c\u093e\u0930 \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930 \u0916\u0917\u094b\u0932\u0935\u093f\u0926\u094b\u0902 \u0928\u0947 \u0915\u093f\u0938 \u0935\u0930\u094d\u0937 \u0915\u0940 \u0925\u0940? [Delhi Police Constable, 03 Jan 2026, Shift-2]",
      "options": [
        "1986 / 1986",
        "2001 / 2001",
        "1995 / 1995",
        "1990 / 1990"
      ],
      "correctIndex": 2,
      "explanation": "The spectacularly bright and historically famous Comet Hale-Bopp, which vividly dominated the night skies for an unprecedented 18 months, was officially and independently discovered by American astronomers Alan Hale and Thomas Bopp precisely in July 1995. / \u0936\u093e\u0928\u0926\u093e\u0930 \u0930\u0942\u092a \u0938\u0947 \u0909\u091c\u094d\u091c\u094d\u0935\u0932 \u0914\u0930 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0927\u0942\u092e\u0915\u0947\u0924\u0941 \u0939\u0947\u0932-\u092c\u0949\u092a, \u091c\u093f\u0938\u0928\u0947 \u0905\u092d\u0942\u0924\u092a\u0942\u0930\u094d\u0935 18 \u092e\u0939\u0940\u0928\u094b\u0902 \u0924\u0915 \u0930\u093e\u0924 \u0915\u0947 \u0906\u0938\u092e\u093e\u0928 \u092a\u0930 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0905\u092a\u0928\u093e \u0926\u092c\u0926\u092c\u093e \u092c\u0928\u093e\u090f \u0930\u0916\u093e, \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0914\u0930 \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930 \u0930\u0942\u092a \u0938\u0947 \u0905\u092e\u0947\u0930\u093f\u0915\u0940 \u0916\u0917\u094b\u0932\u0935\u093f\u0926\u094b\u0902 \u090f\u0932\u0928 \u0939\u0947\u0932 \u0914\u0930 \u0925\u0949\u092e\u0938 \u092c\u094b\u092a \u0926\u094d\u0935\u093e\u0930\u093e \u0920\u0940\u0915 \u091c\u0941\u0932\u093e\u0908 1995 \u092e\u0947\u0902 \u0916\u094b\u091c\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q35.</b> What is the primary source of energy for all life on Earth? / \u092a\u0943\u0925\u094d\u0935\u0940 \u092a\u0930 \u0938\u092d\u0940 \u091c\u0940\u0935\u0928 \u0915\u0947 \u0932\u093f\u090f \u090a\u0930\u094d\u091c\u093e \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0938\u094d\u0930\u094b\u0924 \u0915\u094d\u092f\u093e \u0939\u0948? [Delhi Police Constable, 04 Jan 2026, Shift-2]",
      "options": [
        "The Moon / \u091a\u0902\u0926\u094d\u0930\u092e\u093e",
        "Volcanoes / \u091c\u094d\u0935\u093e\u0932\u093e\u092e\u0941\u0916\u0940",
        "The Sun / \u0938\u0942\u0930\u094d\u092f",
        "Ocean tides / \u092e\u0939\u093e\u0938\u093e\u0917\u0930\u0940\u092f \u091c\u094d\u0935\u093e\u0930"
      ],
      "correctIndex": 2,
      "explanation": "The massive, glowing Sun is the ultimate, totally indispensable, and absolute primary source of intense radiant energy that completely drives virtually all complex biological photosynthesis, weather systems, and intricate ecological processes securely sustaining the entire Earth. / \u0935\u093f\u0936\u093e\u0932, \u091a\u092e\u0915\u0924\u093e \u0939\u0941\u0906 \u0938\u0942\u0930\u094d\u092f \u0924\u0940\u0935\u094d\u0930 \u0909\u091c\u094d\u091c\u094d\u0935\u0932 \u090a\u0930\u094d\u091c\u093e \u0915\u093e \u0905\u0902\u0924\u093f\u092e, \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0905\u092a\u0930\u093f\u0939\u093e\u0930\u094d\u092f \u0914\u0930 \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0938\u094d\u0930\u094b\u0924 \u0939\u0948 \u091c\u094b \u092a\u0942\u0930\u0940 \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u094b \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u092c\u0928\u093e\u090f \u0930\u0916\u0928\u0947 \u0935\u093e\u0932\u0947 \u0932\u0917\u092d\u0917 \u0938\u092d\u0940 \u091c\u091f\u093f\u0932 \u091c\u0948\u0935\u093f\u0915 \u092a\u094d\u0930\u0915\u093e\u0936 \u0938\u0902\u0936\u094d\u0932\u0947\u0937\u0923, \u092e\u094c\u0938\u092e \u092a\u094d\u0930\u0923\u093e\u0932\u093f\u092f\u094b\u0902 \u0914\u0930 \u091c\u091f\u093f\u0932 \u092a\u093e\u0930\u093f\u0938\u094d\u0925\u093f\u0924\u093f\u0915 \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e\u0913\u0902 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u091a\u0932\u093e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q36.</b> Which planet has the longest day in the Solar System, rotating very slowly with a single rotation taking approximately 243 Earth days? / \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u0915\u0947 \u0915\u093f\u0938 \u0917\u094d\u0930\u0939 \u0915\u093e \u0926\u093f\u0928 \u0938\u092c\u0938\u0947 \u0932\u0902\u092c\u093e \u0939\u094b\u0924\u093e \u0939\u0948, \u091c\u094b \u092c\u0939\u0941\u0924 \u0927\u0940\u092e\u0940 \u0917\u0924\u093f \u0938\u0947 \u0918\u0942\u0930\u094d\u0923\u0928 \u0915\u0930\u0924\u093e \u0939\u0948 \u0914\u0930 \u090f\u0915 \u091a\u0915\u094d\u0915\u0930 \u092a\u0942\u0930\u093e \u0915\u0930\u0928\u0947 \u092e\u0947\u0902 \u0932\u0917\u092d\u0917 243 \u092a\u0943\u0925\u094d\u0935\u0940 \u0926\u093f\u0928 \u0932\u0917\u093e\u0924\u093e \u0939\u0948? [Delhi Police Constable , 06 Jan 2026, Shift-3]",
      "options": [
        "Jupiter / \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f",
        "Mars / \u092e\u0902\u0917\u0932",
        "Venus / \u0936\u0941\u0915\u094d\u0930",
        "Mercury / \u092c\u0941\u0927"
      ],
      "correctIndex": 2,
      "explanation": "Venus uniquely and bizarrely exhibits an excruciatingly slow, fully retrograde rotation. It spins so incredibly slowly backwards on its axis that completing just one single full Venusian day explicitly requires a staggering 243 Earth days, making it longer than its year. / \u0936\u0941\u0915\u094d\u0930 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0914\u0930 \u0905\u091c\u0940\u092c \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u0905\u0924\u094d\u092f\u0902\u0924 \u0927\u0940\u092e\u0940, \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092a\u094d\u0930\u0924\u093f\u0917\u093e\u092e\u0940 (\u0909\u0932\u094d\u091f\u0947) \u0918\u0942\u0930\u094d\u0923\u0928 \u0915\u094b \u092a\u094d\u0930\u0926\u0930\u094d\u0936\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u092f\u0939 \u0905\u092a\u0928\u0940 \u0927\u0941\u0930\u0940 \u092a\u0930 \u0907\u0924\u0928\u0940 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0927\u0940\u092e\u0940 \u0917\u0924\u093f \u0938\u0947 \u092a\u0940\u091b\u0947 \u0915\u0940 \u0913\u0930 \u0918\u0942\u092e\u0924\u093e \u0939\u0948 \u0915\u093f \u0915\u0947\u0935\u0932 \u090f\u0915 \u090f\u0915\u0932 \u092a\u0942\u0930\u094d\u0923 \u0936\u0941\u0915\u094d\u0930 \u0926\u093f\u0928 \u0915\u094b \u092a\u0942\u0930\u093e \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0906\u0936\u094d\u091a\u0930\u094d\u092f\u091c\u0928\u0915 \u0930\u0942\u092a \u0938\u0947 243 \u092a\u0943\u0925\u094d\u0935\u0940 \u0926\u093f\u0928\u094b\u0902 \u0915\u0940 \u0906\u0935\u0936\u094d\u092f\u0915\u0924\u093e \u0939\u094b\u0924\u0940 \u0939\u0948, \u091c\u093f\u0938\u0938\u0947 \u092f\u0939 \u0905\u092a\u0928\u0947 \u0935\u0930\u094d\u0937 \u0938\u0947 \u092d\u0940 \u0932\u0902\u092c\u093e \u0939\u094b \u091c\u093e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q37.</b> Which layer of the Sun is primarily responsible for the formation of sunspots, appearing as dark regions due to intense magnetic activity and cooler temperatures compared to surrounding areas? / \u0938\u0942\u0930\u094d\u092f \u0915\u0940 \u0915\u094c\u0928 \u0938\u0940 \u092a\u0930\u0924 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0938\u0928\u0938\u094d\u092a\u0949\u091f (sunspots) \u0915\u0947 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0915\u0947 \u0932\u093f\u090f \u091c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930 \u0939\u0948, \u091c\u094b \u0906\u0938-\u092a\u093e\u0938 \u0915\u0947 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u0940 \u0924\u0941\u0932\u0928\u093e \u092e\u0947\u0902 \u0924\u0940\u0935\u094d\u0930 \u091a\u0941\u0902\u092c\u0915\u0940\u092f \u0917\u0924\u093f\u0935\u093f\u0927\u093f \u0914\u0930 \u0920\u0902\u0921\u0947 \u0924\u093e\u092a\u092e\u093e\u0928 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0915\u093e\u0932\u0947 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0926\u093f\u0916\u093e\u0908 \u0926\u0947\u0924\u0947 \u0939\u0948\u0902? [Delhi Police Constable , 06 Jan 2026, Shift-3]",
      "options": [
        "Chromosphere / \u0915\u094d\u0930\u094b\u092e\u094b\u0938\u094d\u092b\u0940\u092f\u0930",
        "Photosphere / \u092b\u094b\u091f\u094b\u0938\u094d\u092b\u0940\u092f\u0930",
        "Corona / \u0915\u094b\u0930\u094b\u0928\u093e",
        "Core / \u0915\u094b\u0930"
      ],
      "correctIndex": 1,
      "explanation": "Sunspots are highly visible, temporary dark blemishes that manifest strictly and exclusively on the intensely bright, active visible surface layer of the Sun, definitively known to all astronomers as the powerful &#x27;Photosphere&#x27;. / \u0938\u0928\u0938\u094d\u092a\u0949\u091f (Sunspots) \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0926\u0943\u0936\u094d\u092f\u092e\u093e\u0928, \u0905\u0938\u094d\u0925\u093e\u092f\u0940 \u0915\u093e\u0932\u0947 \u0927\u092c\u094d\u092c\u0947 \u0939\u0948\u0902 \u091c\u094b \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u0914\u0930 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0938\u0942\u0930\u094d\u092f \u0915\u0940 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0909\u091c\u094d\u091c\u094d\u0935\u0932, \u0938\u0915\u094d\u0930\u093f\u092f \u0926\u0943\u0936\u094d\u092f \u0938\u0924\u0939 \u092a\u0930\u0924 \u092a\u0930 \u092a\u094d\u0930\u0915\u091f \u0939\u094b\u0924\u0947 \u0939\u0948\u0902, \u091c\u093f\u0928\u094d\u0939\u0947\u0902 \u0938\u092d\u0940 \u0916\u0917\u094b\u0932\u0935\u093f\u0926\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 &#x27;\u092b\u094b\u091f\u094b\u0938\u094d\u092b\u0940\u092f\u0930&#x27; (Photosphere) \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q38.</b> Which phenomenon occurs due to the Earth&#x27;s revolution around the Sun? / \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u0947 \u0938\u0942\u0930\u094d\u092f \u0915\u0947 \u091a\u093e\u0930\u094b\u0902 \u0913\u0930 \u092a\u0930\u093f\u0915\u094d\u0930\u092e\u0923 (revolution) \u0915\u0947 \u0915\u093e\u0930\u0923 \u0915\u094c\u0928 \u0938\u0940 \u0918\u091f\u0928\u093e \u0939\u094b\u0924\u0940 \u0939\u0948? [Delhi Police Constable, 22 Dec 2025, Shift-1]",
      "options": [
        "The length of a day / \u0926\u093f\u0928 \u0915\u0940 \u0932\u0902\u092c\u093e\u0908",
        "Occurrence of seasons / \u090b\u0924\u0941\u0913\u0902 \u0915\u093e \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928",
        "Formation of ocean tides / \u0938\u092e\u0941\u0926\u094d\u0930\u0940 \u091c\u094d\u0935\u093e\u0930 \u0915\u093e \u0928\u093f\u0930\u094d\u092e\u093e\u0923",
        "Changes in local weather / \u0938\u094d\u0925\u093e\u0928\u0940\u092f \u092e\u094c\u0938\u092e \u092e\u0947\u0902 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928"
      ],
      "correctIndex": 1,
      "explanation": "The continuous, incredibly precise elliptical revolution of the Earth heavily traversing around the Sun, inextricably combined with its fixed 23.5-degree axial tilt, is the absolute sole geographical reason for the regular, distinct occurrence of changing global seasons. / \u0938\u0942\u0930\u094d\u092f \u0915\u0947 \u091a\u093e\u0930\u094b\u0902 \u0913\u0930 \u092d\u093e\u0930\u0940 \u092a\u0930\u093f\u0915\u094d\u0930\u092e\u093e \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0940 \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u093e \u0928\u093f\u0930\u0902\u0924\u0930, \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0938\u091f\u0940\u0915 \u0905\u0923\u094d\u0921\u093e\u0915\u093e\u0930 \u092a\u0930\u093f\u0915\u094d\u0930\u092e\u0923 (revolution), \u0907\u0938\u0915\u0947 \u0928\u093f\u0936\u094d\u091a\u093f\u0924 23.5-\u0921\u093f\u0917\u094d\u0930\u0940 \u0905\u0915\u094d\u0937\u0940\u092f \u091d\u0941\u0915\u093e\u0935 \u0915\u0947 \u0938\u093e\u0925 \u0905\u091f\u0942\u091f \u0930\u0942\u092a \u0938\u0947 \u091c\u0941\u0921\u093c\u093e \u0939\u0941\u0906 \u0939\u0948, \u092c\u0926\u0932\u0924\u0940 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u090b\u0924\u0941\u0913\u0902 \u0915\u0940 \u0928\u093f\u092f\u092e\u093f\u0924, \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0918\u091f\u0928\u093e \u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u090f\u0915\u092e\u093e\u0924\u094d\u0930 \u092d\u094c\u0917\u094b\u0932\u093f\u0915 \u0915\u093e\u0930\u0923 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q39.</b> Which planet has the fastest rotation in the Solar System, completing a full rotation in approximately 10 hours, giving it the shortest day among all planets? / \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0915\u093f\u0938 \u0917\u094d\u0930\u0939 \u0915\u093e \u0918\u0942\u0930\u094d\u0923\u0928 \u0938\u092c\u0938\u0947 \u0924\u0947\u091c \u0939\u0948, \u091c\u094b \u0932\u0917\u092d\u0917 10 \u0918\u0902\u091f\u094b\u0902 \u092e\u0947\u0902 \u090f\u0915 \u092a\u0942\u0930\u094d\u0923 \u091a\u0915\u094d\u0915\u0930 \u092a\u0942\u0930\u093e \u0915\u0930\u0924\u093e \u0939\u0948, \u091c\u093f\u0938\u0938\u0947 \u0907\u0938\u0915\u093e \u0926\u093f\u0928 \u0938\u092d\u0940 \u0917\u094d\u0930\u0939\u094b\u0902 \u092e\u0947\u0902 \u0938\u092c\u0938\u0947 \u091b\u094b\u091f\u093e \u0939\u094b\u0924\u093e \u0939\u0948? [Delhi Police Constable, 22 Dec 2025, Shift-3]",
      "options": [
        "Earth / \u092a\u0943\u0925\u094d\u0935\u0940",
        "Mars / \u092e\u0902\u0917\u0932",
        "Jupiter / \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f",
        "Saturn / \u0936\u0928\u093f"
      ],
      "correctIndex": 2,
      "explanation": "Despite being the absolute largest, most massive planet in our entire Solar System, the gas giant Jupiter paradoxically spins on its axis at a furiously rapid pace, completing one incredibly short day in a mere 9.9 hours. / \u0939\u092e\u093e\u0930\u0947 \u092a\u0942\u0930\u0947 \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u092a\u0942\u0930\u094d\u0923 \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u093e, \u0938\u092c\u0938\u0947 \u0935\u093f\u0936\u093e\u0932 \u0917\u094d\u0930\u0939 \u0939\u094b\u0928\u0947 \u0915\u0947 \u092c\u093e\u0935\u091c\u0942\u0926, \u0917\u0948\u0938 \u0935\u093f\u0936\u093e\u0932 \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f \u0935\u093f\u0930\u094b\u0927\u093e\u092d\u093e\u0938\u0940 \u0930\u0942\u092a \u0938\u0947 \u0905\u092a\u0928\u0940 \u0927\u0941\u0930\u0940 \u092a\u0930 \u090f\u0915 \u0905\u0924\u094d\u092f\u0902\u0924 \u0924\u0940\u0935\u094d\u0930 \u0917\u0924\u093f \u0938\u0947 \u0918\u0942\u092e\u0924\u093e \u0939\u0948, \u0915\u0947\u0935\u0932 9.9 \u0918\u0902\u091f\u094b\u0902 \u092e\u0947\u0902 \u090f\u0915 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u091b\u094b\u091f\u093e \u0926\u093f\u0928 \u092a\u0942\u0930\u093e \u0915\u0930\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q40.</b> What is the name of the largest asteroid? / \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u0947 \u0915\u094d\u0937\u0941\u0926\u094d\u0930\u0917\u094d\u0930\u0939 (asteroid) \u0915\u093e \u0915\u094d\u092f\u093e \u0928\u093e\u092e \u0939\u0948? [Delhi Police Constable, 22 Dec 2025, Shift-3]",

      ],
      "correctIndex": 1,
      "explanation": "Residing prominently in the massive main asteroid belt directly between Mars and Jupiter, Ceres is unequivocally the absolute largest object there. Due to its immense spherical size, it is officially double-classified as both the largest asteroid and an inner dwarf planet. / \u092e\u0902\u0917\u0932 \u0914\u0930 \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f \u0915\u0947 \u092c\u0940\u091a \u0935\u093f\u0936\u093e\u0932 \u092e\u0941\u0916\u094d\u092f \u0915\u094d\u0937\u0941\u0926\u094d\u0930\u0917\u094d\u0930\u0939 \u092c\u0947\u0932\u094d\u091f \u092e\u0947\u0902 \u092a\u094d\u0930\u092e\u0941\u0916\u0924\u093e \u0938\u0947 \u0938\u094d\u0925\u093f\u0924, \u0938\u0940\u0930\u0947\u0938 (Ceres) \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0935\u0939\u093e\u0902 \u0915\u0940 \u092a\u0942\u0930\u094d\u0923 \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u0940 \u0935\u0938\u094d\u0924\u0941 \u0939\u0948\u0964 \u0907\u0938\u0915\u0947 \u0935\u093f\u0936\u093e\u0932 \u0917\u094b\u0932\u093e\u0915\u093e\u0930 \u0906\u0915\u093e\u0930 \u0915\u0947 \u0915\u093e\u0930\u0923, \u0907\u0938\u0947 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u0947 \u0915\u094d\u0937\u0941\u0926\u094d\u0930\u0917\u094d\u0930\u0939 \u0914\u0930 \u090f\u0915 \u0906\u0902\u0924\u0930\u093f\u0915 \u092c\u094c\u0928\u0947 \u0917\u094d\u0930\u0939 \u0926\u094b\u0928\u094b\u0902 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0926\u094b\u0939\u0930\u093e \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q41.</b> Which celestial body is at the center of our solar system? / \u0939\u092e\u093e\u0930\u0947 \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u0915\u0947 \u0915\u0947\u0902\u0926\u094d\u0930 \u092e\u0947\u0902 \u0915\u094c\u0928 \u0938\u093e \u0916\u0917\u094b\u0932\u0940\u092f \u092a\u093f\u0902\u0921 (celestial body) \u0939\u0948? [Delhi Police Constable, 23 Dec 2025, Shift-1]",
      "options": [
        "Earth / \u092a\u0943\u0925\u094d\u0935\u0940",
        "The Sun / \u0938\u0942\u0930\u094d\u092f",
        "Mars / \u092e\u0902\u0917\u0932",
        "Jupiter / \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f"
      ],
      "correctIndex": 1,
      "explanation": "Completely validating the profoundly accurate heliocentric model brilliantly proposed by Copernicus, the massive, blindingly hot star known as the Sun sits absolutely anchored precisely at the exact gravitational center of our entire Solar System. / \u0915\u094b\u092a\u0930\u0928\u093f\u0915\u0938 \u0926\u094d\u0935\u093e\u0930\u093e \u0936\u093e\u0928\u0926\u093e\u0930 \u0922\u0902\u0917 \u0938\u0947 \u092a\u094d\u0930\u0938\u094d\u0924\u093e\u0935\u093f\u0924 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u0938\u091f\u0940\u0915 \u0938\u0942\u0930\u094d\u092f-\u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 (heliocentric) \u092e\u0949\u0921\u0932 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092e\u093e\u0928\u094d\u092f \u0915\u0930\u0924\u0947 \u0939\u0941\u090f, \u0938\u0942\u0930\u094d\u092f \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u091c\u093e\u0928\u093e \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u093e \u0935\u093f\u0936\u093e\u0932, \u0905\u0902\u0927\u093e \u0915\u0930 \u0926\u0947\u0928\u0947 \u0935\u093e\u0932\u093e \u0917\u0930\u094d\u092e \u0924\u093e\u0930\u093e \u0939\u092e\u093e\u0930\u0947 \u092a\u0942\u0930\u0947 \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u0915\u0947 \u0938\u091f\u0940\u0915 \u0917\u0941\u0930\u0941\u0924\u094d\u0935\u093e\u0915\u0930\u094d\u0937\u0923 \u0915\u0947\u0902\u0926\u094d\u0930 \u092a\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0932\u0902\u0917\u0930 \u0921\u093e\u0932\u0947 \u0939\u0941\u090f \u092c\u0948\u0920\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q42.</b> The mass of the Chandrashekhar limit is how many times the mass of the Sun? / \u091a\u0902\u0926\u094d\u0930\u0936\u0947\u0916\u0930 \u0938\u0940\u092e\u093e (Chandrashekhar limit) \u0915\u093e \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 \u0938\u0942\u0930\u094d\u092f \u0915\u0947 \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 \u0915\u093e \u0915\u093f\u0924\u0928\u093e \u0917\u0941\u0928\u093e \u0939\u0948? [Delhi Police Constable, 24 Dec 2025, Shift-1]",
      "options": [
        "2.8 times / 2.8 \u0917\u0941\u0928\u093e",
        "1.2 times / 1.2 \u0917\u0941\u0928\u093e",
        "1.4 times / 1.4 \u0917\u0941\u0928\u093e",
        "1.8 times / 1.8 \u0917\u0941\u0928\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The highly famous Chandrasekhar limit, elegantly derived by the brilliant Indian astrophysicist S. Chandrasekhar, scientifically represents the exact absolute maximum mass (precisely 1.4 times the mass of our own Sun) that a stable white dwarf star can possibly maintain. / \u0936\u093e\u0928\u0926\u093e\u0930 \u092d\u093e\u0930\u0924\u0940\u092f \u0916\u0917\u094b\u0932 \u092d\u094c\u0924\u093f\u0915\u0940\u0935\u093f\u0926\u094d \u090f\u0938. \u091a\u0902\u0926\u094d\u0930\u0936\u0947\u0916\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u0941\u0930\u0941\u091a\u093f\u092a\u0942\u0930\u094d\u0923 \u0922\u0902\u0917 \u0938\u0947 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u0940 \u0917\u0908 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u091a\u0902\u0926\u094d\u0930\u0936\u0947\u0916\u0930 \u0938\u0940\u092e\u093e, \u0935\u0948\u091c\u094d\u091e\u093e\u0928\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u091f\u0940\u0915 \u092a\u0942\u0930\u094d\u0923 \u0905\u0927\u093f\u0915\u0924\u092e \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 (\u0939\u092e\u093e\u0930\u0947 \u0905\u092a\u0928\u0947 \u0938\u0942\u0930\u094d\u092f \u0915\u0947 \u0926\u094d\u0930\u0935\u094d\u092f\u092e\u093e\u0928 \u0915\u093e \u0920\u0940\u0915 1.4 \u0917\u0941\u0928\u093e) \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u0930\u0924\u0940 \u0939\u0948 \u091c\u093f\u0938\u0947 \u090f\u0915 \u0938\u094d\u0925\u093f\u0930 \u0938\u092b\u0947\u0926 \u092c\u094c\u0928\u093e \u0924\u093e\u0930\u093e (white dwarf star) \u0938\u0902\u092d\u0935\u0924\u0903 \u092c\u0928\u093e\u090f \u0930\u0916 \u0938\u0915\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q43.</b> Which celestial body in the Solar System has the highest known albedo? / \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0915\u093f\u0938 \u0916\u0917\u094b\u0932\u0940\u092f \u092a\u093f\u0902\u0921 \u0915\u093e \u090f\u0932\u094d\u092c\u093f\u0921\u094b (albedo) \u091c\u094d\u091e\u093e\u0924 \u0938\u092c\u0938\u0947 \u0905\u0927\u093f\u0915 \u0939\u0948? [Delhi Police Constable, 24 Dec 2025, Shift-2]",
      "options": [
        "Enceladus / \u090f\u0928\u094d\u0938\u0947\u0932\u0947\u0921\u0938",
        "Pluto / \u092a\u094d\u0932\u0942\u091f\u094b",
        "Europa / \u092f\u0942\u0930\u094b\u092a\u093e",
        "Triton / \u091f\u094d\u0930\u093e\u0907\u091f\u0928"
      ],
      "correctIndex": 0,
      "explanation": "Enceladus, a profoundly active, deeply frozen moon orbiting Saturn, boasts the absolute highest known albedo (reflectivity). Its surface is continuously and thoroughly blasted with extremely fresh, clean ice strictly from its own powerful geysers, making it astonishingly mirror-like. / \u0936\u0928\u093f \u0915\u0940 \u092a\u0930\u093f\u0915\u094d\u0930\u092e\u093e \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u093e \u090f\u0915 \u0905\u0924\u094d\u092f\u0902\u0924 \u0938\u0915\u094d\u0930\u093f\u092f, \u0917\u0939\u0930\u0947 \u091c\u092e\u0947 \u0939\u0941\u090f \u091a\u0902\u0926\u094d\u0930\u092e\u093e \u090f\u0928\u094d\u0938\u0947\u0932\u0947\u0921\u0938 (Enceladus), \u092a\u0942\u0930\u094d\u0923 \u0930\u0942\u092a \u0938\u0947 \u0909\u091a\u094d\u091a\u0924\u092e \u091c\u094d\u091e\u093e\u0924 \u090f\u0932\u094d\u092c\u093f\u0921\u094b (\u092a\u094d\u0930\u0924\u093f\u092c\u093f\u0902\u092c\u093f\u0924\u093e) \u0915\u093e \u0926\u093e\u0935\u093e \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u0907\u0938\u0915\u0940 \u0938\u0924\u0939 \u092a\u0930 \u0907\u0938\u0915\u0947 \u0905\u092a\u0928\u0947 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0917\u0940\u091c\u0930 \u0938\u0947 \u092c\u0947\u0939\u0926 \u0924\u093e\u091c\u0940, \u0938\u093e\u092b \u092c\u0930\u094d\u092b \u0915\u093e \u0932\u0917\u093e\u0924\u093e\u0930 \u0914\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0935\u093f\u0938\u094d\u092b\u094b\u091f \u0939\u094b\u0924\u093e \u0939\u0948, \u091c\u093f\u0938\u0938\u0947 \u092f\u0939 \u0906\u0936\u094d\u091a\u0930\u094d\u092f\u091c\u0928\u0915 \u0930\u0942\u092a \u0938\u0947 \u0926\u0930\u094d\u092a\u0923 \u0915\u0940 \u0924\u0930\u0939 \u0939\u094b \u091c\u093e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q44.</b> Which layer of the Sun is responsible for the majority of solar radiation reaching Earth? / \u092a\u0943\u0925\u094d\u0935\u0940 \u0924\u0915 \u092a\u0939\u0941\u0901\u091a\u0928\u0947 \u0935\u093e\u0932\u0947 \u0905\u0927\u093f\u0915\u093e\u0902\u0936 \u0938\u094c\u0930 \u0935\u093f\u0915\u093f\u0930\u0923 \u0915\u0947 \u0932\u093f\u090f \u0938\u0942\u0930\u094d\u092f \u0915\u0940 \u0915\u094c\u0928 \u0938\u0940 \u092a\u0930\u0924 \u091c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930 \u0939\u0948? [Delhi Police Constable, 26 Dec 2025, Shift-1]",
      "options": [
        "Chromosphere / \u0915\u094d\u0930\u094b\u092e\u094b\u0938\u094d\u092b\u0940\u092f\u0930",
        "Photosphere / \u092b\u094b\u091f\u094b\u0938\u094d\u092b\u0940\u092f\u0930",
        "Corona / \u0915\u094b\u0930\u094b\u0928\u093e",
        "Core / \u0915\u094b\u0930"
      ],
      "correctIndex": 1,
      "explanation": "The intensely blazing &#x27;Photosphere&#x27; strictly acts as the absolute primary, visible emitting surface layer of the Sun. It is exactly this specific brilliantly bright layer that furiously radiates the vast, overwhelming majority of life-giving sunlight straight towards Earth. / \u0924\u0940\u0935\u094d\u0930\u0924\u093e \u0938\u0947 \u0927\u0927\u0915\u0924\u093e &#x27;\u092b\u094b\u091f\u094b\u0938\u094d\u092b\u0940\u092f\u0930&#x27; \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0938\u0942\u0930\u094d\u092f \u0915\u0940 \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915, \u0926\u0943\u0936\u094d\u092f\u092e\u093e\u0928 \u0909\u0924\u094d\u0938\u0930\u094d\u091c\u0915 \u0938\u0924\u0939 \u092a\u0930\u0924 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u092f\u0939 \u0920\u0940\u0915 \u092f\u0939\u0940 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0936\u093e\u0928\u0926\u093e\u0930 \u091a\u092e\u0915\u0940\u0932\u0940 \u092a\u0930\u0924 \u0939\u0948 \u091c\u094b \u0938\u0940\u0927\u0947 \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u0940 \u0913\u0930 \u091c\u0940\u0935\u0928 \u0926\u0947\u0928\u0947 \u0935\u093e\u0932\u0947 \u0938\u0942\u0930\u094d\u092f \u0915\u0947 \u092a\u094d\u0930\u0915\u093e\u0936 \u0915\u0947 \u0935\u093f\u0936\u093e\u0932, \u092d\u093e\u0930\u0940 \u092c\u0939\u0941\u092e\u0924 \u0915\u094b \u0924\u0947\u091c\u0940 \u0938\u0947 \u0935\u093f\u0915\u0940\u0930\u094d\u0923 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q45.</b> Where are asteroids mostly found in the solar system? / \u0938\u094c\u0930\u092e\u0902\u0921\u0932 \u092e\u0947\u0902 \u0915\u094d\u0937\u0941\u0926\u094d\u0930\u0917\u094d\u0930\u0939 (asteroids) \u0905\u0927\u093f\u0915\u0924\u0930 \u0915\u0939\u093e\u0901 \u092a\u093e\u090f \u091c\u093e\u0924\u0947 \u0939\u0948\u0902? [Delhi Police Constable, 26 Dec 2025, Shift-1]",
      "options": [
        "Between the orbits of Earth and Mars / \u092a\u0943\u0925\u094d\u0935\u0940 \u0914\u0930 \u092e\u0902\u0917\u0932 \u0915\u0940 \u0915\u0915\u094d\u0937\u093e\u0913\u0902 \u0915\u0947 \u092c\u0940\u091a",
        "Between the orbits of Venus and Earth / \u0936\u0941\u0915\u094d\u0930 \u0914\u0930 \u092a\u0943\u0925\u094d\u0935\u0940 \u0915\u0940 \u0915\u0915\u094d\u0937\u093e\u0913\u0902 \u0915\u0947 \u092c\u0940\u091a",
        "Between the orbits of Mars and Jupiter / \u092e\u0902\u0917\u0932 \u0914\u0930 \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f \u0915\u0940 \u0915\u0915\u094d\u0937\u093e\u0913\u0902 \u0915\u0947 \u092c\u0940\u091a",
        "Near the Sun / \u0938\u0942\u0930\u094d\u092f \u0915\u0947 \u092a\u093e\u0938"
      ],
      "correctIndex": 2,
      "explanation": "The vast, overwhelming entirety of millions of ancient rocky remnants known officially as asteroids are securely and permanently trapped exactly within the massive, densely packed main &quot;Asteroid Belt,&quot; stretching entirely between the distinct planetary orbits of Mars and Jupiter. / \u0915\u094d\u0937\u0941\u0926\u094d\u0930\u0917\u094d\u0930\u0939\u094b\u0902 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u091c\u093e\u0928\u0947 \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 \u0932\u093e\u0916\u094b\u0902 \u092a\u094d\u0930\u093e\u091a\u0940\u0928 \u091a\u091f\u094d\u091f\u093e\u0928\u0940 \u0905\u0935\u0936\u0947\u0937\u094b\u0902 \u0915\u093e \u0935\u093f\u0936\u093e\u0932, \u092d\u093e\u0930\u0940 \u0939\u093f\u0938\u094d\u0938\u093e \u092e\u0902\u0917\u0932 \u0914\u0930 \u092c\u0943\u0939\u0938\u094d\u092a\u0924\u093f \u0915\u0940 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0917\u094d\u0930\u0939\u094b\u0902 \u0915\u0940 \u0915\u0915\u094d\u0937\u093e\u0913\u0902 \u0915\u0947 \u092c\u0940\u091a \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092b\u0948\u0932\u0947 \u0939\u0941\u090f \u0935\u093f\u0936\u093e\u0932, \u0918\u0928\u0940 \u092a\u0948\u0915 \u0935\u093e\u0932\u0940 \u092e\u0941\u0916\u094d\u092f &quot;\u0915\u094d\u0937\u0941\u0926\u094d\u0930\u0917\u094d\u0930\u0939 \u092c\u0947\u0932\u094d\u091f&quot; (Asteroid Belt) \u0915\u0947 \u092d\u0940\u0924\u0930 \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924 \u0914\u0930 \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u092b\u0902\u0938\u093e \u0939\u0941\u0906 \u0939\u0948\u0964",
      "reference": ""

          fontIndex = (fontIndex + 1) % fontSizes.length;

      const langOrder = ['both', 'hn', 'en'];

      langToggleBtn.addEventListener('click', () => {

  function updateLangButton() {
      let label = 'BILI';
      if (state.currentLang === 'hn') label = 'HIN';
      if (state.currentLang === 'en') label = 'ENG';
      langToggleBtn.textContent = label;
  }

  function translateText(text) {
      if (!text) return text;
      if (state.currentLang === 'both') return text;

      // Check if string has HTML tags to decide between simple split and DOM traversal
      const hasTags = /<[a-z][\s\S]*>/i.test(text);

      if (hasTags) {
          const div = document.createElement('div');
          div.innerHTML = text;
          walkAndTranslate(div);
          return div.innerHTML;
      } else {
          // Plain text path
          if (text.includes(' / ')) {
              const parts = text.split(' / ');
              if (parts.length >= 2) {
                  const en = parts[0];
                  const hn = parts.slice(1).join(' / ');
                  return state.currentLang === 'hn' ? hn.trim() : en.trim();
              }
          }
          return text;
      }
  }

  function walkAndTranslate(node) {
      if (node.nodeType === 3) { // Text node
          const val = node.nodeValue;
          if (val && val.includes(' / ')) {
              const parts = val.split(' / ');
              if (parts.length >= 2) {
                  const en = parts[0];
                  const hn = parts.slice(1).join(' / ');
                  node.nodeValue = state.currentLang === 'hn' ? hn.trim() : en.trim();
              }
          }
      } else if (node.nodeType === 1) { // Element node
          for (let i = 0; i < node.childNodes.length; i++) {
              walkAndTranslate(node.childNodes[i]);
          }
      }
  }


  function initSwipeNavigation() {
    let touchStartX = 0;
    let touchEndX = 0;
    let touchStartY = 0;
    let touchEndY = 0;
    const swipeThreshold = 50; // Minimum distance for a swipe
    const swipeRatio = 0.5; // Vertical distance should be less than half of horizontal

    const swipeArea = document.querySelector('.quiz-main');

    swipeArea.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    swipeArea.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipe();
    }, { passive: true });

    function handleSwipe() {
        if (state.submitted && !state.inReviewMode) return;

        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;

        if (Math.abs(dx) > swipeThreshold && Math.abs(dy) < Math.abs(dx) * swipeRatio) {
            if (dx < 0) {
                go(1); // Swiped left
            } else {
                go(-1); // Swiped right
            }
        }
    }
  }

  // ----- Timer -----
  function initTimer(){
    const start = Date.now();
    const duration = state.totalTime*1000;
    const end = start + duration;
    tick(); state.timerInterval = setInterval(tick, 1000);
    function tick(){
      const now = Date.now();
      const left = Math.max(0, end-now);
      const m = String(Math.floor(left/60000)).padStart(2,'0');
      const s = String(Math.floor((left%60000)/1000)).padStart(2,'0');

      // Sidebar timer
      document.getElementById('minutes').textContent = m;
      document.getElementById('seconds').textContent = s;

      // Header timer (NEW)
      const headerTimer = document.getElementById('headerTimerDisp');
      if(headerTimer) headerTimer.textContent = `${m}:${s}`;

      const pct = (left/duration)*100;
      const bar = document.getElementById('timeProgress');
      bar.style.width = pct + '%';
      if(left<=0){ clearInterval(state.timerInterval); submitQuiz(); }
      else if(pct<25) bar.className='progress-bar bg-danger';
      else if(pct<50) bar.className='progress-bar bg-warning';
      else bar.className='progress-bar bg-primary';
    }
  }

  // ----- Sidebar tiles -----
  function buildQuestionTiles(){
    qListGrid.innerHTML = '';
    quizData.questions.forEach((_,i)=>{
      const d = document.createElement('div');
      d.className='q-tile'; d.textContent=i+1;
      d.addEventListener('click', ()=>{
        // Close modal IMMEDIATELY upon clicking, before rendering or anything else
        document.getElementById('paletteModal').classList.remove('show');

        if(!state.submitted) updateTime();
        renderQuestion(i);
      });
      qListGrid.appendChild(d);
    });
  }

  function updateTiles(){
    document.querySelectorAll('.q-tile').forEach((el,idx)=>{
      el.className='q-tile'; // Reset
      if(state.submitted){
          if(state.answers[idx] === quizData.questions[idx].correctIndex) el.classList.add('review-correct');
          else if(state.answers[idx] !== null) el.classList.add('review-incorrect');
          else el.classList.add('review-unattempted');
      } else {
        if(state.answers[idx] !== null) el.classList.add('answered');
        if(state.markedForReview[idx]) el.classList.add('marked');
      }
      if(idx === state.current) el.classList.add('current');
    });
  }

  // ----- Render question -----
  function renderQuestion(idx){
    if (idx < 0 || idx >= quizData.questions.length) return;

             markHtml = `<span class="q-marks text-muted">0</span>`;

             markHtml = `<span class="q-marks positive">+${posMark}</span>`;

    let textContent = q.text;

        textContent = textContent.trim();

        textContent = textContent.replace(/\n\s+/g, ' ');

      </div>
    `;
    questionArea.innerHTML = questionHtml;

    // Start per-question timer logic (Visual only)
    if (!state.submitted) {

        if(timerEl) {

    // Navigation Buttons HTML

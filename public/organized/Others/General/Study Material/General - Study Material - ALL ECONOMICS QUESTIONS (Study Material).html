    {
      "text": "<b>Q33.</b> The Food Corporation of India (FCI) was established in: / \u092d\u093e\u0930\u0924\u0940\u092f \u0916\u093e\u0926\u094d\u092f \u0928\u093f\u0917\u092e (FCI) \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u092c \u0939\u0941\u0908 \u0925\u0940? [SSC GD 2026]",
      "options": [
        "1968 / 1968",
        "1974 / 1974",
        "1951 / 1951",
        "1965 / 1965"
      ],
      "correctIndex": 3,
      "explanation": "Born directly from the harsh food crises of the mid-60s, the Food Corporation of India (FCI) was firmly established in 1965 to strategically procure grains at MSP and masterfully manage national buffer stocks. / 60 \u0915\u0947 \u0926\u0936\u0915 \u0915\u0947 \u092e\u0927\u094d\u092f \u0915\u0947 \u0915\u0920\u094b\u0930 \u0916\u093e\u0926\u094d\u092f \u0938\u0902\u0915\u091f \u0938\u0947 \u0938\u0940\u0927\u0947 \u0909\u0924\u094d\u092a\u0928\u094d\u0928, \u092d\u093e\u0930\u0924\u0940\u092f \u0916\u093e\u0926\u094d\u092f \u0928\u093f\u0917\u092e (FCI) \u0915\u094b 1965 \u092e\u0947\u0902 \u090f\u092e\u090f\u0938\u092a\u0940 \u092a\u0930 \u0905\u0928\u093e\u091c \u0915\u0940 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0916\u0930\u0940\u0926 \u0915\u0930\u0928\u0947 \u0914\u0930 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092c\u092b\u0930 \u0938\u094d\u091f\u0949\u0915 \u0915\u094b \u0915\u0941\u0936\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u092a\u094d\u0930\u092c\u0902\u0927\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092e\u091c\u092c\u0942\u0924\u0940 \u0938\u0947 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q34.</b> In _____ the Government of India set up a committee under the chairmanship of RN Malhotra, former Governor of RBI, to propose recommendations for reforms in the insurance sector. / \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 _____ \u092e\u0947\u0902 \u092c\u0940\u092e\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u092e\u0947\u0902 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0938\u0941\u091d\u093e\u0935 \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f RBI \u0915\u0947 \u092a\u0942\u0930\u094d\u0935 \u0917\u0935\u0930\u094d\u0928\u0930 \u0906\u0930.\u090f\u0928. \u092e\u0932\u094d\u0939\u094b\u0924\u094d\u0930\u093e \u0915\u0940 \u0905\u0927\u094d\u092f\u0915\u094d\u0937\u0924\u093e \u092e\u0947\u0902 \u090f\u0915 \u0938\u092e\u093f\u0924\u093f \u0915\u093e \u0917\u0920\u0928 \u0915\u093f\u092f\u093e\u0964 [SSC GD 2026]",
      "options": [
        "1983 / 1983",
        "1999 / 1999",
        "1963 / 1963",
        "1993 / 1993"
      ],
      "correctIndex": 3,
      "explanation": "The historic Malhotra Committee was officially constituted in 1993. Its deeply radical recommendations successfully triggered the monumental end of the state monopoly and the massive privatization of the Indian insurance sector. / \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u092e\u0932\u094d\u0939\u094b\u0924\u094d\u0930\u093e \u0938\u092e\u093f\u0924\u093f \u0915\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 1993 \u092e\u0947\u0902 \u0917\u0920\u0928 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0915\u0940 \u0905\u0924\u094d\u092f\u0902\u0924 \u0915\u091f\u094d\u091f\u0930\u092a\u0902\u0925\u0940 \u0938\u093f\u092b\u093e\u0930\u093f\u0936\u094b\u0902 \u0928\u0947 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u090f\u0915\u093e\u0927\u093f\u0915\u093e\u0930 \u0915\u0947 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0905\u0902\u0924 \u0914\u0930 \u092d\u093e\u0930\u0924\u0940\u092f \u092c\u0940\u092e\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0928\u093f\u091c\u0940\u0915\u0930\u0923 \u0915\u094b \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u091f\u094d\u0930\u093f\u0917\u0930 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q35.</b> Which act created a separate authority for food safety in India? / \u0915\u093f\u0938 \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0928\u0947 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0916\u093e\u0926\u094d\u092f \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u0915\u0947 \u0932\u093f\u090f \u090f\u0915 \u0905\u0932\u0917 \u092a\u094d\u0930\u093e\u0927\u093f\u0915\u0930\u0923 \u0915\u093e \u0917\u0920\u0928 \u0915\u093f\u092f\u093e? [SSC GD 2026]",
      "options": [
        "Consumer Protection Act, 2019 / \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0938\u0902\u0930\u0915\u094d\u0937\u0923 \u0905\u0927\u093f\u0928\u093f\u092f\u092e, 2019",
        "Competition Act, 2002 / \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0905\u0927\u093f\u0928\u093f\u092f\u092e, 2002",
        "National Food Security Act, 2013 / \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0916\u093e\u0926\u094d\u092f \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u0905\u0927\u093f\u0928\u093f\u092f\u092e, 2013",
        "Food Safety and Standards Act, 2006 / \u0916\u093e\u0926\u094d\u092f \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u0914\u0930 \u092e\u093e\u0928\u0915 \u0905\u0927\u093f\u0928\u093f\u092f\u092e, 2006"
      ],
      "correctIndex": 3,
      "explanation": "The Food Safety and Standards Act of 2006 powerfully consolidated numerous older, fragmented food laws and legally established the FSSAI as the supreme, solitary authority specifically dedicated to national food safety and hygiene. / 2006 \u0915\u0947 \u0916\u093e\u0926\u094d\u092f \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u0914\u0930 \u092e\u093e\u0928\u0915 \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0928\u0947 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0930\u0942\u092a \u0938\u0947 \u0915\u0908 \u092a\u0941\u0930\u093e\u0928\u0947, \u0916\u0902\u0921\u093f\u0924 \u0916\u093e\u0926\u094d\u092f \u0915\u093e\u0928\u0942\u0928\u094b\u0902 \u0915\u094b \u0938\u092e\u0947\u0915\u093f\u0924 \u0915\u093f\u092f\u093e \u0914\u0930 \u0915\u093e\u0928\u0942\u0928\u0940 \u0930\u0942\u092a \u0938\u0947 FSSAI \u0915\u094b \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0916\u093e\u0926\u094d\u092f \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u0914\u0930 \u0938\u094d\u0935\u091a\u094d\u091b\u0924\u093e \u0915\u0947 \u0932\u093f\u090f \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0938\u092e\u0930\u094d\u092a\u093f\u0924 \u0938\u0930\u094d\u0935\u094b\u091a\u094d\u091a, \u090f\u0915\u093e\u0915\u0940 \u092a\u094d\u0930\u093e\u0927\u093f\u0915\u0930\u0923 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q36.</b> The Human Development Index (HDI) is a composite index of _____. / \u092e\u093e\u0928\u0935 \u0935\u093f\u0915\u093e\u0938 \u0938\u0942\u091a\u0915\u093e\u0902\u0915 (HDI) _____ \u0915\u093e \u090f\u0915 \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0938\u0942\u091a\u0915\u093e\u0902\u0915 \u0939\u0948\u0964 [SSC GD 2026]",
      "options": [
        "Employment, social security, gender equality / \u0930\u094b\u091c\u093c\u0917\u093e\u0930, \u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u0938\u0941\u0930\u0915\u094d\u0937\u093e, \u0932\u0948\u0902\u0917\u093f\u0915 \u0938\u092e\u093e\u0928\u0924\u093e",
        "Income, Health, Environment / \u0906\u092f, \u0938\u094d\u0935\u093e\u0938\u094d\u0925\u094d\u092f, \u092a\u0930\u094d\u092f\u093e\u0935\u0930\u0923",
        "Gross Domestic Product, Gross National Income, Literacy / \u0938\u0915\u0932 \u0918\u0930\u0947\u0932\u0942 \u0909\u0924\u094d\u092a\u093e\u0926, \u0938\u0915\u0932 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0906\u092f, \u0938\u093e\u0915\u094d\u0937\u0930\u0924\u093e",
        "Education, Income, Life expectancy / \u0936\u093f\u0915\u094d\u0937\u093e, \u0906\u092f, \u091c\u0940\u0935\u0928 \u092a\u094d\u0930\u0924\u094d\u092f\u093e\u0936\u093e"
      ],
      "correctIndex": 3,
      "explanation": "Developed by the UNDP, the Human Development Index (HDI) is an internationally recognized composite statistical measure perfectly capturing three core dimensions: Education (schooling), Income (GNI), and Health (Life expectancy). / \u092f\u0942\u090f\u0928\u0921\u0940\u092a\u0940 \u0926\u094d\u0935\u093e\u0930\u093e \u0935\u093f\u0915\u0938\u093f\u0924, \u092e\u093e\u0928\u0935 \u0935\u093f\u0915\u093e\u0938 \u0938\u0942\u091a\u0915\u093e\u0902\u0915 (HDI) \u090f\u0915 \u0905\u0902\u0924\u0930\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u094d\u0924\u0930 \u092a\u0930 \u092e\u093e\u0928\u094d\u092f\u0924\u093e \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0938\u092e\u0917\u094d\u0930 \u0938\u093e\u0902\u0916\u094d\u092f\u093f\u0915\u0940\u092f \u0909\u092a\u093e\u092f \u0939\u0948 \u091c\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0924\u0940\u0928 \u092e\u0941\u0916\u094d\u092f \u0906\u092f\u093e\u092e\u094b\u0902 \u0915\u094b \u0915\u0948\u092a\u094d\u091a\u0930 \u0915\u0930\u0924\u093e \u0939\u0948: \u0936\u093f\u0915\u094d\u0937\u093e (\u0938\u094d\u0915\u0942\u0932\u0940 \u0936\u093f\u0915\u094d\u0937\u093e), \u0906\u092f (\u091c\u0940\u090f\u0928\u0906\u0908), \u0914\u0930 \u0938\u094d\u0935\u093e\u0938\u094d\u0925\u094d\u092f (\u091c\u0940\u0935\u0928 \u092a\u094d\u0930\u0924\u094d\u092f\u093e\u0936\u093e)\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q37.</b> The trade policy of the 1950s-1980s in India emphasized: / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 1950 \u0938\u0947 1980 \u0915\u0947 \u0926\u0936\u0915 \u0915\u0940 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0928\u0940\u0924\u093f \u0928\u0947 \u0907\u0928 \u092c\u093e\u0924\u094b\u0902 \u092a\u0930 \u091c\u093c\u094b\u0930 \u0926\u093f\u092f\u093e: [SSC GD 2026]",
      "options": [
        "Complete liberalization / \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923",
        "Foreign portfolio investment / \u0935\u093f\u0926\u0947\u0936\u0940 \u092a\u094b\u0930\u094d\u091f\u092b\u094b\u0932\u093f\u092f\u094b \u0928\u093f\u0935\u0947\u0936",
        "Export promotion through free trade / \u092e\u0941\u0915\u094d\u0924 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0915\u0947 \u091c\u093c\u0930\u093f\u090f \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e",
        "Import substitution and protectionism / \u0906\u092f\u093e\u0924 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928 \u0914\u0930 \u0938\u0902\u0930\u0915\u094d\u0937\u0923\u0935\u093e\u0926"
      ],
      "correctIndex": 3,
      "explanation": "For four decades post-independence (1950s-1980s), India aggressively pursued an inward-looking &quot;Import Substitution&quot; strategy, heavily emphasizing intense protectionism via steep tariffs to completely shield nascent domestic industries from foreign competition. / \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0915\u0947 \u092c\u093e\u0926 \u091a\u093e\u0930 \u0926\u0936\u0915\u094b\u0902 (1950-1980 \u0915\u0947 \u0926\u0936\u0915) \u0924\u0915, \u092d\u093e\u0930\u0924 \u0928\u0947 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u0905\u0902\u0924\u0930\u094d\u092e\u0941\u0916\u0940 &quot;\u0906\u092f\u093e\u0924 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928&quot; \u0930\u0923\u0928\u0940\u0924\u093f \u0915\u093e \u0905\u0928\u0941\u0938\u0930\u0923 \u0915\u093f\u092f\u093e, \u0928\u0935\u091c\u093e\u0924 \u0918\u0930\u0947\u0932\u0942 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0935\u093f\u0926\u0947\u0936\u0940 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0938\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092c\u091a\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0940 \u091f\u0948\u0930\u093f\u092b \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0924\u0940\u0935\u094d\u0930 \u0938\u0902\u0930\u0915\u094d\u0937\u0923\u0935\u093e\u0926 \u092a\u0930 \u092d\u093e\u0930\u0940 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q38.</b> In the context of Mega consolidation in public sector banks, the Andhra Bank was amalgamated into ____. / \u092a\u092c\u094d\u0932\u093f\u0915 \u0938\u0947\u0915\u094d\u091f\u0930 \u092c\u0948\u0902\u0915\u094b\u0902 \u0915\u0947 \u092c\u0921\u093c\u0947 \u0935\u093f\u0932\u092f \u0915\u0947 \u0938\u0902\u0926\u0930\u094d\u092d \u092e\u0947\u0902, \u0906\u0902\u0927\u094d\u0930\u093e \u092c\u0948\u0902\u0915 \u0915\u093e \u0935\u093f\u0932\u092f ____ \u092e\u0947\u0902 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 [SSC GD 2026]",
      "options": [
        "Indian Bank / \u0907\u0902\u0921\u093f\u092f\u0928 \u092c\u0948\u0902\u0915",
        "Punjab National Bank / \u092a\u0902\u091c\u093e\u092c \u0928\u0947\u0936\u0928\u0932 \u092c\u0948\u0902\u0915",
        "Canara Bank / \u0915\u0947\u0928\u0930\u093e \u092c\u0948\u0902\u0915",
        "Union Bank of India / \u092f\u0942\u0928\u093f\u092f\u0928 \u092c\u0948\u0902\u0915 \u0911\u092b\u093c \u0907\u0902\u0921\u093f\u092f\u093e"
      ],
      "correctIndex": 3,
      "explanation": "Under the massive, government-mandated mega-consolidation wave of public sector banks effective April 2020, both Andhra Bank and Corporation Bank were structurally merged directly into the colossal Union Bank of India. / \u0905\u092a\u094d\u0930\u0948\u0932 2020 \u0938\u0947 \u092a\u094d\u0930\u092d\u093e\u0935\u0940 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u092c\u0948\u0902\u0915\u094b\u0902 \u0915\u0940 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u0938\u0930\u0915\u093e\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u092e\u0947\u0917\u093e-\u0915\u0902\u0938\u094b\u0932\u093f\u0921\u0947\u0936\u0928 \u0932\u0939\u0930 \u0915\u0947 \u0924\u0939\u0924, \u0906\u0902\u0927\u094d\u0930\u093e \u092c\u0948\u0902\u0915 \u0914\u0930 \u0915\u0949\u0930\u094d\u092a\u094b\u0930\u0947\u0936\u0928 \u092c\u0948\u0902\u0915 \u0926\u094b\u0928\u094b\u0902 \u0915\u094b \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u0940\u0927\u0947 \u0935\u093f\u0936\u093e\u0932 \u092f\u0942\u0928\u093f\u092f\u0928 \u092c\u0948\u0902\u0915 \u0911\u092b \u0907\u0902\u0921\u093f\u092f\u093e \u092e\u0947\u0902 \u092e\u093f\u0932\u093e \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q39.</b> Which of the following is not a function of government in a mixed economy? / \u092e\u093f\u0936\u094d\u0930\u093f\u0924 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u092e\u0947\u0902 \u0938\u0930\u0915\u093e\u0930 \u0915\u093e \u0915\u093e\u0930\u094d\u092f \u0907\u0928\u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928-\u0938\u093e \u0928\u0939\u0940\u0902 \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Provision of public goods / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0940 \u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e",
        "Redistribution of income / \u0906\u092f \u0915\u093e \u092a\u0941\u0928\u0930\u094d\u0935\u093f\u0924\u0930\u0923",
        "Regulation of markets / \u092c\u093e\u091c\u093c\u093e\u0930\u094b\u0902 \u0915\u093e \u0928\u093f\u092f\u092e\u0928",
        "Setting prices of all goods / \u0938\u092d\u0940 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0940 \u0915\u0940\u092e\u0924\u0947\u0902 \u0924\u092f \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "In a dynamic Mixed Economy like India, the government regulates markets and provides public goods, but it absolutely does not fix the prices of ALL goods. Price setting for everyday commodities is largely left entirely to free-market demand and supply forces. / \u092d\u093e\u0930\u0924 \u091c\u0948\u0938\u0940 \u0917\u0924\u093f\u0936\u0940\u0932 \u092e\u093f\u0936\u094d\u0930\u093f\u0924 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u092e\u0947\u0902, \u0938\u0930\u0915\u093e\u0930 \u092c\u093e\u091c\u093e\u0930\u094b\u0902 \u0915\u094b \u0935\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0915\u0930\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0935\u0938\u094d\u0924\u0941\u090f\u0902 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u0940 \u0939\u0948, \u0932\u0947\u0915\u093f\u0928 \u092f\u0939 \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0938\u092d\u0940 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0940 \u0915\u0940\u092e\u0924\u0947\u0902 \u0924\u092f \u0928\u0939\u0940\u0902 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964 \u0930\u094b\u091c\u093c\u092e\u0930\u094d\u0930\u093e \u0915\u0940 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0947 \u0932\u093f\u090f \u092e\u0942\u0932\u094d\u092f \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u0923 \u0915\u093e\u092b\u0940 \u0939\u0926 \u0924\u0915 \u092e\u0941\u0915\u094d\u0924-\u092c\u093e\u091c\u093c\u093e\u0930 \u0915\u0940 \u092e\u093e\u0901\u0917 \u0914\u0930 \u0906\u092a\u0942\u0930\u094d\u0924\u093f \u0915\u0940 \u0924\u093e\u0915\u0924\u094b\u0902 \u092a\u0930 \u091b\u094b\u0921\u093c \u0926\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q40.</b> By how much was the Indian rupee devalued in July 1991 to tackle the balance of payments crisis? / \u092d\u0941\u0917\u0924\u093e\u0928 \u0938\u0902\u0924\u0941\u0932\u0928 \u0915\u0947 \u0938\u0902\u0915\u091f \u0938\u0947 \u0928\u093f\u092a\u091f\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u091c\u0941\u0932\u093e\u0908 1991 \u092e\u0947\u0902 \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u0941\u092a\u092f\u0947 \u0915\u093e \u0905\u0935\u092e\u0942\u0932\u094d\u092f\u0928 \u0915\u093f\u0924\u0928\u0947 \u092a\u094d\u0930\u0924\u093f\u0936\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e? [SSC GD 2026]",
      "options": [
        "5-7% / 5-7%",
        "50% / 50%",
        "30-35% / 30-35%",
        "18-20% / 18-20%"
      ],
      "correctIndex": 3,
      "explanation": "Driven by the catastrophic 1991 BoP crisis, the Reserve Bank of India aggressively devalued the Indian Rupee in two swift phases in July 1991, cumulatively plunging its value by a massive 18-20% to urgently boost exports. / 1991 \u0915\u0947 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u092d\u0941\u0917\u0924\u093e\u0928 \u0938\u0902\u0924\u0941\u0932\u0928 (BoP) \u0938\u0902\u0915\u091f \u0938\u0947 \u092a\u094d\u0930\u0947\u0930\u093f\u0924 \u0939\u094b\u0915\u0930, \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u093f\u091c\u0930\u094d\u0935 \u092c\u0948\u0902\u0915 \u0928\u0947 \u091c\u0941\u0932\u093e\u0908 1991 \u092e\u0947\u0902 \u0926\u094b \u0924\u094d\u0935\u0930\u093f\u0924 \u091a\u0930\u0923\u094b\u0902 \u092e\u0947\u0902 \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u0941\u092a\u092f\u0947 \u0915\u093e \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u0935\u092e\u0942\u0932\u094d\u092f\u0928 \u0915\u093f\u092f\u093e, \u091c\u093f\u0938\u0938\u0947 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b \u0924\u0924\u094d\u0915\u093e\u0932 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0907\u0938\u0915\u0947 \u092e\u0942\u0932\u094d\u092f \u092e\u0947\u0902 18-20% \u0915\u0940 \u092d\u093e\u0930\u0940 \u0917\u093f\u0930\u093e\u0935\u091f \u0906\u0908\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q41.</b> Main Worker in India is a person who works for at least ____ days in a year. / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 &#x27;\u092e\u0941\u0916\u094d\u092f \u0915\u093e\u092e\u0917\u093e\u0930&#x27; (Main Worker) \u0935\u0939 \u0935\u094d\u092f\u0915\u094d\u0924\u093f \u0939\u0948 \u091c\u094b \u090f\u0915 \u0935\u0930\u094d\u0937 \u092e\u0947\u0902 \u0915\u092e \u0938\u0947 \u0915\u092e ____ \u0926\u093f\u0928 \u0915\u093e\u092e \u0915\u0930\u0924\u093e \u0939\u0948\u0964 [SSC GD 2026]",
      "options": [

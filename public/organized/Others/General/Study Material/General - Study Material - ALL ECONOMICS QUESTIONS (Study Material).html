        "deficit budget / \u0918\u093e\u091f\u0947 \u0915\u093e \u092c\u091c\u091f",
        "balanced budget / \u0938\u0902\u0924\u0941\u0932\u093f\u0924 \u092c\u091c\u091f",
        "surplus budget / \u0905\u0927\u093f\u0936\u0947\u0937 \u092c\u091c\u091f"
      ],
      "correctIndex": 3,
      "explanation": "In strict governmental finance, a &quot;Surplus Budget&quot; is explicitly declared when the state&#x27;s total incoming revenue (massively generated from aggressive tax collections) strictly and healthily exceeds its entire total expenditure. This highly desirable state indicates profound fiscal discipline and provides massive capital for national emergencies. / \u0938\u0916\u094d\u0924 \u0938\u0930\u0915\u093e\u0930\u0940 \u0935\u093f\u0924\u094d\u0924 \u092e\u0947\u0902, &quot;\u0905\u0927\u093f\u0936\u0947\u0937 \u092c\u091c\u091f&quot; (Surplus Budget) \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0924\u092c \u0918\u094b\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 \u091c\u092c \u0930\u093e\u091c\u094d\u092f \u0915\u093e \u0915\u0941\u0932 \u0906\u0935\u0915 \u0930\u093e\u091c\u0938\u094d\u0935 (\u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0915\u0930 \u0938\u0902\u0917\u094d\u0930\u0939 \u0938\u0947 \u0909\u0924\u094d\u092a\u0928\u094d\u0928) \u0909\u0938\u0915\u0947 \u0938\u0902\u092a\u0942\u0930\u094d\u0923 \u0915\u0941\u0932 \u0935\u094d\u092f\u092f \u0938\u0947 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0914\u0930 \u0938\u094d\u0935\u0938\u094d\u0925 \u0930\u0942\u092a \u0938\u0947 \u0905\u0927\u093f\u0915 \u0939\u094b \u091c\u093e\u0924\u093e \u0939\u0948\u0964 \u092f\u0939 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u093e\u0902\u091b\u0928\u0940\u092f \u0938\u094d\u0925\u093f\u0924\u093f \u0917\u0939\u0928 \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0905\u0928\u0941\u0936\u093e\u0938\u0928 \u0915\u093e \u0938\u0902\u0915\u0947\u0924 \u0926\u0947\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0906\u092a\u093e\u0924 \u0938\u094d\u0925\u093f\u0924\u093f\u092f\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0940 \u092a\u0942\u0902\u091c\u0940 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q65.</b> Which index measures wholesale prices? / \u0915\u094c\u0928-\u0938\u093e \u0907\u0902\u0921\u0947\u0915\u094d\u0938 \u0925\u094b\u0915 \u0915\u0940\u092e\u0924\u094b\u0902 \u0915\u094b \u092e\u093e\u092a\u0924\u093e \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Gross Domestic Product Deflator / \u0938\u0915\u0932 \u0918\u0930\u0947\u0932\u0942 \u0909\u0924\u094d\u092a\u093e\u0926 \u0905\u092a\u0938\u094d\u092b\u0940\u0924\u093f\u0915\u093e\u0930\u0915 (GDP Deflator)",
        "Consumer Price Index / \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u092e\u0942\u0932\u094d\u092f \u0938\u0942\u091a\u0915\u093e\u0902\u0915",
        "Index of industrial Production / \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0938\u0942\u091a\u0915\u093e\u0902\u0915",
        "Wholesale Price Index / \u0925\u094b\u0915 \u092e\u0942\u0932\u094d\u092f \u0938\u0942\u091a\u0915\u093e\u0902\u0915"
      ],
      "correctIndex": 3,
      "explanation": "The Wholesale Price Index (WPI) is a highly critical macroeconomic indicator that rigorously tracks and accurately measures the exact average massive change in the bulk prices of goods heavily sold and traded in bulk by large wholesale businesses directly to other commercial entities. / \u0925\u094b\u0915 \u092e\u0942\u0932\u094d\u092f \u0938\u0942\u091a\u0915\u093e\u0902\u0915 (WPI) \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0938\u092e\u0937\u094d\u091f\u093f-\u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0902\u0915\u0947\u0924\u0915 \u0939\u0948 \u091c\u094b \u092c\u0921\u093c\u0947 \u0925\u094b\u0915 \u0935\u094d\u092f\u0935\u0938\u093e\u092f\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u0940\u0927\u0947 \u0905\u0928\u094d\u092f \u0935\u094d\u092f\u093e\u0935\u0938\u093e\u092f\u093f\u0915 \u0938\u0902\u0938\u094d\u0925\u093e\u0913\u0902 \u0915\u094b \u092d\u093e\u0930\u0940 \u092e\u093e\u0924\u094d\u0930\u093e \u092e\u0947\u0902 \u092c\u0947\u091a\u0947 \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 \u0914\u0930 \u0925\u094b\u0915 \u092e\u0947\u0902 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0915\u093f\u090f \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 \u0938\u093e\u092e\u093e\u0928\u094b\u0902 \u0915\u0940 \u0925\u094b\u0915 \u0915\u0940\u092e\u0924\u094b\u0902 \u092e\u0947\u0902 \u0938\u091f\u0940\u0915 \u0914\u0938\u0924 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 \u0915\u094b \u0915\u0920\u094b\u0930\u0924\u093e \u0938\u0947 \u091f\u094d\u0930\u0948\u0915 \u0914\u0930 \u0938\u091f\u0940\u0915 \u0930\u0942\u092a \u0938\u0947 \u092e\u093e\u092a\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "\n            <div class=\"context-box\">\n                Q66. Which of the following was the target of Tenth five-year plan of India? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0926\u0938\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u0932\u0915\u094d\u0937\u094d\u092f \u0907\u0928\u092e\u0947\u0902 \u0938\u0947 \u0915\u094d\u092f\u093e \u0925\u093e? [SSC GD 2026]<br><br>1. Improvement in Literacy. / 1. \u0938\u093e\u0915\u094d\u0937\u0930\u0924\u093e \u092e\u0947\u0902 \u0938\u0941\u0927\u093e\u0930\u0964<br><br>2. Reduction in infant and maternal mortality rates. / 2. \u0936\u093f\u0936\u0941 \u0914\u0930 \u092e\u093e\u0924\u0943 \u092e\u0943\u0924\u094d\u092f\u0941 \u0926\u0930 \u092e\u0947\u0902 \u0915\u092e\u0940\u0964\n            </div>\n            <b>Q66.</b> Which of the statements above is/are correct? / \ud83d\udc49 \u0909\u092a\u0930\u094b\u0915\u094d\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e/\u0938\u0947 \u0915\u0925\u0928 \u0938\u0939\u0940 \u0939\u0948/\u0939\u0948\u0902?",
      "options": [
        "Only I / \u0915\u0947\u0935\u0932 I",
        "Both I and II / I \u0914\u0930 II \u0926\u094b\u0928\u094b\u0902",
        "Neither I nor II / \u0928 \u0924\u094b I \u0914\u0930 \u0928 \u0939\u0940 II",
        "Only II / \u0915\u0947\u0935\u0932 II"
      ],
      "correctIndex": 1,
      "explanation": "The Tenth Five-Year Plan (2002-2007) marked a profound shift by strictly prioritizing massive social indicators alongside economic growth. It aggressively targeted a massive reduction in poverty ratios, rigorous improvements in national literacy rates, and significant, urgent reductions in both infant mortality and maternal mortality rates. / \u0926\u0938\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (2002-2007) \u0928\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0915\u0947 \u0938\u093e\u0925-\u0938\u093e\u0925 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u0938\u0902\u0915\u0947\u0924\u0915\u094b\u0902 \u0915\u094b \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0947\u0915\u0930 \u090f\u0915 \u0917\u0939\u0930\u093e \u092c\u0926\u0932\u093e\u0935 \u0915\u093f\u092f\u093e\u0964 \u0907\u0938\u0928\u0947 \u0917\u0930\u0940\u092c\u0940 \u0905\u0928\u0941\u092a\u093e\u0924 \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0915\u092e\u0940, \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u093e\u0915\u094d\u0937\u0930\u0924\u093e \u0926\u0930 \u092e\u0947\u0902 \u0915\u0920\u094b\u0930 \u0938\u0941\u0927\u093e\u0930 \u0914\u0930 \u0936\u093f\u0936\u0941 \u092e\u0943\u0924\u094d\u092f\u0941 \u0926\u0930 \u0935 \u092e\u093e\u0924\u0943 \u092e\u0943\u0924\u094d\u092f\u0941 \u0926\u0930 \u0926\u094b\u0928\u094b\u0902 \u092e\u0947\u0902 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923, \u0924\u0924\u094d\u0915\u093e\u0932 \u0915\u092e\u0940 \u0915\u093e \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0932\u0915\u094d\u0937\u094d\u092f \u0930\u0916\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q67.</b> Which industry was considered the \u201ccommanding heights\u201d of the economy during 1950-1980? / 1950-1980 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0915\u093f\u0938 \u0909\u0926\u094d\u092f\u094b\u0917 \u0915\u094b \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u093e &quot;\u0915\u092e\u093e\u0902\u0921\u093f\u0902\u0917 \u0939\u093e\u0907\u091f\u094d\u0938&quot; (\u092e\u0941\u0916\u094d\u092f \u0906\u0927\u093e\u0930) \u092e\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0925\u093e? [SSC GD 2026]",
      "options": [
        "Agriculture / \u0915\u0943\u0937\u093f",
        "Textile / \u0915\u092a\u0921\u093c\u093e \u0909\u0926\u094d\u092f\u094b\u0917",
        "Heavy industry, steel, energy / \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917, \u0907\u0938\u094d\u092a\u093e\u0924, \u090a\u0930\u094d\u091c\u093e",
        "Handicrafts / \u0939\u0938\u094d\u0924\u0936\u093f\u0932\u094d\u092a"
      ],
      "correctIndex": 2,
      "explanation": "During the highly socialist-leaning initial planning era (1950-1980), the profound term &quot;commanding heights of the economy&quot; specifically referred to vital, massive Heavy Industries, giant Steel plants, and critical Energy sectors. The state actively monopolized these exact sectors to completely dictate the entire trajectory of national industrialization. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u091d\u0941\u0915\u093e\u0935 \u0935\u093e\u0932\u0947 \u092a\u094d\u0930\u093e\u0930\u0902\u092d\u093f\u0915 \u0928\u093f\u092f\u094b\u091c\u0928 \u092f\u0941\u0917 (1950-1980) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928, &quot;\u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0947 \u0915\u092e\u093e\u0902\u0921\u093f\u0902\u0917 \u0939\u093e\u0907\u091f\u094d\u0938&quot; \u0936\u092c\u094d\u0926 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902, \u0935\u093f\u0936\u093e\u0932 \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\u0930\u094b\u0902 \u0914\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u090a\u0930\u094d\u091c\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u094b \u0938\u0902\u0926\u0930\u094d\u092d\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u0930\u093e\u091c\u094d\u092f \u0928\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0915\u0947 \u092a\u0942\u0930\u0947 \u092a\u094d\u0930\u0915\u094d\u0937\u0947\u092a\u0935\u0915\u094d\u0930 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0924\u092f \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0907\u0928 \u0938\u091f\u0940\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u092a\u0930 \u0938\u0915\u094d\u0930\u093f\u092f \u0930\u0942\u092a \u0938\u0947 \u090f\u0915\u093e\u0927\u093f\u0915\u093e\u0930 \u0915\u0930 \u0932\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q68.</b> Which sector was given top priority in India\u2019s Second Five-Year Plan? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092e\u0947\u0902 \u0915\u093f\u0938 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u094b \u0938\u0930\u094d\u0935\u094b\u091a\u094d\u091a \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0940 \u0917\u0908 \u0925\u0940? [SSC GD 2026]",
      "options": [
        "Agriculture / \u0915\u0943\u0937\u093f",
        "Heavy industry / \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917",
        "Services / \u0938\u0947\u0935\u093e\u090f\u0901",
        "Small-scale enterprises / \u0932\u0918\u0941-\u0938\u094d\u0924\u0930\u0940\u092f \u0909\u0926\u094d\u092f\u092e"
      ],
      "correctIndex": 1,
      "explanation": "The incredibly historic Second Five-Year Plan (1956-1961), structured masterfully on the Mahalanobis model, strategically and aggressively shifted the core national economic focus completely away from agriculture directly to rapid, massive industrialization, heavily prioritizing the rapid establishment of massive &#x27;Heavy and Basic Industries&#x27; like steel. / \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u092a\u0930 \u0909\u0924\u094d\u0915\u0943\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u0930\u091a\u093f\u0924 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-1961) \u0928\u0947 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092e\u0941\u0916\u094d\u092f \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0906\u0930\u094d\u0925\u093f\u0915 \u092b\u094b\u0915\u0938 \u0915\u094b \u0915\u0943\u0937\u093f \u0938\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0926\u0942\u0930 \u0915\u0930\u0915\u0947 \u0938\u0940\u0927\u0947 \u0924\u0947\u091c, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0915\u0940 \u0913\u0930 \u0938\u094d\u0925\u093e\u0928\u093e\u0902\u0924\u0930\u093f\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e, \u092d\u093e\u0930\u0940 \u092e\u093e\u0924\u094d\u0930\u093e \u092e\u0947\u0902 \u0938\u094d\u091f\u0940\u0932 \u091c\u0948\u0938\u0947 \u092c\u0921\u093c\u0947 &#x27;\u092d\u093e\u0930\u0940 \u0914\u0930 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902&#x27; \u0915\u0940 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u094b \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q69.</b> Which scheme provides financial incentives to promote exports from SEZs? / SEZ \u0938\u0947 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u094c\u0928 \u0938\u0940 \u092f\u094b\u091c\u0928\u093e \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u0928 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u0940 \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Merchandise Exports from India Scheme (MEIS) / \u092e\u0930\u094d\u091a\u0947\u0902\u0921\u093e\u0907\u091c\u093c \u090f\u0915\u094d\u0938\u092a\u094b\u0930\u094d\u091f\u094d\u0938 \u092b\u094d\u0930\u0949\u092e \u0907\u0902\u0921\u093f\u092f\u093e \u0938\u094d\u0915\u0940\u092e (MEIS)",
        "National Export Insurance Scheme / \u0928\u0947\u0936\u0928\u0932 \u090f\u0915\u094d\u0938\u092a\u094b\u0930\u094d\u091f \u0907\u0902\u0936\u094d\u092f\u094b\u0930\u0947\u0902\u0938 \u0938\u094d\u0915\u0940\u092e",
        "Prime Minister&#x27;s Export Fund / \u092a\u094d\u0930\u0927\u093e\u0928\u092e\u0902\u0924\u094d\u0930\u0940 \u090f\u0915\u094d\u0938\u092a\u094b\u0930\u094d\u091f \u092b\u0902\u0921",
        "Foreign Trade Investment Program / \u092b\u0949\u0930\u0947\u0928 \u091f\u094d\u0930\u0947\u0921 \u0907\u0928\u094d\u0935\u0947\u0938\u094d\u091f\u092e\u0947\u0902\u091f \u092a\u094d\u0930\u094b\u0917\u094d\u0930\u093e\u092e"
      ],
      "correctIndex": 0,
      "explanation": "The Merchandise Exports from India Scheme (MEIS) was strategically launched under the Foreign Trade Policy to aggressively provide crucial financial incentives to domestic exporters. It aimed to heavily offset massive infrastructural inefficiencies and massively boost the absolute export of locally manufactured goods, particularly from vital Special Economic Zones (SEZs). / \u092e\u0930\u094d\u091a\u0947\u0902\u0921\u093e\u0907\u091c \u090f\u0915\u094d\u0938\u092a\u094b\u0930\u094d\u091f\u094d\u0938 \u092b\u094d\u0930\u0949\u092e \u0907\u0902\u0921\u093f\u092f\u093e \u0938\u094d\u0915\u0940\u092e (MEIS) \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0926\u0947\u0936 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0928\u0940\u0924\u093f \u0915\u0947 \u0924\u0939\u0924 \u0918\u0930\u0947\u0932\u0942 \u0928\u093f\u0930\u094d\u092f\u093e\u0924\u0915\u094b\u0902 \u0915\u094b \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u0928 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940\u0964 \u0907\u0938\u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0922\u093e\u0902\u091a\u093e\u0917\u0924 \u0905\u0915\u094d\u0937\u092e\u0924\u093e\u0913\u0902 \u0915\u0940 \u092d\u0930\u092a\u093e\u0908 \u0915\u0930\u0928\u093e \u0914\u0930 \u0938\u094d\u0925\u093e\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0928\u093f\u0930\u094d\u092e\u093f\u0924 \u0935\u0938\u094d\u0924\u0941\u0913\u0902, \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0935\u093f\u0936\u0947\u0937 \u0906\u0930\u094d\u0925\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 (SEZs) \u0938\u0947 \u092a\u0942\u0930\u094d\u0923 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q70.</b> The concept of five-year plans of India was borrowed from _____. / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u093e \u0935\u093f\u091a\u093e\u0930 _____ \u0938\u0947 \u0932\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 [SSC GD 2026]",
      "options": [
        "United Kingdome / \u092f\u0942\u0928\u093e\u0907\u091f\u0947\u0921 \u0915\u093f\u0902\u0917\u0921\u092e",
        "Former Soviet Union / \u092a\u0942\u0930\u094d\u0935 \u0938\u094b\u0935\u093f\u092f\u0924 \u0938\u0902\u0918",
        "United States of America / \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0930\u093e\u091c\u094d\u092f \u0905\u092e\u0947\u0930\u093f\u0915\u093e",
        "France / \u092b\u093c\u094d\u0930\u093e\u0902\u0938"
      ],
      "correctIndex": 1,
      "explanation": "The profoundly transformative macroeconomic concept of highly centralized &#x27;Five-Year Plans&#x27; was explicitly and heavily borrowed directly from the Former Soviet Union (USSR). Prime Minister Jawaharlal Nehru, deeply inspired by their massive rapid industrial success, actively adopted this rigid state-led planning model to systematically rebuild the fragile Indian economy. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u0915\u0943\u0924 &#x27;\u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u0913\u0902&#x27; \u0915\u0940 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940 \u0938\u092e\u0937\u094d\u091f\u093f-\u0906\u0930\u094d\u0925\u093f\u0915 \u0905\u0935\u0927\u093e\u0930\u0923\u093e \u0915\u094b \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0938\u0940\u0927\u0947 \u092a\u0942\u0930\u094d\u0935 \u0938\u094b\u0935\u093f\u092f\u0924 \u0938\u0902\u0918 (USSR) \u0938\u0947 \u0932\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u091c\u0935\u093e\u0939\u0930\u0932\u093e\u0932 \u0928\u0947\u0939\u0930\u0942 \u0928\u0947 \u0909\u0928\u0915\u0940 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0924\u0940\u0935\u094d\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0938\u092b\u0932\u0924\u093e \u0938\u0947 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u092a\u094d\u0930\u0947\u0930\u093f\u0924 \u0939\u094b\u0915\u0930, \u0928\u093e\u091c\u0941\u0915 \u092d\u093e\u0930\u0924\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u092b\u093f\u0930 \u0938\u0947 \u092c\u0928\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0907\u0938 \u0915\u0920\u094b\u0930 \u0930\u093e\u091c\u094d\u092f-\u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u0928\u093f\u092f\u094b\u091c\u0928 \u092e\u0949\u0921\u0932 \u0915\u094b \u0938\u0915\u094d\u0930\u093f\u092f \u0930\u0942\u092a \u0938\u0947 \u0905\u092a\u0928\u093e\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q71.</b> Which trade-related policy reform was introduced in 1991 to stimulate India\u2019s export growth? / \u092d\u093e\u0930\u0924 \u0915\u0947 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u092e\u0947\u0902 \u0935\u0943\u0926\u094d\u0927\u093f \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f 1991 \u092e\u0947\u0902 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0938\u0947 \u0938\u0902\u092c\u0902\u0927\u093f\u0924 \u0915\u094c\u0928-\u0938\u093e \u0928\u0940\u0924\u093f\u0917\u0924 \u0938\u0941\u0927\u093e\u0930 \u0932\u093e\u0917\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e? [SSC GD 2026]",
      "options": [
        "Economic Liberalization Policy / \u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0928\u0940\u0924\u093f",
        "Import Substitution Strategy / \u0906\u092f\u093e\u0924 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928 \u0930\u0923\u0928\u0940\u0924\u093f",
        "Export-Import Policy Framework / \u0928\u093f\u0930\u094d\u092f\u093e\u0924-\u0906\u092f\u093e\u0924 \u0928\u0940\u0924\u093f \u0922\u093e\u0902\u091a\u093e",
        "Green Revolution Strategy / \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0930\u0923\u0928\u0940\u0924\u093f"
      ],
      "correctIndex": 0,
      "explanation": "To drastically revive the totally collapsed Indian economy, the historic 1991 Economic Liberalization Policy was forcefully implemented. It aggressively dismantled the stifling License Raj, heavily reduced complex trade barriers, and fiercely promoted exports by actively opening the domestic market to immense global competition and massive foreign investments. / \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0922\u0939\u0940 \u0939\u0941\u0908 \u092d\u093e\u0930\u0924\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u0915\u093e\u092b\u0940 \u092a\u0941\u0928\u0930\u094d\u091c\u0940\u0935\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f, \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1991 \u0915\u0940 \u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0928\u0940\u0924\u093f \u0915\u094b \u092c\u0932\u092a\u0942\u0930\u094d\u0935\u0915 \u0932\u093e\u0917\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0928\u0947 \u0926\u092e\u0918\u094b\u0902\u091f\u0942 \u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0916\u0924\u094d\u092e \u0915\u0930 \u0926\u093f\u092f\u093e, \u091c\u091f\u093f\u0932 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u092c\u093e\u0927\u093e\u0913\u0902 \u0915\u094b \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0915\u092e \u0915\u0930 \u0926\u093f\u092f\u093e, \u0914\u0930 \u0918\u0930\u0947\u0932\u0942 \u092c\u093e\u091c\u093e\u0930 \u0915\u094b \u092d\u093e\u0930\u0940 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u0947 \u0932\u093f\u090f \u0938\u0915\u094d\u0930\u093f\u092f \u0930\u0942\u092a \u0938\u0947 \u0916\u094b\u0932\u0915\u0930 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b \u091c\u094b\u0930\u0926\u093e\u0930 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q72.</b> Which key fiscal reform was introduced in India after 1991 to strengthen revenue collection? / 1991 \u0915\u0947 \u092c\u093e\u0926 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0930\u093e\u091c\u0938\u094d\u0935 \u0938\u0902\u0917\u094d\u0930\u0939 \u0915\u094b \u092e\u091c\u092c\u0942\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u094c\u0928 \u0938\u093e \u092a\u094d\u0930\u092e\u0941\u0916 \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0938\u0941\u0927\u093e\u0930 \u0932\u093e\u0917\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e? [SSC GD 2026]",
      "options": [
        "Removing income tax completely / \u0906\u092f\u0915\u0930 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0939\u091f\u093e\u0928\u093e",
        "Simplifying indirect taxes through MODVAT / MODVAT \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0905\u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0915\u0930\u094b\u0902 \u0915\u094b \u0938\u0930\u0932 \u092c\u0928\u093e\u0928\u093e",
        "Increasing subsidies / \u0938\u092c\u094d\u0938\u093f\u0921\u0940 \u092c\u0922\u093c\u093e\u0928\u093e",
        "Introduction of Goods and Services Tax (GST) / \u0935\u0938\u094d\u0924\u0941 \u090f\u0935\u0902 \u0938\u0947\u0935\u093e \u0915\u0930 (GST) \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924"
      ],
      "correctIndex": 1,
      "explanation": "As a massive foundational step toward vital tax reform post-1991, the Indian government actively pushed for simplifying the highly complex indirect tax structure specifically through systems like MODVAT (Modified Value Added Tax). This heavily aimed to definitively reduce the cascading effect of taxes and effectively boost transparent revenue collection. / 1991 \u0915\u0947 \u092c\u093e\u0926 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0915\u0930 \u0938\u0941\u0927\u093e\u0930 \u0915\u0940 \u0926\u093f\u0936\u093e \u092e\u0947\u0902 \u090f\u0915 \u092c\u0921\u093c\u0947 \u0906\u0927\u093e\u0930\u092d\u0942\u0924 \u0915\u0926\u092e \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902, \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 MODVAT (\u0938\u0902\u0936\u094b\u0927\u093f\u0924 \u092e\u0942\u0932\u094d\u092f \u0935\u0930\u094d\u0927\u093f\u0924 \u0915\u0930) \u091c\u0948\u0938\u0940 \u092a\u094d\u0930\u0923\u093e\u0932\u093f\u092f\u094b\u0902 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u091c\u091f\u093f\u0932 \u0905\u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0915\u0930 \u0938\u0902\u0930\u091a\u0928\u093e \u0915\u094b \u0938\u0930\u0932 \u092c\u0928\u093e\u0928\u0947 \u092a\u0930 \u0938\u0915\u094d\u0930\u093f\u092f \u0930\u0942\u092a \u0938\u0947 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e\u0964 \u0907\u0938\u0915\u093e \u092e\u0941\u0916\u094d\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u0930\u094b\u0902 \u0915\u0947 \u0935\u094d\u092f\u093e\u092a\u0915 \u092a\u094d\u0930\u092d\u093e\u0935 (cascading effect) \u0915\u094b \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0915\u092e \u0915\u0930\u0928\u093e \u0914\u0930 \u092a\u093e\u0930\u0926\u0930\u094d\u0936\u0940 \u0930\u093e\u091c\u0938\u094d\u0935 \u0938\u0902\u0917\u094d\u0930\u0939 \u0915\u094b \u092a\u094d\u0930\u092d\u093e\u0935\u0940 \u0922\u0902\u0917 \u0938\u0947 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q73.</b> What was the main drawback of small-scale industry reservation policies? / \u091b\u094b\u091f\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0906\u0930\u0915\u094d\u0937\u0923 \u0928\u0940\u0924\u093f\u092f\u094b\u0902 \u0915\u0940 \u092e\u0941\u0916\u094d\u092f \u0915\u092e\u0940 \u0915\u094d\u092f\u093e \u0925\u0940? [SSC GD 2026]",
      "options": [
        "They excluded rural entrepreneurs / \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0909\u0926\u094d\u092f\u092e\u093f\u092f\u094b\u0902 \u0915\u094b \u092c\u093e\u0939\u0930 \u0930\u0916\u093e",
        "They encouraged monopoly power / \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u090f\u0915\u093e\u0927\u093f\u0915\u093e\u0930 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u093f\u092f\u093e",
        "They eliminated export opportunities / \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u0947 \u0905\u0935\u0938\u0930\u094b\u0902 \u0915\u094b \u0916\u0924\u094d\u092e \u0915\u0930 \u0926\u093f\u092f\u093e",
        "They restricted economies of scale and technological upgrading / \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0947 \u0932\u093e\u092d \u0914\u0930 \u0924\u0915\u0928\u0940\u0915\u0940 \u0905\u092a\u0917\u094d\u0930\u0947\u0921\u093f\u0902\u0917 \u0915\u094b \u0938\u0940\u092e\u093f\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e"
      ],
      "correctIndex": 3,
      "explanation": "By legally and strictly reserving specific products entirely for small-scale industries, the government tragically and inadvertently prevented these highly protected firms from aggressively growing. This rigid limitation explicitly restricted &quot;economies of scale&quot; and deeply discouraged massive technological upgrading, making Indian goods heavily globally uncompetitive. / \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0909\u0924\u094d\u092a\u093e\u0926\u094b\u0902 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u091b\u094b\u091f\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0915\u093e\u0928\u0942\u0928\u0940 \u0914\u0930 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0906\u0930\u0915\u094d\u0937\u093f\u0924 \u0915\u0930\u0915\u0947, \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0926\u0941\u0916\u0926 \u0914\u0930 \u0905\u0928\u091c\u093e\u0928\u0947 \u092e\u0947\u0902 \u0907\u0928 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u0902\u0930\u0915\u094d\u0937\u093f\u0924 \u092b\u0930\u094d\u092e\u094b\u0902 \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0922\u093c\u0928\u0947 \u0938\u0947 \u0930\u094b\u0915 \u0926\u093f\u092f\u093e\u0964 \u0907\u0938 \u0915\u0920\u094b\u0930 \u0938\u0940\u092e\u093e \u0928\u0947 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 &quot;\u092a\u0948\u092e\u093e\u0928\u0947 \u0915\u0940 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e\u0913\u0902&quot; (economies of scale) \u0915\u094b \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093f\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0924\u0915\u0928\u0940\u0915\u0940 \u0909\u0928\u094d\u0928\u092f\u0928 \u0915\u094b \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u0939\u0924\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u093f\u092f\u093e, \u091c\u093f\u0938\u0938\u0947 \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u093e\u092e\u093e\u0928 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0905\u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u0940 \u0939\u094b \u0917\u090f\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q74.</b> Which plan was terminated one year before completion due to the Indo-China war? / \u092d\u093e\u0930\u0924-\u091a\u0940\u0928 \u092f\u0941\u0926\u094d\u0927 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0915\u093f\u0938 \u092f\u094b\u091c\u0928\u093e \u0915\u094b \u092a\u0942\u0930\u093e \u0939\u094b\u0928\u0947 \u0938\u0947 \u090f\u0915 \u0938\u093e\u0932 \u092a\u0939\u0932\u0947 \u0939\u0940 \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e? [SSC GD 2026]",
      "options": [
        "First Plan / \u092a\u0939\u0932\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Fourth Plan / \u091a\u094c\u0925\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Third Plan / \u0924\u0940\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e",
        "second Plan / \u0926\u0942\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The highly ambitious Third Five-Year Plan (1961-1966) failed disastrously primarily due to the severe economic drain from the catastrophic Sino-Indian War (1962). While it technically ran its course, its goals were utterly shattered, forcing the government into a humiliating &quot;Plan Holiday&quot; instead of launching the Fourth Plan. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1961-1966) \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u091a\u0940\u0928-\u092d\u093e\u0930\u0924 \u092f\u0941\u0926\u094d\u0927 (1962) \u0938\u0947 \u0917\u0902\u092d\u0940\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u093f\u0915\u093e\u0938\u0940 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u092b\u0932 \u0930\u0939\u0940\u0964 \u091c\u092c\u0915\u093f \u092f\u0939 \u0924\u0915\u0928\u0940\u0915\u0940 \u0930\u0942\u092a \u0938\u0947 \u0905\u092a\u0928\u0947 \u092a\u093e\u0920\u094d\u092f\u0915\u094d\u0930\u092e \u092a\u0930 \u091a\u0932\u093e, \u0907\u0938\u0915\u0947 \u0932\u0915\u094d\u0937\u094d\u092f \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u091a\u0915\u0928\u093e\u091a\u0942\u0930 \u0939\u094b \u0917\u090f, \u091c\u093f\u0938\u0938\u0947 \u0938\u0930\u0915\u093e\u0930 \u0915\u094b \u091a\u094c\u0925\u0940 \u092f\u094b\u091c\u0928\u093e \u0936\u0941\u0930\u0942 \u0915\u0930\u0928\u0947 \u0915\u0947 \u092c\u091c\u093e\u092f \u090f\u0915 \u0905\u092a\u092e\u093e\u0928\u091c\u0928\u0915 &quot;\u092f\u094b\u091c\u0928\u093e \u0905\u0935\u0915\u093e\u0936&quot; (Plan Holiday) \u0915\u0947 \u0932\u093f\u090f \u092e\u091c\u092c\u0942\u0930 \u0939\u094b\u0928\u093e \u092a\u0921\u093c\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q75.</b> When nominal Gross Domestic Product (GDP) rises faster than real GDP, it indicates: / \u091c\u092c \u0928\u0949\u092e\u093f\u0928\u0932 \u0938\u0915\u0932 \u0918\u0930\u0947\u0932\u0942 \u0909\u0924\u094d\u092a\u093e\u0926 (GDP) \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 GDP \u0915\u0940 \u0924\u0941\u0932\u0928\u093e \u092e\u0947\u0902 \u0924\u0947\u091c\u093c\u0940 \u0938\u0947 \u092c\u0922\u093c\u0924\u093e \u0939\u0948, \u0924\u094b \u092f\u0939 \u0926\u0930\u094d\u0936\u093e\u0924\u093e \u0939\u0948: [SSC GD 2026]",
      "options": [
        "Zero growth / \u0936\u0942\u0928\u094d\u092f \u0935\u0943\u0926\u094d\u0927\u093f",
        "Deflation / \u0905\u092a\u0938\u094d\u092b\u0940\u0924\u093f",
        "High inflation / \u0909\u091a\u094d\u091a \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f",
        "Falling inflation / \u0917\u093f\u0930\u0924\u0940 \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f"
      ],
      "correctIndex": 2,
      "explanation": "Nominal GDP rigidly measures output utilizing absolutely current market prices, whereas Real GDP strictly uses constant base-year prices. If Nominal GDP rises significantly faster than Real GDP, it mathematically and undeniably indicates that actual prices are aggressively skyrocketing, reflecting a state of severe &quot;High Inflation&quot; rather than real production growth. / \u0928\u093e\u092e\u092e\u093e\u0924\u094d\u0930 \u091c\u0940\u0921\u0940\u092a\u0940 (Nominal GDP) \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0935\u0930\u094d\u0924\u092e\u093e\u0928 \u092c\u093e\u091c\u093e\u0930 \u0915\u0940\u092e\u0924\u094b\u0902 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0915\u0947 \u0906\u0909\u091f\u092a\u0941\u091f \u0915\u094b \u092e\u093e\u092a\u0924\u093e \u0939\u0948, \u091c\u092c\u0915\u093f \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u091c\u0940\u0921\u0940\u092a\u0940 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0938\u094d\u0925\u093f\u0930 \u0906\u0927\u093e\u0930-\u0935\u0930\u094d\u0937 \u0915\u0940 \u0915\u0940\u092e\u0924\u094b\u0902 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u092f\u0926\u093f \u0928\u093e\u092e\u092e\u093e\u0924\u094d\u0930 \u091c\u0940\u0921\u0940\u092a\u0940 \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u091c\u0940\u0921\u0940\u092a\u0940 \u0915\u0940 \u0924\u0941\u0932\u0928\u093e \u092e\u0947\u0902 \u0915\u093e\u092b\u0940 \u0924\u0947\u091c\u0940 \u0938\u0947 \u092c\u0922\u093c\u0924\u093e \u0939\u0948, \u0924\u094b \u092f\u0939 \u0917\u0923\u093f\u0924\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0928\u093f\u0930\u094d\u0935\u093f\u0935\u093e\u0926 \u0930\u0942\u092a \u0938\u0947 \u0907\u0902\u0917\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948 \u0915\u093f \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u0915\u0940\u092e\u0924\u0947\u0902 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0906\u0938\u092e\u093e\u0928 \u091b\u0942 \u0930\u0939\u0940 \u0939\u0948\u0902, \u091c\u094b \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0935\u0943\u0926\u094d\u0927\u093f \u0915\u0947 \u092c\u091c\u093e\u092f \u0917\u0902\u092d\u0940\u0930 &quot;\u0909\u091a\u094d\u091a \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f&quot; \u0915\u0940 \u0938\u094d\u0925\u093f\u0924\u093f \u0915\u094b \u0926\u0930\u094d\u0936\u093e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q76.</b> In the context of money supply in India, which of the following is NOT the Quantitative tool of Reserve bank of India? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092e\u0941\u0926\u094d\u0930\u093e \u0906\u092a\u0942\u0930\u094d\u0924\u093f \u0915\u0947 \u0938\u0902\u0926\u0930\u094d\u092d \u092e\u0947\u0902, \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928-\u0938\u093e \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u093f\u091c\u093c\u0930\u094d\u0935 \u092c\u0948\u0902\u0915 \u0915\u093e \u092e\u093e\u0924\u094d\u0930\u093e\u0924\u094d\u092e\u0915 \u0909\u092a\u0915\u0930\u0923 \u0928\u0939\u0940\u0902 \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Bank rate / \u092c\u0948\u0902\u0915 \u0926\u0930",
        "Cash Reserve Ratio / \u0928\u0915\u0926 \u0906\u0930\u0915\u094d\u0937\u093f\u0924 \u0905\u0928\u0941\u092a\u093e\u0924",
        "Open Market Operations / \u0916\u0941\u0932\u0947 \u092c\u093e\u091c\u093e\u0930 \u0938\u0902\u091a\u093e\u0932\u0928",
        "Moral suasion / \u0928\u0948\u0924\u093f\u0915 \u0926\u092c\u093e\u0935"
      ],
      "correctIndex": 3,
      "explanation": "In the RBI&#x27;s highly strategic monetary arsenal, &quot;Moral Suasion&quot; is exclusively a Qualitative (selective) tool, representing informal, non-binding persuasion directed at banks. Conversely, Bank Rate, CRR, and OMO are absolutely strict, mandatory Quantitative tools massively designed to physically control the entire volume of money supply in the whole economy. / RBI \u0915\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u092e\u094c\u0926\u094d\u0930\u093f\u0915 \u0936\u0938\u094d\u0924\u094d\u0930\u093e\u0917\u093e\u0930 \u092e\u0947\u0902, &quot;\u0928\u0948\u0924\u093f\u0915 \u0926\u092c\u093e\u0935&quot; (Moral Suasion) \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u0917\u0941\u0923\u093e\u0924\u094d\u092e\u0915 (\u091a\u092f\u0928\u093e\u0924\u094d\u092e\u0915) \u0909\u092a\u0915\u0930\u0923 \u0939\u0948, \u091c\u094b \u092c\u0948\u0902\u0915\u094b\u0902 \u0915\u094b \u0928\u093f\u0930\u094d\u0926\u0947\u0936\u093f\u0924 \u0905\u0928\u094c\u092a\u091a\u093e\u0930\u093f\u0915, \u0917\u0948\u0930-\u092c\u093e\u0927\u094d\u092f\u0915\u093e\u0930\u0940 \u0905\u0928\u0941\u0928\u092f \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u0907\u0938\u0915\u0947 \u0935\u093f\u092a\u0930\u0940\u0924, \u092c\u0948\u0902\u0915 \u0926\u0930, CRR \u0914\u0930 OMO \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0938\u0916\u094d\u0924, \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u092e\u093e\u0924\u094d\u0930\u093e\u0924\u094d\u092e\u0915 \u0909\u092a\u0915\u0930\u0923 \u0939\u0948\u0902 \u091c\u094b \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u0942\u0930\u0940 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u092e\u0947\u0902 \u0927\u0928 \u0906\u092a\u0942\u0930\u094d\u0924\u093f \u0915\u0940 \u092a\u0942\u0930\u0940 \u092e\u093e\u0924\u094d\u0930\u093e \u0915\u094b \u092d\u094c\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0921\u093f\u091c\u093c\u093e\u0907\u0928 \u0915\u093f\u090f \u0917\u090f \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q77.</b> By 1990, India&#x27;s external debt had become: / 1990 \u0924\u0915, \u092d\u093e\u0930\u0924 \u0915\u093e \u0935\u093f\u0926\u0947\u0936\u0940 \u0915\u0930\u094d\u091c \u0907\u0924\u0928\u093e \u0939\u094b \u0917\u092f\u093e \u0925\u093e: [SSC GD 2026]",
      "options": [

      "correctIndex": 0,
      "explanation": "By the critical year 1990, India&#x27;s sovereign external debt had aggressively and disastrously accumulated to an absolutely unmanageable, terrifying level. This massive, unsustainable debt burden directly triggered the horrific 1991 Balance of Payments crisis, pushing the entire nation to the very brink of a humiliating sovereign default. / \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0935\u0930\u094d\u0937 1990 \u0924\u0915, \u092d\u093e\u0930\u0924 \u0915\u093e \u0938\u0902\u092a\u094d\u0930\u092d\u0941 \u092c\u093e\u0939\u0930\u0940 \u090b\u0923 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0914\u0930 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0905\u0938\u0939\u0928\u0940\u092f, \u092d\u092f\u093e\u0928\u0915 \u0938\u094d\u0924\u0930 \u0924\u0915 \u091c\u092e\u093e \u0939\u094b \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u0905\u0938\u094d\u0925\u093f\u0930 \u090b\u0923 \u092c\u094b\u091d \u0928\u0947 \u0938\u0940\u0927\u0947 1991 \u0915\u0947 \u092d\u092f\u093e\u0928\u0915 \u092d\u0941\u0917\u0924\u093e\u0928 \u0938\u0902\u0924\u0941\u0932\u0928 \u0938\u0902\u0915\u091f \u0915\u094b \u091c\u0928\u094d\u092e \u0926\u093f\u092f\u093e, \u091c\u093f\u0938\u0938\u0947 \u092a\u0942\u0930\u0947 \u0926\u0947\u0936 \u0915\u094b \u0905\u092a\u092e\u093e\u0928\u091c\u0928\u0915 \u0938\u0902\u092a\u094d\u0930\u092d\u0941 \u0921\u093f\u092b\u093c\u0949\u0932\u094d\u091f (\u0926\u093f\u0935\u093e\u0932\u093f\u092f\u093e\u092a\u0928) \u0915\u0947 \u0915\u0917\u093e\u0930 \u092a\u0930 \u0927\u0915\u0947\u0932 \u0926\u093f\u092f\u093e \u0917\u092f\u093e\u0964",

      "correctIndex": 1,
      "explanation": "The highly powerful Goods and Services Tax (GST) Council, a critical constitutional body explicitly responsible for making absolute paramount decisions on GST rates and massive tax exemptions, is permanently and statutorily chaired exclusively by the Union Finance Minister of India. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0935\u0938\u094d\u0924\u0941 \u090f\u0935\u0902 \u0938\u0947\u0935\u093e \u0915\u0930 (GST) \u092a\u0930\u093f\u0937\u0926, \u090f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0938\u0902\u0935\u0948\u0927\u093e\u0928\u093f\u0915 \u0928\u093f\u0915\u093e\u092f \u0939\u0948 \u091c\u094b \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 GST \u0926\u0930\u094b\u0902 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0915\u0930 \u091b\u0942\u091f\u094b\u0902 \u092a\u0930 \u092a\u0942\u0930\u094d\u0923 \u0938\u0930\u094d\u0935\u094b\u091a\u094d\u091a \u0928\u093f\u0930\u094d\u0923\u092f \u0932\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u091c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930 \u0939\u0948, \u0938\u094d\u0925\u093e\u092f\u0940 \u0914\u0930 \u0935\u0948\u0927\u093e\u0928\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u0935\u093f\u0924\u094d\u0924 \u092e\u0902\u0924\u094d\u0930\u0940 \u0926\u094d\u0935\u093e\u0930\u093e \u0905\u0927\u094d\u092f\u0915\u094d\u0937\u0924\u093e \u0915\u0940 \u091c\u093e\u0924\u0940 \u0939\u0948\u0964",

      "options": [

      "correctIndex": 2,
      "explanation": "&quot;Disguised Unemployment&quot; is an incredibly tragic economic phenomenon fundamentally plaguing the Indian Agricultural sector. It occurs strictly when far more people are desperately engaged in a farming activity than are technically required; removing them would absolutely not affect the total massive output, meaning their marginal productivity is exactly zero. / &quot;\u092a\u094d\u0930\u091a\u094d\u091b\u0928\u094d\u0928 \u092c\u0947\u0930\u094b\u091c\u0917\u093e\u0930\u0940&quot; \u090f\u0915 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0926\u0941\u0916\u0926 \u0906\u0930\u094d\u0925\u093f\u0915 \u0918\u091f\u0928\u093e \u0939\u0948 \u091c\u094b \u092e\u094c\u0932\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0924\u0940\u092f \u0915\u0943\u0937\u093f \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u094b \u0924\u094d\u0930\u0938\u094d\u0924 \u0915\u0930 \u0930\u0939\u0940 \u0939\u0948\u0964 \u092f\u0939 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0924\u092c \u0939\u094b\u0924\u093e \u0939\u0948 \u091c\u092c \u0924\u0915\u0928\u0940\u0915\u0940 \u0930\u0942\u092a \u0938\u0947 \u0906\u0935\u0936\u094d\u092f\u0915 \u0932\u094b\u0917\u094b\u0902 \u0915\u0940 \u0924\u0941\u0932\u0928\u093e \u092e\u0947\u0902 \u092c\u0939\u0941\u0924 \u0905\u0927\u093f\u0915 \u0932\u094b\u0917 \u0915\u0943\u0937\u093f \u0917\u0924\u093f\u0935\u093f\u0927\u093f \u092e\u0947\u0902 \u0932\u0917\u0947 \u0939\u094b\u0924\u0947 \u0939\u0948\u0902; \u0909\u0928\u094d\u0939\u0947\u0902 \u0939\u091f\u093e\u0928\u0947 \u0938\u0947 \u0915\u0941\u0932 \u092c\u0921\u093c\u0947 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u092a\u0930 \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u092d\u0940 \u0905\u0938\u0930 \u0928\u0939\u0940\u0902 \u092a\u0921\u093c\u0947\u0917\u093e, \u091c\u093f\u0938\u0915\u093e \u0905\u0930\u094d\u0925 \u0939\u0948 \u0915\u093f \u0909\u0928\u0915\u0940 \u0938\u0940\u092e\u093e\u0       "text": "<b>Q80.</b> The Manmohan Singh Committee (1991) is known for: / \u092e\u0928\u092e\u094b\u0939\u0928 \u0938\u093f\u0902\u0939 \u0938\u092e\u093f\u0924\u093f (1991) \u0907\u0938\u0915\u0947 \u0932\u093f\u090f \u091c\u093e\u0928\u0940 \u091c\u093e\u0924\u0940 \u0939\u0948: [SSC GD 2026]",
      "options": [

        "Banking reforms / \u092c\u0948\u0902\u0915\u093f\u0902\u0917 \u0938\u0941\u0927\u093e\u0930"
      ],
      "correctIndex": 1,
      "explanation": "Operating directly during the catastrophic 1991 crisis, Dr. Manmohan Singh aggressively spearheaded the monumental New Economic Policy. His absolute visionary leadership drove sweeping &quot;Liberalization and structural adjustment&quot; policies, permanently dismantling the rigid License Raj and profoundly opening the stifled Indian economy to fierce global competition. / \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 1991 \u0938\u0902\u0915\u091f \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0938\u0940\u0927\u0947 \u0938\u0902\u091a\u093e\u0932\u0928 \u0915\u0930\u0924\u0947 \u0939\u0941\u090f, \u0921\u0949 \u092e\u0928\u092e\u094b\u0939\u0928 \u0938\u093f\u0902\u0939 \u0928\u0947 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0928\u0908 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f \u0915\u093e \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0915\u093f\u092f\u093e\u0964 \u0909\u0928\u0915\u0947 \u092a\u0942\u0930\u094d\u0923 \u0926\u0942\u0930\u0926\u0930\u094d\u0936\u0940 \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0928\u0947 \u0935\u094d\u092f\u093e\u092a\u0915 &quot;\u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0914\u0930 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0938\u092e\u093e\u092f\u094b\u091c\u0928&quot; \u0928\u0940\u0924\u093f\u092f\u094b\u0902 \u0915\u094b \u092a\u094d\u0930\u0947\u0930\u093f\u0924 \u0915\u093f\u092f\u093e, \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u0915\u0920\u094b\u0930 \u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c \u0915\u094b \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e \u0914\u0930 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0930\u0941\u0915\u0940 \u0939\u0941\u0908 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u092d\u092f\u0902\u0915\u0930 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u092a\u094d\u0930\u0924       "reference": ""

    {
      "text": "<b>Q81.</b> The Life Insurance Corporation of India was nationalized to: / \u0932\u093e\u0907\u092b \u0907\u0902\u0936\u094d\u092f\u094b\u0930\u0947\u0902\u0938 \u0915\u0949\u0930\u094d\u092a\u094b\u0930\u0947\u0936\u0928 \u0911\u092b\u093c \u0907\u0902\u0921\u093f\u092f\u093e \u0915\u093e \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f\u0915\u0930\u0923 \u0907\u0928 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e: [SSC GD 2026]",
      "options": [

        "Promote rural employment / \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0930\u094b\u091c\u093c\u0917\u093e\u0930 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e",
        "Regulate foreign trade / \u0935\u093f\u0926\u0947\u0936\u0940 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0915\u094b \u0935\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 1,
      "explanation": "The sovereign Government of India purposefully and aggressively nationalized the life insurance sector in 1956 to create LIC. The absolute core socialist objective was to powerfully capture and systematically mobilize massive domestic savings from the public to heavily fund gigantic, state-planned national infrastructure and massive development projects. / \u0938\u0902\u092a\u094d\u0930\u092d\u0941 \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 LIC \u092c\u0928\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f 1956 \u092e\u0947\u0902 \u091c\u0940\u0935\u0928 \u092c\u0940\u092e\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f\u092a\u0942\u0930\u094d\u0923 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f\u0915\u0930\u0923 \u0915\u093f\u092f\u093e\u0964 \u092a\u0942\u0930\u094d\u0923 \u092e\u0941\u0916\u094d\u092f \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u0930\u093e\u091c\u094d\u092f-\u0928\u093f\u092f\u094b\u091c\u093f\u0924 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u0947 \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930\u093f\u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u094b \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0924\u094d\u0924\u092a\u094b\u0937\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u091c\u0928\u0924\u093e \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0918\u0930\u0947\u0932\u0942 \u092c\u091a\u0924 \u0915\u094b \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u     {
      "text": "<b>Q82.</b> Which of the following is an example of the Generosity factor in the Happiness Index? / \u0907\u0928\u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928-\u0938\u093e &#x27;\u0939\u0948\u092a\u094d\u092a\u0940\u0928\u0947\u0938 \u0907\u0902\u0921\u0947\u0915\u094d\u0938&#x27; \u092e\u0947\u0902 &#x27;\u0909\u0926\u093e\u0930\u0924\u093e&#x27; (Generosity) \u0915\u093e\u0930\u0915 \u0915\u093e \u0909\u0926\u093e\u0939\u0930\u0923 \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Willingness to donate to charity or help others / \u091a\u0948\u0930\u093f\u091f\u0940 \u092e\u0947\u0902 \u0926\u093e\u0928 \u0915\u0930\u0928\u0947 \u092f\u093e \u0926\u0942\u0938\u0930\u094b\u0902 \u0915\u0940 \u092e\u0926\u0926 \u0915\u0930\u0928\u0947 \u0915\u0940 \u0907\u091a\u094d\u091b\u093e",
        "Government subsidies / \u0938\u0930\u0915\u093e\u0930\u0940 \u0938\u092c\u094d\u0938\u093f\u0921\u0940",
        "Foreign aid / \u0935\u093f\u0926\u0947\u0936\u0940 \u0938\u0939\u093e\u092f\u0924\u093e",
        "National tax rates / \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u091f\u0948\u0915\u094d\u0938 \u0926\u0930\u0947\u0902"
      ],
      "correctIndex": 0,
      "explanation": "In the highly comprehensive World Happiness Report, the crucial variable of &quot;Generosity&quot; is explicitly and strictly measured by tracking citizens&#x27; personal &quot;willingness to donate to charity&quot; or their active readiness to selflessly help strangers, beautifully reflecting the profound socio-cultural strength of a nation. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u094d\u092f\u093e\u092a\u0915 \u0935\u093f\u0936\u094d\u0935 \u0916\u0941\u0936\u0939\u093e\u0932\u0940 \u0930\u093f\u092a\u094b\u0930\u094d\u091f \u092e\u0947\u0902, &quot;\u0909\u0926\u093e\u0930\u0924\u093e&quot; \u0915\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u091a\u0930 \u0915\u094b \u0928\u093e\u0917\u0930\u093f\u0915\u094b\u0902 \u0915\u0940 \u0935\u094d\u092f\u0915\u094d\u0924\u093f\u0917\u0924 &quot;\u0926\u093e\u0928 \u0915\u0930\u0928\u0947 \u0915\u0940 \u0907\u091a\u094d\u091b\u093e&quot; \u092f\u093e \u0905\u091c\u0928\u092c\u093f\u092f\u094b\u0902 \u0915\u0940 \u0928\u093f\u0938\u094d\u0935\u093e\u0930\u094d\u0925 \u092e\u0926\u0926 \u0915\u0930\u0928\u0947 \u0915\u0940 \u0909\u0928\u0915\u0940 \u0938\u0915\u094d\u0930\u093f\u092f \u0924\u0924\u094d\u092a\u0930\u0924\u093e \u092a\u0930 \u0928\u091c\u093c\u0930 \u0930\u0916\u0915\u0930 \u0938\u094d\u092a\u0937\u094d\u091f \u0914\u0930 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u092e\u093e\u092a\u093e \u091c\u093e\u0924\u093e \u0939\u0948, \u091c\u094b \u090f\u0915 \u0930\u093e\u0937\u094d\u091f\u094d\u0930 \u0915\u0940 \u0917\u0939\u0930\u0940 \u0938\u093e\u092e\u093e\u091c\u093f\u0915-\u0938\u093e\u0902\u0938\u094d\u0915\u0943\u0924\u093f\u0915 \u0924\u093e\u0915\u0924 \u0915\u094b \u0916\u0942\u092c\u0938\u0942\u0930\u0924\u0940 \u0938\u0947 \u0926\u0930\u094d\u0936\u093e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""

    {
      "text": "<b>Q83.</b> In the context of money supply in India, ________ refers to buying and selling of bonds issued by the Government of India in the open market. / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092e\u0941\u0926\u094d\u0930\u093e \u0906\u092a\u0942\u0930\u094d\u0924\u093f \u0915\u0947 \u0938\u0902\u0926\u0930\u094d\u092d \u092e\u0947\u0902, ________ \u0915\u093e \u0924\u093e\u0924\u094d\u092a\u0930\u094d\u092f \u0916\u0941\u0932\u0947 \u092c\u093e\u091c\u093c\u093e\u0930 \u092e\u0947\u0902 \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u091c\u093e\u0930\u0940 \u092c\u0949\u0923\u094d\u0921 \u0915\u0940 \u0916\u0930\u0940\u0926-\u092c\u093f\u0915\u094d\u0930\u0940 \u0938\u0947 \u0939\u0948\u0964 [SSC GD 2026]",
      "options": [
        "Margin requirement / \u092e\u093e\u0930\u094d\u091c\u093f\u0928 \u0915\u0940 \u0906\u0935\u0936\u094d\u092f\u0915\u0924\u093e",
        "Evergreening of loans / \u0932\u094b\u0928 \u0915\u0940 \u090f\u0935\u0930\u0917\u094d\u0930\u0940\u0928\u093f\u0902\u0917",
        "Open market operation / \u0913\u092a\u0928 \u092e\u093e\u0930\u094d\u0915\u0947\u091f \u0911\u092a\u0930\u0947\u0936\u0928 (\u0916\u0941\u0932\u0947 \u092c\u093e\u091c\u093e\u0930 \u0915\u093e \u0938\u0902\u091a\u093e\u0932\u0928)",
        "Moral suasion / \u0928\u0948\u0924\u093f\u0915 \u0926\u092c\u093e\u0935"
      ],
      "correctIndex": 2,
      "explanation": "&quot;Open Market Operations&quot; (OMO) is the highly critical, massively powerful quantitative tool utilized aggressively by the RBI. It explicitly involves the direct buying and selling of massive government securities (bonds) in the open market to strictly and instantly control the total physical liquidity (money supply) in the entire economy. / &quot;\u0913\u092a\u0928 \u092e\u093e\u0930\u094d\u0915\u0947\u091f \u0911\u092a\u0930\u0947\u0936\u0902\u0938&quot; (OMO) \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u092e\u093e\u0924\u094d\u0930\u093e\u0924\u094d\u092e\u0915 \u0909\u092a\u0915\u0930\u0923 \u0939\u0948 \u091c\u093f\u0938\u0915\u093e RBI \u0926\u094d\u0935\u093e\u0930\u093e \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964 \u0907\u0938\u092e\u0947\u0902 \u092a\u0942\u0930\u0940 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u092e\u0947\u0902 \u0915\u0941\u0932 \u092d\u094c\u0924\u093f\u0915 \u0924\u0930\u0932\u0924\u093e (\u0927\u0928 \u0906\u092a\u0942\u0930\u094d\u0924\u093f) \u0915\u094b \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u0914\u0930 \u0924\u0941\u0930\u0902\u0924 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0916\u0941\u0932\u0947 \u092c\u093e\u091c\u093e\u0930 \u092e\u0947\u0902 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0938\u0930\u0915\u093e\u0930\u0940 \u092a\u094d\u0930\u0924\u093f\u092d\u0942\u0924\u093f\u092f\u094b\u0902 (\u092c\u093e\u0902\u0921) \u0915\u0940 \u0938\u0940\u0927\u0940 \u0916\u0930\u0940\u0926 \u0914\u0930 \u092c\u093f\u0915\u094d\u0930\u0940 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0964",
      "reference": ""

    {
      "text": "<b>Q84.</b> The \u201cGetting Electricity\u201d indicator in the Ease of Doing Business Index (EODB) measures: / &#x27;\u0908\u091c\u093c \u0911\u092b\u093c \u0921\u0942\u0907\u0902\u0917 \u092c\u093f\u091c\u093c\u0928\u0947\u0938 \u0907\u0902\u0921\u0947\u0915\u094d\u0938&#x27; (EODB) \u092e\u0947\u0902 &#x27;\u092c\u093f\u091c\u0932\u0940 \u0915\u0928\u0947\u0915\u094d\u0936\u0928 \u092e\u093f\u0932\u0928\u093e&#x27; (Getting Electricity) \u0907\u0902\u0921\u093f\u0915\u0947\u091f\u0930 \u092f\u0939 \u092e\u093e\u092a\u0924\u093e \u0939\u0948: [SSC GD 2026]",
      "options": [

        "National power production / \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092c\u093f\u091c\u0932\u0940 \u0909\u0924\u094d\u092a\u093e\u0926\u0928",
        "Energy efficiency / \u090a\u0930\u094d\u091c\u093e \u0926\u0915\u094d\u0937\u0924\u093e",
        "Number of households with power / \u092c\u093f\u091c\u0932\u0940 \u0938\u0941\u0935\u093f\u0927\u093e \u0935\u093e\u0932\u0947 \u0918\u0930\u094b\u0902 \u0915\u0940 \u0938\u0902\u0916\u094d\u092f\u093e"

      "correctIndex": 0,
      "explanation": "In the prestigious World Bank&#x27;s EoDB Index, the specific &quot;Getting Electricity&quot; indicator rigorously evaluates the absolute ease for a new business to connect to the grid. It strictly measures the exact bureaucratic procedures, the massive time delays, and the total financial cost to successfully obtain a permanent commercial electricity connection. / \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 \u0935\u093f\u0936\u094d\u0935 \u092c\u0948\u0902\u0915 \u0915\u0947 \u0908\u0913\u0921\u0940\u092c\u0940 (EoDB) \u0907\u0902\u0921\u0947\u0915\u094d\u0938 \u092e\u0947\u0902, \u0935\u093f\u0936\u093f\u0937\u094d\u091f &quot;\u0917\u0947\u091f\u093f\u0902\u0917 \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u093f\u0938\u093f\u091f\u0940&quot; \u0938\u0902\u0915\u0947\u0924\u0915 \u090f\u0915 \u0928\u090f \u0935\u094d\u092f\u0935\u0938\u093e\u092f \u0915\u0947 \u0932\u093f\u090f \u0917\u094d\u0930\u093f\u0921 \u0938\u0947 \u091c\u0941\u0921\u093c\u0928\u0947 \u0915\u0940 \u092a\u0942\u0930\u094d\u0923 \u0906\u0938\u093e\u0928\u0940 \u0915\u093e \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u092e\u0942\u0932\u094d\u092f\u093e\u0902\u0915\u0928 \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u092f\u0939 \u090f\u0915 \u0938\u094d\u0925\u093e\u092f\u0940 \u0935\u093e\u0923\u093f\u091c\u094d\u092f\u093f\u0915 \u092c\u093f\u091c\u0932\u0940 \u0915\u0928\u0947\u0915\u094d\u0936\u0928 \u0915\u094b \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u091f\u0940\u0915 \u0928\u094c\u0915\u0930\u0936\u093e\u0939\u0940 \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e\u0913\u0902, \u092d\u093e\u0930\u0940 \u0938\u092e\u092f \u0915\u0940 \u0926\u0947\u0930\u0940 \u0914\u0930 \u0915\u0941\u0932 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0932\u093e\u0917\u0924 \u0915\u094b \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u092e\u093e\u092a\u0924\u093e \u0939\u0948\u0964",

      "text": "<b>Q85.</b> Which statement best captures the industrial performance of India during the Third Five Year Plan (1961-66)? / \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1961-66) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u092a\u094d\u0930\u0926\u0930\u094d\u0936\u0928 \u0915\u094b \u0915\u094c\u0928 \u0938\u093e \u0915\u0925\u0928 \u0938\u092c\u0938\u0947 \u0905\u091a\u094d\u091b\u0940 \u0924\u0930\u0939 \u092c\u0924\u093e\u0924\u093e \u0939\u0948? [SSC GD 2026]",

      "correctIndex": 3,
      "explanation": "In the prestigious World Happiness Report, the highly developed Nordic countries (such as Finland, Denmark, and Iceland) consistently and absolutely dominate the supreme top rankings. This is unequivocally attributed to their incredibly robust social welfare systems, immensely high life expectancy, deep social trust, and virtually non-existent corruption. / \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 \u0935\u093f\u0936\u094d\u0935 \u0916\u0941\u0936\u0939\u093e\u0932\u0940 \u0930\u093f\u092a\u094b\u0930\u094d\u091f \u092e\u0947\u0902, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u093f\u0915\u0938\u093f\u0924 \u0928\u0949\u0930\u094d\u0921\u093f\u0915 \u0926\u0947\u0936 (\u091c\u0948\u0938\u0947 \u092b\u093f\u0928\u0932\u0948\u0902\u0921, \u0921\u0947\u0928\u092e\u093e\u0930\u094d\u0915 \u0914\u0930 \u0906\u0907\u0938\u0932\u0948\u0902\u0921) \u0932\u0917\u093e\u0924\u093e\u0930 \u0914\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u0930\u094d\u0935\u094b\u091a\u094d\u091a \u0936\u0940\u0930\u094d\u0937 \u0930\u0948\u0902\u0915\u093f\u0902\u0917 \u092a\u0930 \u0939\u093e\u0935\u0940 \u0939\u0948\u0902\u0964 \u0907\u0938\u0915\u093e \u0938\u094d\u092a\u0937\u094d\u091f \u0936\u094d\u0930\u0947\u092f \u0909\u0928\u0915\u0947 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u092e\u091c\u092c\u0942\u0924 \u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u0915\u0932\u094d\u092f\u093e\u0923 \u092a\u094d\u0930\u0923\u093e\u0932\u093f\u092f\u094b\u0902, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0909\u091a\u094d\u091a \u091c\u0940\u0935\u0928 \u092a\u094d\u0930\u0924\u094d\u092f\u093e\u0936\u093e, \u0917\u0939\u0930\u0947 \u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u0935\u093f\u0936\u094d\u0935\u093e\u0938 \u0914\u0930 \u0935\u0938\u094d\u0924\u0941\u0924\u0903 \u0917\u0948\u0930-\u092e\u094c\u091c\u0942\u0926 \u092d\u094d\u0930\u0937\u094d\u091f\u093e\u091a\u093e\u093       "text": "<b>Q90.</b> Which of the following most accurately reflects the fundamental orientation of public sector industries in India? / \u0907\u0928\u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928-\u0938\u093e \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u092e\u0942\u0932 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u094b \u0938\u092c\u0938\u0947 \u0938\u0939\u0940 \u0922\u0902\u0917 \u0938\u0947 \u0926\u0930\u094d\u0936\u093e\u0924\u093e \u0939\u0948? [SSC GD 2026]",

      ],
      "correctIndex": 1,
      "explanation": "Unlike aggressive private enterprises entirely driven by ruthless profit maximization, India&#x27;s colossal Public Sector Undertakings (PSUs) were historically established with a deeply profound socialist orientation. Their absolute primary mandate is to vigorously prioritize wider socio-economic objectives, heavily focusing on mass employment generation, balanced regional development, and building foundational infrastructure. / \u0928\u093f\u0930\u094d\u092e\u092e \u0932\u093e\u092d \u0905\u0927\u093f\u0915\u0924\u092e\u0915\u0930\u0923 \u0938\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0902\u091a\u093e\u0932\u093f\u0924 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0928\u093f\u091c\u0940 \u0909\u0926\u094d\u092f\u092e\u094b\u0902 \u0915\u0947 \u0935\u093f\u092a\u0930\u0940\u0924, \u092d\u093e\u0930\u0924 \u0915\u0947 \u0935\u093f\u0936\u093e\u0932 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u092a\u0915\u094d\u0930\u092e\u094b\u0902 (PSU) \u0915\u094b \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0917\u0939\u0928 \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0905\u092d\u093f\u0935\u093f\u0928\u094d\u092f\u093e\u0938 \u0915\u0947 \u0938\u093e\u0925 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0909\u0928\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u091c\u0928\u093e\u0926\u0947\u0936 \u0935\u094d\u092f\u093e\u092a\u0915 \u0938\u093e\u092e\u093e\u091c\u093f\u0915-\u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f\u094b\u0902 \u0915\u094b \u091c\u094b\u0930\u0926\u093e\u0930 \u0922\u0902\u0917 \u0938\u0947 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0947\u0928\u093e \u0939\u0948, \u091c\u094b \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u094       ],
      "correctIndex": 0,
      "explanation": "In the World Bank&#x27;s highly stringent Ease of Doing Business framework, the crucial &quot;Resolving Insolvency&quot; indicator explicitly and meticulously evaluates the absolute efficiency of a nation&#x27;s bankruptcy laws. It strictly measures the exact agonizing time, the severe financial cost, and the ultimate recovery rate (cents on the dollar) for secured creditors when a domestic business collapses. / \u0935\u093f\u0936\u094d\u0935 \u092c\u0948\u0902\u0915 \u0915\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u0916\u094d\u0924 &#x27;\u0908\u091c\u093c \u0911\u092b\u093c \u0921\u0942\u0907\u0902\u0917 \u092c\u093f\u091c\u093c\u0928\u0947\u0938&#x27; \u0922\u093e\u0902\u091a\u0947 \u092e\u0947\u0902, \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 &quot;\u0926\u093f\u0935\u093e\u0932\u093f\u092f\u093e\u092a\u0928 \u0938\u092e\u093e\u0927\u093e\u0928&quot; (Resolving Insolvency) \u0938\u0902\u0915\u0947\u0924\u0915 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0938\u093e\u0935\u0927\u093e\u0928\u0940\u092a\u0942\u0930\u094d\u0935\u0915 \u0915\u093f\u0938\u0940 \u0930\u093e\u0937\u094d\u091f\u094d\u0930 \u0915\u0947 \u0926\u093f\u0935\u093e\u0932\u093f\u092f\u093e\u092a\u0928 \u0915\u093e\u0928\u0942\u0928\u094b\u0902 \u0915\u0940 \u092a\u0942\u0930\u094d\u0923 \u0926\u0915\u094d\u0937\u0924\u093e \u0915\u093e \u092e\u0942\u0932\u094d\u092f\u093e\u0902\u0915\u0928 \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u092f\u0939 \u090f\u0915 \u0918\u0930\u0947\u0932\u0942 \u0935\u094d\u092f\u0935\u0938\u093e\u092f \u0915\u0947 \u0922\u0939\u0928\u0947 \u092a\u0930 \u0938\u0941\u0930\u0915\u094d\u0937\u093f\u0924 \u0932\u0947\u0928\u0926\u093e\u0930\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0938\u091f\u0940\u0915 \u0915\u0937\u094d\u091f\u0926\u093e\u092f\u0915 \u0938\u092e\u092f, \u0917\u0902\u092d\u0940\u0930 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0932\u093e\u0917\u0924 \u0914       "correctIndex": 2,
      "explanation": "The sweeping 1991 Liberalization and Globalization reforms spectacularly unleashed the immense potential of the Indian industry. By dismantling archaic barriers, it fiercely provided domestic firms with unprecedented, massive access to incredibly advanced global technology and deeply integrated them into vastly larger international consumer markets, forcing them to become globally competitive. / 1991 \u0915\u0947 \u0935\u094d\u092f\u093e\u092a\u0915 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0914\u0930 \u0935\u0948\u0936\u094d\u0935\u0940\u0915\u0930\u0923 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0928\u0947 \u0936\u093e\u0928\u0926\u093e\u0930 \u0922\u0902\u0917 \u0938\u0947 \u092d\u093e\u0930\u0924\u0940\u092f \u0909\u0926\u094d\u092f\u094b\u0917 \u0915\u0940 \u0905\u092a\u093e\u0930 \u0915\u094d\u0937\u092e\u0924\u093e \u0915\u094b \u0909\u091c\u093e\u0917\u0930 \u0915\u093f\u092f\u093e\u0964 \u092a\u0941\u0930\u093e\u0928\u0940 \u092c\u093e\u0927\u093e\u0913\u0902 \u0915\u094b \u0916\u0924\u094d\u092e \u0915\u0930\u0915\u0947, \u0907\u0938\u0928\u0947 \u0918\u0930\u0947\u0932\u0942 \u092b\u0930\u094d\u092e\u094b\u0902 \u0915\u094b \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0909\u0928\u094d\u0928\u0924 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940 \u0924\u0915 \u0905\u092d\u0942\u0924\u092a\u0942\u0930\u094d\u0935, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u0939\u0941\u0902\u091a \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0940 \u0914\u0930 \u0909\u0928\u094d\u0939\u0947\u0902 \u092c\u0921\u093c\u0947 \u0905\u0902\u0924\u0930\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u092c\u093e\u091c\u093e\u0930\u094b\u0902 \u092e\u0947\u0902 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u090f\u0915\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e, \u091c\u093f\u0938\u0938\u0947 \u0909\u0928\u094d\u0939\u0947\u0902 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u0940 \u092c\u0928\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092e\u091c\u092c\u0942\u0930 \u0939\u094b\u0928\u093e \u092a\u0921\u093c\u093e\u0964",

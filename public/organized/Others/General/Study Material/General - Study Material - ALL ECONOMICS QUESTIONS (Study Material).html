      ],
      "correctIndex": 3,
      "explanation": "According strictly to the official Indian Census classifications, a &quot;Main Worker&quot; is precisely defined as an individual who has been economically active and employed for a major part of the year, explicitly meaning at least 183 days (or 6 months). / \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u092d\u093e\u0930\u0924\u0940\u092f \u091c\u0928\u0917\u0923\u0928\u093e \u0935\u0930\u094d\u0917\u0940\u0915\u0930\u0923 \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930, \u090f\u0915 &quot;\u092e\u0941\u0916\u094d\u092f \u0915\u093e\u092e\u0917\u093e\u0930&quot; \u0915\u094b \u0938\u091f\u0940\u0915 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u0910\u0938\u0947 \u0935\u094d\u092f\u0915\u094d\u0924\u093f \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092a\u0930\u093f\u092d\u093e\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948 \u091c\u094b \u0935\u0930\u094d\u0937 \u0915\u0947 \u090f\u0915 \u092c\u0921\u093c\u0947 \u0939\u093f\u0938\u094d\u0938\u0947 \u0915\u0947 \u0932\u093f\u090f \u0906\u0930\u094d\u0925\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u0915\u094d\u0930\u093f\u092f \u0914\u0930 \u0928\u093f\u092f\u094b\u091c\u093f\u0924 \u0930\u0939\u093e \u0939\u0948, \u091c\u093f\u0938\u0915\u093e \u0938\u094d\u092a\u0937\u094d\u091f \u0905\u0930\u094d\u0925 \u0915\u092e \u0938\u0947 \u0915\u092e 183 \u0926\u093f\u0928 (\u092f\u093e 6 \u092e\u0939\u0940\u0928\u0947) \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q42.</b> India\u2019s 1991 external sector reforms included a move towards trade liberalization. Which measure best exemplifies this policy shift? / \u092d\u093e\u0930\u0924 \u0915\u0947 1991 \u0915\u0947 \u092c\u093e\u0939\u0930\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u092e\u0947\u0902 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923 \u0915\u0940 \u0926\u093f\u0936\u093e \u092e\u0947\u0902 \u0915\u0926\u092e \u0909\u0920\u093e\u0928\u093e \u0936\u093e\u092e\u093f\u0932 \u0925\u093e\u0964 \u0915\u094c\u0928 \u0938\u093e \u0909\u092a\u093e\u092f \u0907\u0938 \u0928\u0940\u0924\u093f\u0917\u0924 \u092c\u0926\u0932\u093e\u0935 \u0915\u093e \u0938\u092c\u0938\u0947 \u0905\u091a\u094d\u091b\u093e \u0909\u0926\u093e\u0939\u0930\u0923 \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Fixing export quotas to control foreign exchange reserves. / \u0935\u093f\u0926\u0947\u0936\u0940 \u092e\u0941\u0926\u094d\u0930\u093e \u092d\u0902\u0921\u093e\u0930 \u0915\u094b \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b\u091f\u093e \u0924\u092f \u0915\u0930\u0928\u093e\u0964",
        "Increasing quantitative restrictions on imports / \u0906\u092f\u093e\u0924 \u092a\u0930 \u092e\u093e\u0924\u094d\u0930\u093e\u0924\u094d\u092e\u0915 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927 \u092c\u0922\u093c\u093e\u0928\u093e",
        "Imposing higher tariffs to protect domestic industries / \u0918\u0930\u0947\u0932\u0942 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0940 \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u0915\u0947 \u0932\u093f\u090f \u090a\u0902\u091a\u0947 \u091f\u0948\u0930\u093f\u092b \u0932\u0917\u093e\u0928\u093e",
        "Abolishing the import licensing system for most goods / \u091c\u093c\u094d\u092f\u093e\u0926\u093e\u0924\u093e\u0930 \u0938\u093e\u092e\u093e\u0928\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0906\u092f\u093e\u0924 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0915\u094b \u0916\u0924\u094d\u092e \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "The radical 1991 external sector reforms forcefully shattered the &quot;License Raj.&quot; To seamlessly integrate India into the global economy, the government aggressively abolished the highly restrictive import licensing system and quantitative restrictions for most commodities. / \u0915\u091f\u094d\u091f\u0930\u092a\u0902\u0925\u0940 1991 \u0915\u0947 \u092c\u093e\u0939\u0930\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0928\u0947 &quot;\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c&quot; \u0915\u094b \u092c\u0932\u092a\u0942\u0930\u094d\u0935\u0915 \u091a\u0915\u0928\u093e\u091a\u0942\u0930 \u0915\u0930 \u0926\u093f\u092f\u093e\u0964 \u092d\u093e\u0930\u0924 \u0915\u094b \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u092e\u0947\u0902 \u092e\u0942\u0932 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915\u0940\u0915\u0943\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f, \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0905\u0927\u093f\u0915\u093e\u0902\u0936 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0947 \u0932\u093f\u090f \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093e\u0924\u094d\u092e\u0915 \u0906\u092f\u093e\u0924 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0914\u0930 \u092e\u093e\u0924\u094d\u0930\u093e\u0924\u094d\u092e\u0915 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u094b\u0902 \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q43.</b> The National Multidimensional Poverty Index (MPI) in India, released by which of the following? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092c\u0939\u0941\u0906\u092f\u093e\u092e\u0940 \u0917\u0930\u0940\u092c\u0940 \u0938\u0942\u091a\u0915\u093e\u0902\u0915 (MPI) \u0915\u093f\u0938\u0915\u0947 \u0926\u094d\u0935\u093e\u0930\u093e \u091c\u093e\u0930\u0940 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948? [SSC GD 2026]",
      "options": [
        "IIB / IIB",
        "NHRC / NHRC",
        "IDSA / IDSA",
        "NITI Aayog / \u0928\u0940\u0924\u093f \u0906\u092f\u094b\u0917"
      ],
      "correctIndex": 3,
      "explanation": "Acting as the supreme national policy think tank, NITI Aayog is officially responsible for precisely compiling and aggressively releasing the highly comprehensive National Multidimensional Poverty Index (MPI), closely tracking exact deprivations across health, education, and living standards. / \u0938\u0930\u094d\u0935\u094b\u091a\u094d\u091a \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0928\u0940\u0924\u093f \u0925\u093f\u0902\u0915 \u091f\u0948\u0902\u0915 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u0947 \u0939\u0941\u090f, \u0928\u0940\u0924\u093f \u0906\u092f\u094b\u0917 \u0938\u094d\u0935\u093e\u0938\u094d\u0925\u094d\u092f, \u0936\u093f\u0915\u094d\u0937\u093e \u0914\u0930 \u091c\u0940\u0935\u0928 \u0938\u094d\u0924\u0930 \u092e\u0947\u0902 \u0938\u091f\u0940\u0915 \u0905\u092d\u093e\u0935\u094b\u0902 \u0915\u094b \u0915\u0930\u0940\u092c \u0938\u0947 \u091f\u094d\u0930\u0948\u0915 \u0915\u0930\u0924\u0947 \u0939\u0941\u090f, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092c\u0939\u0941\u0906\u092f\u093e\u092e\u0940 \u0917\u0930\u0940\u092c\u0940 \u0938\u0942\u091a\u0915\u093e\u0902\u0915 (MPI) \u0915\u094b \u0938\u091f\u0940\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u0915\u0932\u093f\u0924 \u0915\u0930\u0928\u0947 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u091c\u093e\u0930\u0940 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u091c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q44.</b> \u201cStagflation\u201d is a situation of: / \u201c\u0938\u094d\u091f\u0948\u0917\u092b\u094d\u0932\u0947\u0936\u0928\u201d (Stagflation) \u0910\u0938\u0940 \u0938\u094d\u0925\u093f\u0924\u093f \u0939\u0948 \u091c\u093f\u0938\u092e\u0947\u0902: [SSC GD 2026]",
      "options": [
        "Inflation + Trade surplus / \u092e\u0939\u0902\u0917\u093e\u0908 + \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0905\u0927\u093f\u0936\u0947\u0937",
        "inflation + Growth in employment / \u092e\u0939\u0902\u0917\u093e\u0908 + \u0930\u094b\u091c\u093c\u0917\u093e\u0930 \u092e\u0947\u0902 \u0935\u0943\u0926\u094d\u0927\u093f",
        "Inflation + Rising Gross Domestic Product / \u092e\u0939\u0902\u0917\u093e\u0908 + \u092c\u0922\u093c\u0924\u093e \u0938\u0915\u0932 \u0918\u0930\u0947\u0932\u0942 \u0909\u0924\u094d\u092a\u093e\u0926 (GDP)",
        "Inflation + Unemployment / \u092e\u0939\u0902\u0917\u093e\u0908 + \u092c\u0947\u0930\u094b\u095b\u0917\u093e\u0930\u0940"
      ],
      "correctIndex": 3,
      "explanation": "&#x27;Stagflation&#x27; represents a highly toxic, extremely difficult macroeconomic paradox where a nation tragically suffers from severe, runaway inflation occurring simultaneously with stagnant economic growth and persistently massive unemployment rates. / &#x27;\u0938\u094d\u091f\u0948\u0917\u092b\u094d\u0932\u0947\u0936\u0928&#x27; \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u093f\u0937\u093e\u0915\u094d\u0924, \u0905\u0924\u094d\u092f\u0902\u0924 \u0915\u0920\u093f\u0928 \u0938\u092e\u0937\u094d\u091f\u093f-\u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0930\u094b\u0927\u093e\u092d\u093e\u0938 \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u0930\u0924\u093e \u0939\u0948 \u091c\u0939\u093e\u0901 \u090f\u0915 \u0930\u093e\u0937\u094d\u091f\u094d\u0930 \u0926\u0941\u0916\u0926 \u0930\u0942\u092a \u0938\u0947 \u0938\u094d\u0925\u093f\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0914\u0930 \u0932\u0917\u093e\u0924\u093e\u0930 \u092d\u093e\u0930\u0940 \u092c\u0947\u0930\u094b\u091c\u0917\u093e\u0930\u0940 \u0926\u0930 \u0915\u0947 \u0938\u093e\u0925-\u0938\u093e\u0925 \u0939\u094b\u0928\u0947 \u0935\u093e\u0932\u0940 \u0917\u0902\u092d\u0940\u0930, \u092d\u0917\u094b\u0921\u093c\u093e \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f \u0938\u0947 \u0917\u094d\u0930\u0938\u094d\u0924 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q45.</b> Which trend shows that the 1991 reforms led to \u201cgrowth with inequality\u201d? / \u0915\u094c\u0928 \u0938\u093e \u091f\u094d\u0930\u0947\u0902\u0921 \u092f\u0939 \u0926\u093f\u0916\u093e\u0924\u093e \u0939\u0948 \u0915\u093f 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0915\u093e\u0930\u0923 &quot;\u0905\u0938\u092e\u093e\u0928\u0924\u093e \u0915\u0947 \u0938\u093e\u0925 \u0935\u093f\u0915\u093e\u0938&quot; \u0939\u0941\u0906? [SSC GD 2026]",
      "options": [
        "Agricultural employment grew faster than industrial employment / \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0930\u094b\u091c\u093c\u0917\u093e\u0930 \u0915\u0940 \u0924\u0941\u0932\u0928\u093e \u092e\u0947\u0902 \u0915\u0943\u0937\u093f \u0930\u094b\u091c\u093c\u0917\u093e\u0930 \u0924\u0947\u091c\u093c\u0940 \u0938\u0947 \u092c\u0922\u093c\u093e",
        "The informal sector shrank significantly / \u0905\u0928\u094c\u092a\u091a\u093e\u0930\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u093e\u092b\u0940 \u0938\u093f\u0915\u0941\u0921\u093c \u0917\u092f\u093e",
        "Rural poverty declined faster than urban poverty / \u0936\u0939\u0930\u0940 \u0917\u0930\u0940\u092c\u0940 \u0915\u0940 \u0924\u0941\u0932\u0928\u093e \u092e\u0947\u0902 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0917\u0930\u0940\u092c\u0940 \u0924\u0947\u091c\u093c\u0940 \u0938\u0947 \u0918\u091f\u0940",
        "urban service sector expanded rapidly while agriculture stagnated / \u0936\u0939\u0930\u0940 \u0938\u0947\u0935\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0924\u0947\u091c\u093c\u0940 \u0938\u0947 \u092c\u0922\u093c\u093e \u091c\u092c\u0915\u093f \u0915\u0943\u0937\u093f \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u092e\u0947\u0902 \u0920\u0939\u0930\u093e\u0935 \u0906 \u0917\u092f\u093e"
      ],
      "correctIndex": 3,
      "explanation": "While the 1991 LPG reforms successfully skyrocketed India&#x27;s overall GDP, they created stark inequality. The highly skilled urban service sector (like IT) exploded aggressively, while the vast, labor-intensive rural agricultural sector was tragically neglected and completely stagnated. / \u091c\u092c\u0915\u093f 1991 \u0915\u0947 \u090f\u0932\u092a\u0940\u091c\u0940 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0938\u092e\u0917\u094d\u0930 \u0938\u0915\u0932 \u0918\u0930\u0947\u0932\u0942 \u0909\u0924\u094d\u092a\u093e\u0926 \u0915\u094b \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u0906\u0938\u092e\u093e\u0928 \u092a\u0930 \u092a\u0939\u0941\u0902\u091a\u093e \u0926\u093f\u092f\u093e, \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u090f\u0915 \u092c\u0921\u093c\u0940 \u0905\u0938\u092e\u093e\u0928\u0924\u093e \u092a\u0948\u0926\u093e \u0915\u0930 \u0926\u0940\u0964 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u0941\u0936\u0932 \u0936\u0939\u0930\u0940 \u0938\u0947\u0935\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930 (\u091c\u0948\u0938\u0947 IT) \u092e\u0947\u0902 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0938\u094d\u092b\u094b\u091f \u0939\u0941\u0906, \u091c\u092c\u0915\u093f \u0935\u093f\u0936\u093e\u0932, \u0936\u094d\u0930\u092e-\u0917\u0939\u0928 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0915\u0943\u0937\u093f \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u094b \u0926\u0941\u0916\u0926 \u0930\u0942\u092a \u0938\u0947 \u0909\u092a\u0947\u0915\u094d\u0937\u093f\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0914\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u094d\u0925\u093f\u0930 \u0939\u094b \u0917\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q46.</b> FDI (Foreign Direct Investment) limits were liberalized in India in: / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 FDI (\u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936) \u0915\u0940 \u0938\u0940\u092e\u093e\u0913\u0902 \u0915\u094b \u0915\u092c \u0909\u0926\u093e\u0930 \u092c\u0928\u093e\u092f\u093e \u0917\u092f\u093e? [SSC GD 2026]",
      "options": [
        "2000 / 2000",
        "1995 / 1995",
        "2010 / 2010",
        "1991 / 1991"
      ],
      "correctIndex": 3,
      "explanation": "Under the watershed New Economic Policy initiated aggressively in 1991, India systematically opened its closed doors to global capital. The government heavily liberalized rigid FDI limits, officially permitting automatic approval for vast foreign investments up to 51% in high-priority industries. / 1991 \u092e\u0947\u0902 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0928\u0908 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f \u0915\u0947 \u0924\u0939\u0924, \u092d\u093e\u0930\u0924 \u0928\u0947 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u092a\u0942\u0902\u091c\u0940 \u0915\u0947 \u0932\u093f\u090f \u0905\u092a\u0928\u0947 \u092c\u0902\u0926 \u0926\u0930\u0935\u093e\u091c\u0947 \u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0916\u094b\u0932\u0947\u0964 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0915\u0920\u094b\u0930 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 (FDI) \u0938\u0940\u092e\u093e\u0913\u0902 \u0915\u094b \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0909\u0926\u093e\u0930 \u092c\u0928\u093e\u092f\u093e, \u091c\u093f\u0938\u0938\u0947 \u0909\u091a\u094d\u091a-\u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0935\u093e\u0932\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u092e\u0947\u0902 51% \u0924\u0915 \u0915\u0947 \u0935\u093f\u0936\u093e\u0932 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u0947 \u0932\u093f\u090f \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0938\u094d\u0935\u091a\u093e\u0932\u093f\u0924 \u0905\u0928\u0941\u092e\u094b\u0926\u0928 \u0915\u0940 \u0905\u0928\u0941\u092e\u0924\u093f \u092e\u093f\u0932 \u0917\u0908\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q47.</b> Which structural constraint continues to be the most critical factor limiting agricultural productivity in India? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0915\u0943\u0937\u093f \u0909\u0924\u094d\u092a\u093e\u0926\u0915\u0924\u093e \u0915\u094b \u0938\u0940\u092e\u093f\u0924 \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u093e \u0915\u094c\u0928-\u0938\u093e \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0915\u093e\u0930\u0915 \u0938\u092c\u0938\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092c\u0928\u093e \u0939\u0941\u0906 \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Chronic shortage of agricultural labor / \u0915\u0943\u0937\u093f \u0936\u094d\u0930\u092e\u093f\u0915\u094b\u0902 \u0915\u0940 \u092d\u093e\u0930\u0940 \u0915\u092e\u0940",
        "Inadequacy of fertile soils across major regions / \u092a\u094d\u0930\u092e\u0941\u0916 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u092e\u0947\u0902 \u0909\u092a\u091c\u093e\u090a \u092e\u093f\u091f\u094d\u091f\u0940 \u0915\u0940 \u0915\u092e\u0940",
        "Weakness of domestic market linkages / \u0918\u0930\u0947\u0932\u0942 \u092c\u093e\u091c\u093c\u093e\u0930 \u0938\u0902\u092a\u0930\u094d\u0915\u094b\u0902 \u0915\u0940 \u0915\u092e\u091c\u093c\u094b\u0930\u0940",
        "High dependence on monsoonal variability / \u092e\u093e\u0928\u0938\u0942\u0928 \u0915\u0940 \u0905\u0928\u093f\u0936\u094d\u091a\u093f\u0924\u0924\u093e \u092a\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e"
      ],
      "correctIndex": 3,
      "explanation": "Despite significant modern advancements, over half of India&#x27;s massive agricultural land tragically lacks basic irrigation infrastructure. Consequently, Indian farming&#x27;s absolute productivity remains critically and dangerously tethered directly to the highly erratic and deeply unpredictable seasonal monsoon rainfall. / \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0906\u0927\u0941\u0928\u093f\u0915 \u092a\u094d\u0930\u0917\u0924\u093f \u0915\u0947 \u092c\u093e\u0935\u091c\u0942\u0926, \u092d\u093e\u0930\u0924 \u0915\u0940 \u0906\u0927\u0940 \u0938\u0947 \u0905\u0927\u093f\u0915 \u0915\u0943\u0937\u093f \u092d\u0942\u092e\u093f \u092e\u0947\u0902 \u0926\u0941\u0916\u0926 \u0930\u0942\u092a \u0938\u0947 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0938\u093f\u0902\u091a\u093e\u0908 \u0922\u093e\u0902\u091a\u0947 \u0915\u093e \u0905\u092d\u093e\u0935 \u0939\u0948\u0964 \u0928\u0924\u0940\u091c\u0924\u0928, \u092d\u093e\u0930\u0924\u0940\u092f \u0916\u0947\u0924\u0940 \u0915\u0940 \u092a\u0942\u0930\u094d\u0923 \u0909\u0924\u094d\u092a\u093e\u0926\u0915\u0924\u093e \u0917\u0902\u092d\u0940\u0930 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0916\u0924\u0930\u0928\u093e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0905\u0928\u093f\u092f\u092e\u093f\u0924 \u0914\u0930 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u0905\u092a\u094d\u0930\u0924\u094d\u092f\u093e\u0936\u093f\u0924 \u092e\u094c\u0938\u092e\u0940 \u092e\u093e\u0928\u0938\u0942\u0928\u0940 \u0935\u0930\u094d\u0937\u093e \u0938\u0947 \u091c\u0941\u0921\u093c\u0940 \u0939\u0941\u0908 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q48.</b> Fiscal Responsibility and Budget Management (FRBM) Act primarily aims to: / \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0909\u0924\u094d\u0924\u0930\u0926\u093e\u092f\u093f\u0924\u094d\u0935 \u0914\u0930 \u092c\u091c\u091f \u092a\u094d\u0930\u092c\u0902\u0927\u0928 (FRBM) \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0939\u0948: [SSC GD 2026]",
      "options": [
        "Manage exports / \u090f\u0915\u094d\u0938\u092a\u094b\u0930\u094d\u091f \u0915\u094b \u092e\u0948\u0928\u0947\u091c \u0915\u0930\u0928\u093e",
        "Control money supply / \u092e\u0928\u0940 \u0938\u092a\u094d\u0932\u093e\u0908 \u0915\u094b \u0915\u0902\u091f\u094d\u0930\u094b\u0932 \u0915\u0930\u0928\u093e",
        "Promote cooperative banking / \u0915\u094b-\u0911\u092a\u0930\u0947\u091f\u093f\u0935 \u092c\u0948\u0902\u0915\u093f\u0902\u0917 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e",
        "Reduce fiscal deficit / \u092b\u093f\u0938\u094d\u0915\u0932 \u0921\u0947\u092b\u093f\u0938\u093f\u091f \u0915\u094b \u0915\u092e \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "Enacted powerfully in 2003, the FRBM Act strictly institutionalized rigid financial discipline upon the government. Its absolute primary, legally mandated goal is to systematically and aggressively reduce the soaring national Fiscal Deficit to highly sustainable, manageable levels. / 2003 \u092e\u0947\u0902 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0930\u0942\u092a \u0938\u0947 \u0905\u0927\u093f\u0928\u093f\u092f\u092e\u093f\u0924, FRBM \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0928\u0947 \u0938\u0930\u0915\u093e\u0930 \u092a\u0930 \u0915\u0920\u094b\u0930 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0905\u0928\u0941\u0936\u093e\u0938\u0928 \u0915\u094b \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u0938\u0902\u0938\u094d\u0925\u093e\u0917\u0924 \u0930\u0942\u092a \u0926\u093f\u092f\u093e\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915, \u0915\u093e\u0928\u0942\u0928\u0940 \u0930\u0942\u092a \u0938\u0947 \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0932\u0915\u094d\u0937\u094d\u092f \u092c\u0922\u093c\u0924\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0918\u093e\u091f\u0947 \u0915\u094b \u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093f\u0924 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u091f\u093f\u0915\u093e\u090a, \u092a\u094d\u0930\u092c\u0902\u0927\u0928\u0940\u092f \u0938\u094d\u0924\u0930 \u0924\u0915 \u0915\u092e \u0915\u0930\u0928\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q49.</b> National income measured at constant prices is called: / \u0938\u094d\u0925\u093f\u0930 \u0915\u0940\u092e\u0924\u094b\u0902 \u092a\u0930 \u092e\u093e\u092a\u0940 \u0917\u0908 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0906\u092f \u0915\u094b \u0915\u094d\u092f\u093e \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Net factor income / \u0936\u0941\u0926\u094d\u0927 \u0915\u093e\u0930\u0915 \u0906\u092f",
        "Nominal income / \u0928\u093e\u092e\u092e\u093e\u0924\u094d\u0930 \u0906\u092f",
        "Disposable income / \u0916\u0930\u094d\u091a-\u092f\u094b\u0917\u094d\u092f \u0906\u092f",
        "Real income / \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u0906\u092f"
      ],
      "correctIndex": 3,
      "explanation": "By completely stripping away the highly distorting impacts of inflation, calculating National Income directly at &quot;constant base-year prices&quot; perfectly reveals the true, absolute volume of economic production, officially termed as &quot;Real Income&quot; or Real GDP. / \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f \u0915\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u093f\u0915\u0943\u0924 \u092a\u094d\u0930\u092d\u093e\u0935\u094b\u0902 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0926\u0942\u0930 \u0915\u0930\u0915\u0947, \u0938\u0940\u0927\u0947 &quot;\u0938\u094d\u0925\u093f\u0930 \u0906\u0927\u093e\u0930-\u0935\u0930\u094d\u0937 \u0915\u0940 \u0915\u0940\u092e\u0924\u094b\u0902&quot; \u092a\u0930 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0906\u092f \u0915\u0940 \u0917\u0923\u0928\u093e \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0940 \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915, \u092a\u0942\u0930\u094d\u0923 \u092e\u093e\u0924\u094d\u0930\u093e \u0915\u094b \u092a\u094d\u0930\u0915\u091f \u0915\u0930\u0924\u0940 \u0939\u0948, \u091c\u093f\u0938\u0947 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 &quot;\u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u0906\u092f&quot; \u092f\u093e \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u091c\u0940\u0921\u0940\u092a\u0940 \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q50.</b> Which type of unemployment is due to technological progress? / \u0924\u0915\u0928\u0940\u0915\u0940 \u092a\u094d\u0930\u0917\u0924\u093f \u0915\u0947 \u0915\u093e\u0930\u0923 \u0915\u093f\u0938 \u092a\u094d\u0930\u0915\u093e\u0930 \u0915\u0940 \u092c\u0947\u0930\u094b\u091c\u0917\u093e\u0930\u0940 \u0939\u094b\u0924\u0940 \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Seasonal / \u092e\u094c\u0938\u092e\u0940",
        "Disguised / \u091b\u093f\u092a\u0940 \u0939\u0941\u0908",
        "Frictional / \u0918\u0930\u094d\u0937\u0923\u093e\u0924\u094d\u092e\u0915",
        "Structural / \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915"
      ],
      "correctIndex": 3,
      "explanation": "When highly advanced technological progress (like Automation or AI) brutally renders older, manual skills completely obsolete, it aggressively causes massive &quot;Structural Unemployment.&quot; The entire economic structure shifts, permanently leaving unskilled workers structurally jobless without extensive retraining. / \u091c\u092c \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0909\u0928\u094d\u0928\u0924 \u0924\u0915\u0928\u0940\u0915\u0940 \u092a\u094d\u0930\u0917\u0924\u093f (\u091c\u0948\u0938\u0947 \u0938\u094d\u0935\u091a\u093e\u0932\u0928 \u092f\u093e \u090f\u0906\u0908) \u092a\u0941\u0930\u093e\u0928\u0947, \u0936\u093e\u0930\u0940\u0930\u093f\u0915 \u0915\u094c\u0936\u0932 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0905\u092a\u094d\u0930\u091a\u0932\u093f\u0924 \u092c\u0928\u093e \u0926\u0947\u0924\u0940 \u0939\u0948, \u0924\u094b \u092f\u0939 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 &quot;\u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u092c\u0947\u0930\u094b\u091c\u0917\u093e\u0930\u0940&quot; \u0915\u093e \u0915\u093e\u0930\u0923 \u092c\u0928\u0924\u0940 \u0939\u0948\u0964 \u0938\u0902\u092a\u0942\u0930\u094d\u0923 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0902\u0930\u091a\u0928\u093e \u092c\u0926\u0932 \u091c\u093e\u0924\u0940 \u0939\u0948, \u091c\u093f\u0938\u0938\u0947 \u0905\u0915\u0941\u0936\u0932 \u0936\u094d\u0930\u092e\u093f\u0915 \u0935\u094d\u092f\u093e\u092a\u0915 \u092a\u0941\u0928\u0930\u094d\u092a\u094d\u0930\u0936\u093f\u0915\u094d\u0937\u0923 \u0915\u0947 \u092c\u093f\u0928\u093e \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0947\u0930\u094b\u091c\u0917\u093e\u0930 \u0939\u094b \u091c\u093e\u0924\u0947 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q51.</b> Which Five-Year Plan is referred to as the \u201cGadgil Plan\u201d? / \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u094b &quot;\u0917\u093e\u0921\u0917\u093f\u0932 \u092f\u094b\u091c\u0928\u093e&quot; \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Fourth Plan / \u091a\u094c\u0925\u0940 \u092f\u094b\u091c\u0928\u093e",
        "First Plan / \u092a\u0939\u0932\u0940 \u092f\u094b\u091c\u0928\u093e",
        "second Plan / \u0926\u0942\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Third Plan / \u0924\u0940\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "The highly ambitious Third Five-Year Plan (1961-1966) is historically and famously referred to directly as the &quot;Gadgil Yojana,&quot; named honorably after D.R. Gadgil, the then Deputy Chairman of the powerful Planning Commission who heavily shaped its core strategies. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1961-1966) \u0915\u094b \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0914\u0930 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0930\u0942\u092a \u0938\u0947 \u0938\u0940\u0927\u0947 &quot;\u0917\u093e\u0921\u0917\u093f\u0932 \u092f\u094b\u091c\u0928\u093e&quot; \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948, \u091c\u093f\u0938\u0915\u093e \u0928\u093e\u092e \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0947 \u0924\u0924\u094d\u0915\u093e\u0932\u0940\u0928 \u0909\u092a\u093e\u0927\u094d\u092f\u0915\u094d\u0937 \u0921\u0940.\u0906\u0930. \u0917\u093e\u0921\u0917\u093f\u0932 \u0915\u0947 \u0938\u092e\u094d\u092e\u093e\u0928 \u092e\u0947\u0902 \u0930\u0916\u093e \u0917\u092f\u093e \u0925\u093e, \u091c\u093f\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u0907\u0938\u0915\u0940 \u092e\u0941\u0916\u094d\u092f \u0930\u0923\u0928\u0940\u0924\u093f\u092f\u094b\u0902 \u0915\u094b \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0906\u0915\u093e\u0930 \u0926\u093f\u092f\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q52.</b> Which segment of the Indian economy constitutes the second-largest source of employment after agriculture? / \u092d\u093e\u0930\u0924\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u093e \u0915\u094c\u0928 \u0938\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0943\u0937\u093f \u0915\u0947 \u092c\u093e\u0926 \u0930\u094b\u091c\u093c\u0917\u093e\u0930 \u0915\u093e \u0926\u0942\u0938\u0930\u093e \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u093e \u0938\u094d\u0930\u094b\u0924 \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Information Technology and software services / \u0938\u0942\u091a\u0928\u093e \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940 \u0914\u0930 \u0938\u0949\u092b\u094d\u091f\u0935\u0947\u092f\u0930 \u0938\u0947\u0935\u093e\u090f\u0901",
        "Transport and logistics infrastructure / \u092a\u0930\u093f\u0935\u0939\u0928 \u0914\u0930 \u0932\u0949\u091c\u093f\u0938\u094d\u091f\u093f\u0915\u094d\u0938 \u0907\u0902\u092b\u094d\u0930\u093e\u0938\u094d\u091f\u094d\u0930\u0915\u094d\u091a\u0930",
        "Large-scale capital-intensive industrial enterprises / \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u0942\u0902\u091c\u0940-\u092a\u094d\u0930\u0927\u093e\u0928 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0909\u0926\u094d\u092f\u092e",
        "Micro, Small, and Medium Enterprises (MSMEs) / \u0938\u0942\u0915\u094d\u0937\u094d\u092e, \u0932\u0918\u0941 \u0914\u0930 \u092e\u0927\u094d\u092f\u092e \u0909\u0926\u094d\u092f\u092e (MSMEs)"
      ],
      "correctIndex": 3,
      "explanation": "Functioning as an absolute powerhouse of the national economy, the highly robust Micro, Small, and Medium Enterprises (MSME) sector successfully provides massive employment to over 110 million people, making it indisputably the second-largest employer right after agriculture. / \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0947 \u092a\u0942\u0930\u094d\u0923 \u092a\u093e\u0935\u0930\u0939\u093e\u0909\u0938 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u0947 \u0939\u0941\u090f, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u091c\u092c\u0942\u0924 \u0938\u0942\u0915\u094d\u0937\u094d\u092e, \u0932\u0918\u0941 \u0914\u0930 \u092e\u0927\u094d\u092f\u092e \u0909\u0926\u094d\u092f\u092e (MSME) \u0915\u094d\u0937\u0947\u0924\u094d\u0930 110 \u092e\u093f\u0932\u093f\u092f\u0928 \u0938\u0947 \u0905\u0927\u093f\u0915 \u0932\u094b\u0917\u094b\u0902 \u0915\u094b \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0930\u094b\u091c\u0917\u093e\u0930 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u093e \u0939\u0948, \u091c\u093f\u0938\u0938\u0947 \u092f\u0939 \u0928\u093f\u0930\u094d\u0935\u093f\u0935\u093e\u0926 \u0930\u0942\u092a \u0938\u0947 \u0915\u0943\u0937\u093f \u0915\u0947 \u0920\u0940\u0915 \u092c\u093e\u0926 \u0926\u0942\u0938\u0930\u093e \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u093e \u0928\u093f\u092f\u094b\u0915\u094d\u0924\u093e \u092c\u0928 \u091c\u093e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q53.</b> Which of the following was not a challenge faced by Indian agriculture between 1950 and 1990? / 1950 \u0914\u0930 1990 \u0915\u0947 \u092c\u0940\u091a \u092d\u093e\u0930\u0924\u0940\u092f \u0915\u0943\u0937\u093f \u0915\u0947 \u0938\u093e\u092e\u0928\u0947 \u0907\u0928\u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928-\u0938\u0940 \u091a\u0941\u0928\u094c\u0924\u0940 \u0928\u0939\u0940\u0902 \u0925\u0940? [SSC GD 2026]",
      "options": [
        "Dependence on monsoon rainfall / \u092e\u093e\u0928\u0938\u0942\u0928 \u0915\u0940 \u092c\u093e\u0930\u093f\u0936 \u092a\u0930 \u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e",
        "Fragmented landholdings / \u092c\u093f\u0916\u0930\u0940 \u0939\u0941\u0908 \u091c\u093c\u092e\u0940\u0928 \u0915\u0940 \u091c\u094b\u0924",
        "Low use of fertilizers and irrigation / \u0916\u093e\u0926 \u0914\u0930 \u0938\u093f\u0902\u091a\u093e\u0908 \u0915\u093e \u0915\u092e \u0907\u0938\u094d\u0924\u0947\u092e\u093e\u0932",
        "High rural literacy rate reducing labour supply / \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0938\u093e\u0915\u094d\u0937\u0930\u0924\u093e \u0926\u0930 \u091c\u093c\u094d\u092f\u093e\u0926\u093e \u0939\u094b\u0928\u0947 \u0938\u0947 \u092e\u091c\u093c\u0926\u0942\u0930\u094b\u0902 \u0915\u0940 \u0938\u092a\u094d\u0932\u093e\u0908 \u092e\u0947\u0902 \u0915\u092e\u0940"
      ],
      "correctIndex": 3,
      "explanation": "Between 1950 and 1990, Indian agriculture heavily struggled with massive fragmentation, dire lack of vital irrigation, and extreme monsoon dependence. However, a &quot;high rural literacy rate&quot; absolutely did not exist; severe rural illiteracy actually deeply hindered the adoption of modern farming. / 1950 \u0914\u0930 1990 \u0915\u0947 \u092c\u0940\u091a, \u092d\u093e\u0930\u0924\u0940\u092f \u0915\u0943\u0937\u093f \u0915\u094b \u092d\u093e\u0930\u0940 \u0935\u093f\u0916\u0902\u0921\u0928, \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0938\u093f\u0902\u091a\u093e\u0908 \u0915\u0940 \u092d\u093e\u0930\u0940 \u0915\u092e\u0940 \u0914\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u093e\u0928\u0938\u0942\u0928 \u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0938\u0947 \u092d\u093e\u0930\u0940 \u0938\u0902\u0918\u0930\u094d\u0937 \u0915\u0930\u0928\u093e \u092a\u0921\u093c\u093e\u0964 \u0939\u093e\u0932\u093e\u0902\u0915\u093f, &quot;\u0909\u091a\u094d\u091a \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0938\u093e\u0915\u094d\u0937\u0930\u0924\u093e \u0926\u0930&quot; \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u092e\u094c\u091c\u0942\u0926 \u0928\u0939\u0940\u0902 \u0925\u0940; \u0917\u0902\u092d\u0940\u0930 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0905\u0936\u093f\u0915\u094d\u0937\u093e \u0928\u0947 \u0935\u093e\u0938\u094d\u0924\u0935 \u092e\u0947\u0902 \u0906\u0927\u0941\u0928\u093f\u0915 \u0916\u0947\u0924\u0940 \u0915\u094b \u0905\u092a\u0928\u093e\u0928\u0947 \u092e\u0947\u0902 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u092c\u093e\u0927\u093e \u0909\u0924\u094d\u092a\u0928\u094d\u0928 \u0915\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q54.</b> Before 1991, which policy limited private sector participation in certain industries? / 1991 \u0938\u0947 \u092a\u0939\u0932\u0947, \u0915\u093f\u0938 \u0928\u0940\u0924\u093f \u0928\u0947 \u0915\u0941\u091b \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u092e\u0947\u0902 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u092d\u093e\u0917\u0940\u0926\u093e\u0930\u0940 \u0915\u094b \u0938\u0940\u092e\u093f\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e \u0925\u093e? [SSC GD 2026]",
      "options": [
        "Agricultural Subsidy Policy / \u0915\u0943\u0937\u093f \u0938\u092c\u094d\u0938\u093f\u0921\u0940 \u0928\u0940\u0924\u093f",
        "Public Distribution System / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0935\u093f\u0924\u0930\u0923 \u092a\u094d\u0930\u0923\u093e\u0932\u0940",
        "Foreign Trade Policy / \u0935\u093f\u0926\u0947\u0936 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0928\u0940\u0924\u093f",
        "Industrial Licensing Policy / \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0928\u0940\u0924\u093f"
      ],
      "correctIndex": 3,
      "explanation": "Before the massive 1991 reforms, the highly oppressive &quot;Industrial Licensing Policy&quot; (infamously dubbed the License Raj) strictly mandated exhaustive government approval for virtually every single business action, heavily limiting and stifling robust private sector participation and expansion. / 1991 \u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0938\u0947 \u092a\u0939\u0932\u0947, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0926\u092e\u0928\u0915\u093e\u0930\u0940 &quot;\u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0928\u0940\u0924\u093f&quot; (\u091c\u093f\u0938\u0947 \u0915\u0941\u0916\u094d\u092f\u093e\u0924 \u0930\u0942\u092a \u0938\u0947 \u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948) \u0928\u0947 \u0932\u0917\u092d\u0917 \u0939\u0930 \u090f\u0915 \u0935\u094d\u092f\u093e\u0935\u0938\u093e\u092f\u093f\u0915 \u0915\u093e\u0930\u094d\u0930\u0935\u093e\u0908 \u0915\u0947 \u0932\u093f\u090f \u0935\u093f\u0938\u094d\u0924\u0943\u0924 \u0938\u0930\u0915\u093e\u0930\u0940 \u0905\u0928\u0941\u092e\u094b\u0926\u0928 \u0915\u094b \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0915\u0930 \u0926\u093f\u092f\u093e, \u091c\u093f\u0938\u0928\u0947 \u092e\u091c\u092c\u0942\u0924 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u092d\u093e\u0917\u0940\u0926\u093e\u0930\u0940 \u0914\u0930 \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0915\u094b \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0938\u0940\u092e\u093f\u0924 \u0914\u0930 \u0905\u0935\u0930\u0941\u0926\u094d\u0927 \u0915\u0930 \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q55.</b> The Life Insurance Corporation of India was established in _____. / \u0932\u093e\u0907\u092b \u0907\u0902\u0936\u094d\u092f\u094b\u0930\u0947\u0902\u0938 \u0915\u0949\u0930\u094d\u092a\u094b\u0930\u0947\u0936\u0928 \u0911\u092b\u093c \u0907\u0902\u0921\u093f\u092f\u093e (LIC) \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e _____ \u092e\u0947\u0902 \u0939\u0941\u0908 \u0925\u0940\u0964 [SSC GD 2026]",
      "options": [
        "1960 / 1960",
        "1948 / 1948",
        "1950 / 1950",
        "1956 / 1956"
      ],
      "correctIndex": 3,
      "explanation": "In a monumental socialist economic stride, the Government of India aggressively nationalized the entire life insurance sector. By powerfully amalgamating over 245 distinct private companies, the state officially created the colossal Life Insurance Corporation (LIC) exactly in 1956. / \u090f\u0915 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0906\u0930\u094d\u0925\u093f\u0915 \u0915\u0926\u092e \u092e\u0947\u0902, \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u092a\u0942\u0930\u0947 \u091c\u0940\u0935\u0928 \u092c\u0940\u092e\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u093e \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f\u0915\u0930\u0923 \u0915\u0930 \u0926\u093f\u092f\u093e\u0964 245 \u0938\u0947 \u0905\u0927\u093f\u0915 \u0935\u093f\u092d\u093f\u0928\u094d\u0928 \u0928\u093f\u091c\u0940 \u0915\u0902\u092a\u0928\u093f\u092f\u094b\u0902 \u0915\u094b \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0930\u0942\u092a \u0938\u0947 \u092e\u093f\u0932\u093e\u0915\u0930, \u0930\u093e\u091c\u094d\u092f \u0928\u0947 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0920\u0940\u0915 1956 \u092e\u0947\u0902 \u0935\u093f\u0936\u093e\u0932 \u091c\u0940\u0935\u0928 \u092c\u0940\u092e\u093e \u0928\u093f\u0917\u092e (LIC) \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q56.</b> Which trend shows that the 1991 reforms improved India\u2019s external sector stability? / \u0915\u094c\u0928 \u0938\u093e \u091f\u094d\u0930\u0947\u0902\u0921 \u092f\u0939 \u0926\u093f\u0916\u093e\u0924\u093e \u0939\u0948 \u0915\u093f 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 \u092c\u093e\u0939\u0930\u0940 \u0938\u0947\u0915\u094d\u091f\u0930 \u0915\u0940 \u0938\u094d\u0925\u093f\u0930\u0924\u093e \u092e\u0947\u0902 \u0938\u0941\u0927\u093e\u0930 \u0915\u093f\u092f\u093e? [SSC GD 2026]",
      "options": [
        "Decline in foreign investment inflows / \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u0947 \u092a\u094d\u0930\u0935\u093e\u0939 \u092e\u0947\u0902 \u0917\u093f\u0930\u093e\u0935\u091f",
        "External debt doubled in the 1990s / 1990 \u0915\u0947 \u0926\u0936\u0915 \u092e\u0947\u0902 \u092c\u093e\u0939\u0930\u0940 \u0915\u0930\u094d\u091c \u0926\u094b\u0917\u0941\u0928\u093e \u0939\u094b \u0917\u092f\u093e",
        "Continuous fall in foreign exchange reserves after 1991 / 1991 \u0915\u0947 \u092c\u093e\u0926 \u0935\u093f\u0926\u0947\u0936\u0940 \u092e\u0941\u0926\u094d\u0930\u093e \u092d\u0902\u0921\u093e\u0930 \u092e\u0947\u0902 \u0932\u0917\u093e\u0924\u093e\u0930 \u0917\u093f\u0930\u093e\u0935\u091f",
        "Strong rise in foreign exchange reserves over time / \u0938\u092e\u092f \u0915\u0947 \u0938\u093e\u0925 \u0935\u093f\u0926\u0947\u0936\u0940 \u092e\u0941\u0926\u094d\u0930\u093e \u092d\u0902\u0921\u093e\u0930 \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0935\u0943\u0926\u094d\u0927\u093f"
      ],
      "correctIndex": 3,
      "explanation": "The incredibly transformative 1991 reforms aggressively opened the closed Indian economy to massive global trade and lucrative foreign investments. Consequently, India&#x27;s terrifyingly depleted foreign exchange reserves (which caused the crisis) experienced a remarkably strong, persistent, and massive rise over time, heavily stabilizing the external sector. / \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0928\u0947 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0902\u0926 \u092d\u093e\u0930\u0924\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u094b \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0914\u0930 \u0906\u0915\u0930\u094d\u0937\u0915 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u0947 \u0932\u093f\u090f \u0916\u094b\u0932 \u0926\u093f\u092f\u093e\u0964 \u0928\u0924\u0940\u091c\u0924\u0928, \u092d\u093e\u0930\u0924 \u0915\u093e \u092d\u092f\u093e\u0928\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u092e\u093e\u092a\u094d\u0924 \u0935\u093f\u0926\u0947\u0936\u0940 \u092e\u0941\u0926\u094d\u0930\u093e \u092d\u0902\u0921\u093e\u0930 (\u091c\u093f\u0938\u0915\u0947 \u0915\u093e\u0930\u0923 \u0938\u0902\u0915\u091f \u092a\u0948\u0926\u093e \u0939\u0941\u0906) \u0928\u0947 \u0938\u092e\u092f \u0915\u0947 \u0938\u093e\u0925 \u0909\u0932\u094d\u0932\u0947\u0916\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u092e\u091c\u092c\u0942\u0924, \u0932\u0917\u093e\u0924\u093e\u0930 \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u0943\u0926\u094d\u0927\u093f \u0915\u093e \u0905\u0928\u0941\u092d\u0935 \u0915\u093f\u092f\u093e, \u091c\u093f\u0938\u0938\u0947 \u092c\u093e\u0939\u0930\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u093e\u092b\u0940 \u0938\u094d\u0925\u093f\u0930 \u0939\u094b \u0917\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q57.</b> The Industrial Policy Resolution of 1956 classified industries into how many categories? / 1956 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u092a\u094d\u0930\u0938\u094d\u0924\u093e\u0935 \u0928\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0915\u093f\u0924\u0928\u0940 \u0936\u094d\u0930\u0947\u0923\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e? [SSC GD 2026]",
      "options": [
        "Four / \u091a\u093e\u0930",
        "Five / \u092a\u093e\u0902\u091a",
        "Two / \u0926\u094b",
        "Three / \u0924\u0940\u0928"
      ],
      "correctIndex": 3,
      "explanation": "The deeply historic Industrial Policy Resolution (IPR) of 1956 highly rigidly classified all Indian industries entirely into exactly three distinct schedules. Schedule A (state monopoly), Schedule B (mixed ownership), and Schedule C (private sector), cementing state dominance. / 1956 \u0915\u0947 \u0917\u0939\u0930\u0947 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u092a\u094d\u0930\u0938\u094d\u0924\u093e\u0935 (IPR) \u0928\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u0920\u094b\u0930\u0924\u093e \u0938\u0947 \u0938\u092d\u0940 \u092d\u093e\u0930\u0924\u0940\u092f \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0920\u0940\u0915 \u0924\u0940\u0928 \u0905\u0932\u0917-\u0905\u0932\u0917 \u0905\u0928\u0941\u0938\u0942\u091a\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e\u0964 \u0905\u0928\u0941\u0938\u0942\u091a\u0940 \u090f (\u0930\u093e\u091c\u094d\u092f \u090f\u0915\u093e\u0927\u093f\u0915\u093e\u0930), \u0905\u0928\u0941\u0938\u0942\u091a\u0940 \u092c\u0940 (\u092e\u093f\u0936\u094d\u0930\u093f\u0924 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935), \u0914\u0930 \u0905\u0928\u0941\u0938\u0942\u091a\u0940 \u0938\u0940 (\u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930), \u091c\u093f\u0938\u0928\u0947 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u092a\u094d\u0930\u092d\u0941\u0924\u094d\u0935 \u0915\u094b \u092e\u091c\u092c\u0942\u0924 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q58.</b> The Ease of Doing Business (EODB) indicator \u201cEnforcing Contracts\u201d measures: / &#x27;\u0908\u091c\u093c \u0911\u092b\u093c \u0921\u0942\u0907\u0902\u0917 \u092c\u093f\u091c\u093c\u0928\u0947\u0938&#x27; (EODB) \u0907\u0902\u0921\u093f\u0915\u0947\u091f\u0930 \u0915\u093e &#x27;\u090f\u0928\u092b\u094b\u0930\u094d\u0938\u093f\u0902\u0917 \u0915\u0949\u0928\u094d\u091f\u094d\u0930\u0948\u0915\u094d\u091f\u094d\u0938&#x27; (\u0905\u0928\u0941\u092c\u0902\u0927\u094b\u0902 \u0915\u094b \u0932\u093e\u0917\u0942 \u0915\u0930\u0928\u093e) \u092a\u0948\u0930\u093e\u092e\u0940\u091f\u0930 \u0907\u0928 \u091a\u0940\u091c\u093c\u094b\u0902 \u0915\u094b \u092e\u093e\u092a\u0924\u093e \u0939\u0948: [SSC GD 2026]",
      "options": [
        "Ease of paying and managing taxes / \u091f\u0948\u0915\u094d\u0938 \u091a\u0941\u0915\u093e\u0928\u0947 \u0914\u0930 \u092e\u0948\u0928\u0947\u091c \u0915\u0930\u0928\u0947 \u092e\u0947\u0902 \u0906\u0938\u093e\u0928\u0940",
        "Effectiveness of law enforcement agencies / \u0915\u093e\u0928\u0942\u0928 \u0932\u093e\u0917\u0942 \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0940 \u090f\u091c\u0947\u0902\u0938\u093f\u092f\u094b\u0902 \u0915\u0940 \u092a\u094d\u0930\u092d\u093e\u0935\u0936\u0940\u0932\u0924\u093e",
        "Implementation of labor regulations / \u0932\u0947\u092c\u0930 \u0930\u0947\u0917\u0941\u0932\u0947\u0936\u0902\u0938 (\u0936\u094d\u0930\u092e \u0928\u093f\u092f\u092e\u094b\u0902) \u0915\u094b \u0932\u093e\u0917\u0942 \u0915\u0930\u0928\u093e",
        "Efficiency of the judicial system in resolving commercial disputes / \u0915\u092e\u0930\u094d\u0936\u093f\u092f\u0932 \u0935\u093f\u0935\u093e\u0926\u094b\u0902 \u0915\u094b \u0938\u0941\u0932\u091d\u093e\u0928\u0947 \u092e\u0947\u0902 \u0928\u094d\u092f\u093e\u092f\u093f\u0915 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0915\u0940 \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0937\u092e\u0924\u093e"
      ],
      "correctIndex": 3,
      "explanation": "In the World Bank&#x27;s highly regarded EoDB Index, the specific &quot;Enforcing Contracts&quot; parameter rigorously evaluates the exact time, massive cost, and absolute efficiency of the local judicial system in successfully resolving standard commercial disputes between local businesses. / \u0935\u093f\u0936\u094d\u0935 \u092c\u0948\u0902\u0915 \u0915\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u092e\u094d\u092e\u093e\u0928\u093f\u0924 EoDB \u0907\u0902\u0921\u0947\u0915\u094d\u0938 \u092e\u0947\u0902, \u0935\u093f\u0936\u093f\u0937\u094d\u091f &quot;\u0905\u0928\u0941\u092c\u0902\u0927 \u0932\u093e\u0917\u0942 \u0915\u0930\u0928\u093e&quot; (Enforcing Contracts) \u092a\u0948\u0930\u093e\u092e\u0940\u091f\u0930 \u0938\u094d\u0925\u093e\u0928\u0940\u092f \u0935\u094d\u092f\u0935\u0938\u093e\u092f\u094b\u0902 \u0915\u0947 \u092c\u0940\u091a \u092e\u093e\u0928\u0915 \u0935\u093e\u0923\u093f\u091c\u094d\u092f\u093f\u0915 \u0935\u093f\u0935\u093e\u0926\u094b\u0902 \u0915\u094b \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u0939\u0932 \u0915\u0930\u0928\u0947 \u092e\u0947\u0902 \u0938\u094d\u0925\u093e\u0928\u0940\u092f \u0928\u094d\u092f\u093e\u092f\u093f\u0915 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0915\u0947 \u0938\u091f\u0940\u0915 \u0938\u092e\u092f, \u092d\u093e\u0930\u0940 \u0932\u093e\u0917\u0924 \u0914\u0930 \u092a\u0942\u0930\u094d\u0923 \u0926\u0915\u094d\u0937\u0924\u093e \u0915\u093e \u0915\u0920\u094b\u0930\u0924\u093e \u0938\u0947 \u092e\u0942\u0932\u094d\u092f\u093e\u0902\u0915\u0928 \u0915\u0930\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q59.</b> Which of the following is a major challenge of Indian agriculture today? / \u0906\u091c \u092d\u093e\u0930\u0924\u0940\u092f \u0915\u0943\u0937\u093f \u0915\u0947 \u0938\u093e\u092e\u0928\u0947 \u0907\u0928\u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928-\u0938\u0940 \u090f\u0915 \u092c\u0921\u093c\u0940 \u091a\u0941\u0928\u094c\u0924\u0940 \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Sparse rural population density limiting farm labor / \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0906\u092c\u093e\u0926\u0940 \u0915\u093e \u0915\u092e \u0918\u0928\u0924\u094d\u0935, \u091c\u093f\u0938\u0938\u0947 \u0916\u0947\u0924\u0940 \u0915\u0947 \u0932\u093f\u090f \u092e\u091c\u093c\u0926\u0942\u0930\u094b\u0902 \u0915\u0940 \u0915\u092e\u0940 \u0939\u094b \u0930\u0939\u0940 \u0939\u0948",
        "Rising levels of agricultural mechanization / \u0916\u0947\u0924\u0940 \u092e\u0947\u0902 \u092e\u0936\u0940\u0928\u094b\u0902 \u0915\u093e \u092c\u0922\u093c\u0924\u093e \u0907\u0938\u094d\u0924\u0947\u092e\u093e\u0932",
        "Shrinking domestic demand for staple food grains / \u092e\u0941\u0916\u094d\u092f \u0905\u0928\u093e\u091c \u0915\u0940 \u0918\u0930\u0947\u0932\u0942 \u092e\u093e\u0902\u0917 \u092e\u0947\u0902 \u0915\u092e\u0940",
        "Progressive fragmentation and declining size of operational holdings / \u0916\u0947\u0924\u0940 \u0915\u0940 \u091c\u093c\u092e\u0940\u0928 \u0915\u093e \u0932\u0917\u093e\u0924\u093e\u0930 \u091b\u094b\u091f\u0947-\u091b\u094b\u091f\u0947 \u091f\u0941\u0915\u0921\u093c\u094b\u0902 \u092e\u0947\u0902 \u092c\u0902\u091f\u0928\u093e \u0914\u0930 \u091c\u094b\u0924 \u0915\u093e \u0906\u0915\u093e\u0930 \u0918\u091f\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "A catastrophic and deeply fundamental challenge plaguing modern Indian agriculture is the aggressive, continuous fragmentation of land. Due to strict inheritance laws, operational landholdings are shrinking to practically unviable sizes, making highly efficient mechanized farming utterly impossible for millions. / \u0906\u0927\u0941\u0928\u093f\u0915 \u092d\u093e\u0930\u0924\u0940\u092f \u0915\u0943\u0937\u093f \u0915\u094b \u0924\u094d\u0930\u0938\u094d\u0924 \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0940 \u090f\u0915 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u0914\u0930 \u0905\u0924\u094d\u092f\u0902\u0924 \u092e\u094c\u0932\u093f\u0915 \u091a\u0941\u0928\u094c\u0924\u0940 \u092d\u0942\u092e\u093f \u0915\u093e \u0906\u0915\u094d\u0930\u093e\u092e\u0915, \u0928\u093f\u0930\u0902\u0924\u0930 \u0935\u093f\u0916\u0902\u0921\u0928 \u0939\u0948\u0964 \u0938\u0916\u094d\u0924 \u0935\u093f\u0930\u093e\u0938\u0924 \u0915\u093e\u0928\u0942\u0928\u094b\u0902 \u0915\u0947 \u0915\u093e\u0930\u0923, \u0915\u0943\u0937\u093f \u091c\u094b\u0924 \u0935\u094d\u092f\u093e\u0935\u0939\u093e\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u0932\u093e\u092d\u0915\u093e\u0930\u0940 \u0906\u0915\u093e\u0930 \u092e\u0947\u0902 \u0938\u093f\u0915\u0941\u0921\u093c \u0930\u0939\u0940 \u0939\u0948, \u091c\u093f\u0938\u0938\u0947 \u0932\u093e\u0916\u094b\u0902 \u0932\u094b\u0917\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u0941\u0936\u0932 \u092f\u0902\u0924\u094d\u0930\u0940\u0915\u0943\u0924 \u0916\u0947\u0924\u0940 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0905\u0938\u0902\u092d\u0935 \u0939\u094b \u0917\u0908 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q60.</b> Why are the 1991 reforms sometimes linked to \u201cjobless growth&quot;? / 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u094b \u0915\u092d\u0940-\u0915\u092d\u0940 &quot;\u0930\u094b\u091c\u093c\u0917\u093e\u0930-\u0935\u093f\u0939\u0940\u0928 \u0935\u093f\u0915\u093e\u0938&quot; (jobless growth) \u0938\u0947 \u0915\u094d\u092f\u094b\u0902 \u091c\u094b\u0921\u093c\u093e \u091c\u093e\u0924\u093e \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Rural areas absorbed more labor / \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0907\u0932\u093e\u0915\u094b\u0902 \u092e\u0947\u0902 \u091c\u093c\u094d\u092f\u093e\u0926\u093e \u0932\u094b\u0917\u094b\u0902 \u0915\u094b \u0915\u093e\u092e \u092e\u093f\u0932\u093e",
        "Educated unemployment went down sharply / \u0936\u093f\u0915\u094d\u0937\u093f\u0924 \u0932\u094b\u0917\u094b\u0902 \u092e\u0947\u0902 \u092c\u0947\u0930\u094b\u095b\u0917\u093e\u0930\u0940 \u0924\u0947\u095b\u0940 \u0938\u0947 \u0915\u092e \u0939\u0941\u0908",
        "Rising share of employment in agriculture / \u0915\u0943\u0937\u093f \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u092e\u0947\u0902 \u0930\u094b\u095b\u0917\u093e\u0930 \u0915\u0940 \u0939\u093f\u0938\u094d\u0938\u0947\u0926\u093e\u0930\u0940 \u092c\u095d\u0928\u093e",
        "High GDP growth without proportionate employment expansion / \u0930\u094b\u091c\u093c\u0917\u093e\u0930 \u092e\u0947\u0902 \u0909\u091a\u093f\u0924 \u0935\u0943\u0926\u094d\u0927\u093f \u0915\u0947 \u092c\u093f\u0928\u093e GDP \u092e\u0947\u0902 \u0924\u0947\u091c\u093c \u092c\u0922\u093c\u094b\u0924\u0930\u0940"
      ],
      "correctIndex": 3,
      "explanation": "While the historic 1991 reforms successfully skyrocketed India&#x27;s overall GDP through a massive boom strictly in highly skilled, capital-intensive IT and service sectors, these specific sectors tragically failed to aggressively create corresponding mass employment for the vast unskilled population, causing &quot;jobless growth.&quot; / \u092f\u0926\u094d\u092f\u092a\u093f \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0928\u0947 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u0941\u0936\u0932, \u092a\u0942\u0902\u091c\u0940-\u0917\u0939\u0928 \u0906\u0908\u091f\u0940 \u0914\u0930 \u0938\u0947\u0935\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0909\u091b\u093e\u0932 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0938\u092e\u0917\u094d\u0930 \u091c\u0940\u0921\u0940\u092a\u0940 \u0915\u094b \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u0906\u0938\u092e\u093e\u0928 \u092a\u0930 \u092a\u0939\u0941\u0902\u091a\u093e \u0926\u093f\u092f\u093e, \u0932\u0947\u0915\u093f\u0928 \u092f\u0947 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0926\u0941\u0916\u0926 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0936\u093e\u0932 \u0905\u0915\u0941\u0936\u0932 \u0906\u092c\u093e\u0926\u0940 \u0915\u0947 \u0932\u093f\u090f \u0924\u0926\u0928\u0941\u0938\u093e\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0930\u094b\u091c\u0917\u093e\u0930 \u092a\u0948\u0926\u093e \u0915\u0930\u0928\u0947 \u092e\u0947\u0902 \u0935\u093f\u092b\u0932 \u0930\u0939\u0947, \u091c\u093f\u0938\u0938\u0947 &quot;\u0930\u094b\u091c\u0917\u093e\u0930-\u0935\u093f\u0939\u0940\u0928 \u0935\u093f\u0915\u093e\u0938&quot; (jobless growth) \u0939\u0941\u0906\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q61.</b> Which of the following is a core function of NITI Aayog? / \u0907\u0928\u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928-\u0938\u093e \u0928\u0940\u0924\u093f \u0906\u092f\u094b\u0917 \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u0915\u093e\u0930\u094d\u092f \u0939\u0948? [SSC GD 2026]",
      "options": [
        "Controlling monetary policy / \u092e\u094c\u0926\u094d\u0930\u093f\u0915 \u0928\u0940\u0924\u093f \u0915\u094b \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u0915\u0930\u0928\u093e",
        "Conducting elections / \u091a\u0941\u0928\u093e\u0935 \u0915\u0930\u093e\u0928\u093e",
        "Policy thinks tank and cooperative federalism / \u092a\u0949\u0932\u093f\u0938\u0940 \u0925\u093f\u0902\u0915 \u091f\u0948\u0902\u0915 \u0914\u0930 \u0938\u0939\u0915\u093e\u0930\u0940 \u0938\u0902\u0918\u0935\u093e\u0926",
        "Allocation of plan funds to states / \u0930\u093e\u091c\u094d\u092f\u094b\u0902 \u0915\u094b \u092f\u094b\u091c\u0928\u093e \u0928\u093f\u0927\u093f \u0915\u093e \u0906\u0935\u0902\u091f\u0928"
      ],
      "correctIndex": 2,
      "explanation": "NITI Aayog (National Institution for Transforming India) serves as the apex public policy think tank of the Government of India. It completely shifted away from the top-down command model of the former Planning Commission, actively focusing on fostering robust cooperative federalism through highly structured support initiatives and mechanisms with the States. / \u0928\u0940\u0924\u093f \u0906\u092f\u094b\u0917 (\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092d\u093e\u0930\u0924 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 \u0938\u0902\u0938\u094d\u0925\u093e\u0928) \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0915\u0947 \u0938\u0930\u094d\u0935\u094b\u091a\u094d\u091a \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0928\u0940\u0924\u093f \u0925\u093f\u0902\u0915 \u091f\u0948\u0902\u0915 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u092f\u0939 \u092a\u0942\u0930\u094d\u0935 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0947 \u091f\u0949\u092a-\u0921\u093e\u0909\u0928 \u0915\u092e\u093e\u0902\u0921 \u092e\u0949\u0921\u0932 \u0938\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0926\u0942\u0930 \u0939\u094b \u0917\u092f\u093e, \u091c\u094b \u0930\u093e\u091c\u094d\u092f\u094b\u0902 \u0915\u0947 \u0938\u093e\u0925 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u0902\u0930\u091a\u093f\u0924 \u0938\u092e\u0930\u094d\u0925\u0928 \u092a\u0939\u0932\u094b\u0902 \u0914\u0930 \u0924\u0902\u0924\u094d\u0930\u094b\u0902 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u092e\u091c\u092c\u0942\u0924 \u0938\u0939\u0915\u093e\u0930\u0940 \u0938\u0902\u0918\u0935\u093e\u0926 (cooperative federalism) \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u092a\u0930 \u0938\u0915\u094d\u0930\u093f\u092f \u0930\u0942\u092a \u0938\u0947 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q62.</b> During the planning era, import substitution industrialization (ISI) in India aimed to _____. / \u092f\u094b\u091c\u0928\u093e \u0915\u093e\u0932 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928, \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0906\u092f\u093e\u0924 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 (ISI) \u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f _____ \u0925\u093e\u0964 [SSC GD 2026]",
      "options": [
        "Replace imports of manufactured products with domestic production through protectionist policies / \u0938\u0902\u0930\u0915\u094d\u0937\u0923\u0935\u093e\u0926\u0940 \u0928\u0940\u0924\u093f\u092f\u094b\u0902 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0928\u093f\u0930\u094d\u092e\u093f\u0924 \u0909\u0924\u094d\u092a\u093e\u0926\u094b\u0902 \u0915\u0947 \u0906\u092f\u093e\u0924 \u0915\u094b \u0918\u0930\u0947\u0932\u0942 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0938\u0947 \u092c\u0926\u0932\u0928\u093e",
        "Encourage exports of manufactured goods for foreign exchange earnings / \u0935\u093f\u0926\u0947\u0936\u0940 \u092e\u0941\u0926\u094d\u0930\u093e \u0915\u092e\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0928\u093f\u0930\u094d\u092e\u093f\u0924 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0947 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e",
        "Liberalize imports of machinery and capital goods without restrictions / \u092c\u093f\u0928\u093e \u0915\u093f\u0938\u0940 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927 \u0915\u0947 \u092e\u0936\u0940\u0928\u0930\u0940 \u0914\u0930 \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0947 \u0906\u092f\u093e\u0924 \u0915\u094b \u0909\u0926\u093e\u0930 \u092c\u0928\u093e\u0928\u093e",
        "Attract foreign investment in consumer goods industries / \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u092e\u0947\u0902 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u094b \u0906\u0915\u0930\u094d\u0937\u093f\u0924 \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 0,
      "explanation": "Import Substitution Industrialization (ISI) was a highly defensive economic theory fiercely employed by developing nations like India post-independence. Its absolute primary goal was to systematically replace foreign imports with domestic production, actively shielding nascent national industries from brutal global competition through rigid protectionist policies, steep tariffs, and strict import quotas. / \u0906\u092f\u093e\u0924 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 (ISI) \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0915\u0947 \u092c\u093e\u0926 \u092d\u093e\u0930\u0924 \u091c\u0948\u0938\u0947 \u0935\u093f\u0915\u093e\u0938\u0936\u0940\u0932 \u0926\u0947\u0936\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0907\u0938\u094d\u0924\u0947\u092e\u093e\u0932 \u0915\u093f\u092f\u093e \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u093e \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0930\u0915\u094d\u0937\u093e\u0924\u094d\u092e\u0915 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u0925\u093e\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0932\u0915\u094d\u0937\u094d\u092f \u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0926\u0947\u0936\u0940 \u0906\u092f\u093e\u0924 \u0915\u094b \u0918\u0930\u0947\u0932\u0942 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0947 \u0938\u093e\u0925 \u092c\u0926\u0932\u0928\u093e \u0925\u093e, \u0915\u0920\u094b\u0930 \u0938\u0902\u0930\u0915\u094d\u0937\u0923\u0935\u093e\u0926\u0940 \u0928\u0940\u0924\u093f\u092f\u094b\u0902, \u092d\u093e\u0930\u0940 \u091f\u0948\u0930\u093f\u092b \u0914\u0930 \u0938\u0916\u094d\u0924 \u0906\u092f\u093e\u0924 \u0915\u094b\u091f\u093e \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0915\u094d\u0930\u0942\u0930 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0938\u0947 \u0928\u0935\u091c\u093e\u0924 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0940 \u0938\u0915\u094d\u0930\u093f\u092f \u0930\u0942\u092a \u0938\u0947 \u0930\u0915\u094d\u0937\u093e \u0915\u0930\u0928\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q63.</b> The EXIM Bank of India was set up in: / \u092d\u093e\u0930\u0924 \u0915\u0947 EXIM \u092c\u0948\u0902\u0915 \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u092c \u0939\u0941\u0908 \u0925\u0940? [SSC GD 2026]",
      "options": [
        "1972 / 1972",
        "1990 / 1990",
        "1982 / 1982",
        "1985 / 1985"
      ],
      "correctIndex": 2,
      "explanation": "The Export-Import Bank of India (EXIM Bank) was officially established precisely in 1982 under the Export-Import Bank of India Act 1981. Functioning as the premier export finance institution, it aggressively catalyzes India&#x27;s international trade by providing immense financial assistance to dynamic exporters and importers. / \u092d\u093e\u0930\u0924\u0940\u092f \u0928\u093f\u0930\u094d\u092f\u093e\u0924-\u0906\u092f\u093e\u0924 \u092c\u0948\u0902\u0915 (EXIM Bank) \u0915\u0940 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0938\u094d\u0925\u093e\u092a\u0928\u093e 1981 \u0915\u0947 \u092d\u093e\u0930\u0924\u0940\u092f \u0928\u093f\u0930\u094d\u092f\u093e\u0924-\u0906\u092f\u093e\u0924 \u092c\u0948\u0902\u0915 \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0915\u0947 \u0924\u0939\u0924 \u0920\u0940\u0915 1982 \u092e\u0947\u0902 \u0915\u0940 \u0917\u0908 \u0925\u0940\u0964 \u092a\u094d\u0930\u092e\u0941\u0916 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0935\u093f\u0924\u094d\u0924 \u0938\u0902\u0938\u094d\u0925\u093e\u0928 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u0947 \u0939\u0941\u090f, \u092f\u0939 \u0917\u0924\u093f\u0936\u0940\u0932 \u0928\u093f\u0930\u094d\u092f\u093e\u0924\u0915\u094b\u0902 \u0914\u0930 \u0906\u092f\u093e\u0924\u0915\u094b\u0902 \u0915\u094b \u0905\u092a\u093e\u0930 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0939\u093e\u092f\u0924\u093e \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0915\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0905\u0902\u0924\u0930\u094d\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0909\u0924\u094d\u092a\u094d\u0930\u0947\u0930\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q64.</b> When tax collection exceeds the required expenditure, the budget is said to be ______. / \u091c\u092c \u091f\u0948\u0915\u094d\u0938 \u0938\u0947 \u0939\u094b\u0928\u0947 \u0935\u093e\u0932\u0940 \u0915\u092e\u093e\u0908 \u091c\u093c\u0930\u0942\u0930\u0940 \u0916\u0930\u094d\u091a \u0938\u0947 \u091c\u093c\u094d\u092f\u093e\u0926\u093e \u0939\u094b \u091c\u093e\u0924\u0940 \u0939\u0948, \u0924\u094b \u092c\u091c\u091f \u0915\u094b ______ \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964 [SSC GD 2026]",
      "options": [

        "To regulate trade policies / \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0928\u0940\u0924\u093f\u092f\u094b\u0902 \u0915\u094b \u0935\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0915\u0930\u0928\u093e",
        "To develop genetically modified crops / \u0906\u0928\u0941\u0935\u0902\u0936\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u0936\u094b\u0927\u093f\u0924 (GMO) \u092b\u0938\u0932\u0947\u0902 \u0935\u093f\u0915\u0938\u093f\u0924 \u0915\u0930\u0928\u093e",
        "To promote milk production / \u0926\u0942\u0927 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e"
      ],
      "correctIndex": 0,
      "explanation": "The Technology Mission on Oilseeds aggressively launched in 1986 sought to make India fully self-sufficient. The highly successful NDDB was specifically designated to expertly manage market intervention. By brilliantly applying the exact successful cooperative model of the &quot;White Revolution&quot; to oilseeds, it efficiently managed vast procurement and processing. / 1986 \u092e\u0947\u0902 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0936\u0941\u0930\u0942 \u0915\u093f\u090f \u0917\u090f \u0924\u093f\u0932\u0939\u0928 \u092a\u0930 \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940 \u092e\u093f\u0936\u0928 \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930 \u092c\u0928\u093e\u0928\u0947 \u0915\u0940 \u092e\u093e\u0902\u0917 \u0915\u0940\u0964 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u092b\u0932 \u090f\u0928\u0921\u0940\u0921\u0940\u092c\u0940 (NDDB) \u0915\u094b \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092c\u093e\u091c\u093e\u0930 \u0939\u0938\u094d\u0924\u0915\u094d\u0937\u0947\u092a \u0915\u094b \u0915\u0941\u0936\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u092a\u094d\u0930\u092c\u0902\u0927\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0928\u093e\u092e\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0924\u093f\u0932\u0939\u0928 \u092e\u0947\u0902 &quot;\u0936\u094d\u0935\u0947\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f&quot; \u0915\u0947 \u0938\u091f\u0940\u0915 \u0938\u092b\u0932 \u0938\u0939\u0915\u093e\u0930\u0940 \u092e\u0949\u0921\u0932 \u0915\u094b \u0936\u093e\u0928\u0926\u093e\u0930 \u0922\u0902\u0917 \u0938\u0947 \u0932\u093e\u0917\u0942 \u0915\u0930\u0915\u0947, \u0907\u0938\u0928\u0947 \u0935\u093f\u0936\u093e\u0932 \u0916\u0930\u0940\u0926 \u0914\u0930 \u092a\u094d\u0930\u0938\u0902\u0938\u094d\u0915\u0930\u0923 \u0915\u093e \u0915\u0941\u0936\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q25.</b> In which year were the major economic reforms introduced in India? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092a\u094d\u0930\u092e\u0941\u0916 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930 (economic reforms) \u0915\u093f\u0938 \u0935\u0930\u094d\u0937 \u0936\u0941\u0930\u0942 \u0915\u093f\u090f \u0917\u090f \u0925\u0947? [SSC Steno, 06/08/2025, Shift-1]",
      "options": [
        "1991",
        "2000",
        "1985",
        "1990"
      ],
      "correctIndex": 0,
      "explanation": "The absolutely monumental, paradigm-shifting major economic reforms, globally known as the LPG Reforms (Liberalization, Privatization, and Globalization), were aggressively and historically introduced in July 1991. Driven by a catastrophic Balance of Payments crisis, they systematically dismantled the rigid &quot;License Raj&quot; and forcefully integrated India with the global market. / 1991 \u092e\u0947\u0902 \u090f\u0932\u092a\u0940\u091c\u0940 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 (\u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923, \u0928\u093f\u091c\u0940\u0915\u0930\u0923 \u0914\u0930 \u0935\u0948\u0936\u094d\u0935\u0940\u0915\u0930\u0923) \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u091c\u093e\u0928\u0947 \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f, \u092a\u094d\u0930\u0924\u093f\u092e\u093e\u0928-\u092c\u0926\u0932\u0928\u0947 \u0935\u093e\u0932\u0947 \u092a\u094d\u0930\u092e\u0941\u0916 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u091c\u0941\u0932\u093e\u0908 1991 \u092e\u0947\u0902 \u092a\u0947\u0936 \u0915\u093f\u090f \u0917\u090f \u0925\u0947\u0964 \u092d\u0941\u0917\u0924\u093e\u0928 \u0938\u0902\u0924\u0941\u0932\u0928 \u0915\u0947 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u0938\u0902\u0915\u091f \u0938\u0947 \u092a\u094d\u0930\u0947\u0930\u093f\u0924 \u0939\u094b\u0915\u0930, \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0915\u0920\u094b\u0930 &quot;\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c&quot; \u0915\u094b \u0916\u0924\u094d\u092e \u0915\u0930 \u0926\u093f\u092f\u093e \u0914\u0930 \u092d\u093e\u0930\u0924 \u0915\u094b \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u092c\u093e\u091c\u093e\u0930 \u0915\u0947 \u0938\u093e\u0925 \u092c\u0932\u092a\u0942\u0930\u094d\u0935\u0915 \u090f\u0915\u0940\u0915\u0943\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q26.</b> Which of the following is a key reason for the decline in the agricultural sector in India after 1991 economic reforms? / 1991 \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u092c\u093e\u0926 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0915\u0943\u0937\u093f \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u092e\u0947\u0902 \u0917\u093f\u0930\u093e\u0935\u091f \u0915\u093e \u090f\u0915 \u092a\u094d\u0930\u092e\u0941\u0916 \u0915\u093e\u0930\u0923 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0939\u0948? [SSC Steno, 06/08/2025, Shift-1]",
      "options": [
        "Increased investment in irrigation and rural infrastructure / \u0938\u093f\u0902\u091a\u093e\u0908 \u0914\u0930 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u0947 \u092e\u0947\u0902 \u0928\u093f\u0935\u0947\u0936 \u092e\u0947\u0902 \u0935\u0943\u0926\u094d\u0927\u093f",
        "Rising minimum support prices for all crops / \u0938\u092d\u0940 \u092b\u0938\u0932\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0928\u094d\u092f\u0942\u0928\u0924\u092e \u0938\u092e\u0930\u094d\u0925\u0928 \u092e\u0942\u0932\u094d\u092f (MSP) \u092e\u0947\u0902 \u0935\u0943\u0926\u094d\u0927\u093f",
        "Shift toward export-oriented cash crops and reduced public investment / \u0928\u093f\u0930\u094d\u092f\u093e\u0924-\u0909\u0928\u094d\u092e\u0941\u0916 \u0928\u0915\u0926\u0940 \u092b\u0938\u0932\u094b\u0902 \u0915\u0940 \u0913\u0930 \u092c\u0926\u0932\u093e\u0935 \u0914\u0930 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0928\u093f\u0935\u0947\u0936 \u092e\u0947\u0902 \u0915\u092e\u0940",
        "Greater protection through higher import duties / \u0909\u091a\u094d\u091a \u0906\u092f\u093e\u0924 \u0936\u0941\u0932\u094d\u0915 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0905\u0927\u093f\u0915 \u0938\u0941\u0930\u0915\u094d\u0937\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The sweeping post-1991 economic reforms disproportionately and heavily focused entirely on booming industry and services, tragically leading to a massive, systemic neglect of agriculture. A fundamentally key reason for the sector&#x27;s severe stagnation was the drastic, crippling reduction in vital public investment directly in rural agricultural infrastructure like irrigation. / 1991 \u0915\u0947 \u092c\u093e\u0926 \u0915\u0947 \u0935\u094d\u092f\u093e\u092a\u0915 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0928\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0924\u0947\u091c\u0940 \u0938\u0947 \u092c\u0922\u093c\u0924\u0947 \u0909\u0926\u094d\u092f\u094b\u0917 \u0914\u0930 \u0938\u0947\u0935\u093e\u0913\u0902 \u092a\u0930 \u0905\u0938\u0902\u0917\u0924 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u093f\u092f\u093e, \u091c\u093f\u0938\u0938\u0947 \u0926\u0941\u0916\u0926 \u0930\u0942\u092a \u0938\u0947 \u0915\u0943\u0937\u093f \u0915\u0940 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u092a\u094d\u0930\u0923\u093e\u0932\u0940\u0917\u0924 \u0909\u092a\u0947\u0915\u094d\u0937\u093e \u0939\u0941\u0908\u0964 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0917\u0902\u092d\u0940\u0930 \u0920\u0939\u0930\u093e\u0935 \u0915\u093e \u090f\u0915 \u092e\u094c\u0932\u093f\u0915 \u092e\u0941\u0916\u094d\u092f \u0915\u093e\u0930\u0923 \u0938\u093f\u0902\u091a\u093e\u0908 \u091c\u0948\u0938\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0915\u0943\u0937\u093f \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u0947 \u092e\u0947\u0902 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0930\u0942\u092a \u0938\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0928\u093f\u0935\u0947\u0936 \u092e\u0947\u0902 \u092d\u093e\u0930\u0940, \u0905\u092a\u0902\u0917 \u0915\u092e\u0940 \u0925\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q27.</b> Which scheme was launched to promote entrepreneurship among SC and ST communities? / \u0905\u0928\u0941\u0938\u0942\u091a\u093f\u0924 \u091c\u093e\u0924\u093f (SC) \u0914\u0930 \u0905\u0928\u0941\u0938\u0942\u091a\u093f\u0924 \u091c\u0928\u091c\u093e\u0924\u093f (ST) \u0938\u092e\u0941\u0926\u093e\u092f\u094b\u0902 \u0915\u0947 \u092c\u0940\u091a \u0909\u0926\u094d\u092f\u092e\u093f\u0924\u093e \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u094c\u0928 \u0938\u0940 \u092f\u094b\u091c\u0928\u093e \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC Steno, 06/08/2025, Shift-1]",
      "options": [
        "Atmanirbhar Bharat Abhiyan / \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930 \u092d\u093e\u0930\u0924 \u0905\u092d\u093f\u092f\u093e\u0928",
        "Make in India / \u092e\u0947\u0915 \u0907\u0928 \u0907\u0902\u0921\u093f\u092f\u093e",
        "Stand-Up India / \u0938\u094d\u091f\u0948\u0902\u0921-\u0905\u092a \u0907\u0902\u0921\u093f\u092f\u093e",
        "Start-Up India / \u0938\u094d\u091f\u093e\u0930\u094d\u091f-\u0905\u092a \u0907\u0902\u0921\u093f\u092f\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The highly targeted Stand-Up India Scheme was officially and purposefully launched on April 5, 2016, to forcefully promote robust entrepreneurship at the grassroots. Its absolute specific mandate is to strongly facilitate massive bank loans strictly between \u20b910 lakh and \u20b91 Crore to at least one SC/ST borrower per bank branch. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0932\u0915\u094d\u0937\u093f\u0924 \u0938\u094d\u091f\u0948\u0902\u0921-\u0905\u092a \u0907\u0902\u0921\u093f\u092f\u093e \u092f\u094b\u091c\u0928\u093e 5 \u0905\u092a\u094d\u0930\u0948\u0932, 2016 \u0915\u094b \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f\u092a\u0942\u0930\u094d\u0923 \u0930\u0942\u092a \u0938\u0947 \u091c\u092e\u0940\u0928\u0940 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092e\u091c\u092c\u0942\u0924 \u0909\u0926\u094d\u092f\u092e\u093f\u0924\u093e \u0915\u094b \u092c\u0932\u092a\u0942\u0930\u094d\u0935\u0915 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u091c\u0928\u093e\u0926\u0947\u0936 \u092a\u094d\u0930\u0924\u093f \u092c\u0948\u0902\u0915 \u0936\u093e\u0916\u093e \u092e\u0947\u0902 \u0915\u092e \u0938\u0947 \u0915\u092e \u090f\u0915 \u090f\u0938\u0938\u0940/\u090f\u0938\u091f\u0940 (SC/ST) \u0909\u0927\u093e\u0930\u0915\u0930\u094d\u0924\u093e \u0915\u094b \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u20b910 \u0932\u093e\u0916 \u0914\u0930 \u20b91 \u0915\u0930\u094b\u0921\u093c \u0915\u0947 \u092c\u0940\u091a \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092c\u0948\u0902\u0915 \u090b\u0923 \u0915\u0940 \u0926\u0943\u0922\u093c\u0924\u093e \u0938\u0947 \u0938\u0941\u0935\u093f\u0927\u093e \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q28.</b> Which institution was established in 1961 to promote management education in India? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0936\u093f\u0915\u094d\u0937\u093e \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f 1961 \u092e\u0947\u0902 \u0915\u093f\u0938 \u0938\u0902\u0938\u094d\u0925\u093e \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC Steno, 06/08/2025, Shift-1]",
      "options": [
        "University Grants Commission (UGC) / \u0935\u093f\u0936\u094d\u0935\u0935\u093f\u0926\u094d\u092f\u093e\u0932\u092f \u0905\u0928\u0941\u0926\u093e\u0928 \u0906\u092f\u094b\u0917 (UGC)",
        "Indian Institute of Management (IIM) / \u092d\u093e\u0930\u0924\u0940\u092f \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0938\u0902\u0938\u094d\u0925\u093e\u0928 (IIM)",
        "National Productivity Council (NPC) / \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0909\u0924\u094d\u092a\u093e\u0926\u0915\u0924\u093e \u092a\u0930\u093f\u0937\u0926 (NPC)",
        "Indian Institute of Technology (IIT) / \u092d\u093e\u0930\u0924\u0940\u092f \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940 \u0938\u0902\u0938\u094d\u0925\u093e\u0928 (IIT)"
      ],
      "correctIndex": 1,
      "explanation": "The visionary Government of India strategically established the elite Indian Institutes of Management (IIMs) to actively provide absolutely world-class management education. IIM Calcutta was historically the very first to be officially established in November 1961, followed incredibly closely by IIM Ahmedabad in December 1961. / \u0926\u0942\u0930\u0926\u0930\u094d\u0936\u0940 \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930\u0940\u092f \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0936\u093f\u0915\u094d\u0937\u093e \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0915\u0941\u0932\u0940\u0928 \u092d\u093e\u0930\u0924\u0940\u092f \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0938\u0902\u0938\u094d\u0925\u093e\u0928\u094b\u0902 (IIM) \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u0940\u0964 \u0906\u0908\u0906\u0908\u090f\u092e \u0915\u0932\u0915\u0924\u094d\u0924\u093e (IIM Calcutta) \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0928\u0935\u0902\u092c\u0930 1961 \u092e\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0939\u094b\u0928\u0947 \u0935\u093e\u0932\u093e \u092a\u0939\u0932\u093e \u0938\u0902\u0938\u094d\u0925\u093e\u0928 \u0925\u093e, \u091c\u093f\u0938\u0915\u0947 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u0930\u0940\u092c \u0926\u093f\u0938\u0902\u092c\u0930 1961 \u092e\u0947\u0902 \u0906\u0908\u0906\u0908\u090f\u092e \u0905\u0939\u092e\u0926\u093e\u092c\u093e\u0926 (IIM Ahmedabad) \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0939\u0941\u0908\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q29.</b> Which of the following is not a Maharatna company as of 2024? / 2024 \u0924\u0915 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u092e\u0939\u093e\u0930\u0924\u094d\u0928 \u0915\u0902\u092a\u0928\u0940 \u0928\u0939\u0940\u0902 \u0939\u0948? [SSC Steno, 06/08/2025, Shift-2]",
      "options": [
        "Oil &amp; Natural Gas Corporation Limited / \u0911\u092f\u0932 \u090f\u0902\u0921 \u0928\u0947\u091a\u0941\u0930\u0932 \u0917\u0948\u0938 \u0915\u0949\u0930\u094d\u092a\u094b\u0930\u0947\u0936\u0928 \u0932\u093f\u092e\u093f\u091f\u0947\u0921 (ONGC)",
        "Hindustan Copper Limited / \u0939\u093f\u0902\u0926\u0941\u0938\u094d\u0924\u093e\u0928 \u0915\u0949\u092a\u0930 \u0932\u093f\u092e\u093f\u091f\u0947\u0921",
        "National Thermal Power Corporation Limited / \u0928\u0947\u0936\u0928\u0932 \u0925\u0930\u094d\u092e\u0932 \u092a\u093e\u0935\u0930 \u0915\u0949\u0930\u094d\u092a\u094b\u0930\u0947\u0936\u0928 \u0932\u093f\u092e\u093f\u091f\u0947\u0921 (NTPC)",
        "Steel Authority of India Limited / \u0938\u094d\u091f\u0940\u0932 \u0905\u0925\u0949\u0930\u093f\u091f\u0940 \u0911\u092b \u0907\u0902\u0921\u093f\u092f\u093e \u0932\u093f\u092e\u093f\u091f\u0947\u0921 (SAIL)"
      ],
      "correctIndex": 1,
      "explanation": "Hindustan Copper Limited (HCL) is strictly classified as a Miniratna (Category-I) CPSE, absolutely not a Maharatna. The prestigious Maharatna status is aggressively granted only to absolute top-tier CPSEs boasting significant global presence and massive financial autonomy, such as the gigantic NTPC, ONGC, and SAIL. / \u0939\u093f\u0902\u0926\u0941\u0938\u094d\u0924\u093e\u0928 \u0915\u0949\u092a\u0930 \u0932\u093f\u092e\u093f\u091f\u0947\u0921 (HCL) \u0915\u094b \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u092e\u093f\u0928\u0940\u0930\u0932 (\u0936\u094d\u0930\u0947\u0923\u0940-I) CPSE \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948, \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u092e\u0939\u093e\u0930\u0924\u094d\u0928 \u0928\u0939\u0940\u0902\u0964 \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 \u092e\u0939\u093e\u0930\u0924\u094d\u0928 \u0915\u093e \u0926\u0930\u094d\u091c\u093e \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0915\u0947\u0935\u0932 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0909\u092a\u0938\u094d\u0925\u093f\u0924\u093f \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u094d\u0935\u093e\u092f\u0924\u094d\u0924\u0924\u093e \u0935\u093e\u0932\u0947 \u092a\u0942\u0930\u094d\u0923 \u0936\u0940\u0930\u094d\u0937-\u0938\u094d\u0924\u0930\u0940\u092f \u0938\u0940\u092a\u0940\u090f\u0938\u0908 \u0915\u094b \u0926\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948, \u091c\u0948\u0938\u0947 \u0915\u093f \u0935\u093f\u0936\u093e\u0932 \u090f\u0928\u091f\u0940\u092a\u0940\u0938\u0940, \u0913\u090f\u0928\u091c\u0940\u0938\u0940 \u0914\u0930 \u0938\u0947\u0932\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q30.</b> Which Indian state was the first to benefit from the Green Revolution? / \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0915\u093e \u0932\u093e\u092d \u0909\u0920\u093e\u0928\u0947 \u0935\u093e\u0932\u093e \u092a\u0939\u0932\u093e \u092d\u093e\u0930\u0924\u0940\u092f \u0930\u093e\u091c\u094d\u092f \u0915\u094c\u0928 \u0938\u093e \u0925\u093e? [SSC Steno, 06/08/2025, Shift-2]",
      "options": [
        "Rajasthan / \u0930\u093e\u091c\u0938\u094d\u0925\u093e\u0928",
        "Uttar Pradesh / \u0909\u0924\u094d\u0924\u0930 \u092a\u094d\u0930\u0926\u0947\u0936",
        "Punjab / \u092a\u0902\u091c\u093e\u092c",
        "Haryana / \u0939\u0930\u093f\u092f\u093e\u0923\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The profoundly fertile state of Punjab was the absolute pioneer and by far the biggest massive beneficiary of the historic Green Revolution initiated in the mid-1960s. Its highly established irrigation system and deeply enterprising farmers made it the absolutely ideal, perfect testing ground for modern High Yielding Variety (HYV) wheat seeds. / \u092a\u0902\u091c\u093e\u092c \u0915\u093e \u0905\u0924\u094d\u092f\u0902\u0924 \u0909\u092a\u091c\u093e\u090a \u0930\u093e\u091c\u094d\u092f \u092a\u0942\u0930\u094d\u0923 \u0905\u0917\u094d\u0930\u0923\u0940 \u0925\u093e \u0914\u0930 1960 \u0915\u0947 \u0926\u0936\u0915 \u0915\u0947 \u092e\u0927\u094d\u092f \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0939\u0941\u0908 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0915\u093e \u0905\u092c \u0924\u0915 \u0915\u093e \u0938\u092c\u0938\u0947 \u092c\u0921\u093c\u093e \u0932\u093e\u092d\u093e\u0930\u094d\u0925\u0940 \u0925\u093e\u0964 \u0907\u0938\u0915\u0940 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0938\u093f\u0902\u091a\u093e\u0908 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0914\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0909\u0926\u094d\u092f\u092e\u0936\u0940\u0932 \u0915\u093f\u0938\u093e\u0928\u094b\u0902 \u0928\u0947 \u0907\u0938\u0947 \u0906\u0927\u0941\u0928\u093f\u0915 \u0909\u091a\u094d\u091a \u0909\u092a\u091c \u0926\u0947\u0928\u0947 \u0935\u093e\u0932\u0940 \u0915\u093f\u0938\u094d\u092e (HYV) \u0917\u0947\u0939\u0942\u0902 \u0915\u0947 \u092c\u0940\u091c\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0906\u0926\u0930\u094d\u0936, \u0938\u0939\u0940 \u092a\u0930\u0940\u0915\u094d\u0937\u0923 \u092e\u0948\u0926\u093e\u0928 \u092c\u0928\u093e \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q31.</b> Which government body was responsible for implementing the Technology Mission on Oilseeds? / \u0924\u093f\u0932\u0939\u0928 \u092a\u0930 \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940 \u092e\u093f\u0936\u0928 (Technology Mission on Oilseeds) \u0915\u094b \u0932\u093e\u0917\u0942 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u094c\u0928 \u0938\u093e \u0938\u0930\u0915\u093e\u0930\u0940 \u0928\u093f\u0915\u093e\u092f \u091c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930 \u0925\u093e? [SSC Steno, 06/08/2025, Shift-2]",
      "options": [
        "Ministry of Defense / \u0930\u0915\u094d\u0937\u093e \u092e\u0902\u0924\u094d\u0930\u093e\u0932\u092f",
        "Ministry of Education / \u0936\u093f\u0915\u094d\u0937\u093e \u092e\u0902\u0924\u094d\u0930\u093e\u0932\u092f",
        "Ministry of Commerce / \u0935\u093e\u0923\u093f\u091c\u094d\u092f \u092e\u0902\u0924\u094d\u0930\u093e\u0932\u092f",
        "Ministry of Agriculture / \u0915\u0943\u0937\u093f \u092e\u0902\u0924\u094d\u0930\u093e\u0932\u092f"
      ],
      "correctIndex": 3,
      "explanation": "The highly ambitious Technology Mission on Oilseeds (TMO), aggressively launched in 1986, operated strictly and entirely under the direct supreme oversight of the Ministry of Agriculture. Its absolute paramount goal was to massively increase domestic production of crucial oilseeds and drastically reduce heavy national import dependence. / 1986 \u092e\u0947\u0902 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0924\u093f\u0932\u0939\u0928 \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940 \u092e\u093f\u0936\u0928 (TMO), \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0914\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0915\u0943\u0937\u093f \u092e\u0902\u0924\u094d\u0930\u093e\u0932\u092f \u0915\u0940 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0938\u0930\u094d\u0935\u094b\u091a\u094d\u091a \u0928\u093f\u0917\u0930\u093e\u0928\u0940 \u092e\u0947\u0902 \u0938\u0902\u091a\u093e\u0932\u093f\u0924 \u0939\u094b\u0924\u093e \u0925\u093e\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0938\u0930\u094d\u0935\u094b\u092a\u0930\u093f \u0932\u0915\u094d\u0937\u094d\u092f \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0924\u093f\u0932\u0939\u0928\u094b\u0902 \u0915\u0947 \u0918\u0930\u0947\u0932\u0942 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u094b \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092c\u0922\u093c\u093e\u0928\u093e \u0914\u0930 \u092d\u093e\u0930\u0940 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0906\u092f\u093e\u0924 \u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0915\u094b \u0915\u093e\u092b\u0940 \u0915\u092e \u0915\u0930\u0928\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q32.</b> The regulatory framework adopted by India between 1947 and 1990, often referred to as the &#x27;License Raj,&#x27; aimed to direct economic activity. What was a significant unintended negative consequence often associated with this system? / 1947 \u0914\u0930 1990 \u0915\u0947 \u092c\u0940\u091a \u092d\u093e\u0930\u0924 \u0926\u094d\u0935\u093e\u0930\u093e \u0905\u092a\u0928\u093e\u090f \u0917\u090f \u0935\u093f\u0928\u093f\u092f\u093e\u092e\u0915 \u0922\u093e\u0902\u091a\u0947, \u091c\u093f\u0938\u0947 \u0905\u0915\u094d\u0938\u0930 &#x27;\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c&#x27; \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948, \u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0906\u0930\u094d\u0925\u093f\u0915 \u0917\u0924\u093f\u0935\u093f\u0927\u093f \u0915\u094b \u0928\u093f\u0930\u094d\u0926\u0947\u0936\u093f\u0924 \u0915\u0930\u0928\u093e \u0925\u093e\u0964 \u0907\u0938 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0938\u0947 \u091c\u0941\u0921\u093c\u093e \u090f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0905\u0928\u092a\u0947\u0915\u094d\u0937\u093f\u0924 \u0928\u0915\u093e\u0930\u093e\u0924\u094d\u092e\u0915 \u092a\u0930\u093f\u0923\u093e\u092e \u0915\u094d\u092f\u093e \u0925\u093e? [SSC Steno, 06/08/2025, Shift-3]",
      "options": [
        "The creation of barriers to entry for new businesses potentially stifling innovation and leading to inefficiencies. / \u0928\u090f \u0935\u094d\u092f\u0935\u0938\u093e\u092f\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u092a\u094d\u0930\u0935\u0947\u0936 \u092c\u093e\u0927\u093e\u0913\u0902 \u0915\u093e \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u091c\u094b \u0938\u0902\u092d\u093e\u0935\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0928\u0935\u093e\u091a\u093e\u0930 \u0915\u094b \u0930\u094b\u0915\u0924\u093e \u0939\u0948 \u0914\u0930 \u0905\u0915\u094d\u0937\u092e\u0924\u093e\u0913\u0902 \u0915\u0940 \u0913\u0930 \u0932\u0947 \u091c\u093e\u0924\u093e \u0939\u0948\u0964",
        "A rapid increase in the quality and global competitiveness of Indian-made goods due to stringent quality control measures. / \u0915\u0921\u093c\u0947 \u0917\u0941\u0923\u0935\u0924\u094d\u0924\u093e \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u0909\u092a\u093e\u092f\u094b\u0902 \u0915\u0947 \u0915\u093e\u0930\u0923 \u092d\u093e\u0930\u0924\u0940\u092f \u0928\u093f\u0930\u094d\u092e\u093f\u0924 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0940 \u0917\u0941\u0923\u0935\u0924\u094d\u0924\u093e \u0914\u0930 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u092e\u0947\u0902 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0935\u0943\u0926\u094d\u0927\u093f\u0964",
        "A significant reduction in corruption and bureaucratic delays in obtaining necessary approvals for economic activities. / \u0906\u0930\u094d\u0925\u093f\u0915 \u0917\u0924\u093f\u0935\u093f\u0927\u093f\u092f\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0906\u0935\u0936\u094d\u092f\u0915 \u0905\u0928\u0941\u092e\u094b\u0926\u0928 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u0930\u0928\u0947 \u092e\u0947\u0902 \u092d\u094d\u0930\u0937\u094d\u091f\u093e\u091a\u093e\u0930 \u0914\u0930 \u0928\u094c\u0915\u0930\u0936\u093e\u0939\u0940 \u0915\u0940 \u0926\u0947\u0930\u0940 \u092e\u0947\u0902 \u0909\u0932\u094d\u0932\u0947\u0916\u0928\u0940\u092f \u0915\u092e\u0940\u0964",
        "The fostering of a highly competitive market environment with numerous players in each industry. / \u092a\u094d\u0930\u0924\u094d\u092f\u0947\u0915 \u0909\u0926\u094d\u092f\u094b\u0917 \u092e\u0947\u0902 \u0915\u0908 \u0916\u093f\u0932\u093e\u0921\u093c\u093f\u092f\u094b\u0902 \u0915\u0947 \u0938\u093e\u0925 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u0940 \u092c\u093e\u091c\u093e\u0930 \u0915\u0947 \u092e\u093e\u0939\u094c\u0932 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e\u0964"
      ],
      "correctIndex": 0,
      "explanation": "The heavily bureaucratic &quot;License Raj&quot; oppressively required businesses to obtain complex government licenses for almost every single action. A massive, catastrophic negative consequence was the rigid creation of incredibly high entry barriers, which tragically protected existing grossly inefficient firms from any real competition, completely stifling innovation and growth. / \u092d\u093e\u0930\u0940 \u0928\u094c\u0915\u0930\u0936\u093e\u0939\u0940 &quot;\u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c&quot; \u0915\u0947 \u0932\u093f\u090f \u0935\u094d\u092f\u0935\u0938\u093e\u092f\u094b\u0902 \u0915\u094b \u0932\u0917\u092d\u0917 \u0939\u0930 \u090f\u0915 \u0915\u093e\u0930\u094d\u0930\u0935\u093e\u0908 \u0915\u0947 \u0932\u093f\u090f \u091c\u091f\u093f\u0932 \u0938\u0930\u0915\u093e\u0930\u0940 \u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u0930\u0928\u0947 \u0915\u0940 \u0926\u092e\u0928\u0915\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0906\u0935\u0936\u094d\u092f\u0915\u0924\u093e \u0925\u0940\u0964 \u090f\u0915 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u0928\u0915\u093e\u0930\u093e\u0924\u094d\u092e\u0915 \u092a\u0930\u093f\u0923\u093e\u092e \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0909\u091a\u094d\u091a \u092a\u094d\u0930\u0935\u0947\u0936 \u092c\u093e\u0927\u093e\u0913\u0902 \u0915\u093e \u0915\u0920\u094b\u0930 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0925\u093e, \u091c\u093f\u0938\u0928\u0947 \u0926\u0941\u0916\u0926 \u0930\u0942\u092a \u0938\u0947 \u092e\u094c\u091c\u0942\u0926\u093e \u092c\u0947\u0939\u0926 \u0905\u0915\u0941\u0936\u0932 \u092b\u0930\u094d\u092e\u094b\u0902 \u0915\u094b \u0915\u093f\u0938\u0940 \u092d\u0940 \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0938\u0       "reference": ""

    {
      "text": "<b>Q33.</b> The PM-MITRA scheme is focused on which of the following objectives? / \u092a\u0940\u090f\u092e-\u092e\u093f\u0924\u094d\u0930 (PM-MITRA) \u092f\u094b\u091c\u0928\u093e \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u092a\u0930 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0939\u0948? [SSC Steno, 06/08/2025, Shift-3]",
      "options": [

        "Expanding petroleum retail chains / \u092a\u0947\u091f\u094d\u0930\u094b\u0932\u093f\u092f\u092e \u0916\u0941\u0926\u0930\u093e \u0936\u094d\u0930\u0943\u0902\u0916\u0932\u093e\u0913\u0902 \u0915\u093e \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The highly strategic PM-MITRA (Pradhan Mantri Mega Integrated Textile Region and Apparel) scheme aims to robustly empower the entire Indian textile industry. Its absolute core objective is to massively set up 7 gigantic, world-class Mega Textile Parks featuring plug-and-play facilities to drastically boost massive global textile exports. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u092a\u0940\u090f\u092e-\u092e\u093f\u0924\u094d\u0930 (PM-MITRA) \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u092a\u0942\u0930\u0947 \u092d\u093e\u0930\u0924\u0940\u092f \u0915\u092a\u0921\u093c\u093e \u0909\u0926\u094d\u092f\u094b\u0917 \u0915\u094b \u092e\u091c\u092c\u0942\u0924\u0940 \u0938\u0947 \u0938\u0936\u0915\u094d\u0924 \u092c\u0928\u093e\u0928\u093e \u0939\u0948\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092e\u0941\u0916\u094d\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0915\u092a\u0921\u093c\u093e \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b \u0915\u093e\u092b\u0940 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092a\u094d\u0932\u0917-\u090f\u0902\u0921-\u092a\u094d\u0932\u0947 \u0938\u0941\u0935\u093f\u0927\u093e\u0913\u0902 \u0915\u0940 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0935\u093e\u0932\u0947 7 \u0935\u093f\u0936\u093e\u0932, \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930\u0940\u092f \u092e\u0947\u0917\u093e \u091f\u0947\u0915\u094d\u0938\u091f\u093e\u0907\u0932 \u092a\u093e\u0930\u094d\u0915 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u0930\u0928\u093e \u0939\u0948\u0964",
      "reference": ""

    {
      "text": "<b>Q34.</b> What is one of the major benefits of providing Geographical Indication (GI) tags to local products made by rural artisans? / \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0915\u093e\u0930\u0940\u0917\u0930\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u092c\u0928\u093e\u090f \u0917\u090f \u0938\u094d\u0925\u093e\u0928\u0940\u092f \u0909\u0924\u094d\u092a\u093e\u0926\u094b\u0902 \u0915\u094b \u092d\u094c\u0917\u094b\u0932\u093f\u0915 \u0938\u0902\u0915\u0947\u0924 (GI) \u091f\u0948\u0917 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u0947 \u0915\u093e \u090f\u0915 \u092a\u094d\u0930\u092e\u0941\u0916 \u0932\u093e\u092d \u0915\u094d\u092f\u093e \u0939\u0948? [SSC Steno, 06/08/2025, Shift-3]",
      "options": [
        "It helps preserve traditional knowledge and boosts rural incomes / \u092f\u0939 \u092a\u093e\u0930\u0902\u092a\u0930\u093f\u0915 \u091c\u094d\u091e\u093e\u0928 \u0915\u094b \u0938\u0902\u0930\u0915\u094d\u0937\u093f\u0924 \u0915\u0930\u0928\u0947 \u092e\u0947\u0902 \u092e\u0926\u0926 \u0915\u0930\u0924\u093e \u0939\u0948 \u0914\u0930 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0906\u092f \u0915\u094b \u092c\u0922\u093c\u093e\u0924\u093e \u0939\u0948",
        "It increases dependency on imported goods / \u092f\u0939 \u0906\u092f\u093e\u0924\u093f\u0924 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u092a\u0930 \u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u092c\u0922\u093c\u093e\u0924\u093e \u0939\u0948",
        "It removes the need for skill development in rural areas / \u092f\u0939 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u092e\u0947\u0902 \u0915\u094c\u0936\u0932 \u0935\u093f\u0915\u093e\u0938 \u0915\u0940 \u0906\u0935\u0936\u094d\u092f\u0915\u0924\u093e \u0915\u094b \u0926\u0942\u0930 \u0915\u0930\u0924\u093e \u0939\u0948",
        "It allows unrestricted copying of the product by other regions / \u092f\u0939 \u0905\u0928\u094d\u092f \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0909\u0924\u094d\u092a\u093e\u0926 \u0915\u0940 \u0905\u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093f\u0924 \u0928\u0915\u0932 \u0915\u0940 \u0905\u0928\u0941\u092e\u0924\u093f \u0926\u0947\u0924\u093e \u0939\u0948"
      ],
      "correctIndex": 0,
      "explanation": "A highly prestigious Geographical Indication (GI) Tag legally identifies a unique product as originating from a specific territory. The absolute major benefit is that it fiercely protects invaluable traditional knowledge from cruel misappropriation. By officially branding the product as perfectly authentic, artisans command a massive premium price, boosting incomes. / \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 \u092d\u094c\u0917\u094b\u0932\u093f\u0915 \u0938\u0902\u0915\u0947\u0924 (GI) \u091f\u0948\u0917 \u0915\u093e\u0928\u0942\u0928\u0940 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u0905\u0926\u094d\u0935\u093f\u0924\u0940\u092f \u0909\u0924\u094d\u092a\u093e\u0926 \u0915\u094b \u090f\u0915 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0938\u0947 \u0909\u0924\u094d\u092a\u0928\u094d\u0928 \u0939\u094b\u0928\u0947 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092a\u0939\u091a\u093e\u0928\u0924\u093e \u0939\u0948\u0964 \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u092e\u0941\u0916 \u0932\u093e\u092d \u092f\u0939 \u0939\u0948 \u0915\u093f \u092f\u0939 \u092c\u0939\u0941\u092e\u0942\u0932\u094d\u092f \u092a\u093e\u0930\u0902\u092a\u0930\u093f\u0915 \u091c\u094d\u091e\u093e\u0928 \u0915\u094b \u0915\u094d\u0930\u0942\u0930 \u0926\u0941\u0930\u0941\u092a\u092f\u094b\u0917 \u0938\u0947 \u092e\u091c\u092c\u0942\u0924\u0940 \u0938\u0947 \u092c\u091a\u093e\u0924\u093e \u0939\u0948\u0964 \u0909\u0924\u094d\u092a\u093e\u0926 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092a\u094d\u0930\u093e\u092e\u093e\u0923\u093f\u0915 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u094d\u0930\u093e\u0902\u0921 \u0915\u0930\u0915\u0947, \u0915\u093e\u0930\u0940\u0917\u0930\u094b\u0902 \u0915\u094b \u092d\u093e\u0930\u0940     {
      "text": "<b>Q35.</b> The Industrial Policy Resolution of 1948 aimed at: / 1948 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a (Industrial Policy Resolution) \u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u094d\u092f\u093e \u0925\u093e? [SSC Steno, 06/08/2025, Shift-3]",
      "options": [

      "explanation": "The deeply historic Industrial Policy Resolution (IPR) of 1948 officially laid the very first foundational blueprint for a Mixed Economy in newly independent India. Crucially, it explicitly and aggressively emphasized the massive promotion, expansion, and absolute dominance of the state-owned public sector across key strategic industries to drive national development. / 1948 \u0915\u0947 \u0917\u0939\u0930\u0947 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a (IPR) \u0928\u0947 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0928\u0935 \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092e\u093f\u0936\u094d\u0930\u093f\u0924 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0947 \u0932\u093f\u090f \u0938\u092c\u0938\u0947 \u092a\u0939\u0932\u093e \u0906\u0927\u093e\u0930\u092d\u0942\u0924 \u0916\u093e\u0915\u093e \u0924\u0948\u092f\u093e\u0930 \u0915\u093f\u092f\u093e\u0964 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0930\u0942\u092a \u0938\u0947, \u0907\u0938\u0928\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0935\u093f\u0915\u093e\u0938 \u0915\u094b \u091a\u0932\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092a\u094d\u0930\u092e\u0941\u0916 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u092e\u0947\u0902 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u094d\u0930\u091a\u093e\u0930, \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0914\u0930 \u092a\u0942\u0930\u094d\u0923 \u09     },
    {
      "text": "<b>Q39.</b> Consider the land reforms implemented in India between 1947 and 1990. What was one of the main objectives of these reforms? / 1947 \u0914\u0930 1990 \u0915\u0947 \u092c\u0940\u091a \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0932\u093e\u0917\u0942 \u0915\u093f\u090f \u0917\u090f \u092d\u0942\u092e\u093f \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u092a\u0930 \u0935\u093f\u091a\u093e\u0930 \u0915\u0930\u0947\u0902\u0964 \u0907\u0928 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u092e\u0941\u0916\u094d\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f\u094b\u0902 \u092e\u0947\u0902 \u0938\u0947 \u090f\u0915 \u0915\u094d\u092f\u093e \u0925\u093e? [SSC Steno, 08/08/2025, Shift-1]",
      "options": [
        "To encourage the widespread adoption of mechanized farming techniques. / \u092f\u0902\u0924\u094d\u0930\u0940\u0915\u0943\u0924 \u0916\u0947\u0924\u0940 \u0924\u0915\u0928\u0940\u0915\u094b\u0902 \u0915\u094b \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u092a\u0928\u093e\u0928\u0947 \u0915\u094b \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u0930\u0928\u093e\u0964",
        "To promote the cultivation of cash crops for export. / \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u0947 \u0932\u093f\u090f \u0928\u0915\u0926\u0940 \u092b\u0938\u0932\u094b\u0902 \u0915\u0940 \u0916\u0947\u0924\u0940 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e\u0964",
        "To reduce the concentration of land ownership and protect the interests of small farmers. / \u092d\u0942\u092e\u093f \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0915\u0947 \u0938\u0902\u0915\u0947\u0902\u0926\u094d\u0930\u0923 (concentration) \u0915\u094b \u0915\u092e \u0915\u0930\u0928\u093e \u0914\u0930 \u091b\u094b\u091f\u0947 \u0915\u093f\u0938\u093e\u0928\u094b\u0902 \u0915\u0947 \u0939\u093f\u0924\u094b\u0902 \u0915\u0940 \u0930\u0915\u094d\u0937\u093e \u0915\u0930\u0928\u093e\u0964",
        "To consolidate large landholdings in the hands of a few individuals. / \u0915\u0941\u091b \u0935\u094d\u092f\u0915\u094d\u0924\u093f\u092f\u094b\u0902 \u0915\u0947 \u0939\u093e\u0925\u094b\u0902 \u092e\u0947\u0902 \u092c\u0921\u093c\u0940 \u092d\u0942\u092e\u093f \u091c\u094b\u0924 \u0915\u094b \u0938\u092e\u0947\u0915\u093f\u0924 \u0915\u0930\u0928\u093e\u0964"
      ],
      "correctIndex": 2,
      "explanation": "The absolute central, deeply moral objective of post-independence land reforms was sweeping social equity. The monumental reforms strictly aimed to aggressively reduce the massive concentration of land ownership violently held by a few elite landlords (Zamindars) and righteously redistribute it directly to the actual impoverished tillers. / \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0915\u0947 \u092c\u093e\u0926 \u0915\u0947 \u092d\u0942\u092e\u093f \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f, \u0917\u0939\u0930\u093e \u0928\u0948\u0924\u093f\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0935\u094d\u092f\u093e\u092a\u0915 \u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u0938\u092e\u093e\u0928\u0924\u093e \u0925\u093e\u0964 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u093e \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u0941\u091b \u0915\u0941\u0932\u0940\u0928 \u091c\u092e\u0940\u0902\u0926\u093e\u0930\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0939\u093f\u0902\u0938\u0915 \u0930\u0942\u092a \u0938\u0947 \u092d\u0942\u092e\u093f \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0915\u0940 \u0935\u093f\u0936\u093e\u0932 \u090f\u0915\u093e\u0917\u094d\u0930\u0924\u093e \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0915\u092e \u0915\u0930\u0928\u093e \u0914\u0930 \u0907\u0938\u0947 \u0938\u0940\u0927\u0947 \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u0917\u0930\u0940\u092c \u0915\u093f\u0938\u093e\u0928\u094b\u0902 \u0915\u094b \u092b\u093f\u0930 \u0938\u0947 \u0935\u093f\u0924\u0930\u093f\u0924 \u0915\u0930\u0928\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q40.</b> Which key reform in 1991 specifically addressed the inefficiency of public sector enterprises and promoted competition in industrial production? / 1991 \u092e\u0947\u0902 \u0915\u093f\u0938 \u092a\u094d\u0930\u092e\u0941\u0916 \u0938\u0941\u0927\u093e\u0930 \u0928\u0947 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u092e\u094b\u0902 \u0915\u0940 \u0905\u0915\u094d\u0937\u092e\u0924\u093e \u0915\u094b \u0938\u0902\u092c\u094b\u0927\u093f\u0924 \u0915\u093f\u092f\u093e \u0914\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u092e\u0947\u0902 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u093f\u092f\u093e? [SSC Steno, 08/08/2025, Shift-1]",
      "options": [
        "Complex Industrial Licensing process / \u091c\u091f\u093f\u0932 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e",
        "Public Distribution System Reform / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0935\u093f\u0924\u0930\u0923 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0938\u0941\u0927\u093e\u0930",
        "Fiscal Responsibility Act / \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0909\u0924\u094d\u0924\u0930\u0926\u093e\u092f\u093f\u0924\u094d\u0935 \u0905\u0927\u093f\u0928\u093f\u092f\u092e",
        "Privatization of profit-making PSUs / \u0932\u093e\u092d \u0915\u092e\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 \u092a\u0940\u090f\u0938\u092f\u0942 (PSUs) \u0915\u093e \u0928\u093f\u091c\u0940\u0915\u0930\u0923"
      ],
      "correctIndex": 3,
      "explanation": "A massively crucial, highly transformative pillar of the 1991 reforms was Strategic Privatization (or Disinvestment). By deliberately selling stakes in bloated Public Sector Units (PSUs), the government aggressively aimed to expose these historically protected units directly to fierce market discipline, radically improve their efficiency, and vigorously promote intense competition. / 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u093e \u090f\u0915 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940 \u0938\u094d\u0924\u0902\u092d \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0928\u093f\u091c\u0940\u0915\u0930\u0923 (\u092f\u093e \u0935\u093f\u0928\u093f\u0935\u0947\u0936) \u0925\u093e\u0964 \u092b\u0942\u0932\u0947 \u0939\u0941\u090f \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u0907\u0915\u093e\u0907\u092f\u094b\u0902 (PSUs) \u092e\u0947\u0902 \u091c\u093e\u0928\u092c\u0942\u091d\u0915\u0930 \u0939\u093f\u0938\u094d\u0938\u0947\u0926\u093e\u0930\u0940 \u092c\u0947\u091a\u0915\u0930, \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0907\u0928 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u0930\u0915\u094d\u0937\u093f\u0924 \u0907\u0915\u093e\u0907\u092f\u094b\u0902 \u0915\u094b \u0938\u0940\u0927\u0947 \u092d\u092f\u0902\u0915\u0930 \u092c\u093e\u091c\u093e\u0930 \u0905\u0928\u0941\u0936\u093e\u0938\u0928 \u092e\u0947\u0902 \u0909\u091c\u093e\u0917\u0930 \u0915\u0930\u0928\u0947, \u0909\u0928\u0915\u0940 \u0926\u0915\u094d\u0937\u0924\u093e \u092e\u0947\u0902 \u092e\u094c\u0932\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u0941\u0927\u093e\u0930 \u0915\u0930\u0928\u0947 \u0914\u0930 \u0924\u0940\u0935\u094d\u0930 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0915\u094b \u091c\u094b\u0930\u0926\u093e\u0930 \u0922\u0902\u0917 \u0938\u0947 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u093e \u0932\u0915\u094d\u0937\u094d\u092f \u0930\u0916\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q41.</b> What is a key focus area of the PM Gati Shakti National Master Plan? / \u092a\u0940\u090f\u092e \u0917\u0924\u093f \u0936\u0915\u094d\u0924\u093f \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092e\u093e\u0938\u094d\u091f\u0930 \u092a\u094d\u0932\u093e\u0928 \u0915\u093e \u092a\u094d\u0930\u092e\u0941\u0916 \u092b\u094b\u0915\u0938 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u094d\u092f\u093e \u0939\u0948? [SSC Steno, 08/08/2025, Shift-1]",
      "options": [
        "Urban development / \u0936\u0939\u0930\u0940 \u0935\u093f\u0915\u093e\u0938",
        "Agricultural subsidies / \u0915\u0943\u0937\u093f \u0938\u092c\u094d\u0938\u093f\u0921\u0940",
        "Rural electrification / \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0935\u093f\u0926\u094d\u092f\u0941\u0924\u0940\u0915\u0930\u0923",
        "Multi-modal connectivity / \u092e\u0932\u094d\u091f\u0940-\u092e\u094b\u0921\u0932 \u0915\u0928\u0947\u0915\u094d\u091f\u093f\u0935\u093f\u091f\u0940 (Multi-modal connectivity)"
      ],
      "correctIndex": 3,
      "explanation": "The incredibly massive PM Gati Shakti National Master Plan, officially launched in 2021, is a deeply integrated digital platform. Its absolute overarching key focus is revolutionizing &quot;Multi-modal Connectivity&quot;\u2014seamlessly integrating massive roads, high-speed railways, global airports, and deep ports to drastically slash national logistics costs and supercharge efficiency. / \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u0940\u090f\u092e \u0917\u0924\u093f \u0936\u0915\u094d\u0924\u093f \u0928\u0947\u0936\u0928\u0932 \u092e\u093e\u0938\u094d\u091f\u0930 \u092a\u094d\u0932\u093e\u0928, \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 2021 \u092e\u0947\u0902 \u0932\u0949\u0928\u094d\u091a \u0915\u093f\u092f\u093e \u0917\u092f\u093e, \u090f\u0915 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u090f\u0915\u0940\u0915\u0943\u0924 \u0921\u093f\u091c\u093f\u091f\u0932 \u092a\u094d\u0932\u0947\u091f\u092b\u0949\u0930\u094d\u092e \u0939\u0948\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0935\u094d\u092f\u093e\u092a\u0915 \u092e\u0941\u0916\u094d\u092f \u092b\u094b\u0915\u0938 &quot;\u092e\u0932\u094d\u091f\u0940-\u092e\u094b\u0921\u0932 \u0915\u0928\u0947\u0915\u094d\u091f\u093f\u0935\u093f\u091f\u0940&quot; \u092e\u0947\u0902 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0932\u093e\u0928\u093e \u0939\u0948 - \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0930\u0938\u0926 \u0932\u093e\u0917\u0924 \u0915\u094b \u0915\u092e \u0915\u0930\u0928\u0947 \u0914\u0930 \u0926\u0915\u094d\u0937\u0924\u093e \u0915\u094b \u0938\u0941\u092a\u0930\u091a\u093e\u0930\u094d\u091c \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0935\u093f\u0936\u093e\u0932 \u0938\u0921\u093c\u0915\u094b\u0902, \u0939\u093e\u0908-\u0938\u094d\u092a\u0940\u0921 \u0930\u0947\u0932\u0935\u0947, \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0939\u0935\u093e\u0908 \u0905\u0921\u094d\u0921\u094b\u0902 \u0914\u0930 \u0917\u0939\u0930\u0947 \u092c\u0902\u0926\u0930\u0917\u093e\u0939\u094b\u0902 \u0915\u094b \u092e\u0942\u0932 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915\u0940\u0915\u0943\u0924 \u0915\u0930\u0928\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q42.</b> The Industrial Policy Resolution 1956 played a significant role in shaping India&#x27;s industrial development strategy. What was a key feature of this resolution? / \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a 1956 (IPR 1956) \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0930\u0923\u0928\u0940\u0924\u093f \u0915\u094b \u0906\u0915\u093e\u0930 \u0926\u0947\u0928\u0947 \u092e\u0947\u0902 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092d\u0942\u092e\u093f\u0915\u093e \u0928\u093f\u092d\u093e\u0908\u0964 \u0907\u0938 \u0938\u0902\u0915\u0932\u094d\u092a \u0915\u0940 \u090f\u0915 \u092a\u094d\u0930\u092e\u0941\u0916 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0915\u094d\u092f\u093e \u0925\u0940? [SSC Steno, 08/08/2025, Shift-1]",
      "options": [
        "It strongly advocated for the dominance of the private sector in all industrial activities. / \u0907\u0938\u0928\u0947 \u0938\u092d\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0917\u0924\u093f\u0935\u093f\u0927\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u092a\u094d\u0930\u092d\u0941\u0924\u094d\u0935 \u0915\u0940 \u091c\u094b\u0930\u0926\u093e\u0930 \u0935\u0915\u093e\u0932\u0924 \u0915\u0940\u0964",
        "It emphasized the development of small-scale and cottage industries while discouraging large-scale enterprises. / \u0907\u0938\u0928\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u0915\u0947 \u0909\u0926\u094d\u092f\u092e\u094b\u0902 \u0915\u094b \u0939\u0924\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u0930\u0924\u0947 \u0939\u0941\u090f \u0932\u0918\u0941 \u0914\u0930 \u0915\u0941\u091f\u0940\u0930 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e\u0964",
        "It promoted a completely open and competitive industrial environment with minimal [regulation]. / \u0907\u0938\u0928\u0947 \u0928\u094d\u092f\u0942\u0928\u0924\u092e [\u0935\u093f\u0928\u093f\u092f\u092e\u0928] \u0915\u0947 \u0938\u093e\u0925 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0916\u0941\u0932\u0947 \u0914\u0930 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0935\u093e\u0924\u093e\u0935\u0930\u0923 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u093f\u092f\u093e\u0964",
        "It categorized industries into three schedules, with the public sector leading in strategic and heavy industries. / \u0907\u0938\u0928\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0924\u0940\u0928 \u0905\u0928\u0941\u0938\u0942\u091a\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e, \u091c\u093f\u0938\u092e\u0947\u0902 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u092e\u0947\u0902 \u0905\u0917\u094d\u0930\u0923\u0940 \u0930\u0939\u093e\u0964"
      ],
      "correctIndex": 3,
      "explanation": "The highly historic IPR 1956 is fundamentally defined by its rigorous, strict three-tier classification (Schedules A, B, C) of national industries. Its absolute central, defining feature was firmly establishing the total dominance of the state-owned public sector unconditionally over all crucial strategic, heavy, and basic industries. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 IPR 1956 \u092e\u0942\u0932 \u0930\u0942\u092a \u0938\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0905\u092a\u0928\u0947 \u0915\u0920\u094b\u0930, \u0938\u0916\u094d\u0924 \u0924\u094d\u0930\u093f-\u0938\u094d\u0924\u0930\u0940\u092f \u0935\u0930\u094d\u0917\u0940\u0915\u0930\u0923 (\u0905\u0928\u0941\u0938\u0942\u091a\u0940 \u090f, \u092c\u0940, \u0938\u0940) \u0926\u094d\u0935\u093e\u0930\u093e \u092a\u0930\u093f\u092d\u093e\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948\u0964 \u0907\u0938\u0915\u0940 \u092a\u0942\u0930\u094d\u0923 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f, \u092a\u093e\u0930\u093f\u092d\u093e\u0937\u093f\u0915 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0938\u092d\u0940 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0930\u0923\u0928\u0940\u0924\u093f\u0915, \u092d\u093e\u0930\u0940 \u0914\u0930 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u092a\u0930 \u092c\u093f\u0928\u093e \u0936\u0930\u094d\u0924 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0915\u0941\u0932 \u092a\u094d\u0930\u092d\u0941\u0924\u094d\u0935 \u0915\u094b \u0926\u0943\u0922\u093c\u0924\u093e \u0938\u0947 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u0930 \u0930\u0939\u0940 \u0925\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q43.</b> What is the aim of Ayushman Bharat scheme? / \u0906\u092f\u0941\u0937\u094d\u092e\u093e\u0928 \u092d\u093e\u0930\u0924 \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u094d\u092f\u093e \u0939\u0948? [SSC Steno, 08/08/2025, Shift-2]",
      "options": [
        "Clean drinking water for all / \u0938\u092d\u0940 \u0915\u0947 \u0932\u093f\u090f \u0938\u094d\u0935\u091a\u094d\u091b \u092a\u0947\u092f\u091c\u0932",
        "Free education to children / \u092c\u091a\u094d\u091a\u094b\u0902 \u0915\u094b \u092e\u0941\u092b\u094d\u0924 \u0936\u093f\u0915\u094d\u0937\u093e",
        "Housing for the poor / \u0917\u0930\u0940\u092c\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0906\u0935\u093e\u0938",
        "Health insurance for the poor / \u0917\u0930\u0940\u092c\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0938\u094d\u0935\u093e\u0938\u094d\u0925\u094d\u092f \u092c\u0940\u092e\u093e"
      ],
      "correctIndex": 3,
      "explanation": "The highly monumental Ayushman Bharat Pradhan Mantri Jan Arogya Yojana (PM-JAY) explicitly aims to massively provide absolutely free, high-quality health insurance coverage of up to a massive \u20b95 lakh per family per year, specifically targeting over 12 crore severely poor and highly vulnerable Indian families. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0906\u092f\u0941\u0937\u094d\u092e\u093e\u0928 \u092d\u093e\u0930\u0924 \u092a\u094d\u0930\u0927\u093e\u0928\u092e\u0902\u0924\u094d\u0930\u0940 \u091c\u0928 \u0906\u0930\u094b\u0917\u094d\u092f \u092f\u094b\u091c\u0928\u093e (PM-JAY) \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u0924\u093f \u092a\u0930\u093f\u0935\u093e\u0930 \u092a\u094d\u0930\u0924\u093f \u0935\u0930\u094d\u0937 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 5 \u0932\u093e\u0916 \u0930\u0941\u092a\u092f\u0947 \u0924\u0915 \u0915\u093e \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u092e\u0941\u092b\u094d\u0924, \u0909\u091a\u094d\u091a \u0917\u0941\u0923\u0935\u0924\u094d\u0924\u093e \u0935\u093e\u0932\u093e \u0938\u094d\u0935\u093e\u0938\u094d\u0925\u094d\u092f \u092c\u0940\u092e\u093e \u0915\u0935\u0930\u0947\u091c \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u0947 \u0915\u093e \u0932\u0915\u094d\u0937\u094d\u092f \u0930\u0916\u0924\u0940 \u0939\u0948, \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 12 \u0915\u0930\u094b\u0921\u093c \u0938\u0947 \u0905\u0927\u093f\u0915 \u0917\u0902\u092d\u0940\u0930 \u0930\u0942\u092a \u0938\u0947 \u0917\u0930\u0940\u092c \u0914\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u092e\u091c\u094b\u0930 \u092d\u093e\u0930\u0924\u0940\u092f \u092a\u0930\u093f\u0935\u093e\u0930\u094b\u0902 \u0915\u094b \u0932\u0915\u094d\u0937\u093f\u0924 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q44.</b> Which of the following schemes provides annual income support to farmers directly into their bank accounts? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u092f\u094b\u091c\u0928\u093e \u0915\u093f\u0938\u093e\u0928\u094b\u0902 \u0915\u094b \u0938\u0940\u0927\u0947 \u0909\u0928\u0915\u0947 \u092c\u0948\u0902\u0915 \u0916\u093e\u0924\u094b\u0902 \u092e\u0947\u0902 \u0935\u093e\u0930\u094d\u0937\u093f\u0915 \u0906\u092f \u0938\u0939\u093e\u092f\u0924\u093e \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u0940 \u0939\u0948? [SSC Steno, 08/08/2025, Shift-3]",
      "options": [
        "PM Fasal Bima Yojana / \u092a\u0940\u090f\u092e \u092b\u0938\u0932 \u092c\u0940\u092e\u093e \u092f\u094b\u091c\u0928\u093e",
        "MGNREGA / \u092e\u0928\u0930\u0947\u0917\u093e (MGNREGA)",
        "PM Jan Dhan Yojana / \u092a\u0940\u090f\u092e \u091c\u0928 \u0927\u0928 \u092f\u094b\u091c\u0928\u093e",
        "PM-KISAN / \u092a\u0940\u090f\u092e-\u0915\u093f\u0938\u093e\u0928 (PM-KISAN)"
      ],
      "correctIndex": 3,
      "explanation": "The highly impactful Pradhan Mantri Kisan Samman Nidhi (PM-KISAN) is a massive central scheme that directly and reliably provides a crucial financial benefit of exactly \u20b96,000 per year directly transferred strictly into the bank accounts of all eligible landholding farmer families in three flawless installments. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u092d\u093e\u0935\u0936\u093e\u0932\u0940 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0915\u093f\u0938\u093e\u0928 \u0938\u092e\u094d\u092e\u093e\u0928 \u0928\u093f\u0927\u093f (PM-KISAN) \u090f\u0915 \u0935\u093f\u0936\u093e\u0932 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0939\u0948 \u091c\u094b \u0938\u0940\u0927\u0947 \u0914\u0930 \u092e\u091c\u093c\u092c\u0942\u0924\u0940 \u0938\u0947 \u0938\u092d\u0940 \u092a\u093e\u0924\u094d\u0930 \u092d\u0942\u092e\u093f\u0927\u093e\u0930\u0915 \u0915\u093f\u0938\u093e\u0928 \u092a\u0930\u093f\u0935\u093e\u0930\u094b\u0902 \u0915\u0947 \u092c\u0948\u0902\u0915 \u0916\u093e\u0924\u094b\u0902 \u092e\u0947\u0902 \u0924\u0940\u0928 \u0924\u094d\u0930\u0941\u091f\u093f\u0939\u0940\u0928 \u0915\u093f\u0936\u094d\u0924\u094b\u0902 \u092e\u0947\u0902 \u092a\u094d\u0930\u0924\u093f \u0935\u0930\u094d\u0937 \u0920\u0940\u0915 \u20b96,000 \u0915\u093e \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0932\u093e\u092d \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q45.</b> Which of the following is the central objective of Saksham Anganwadi and Poshan 2.0 scheme? / \u0938\u0915\u094d\u0937\u092e \u0906\u0902\u0917\u0928\u0935\u093e\u0921\u093c\u0940 \u0914\u0930 \u092a\u094b\u0937\u0923 2.0 (Poshan 2.0) \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0939\u0948? [SSC Steno, 08/08/2025, Shift-3]",
      "options": [
        "Providing skill-based employment / \u0915\u094c\u0936\u0932 \u0906\u0927\u093e\u0930\u093f\u0924 \u0930\u094b\u091c\u0917\u093e\u0930 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u093e",
        "Urban health surveillance / \u0936\u0939\u0930\u0940 \u0938\u094d\u0935\u093e\u0938\u094d\u0925\u094d\u092f \u0928\u093f\u0917\u0930\u093e\u0928\u0940",
        "Food security through MSP / \u090f\u092e\u090f\u0938\u092a\u0940 (MSP) \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0916\u093e\u0926\u094d\u092f \u0938\u0941\u0930\u0915\u094d\u0937\u093e",
        "Strengthening early childhood care and nutrition delivery systems / \u092a\u094d\u0930\u093e\u0930\u0902\u092d\u093f\u0915 \u092c\u093e\u0932\u094d\u092f\u093e\u0935\u0938\u094d\u0925\u093e \u0926\u0947\u0916\u092d\u093e\u0932 \u0914\u0930 \u092a\u094b\u0937\u0923 \u0935\u093f\u0924\u0930\u0923 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0915\u094b \u092e\u091c\u092c\u0942\u0924 \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "The highly integrated Saksham Anganwadi and Poshan 2.0 is a massive, modernized national nutrition support programme. Its absolute central, overriding objective is to fiercely address severe malnutrition by aggressively strengthening crucial early childhood care and massively upgrading the entire rural nutrition delivery infrastructure (Anganwadis). / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u090f\u0915\u0940\u0915\u0943\u0924 \u0938\u0915\u094d\u0937\u092e \u0906\u0902\u0917\u0928\u0935\u093e\u0921\u093c\u0940 \u0914\u0930 \u092a\u094b\u0937\u0923 2.0 \u090f\u0915 \u0935\u093f\u0936\u093e\u0932, \u0906\u0927\u0941\u0928\u093f\u0915 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092a\u094b\u0937\u0923 \u0938\u0939\u093e\u092f\u0924\u093e \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e \u0939\u0948\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f, \u0905\u0924\u093f\u0935\u094d\u092f\u093e\u092a\u0940 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0930\u0902\u092d\u093f\u0915 \u092c\u093e\u0932\u094d\u092f\u093e\u0935\u0938\u094d\u0925\u093e \u0926\u0947\u0916\u092d\u093e\u0932 \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092e\u091c\u092c\u0942\u0924 \u0915\u0930\u0915\u0947 \u0914\u0930 \u0938\u0902\u092a\u0942\u0930\u094d\u0923 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u092a\u094b\u0937\u0923 \u0935\u093f\u0924\u0930\u0923 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u0947 (\u0906\u0902\u0917\u0928\u0935\u093e\u0921\u093c\u0940) \u0915\u094b \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0905\u092a\u0917\u094d\u0930\u0947\u0921 \u0915\u0930\u0915\u0947 \u0917\u0902\u092d\u0940\u0930 \u0915\u0941\u092a\u094b\u0937\u0923 \u0915\u094b \u0926\u0942\u0930 \u0915\u0930\u0928\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q46.</b> Which of the following was a major criticism of the industrial policy followed in India during 1950-1990? / 1950-1990 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0905\u092a\u0928\u093e\u0908 \u0917\u0908 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0915\u0940 \u090f\u0915 \u092a\u094d\u0930\u092e\u0941\u0916 \u0906\u0932\u094b\u091a\u0928\u093e \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u0925\u0940? [SSC Steno, 08/08/2025, Shift-3]",
      "options": [
        "Too much emphasis on exports. / \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u092a\u0930 \u092c\u0939\u0941\u0924 \u0905\u0927\u093f\u0915 \u091c\u094b\u0930\u0964",
        "Neglect of the public sector. / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u0909\u092a\u0947\u0915\u094d\u0937\u093e\u0964",
        "Excessive competition among domestic industries. / \u0918\u0930\u0947\u0932\u0942 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u092c\u0940\u091a \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e\u0964",
        "Creation of a protected market leading to inefficiency and lack of innovation. / \u090f\u0915 \u0938\u0902\u0930\u0915\u094d\u0937\u093f\u0924 \u092c\u093e\u091c\u093e\u0930 \u0915\u093e \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u091c\u093f\u0938\u0938\u0947 \u0905\u0915\u0941\u0936\u0932\u0924\u093e \u0914\u0930 \u0928\u0935\u093e\u091a\u093e\u0930 \u0915\u0940 \u0915\u092e\u0940 \u0939\u0941\u0908\u0964"
      ],
      "correctIndex": 3,
      "explanation": "A massively prominent, absolutely undeniable major criticism of the rigid Import-Substitution and archaic License Raj era (1950-90) was that it deliberately created a highly sheltered, artificially protected domestic market. Without the vital pressure to compete globally, domestic firms lacked any incentive to innovate, fostering catastrophic, widespread inefficiency. / \u0915\u0920\u094b\u0930 \u0906\u092f\u093e\u0924-\u092a\u094d\u0930\u0924\u093f\u0938\u094d\u0925\u093e\u092a\u0928 \u0914\u0930 \u092a\u0941\u0930\u093e\u0924\u0928 \u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u0930\u093e\u091c \u092f\u0941\u0917 (1950-90) \u0915\u0940 \u090f\u0915 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u094d\u0930\u092e\u0941\u0916, \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0928\u093f\u0930\u094d\u0935\u093f\u0935\u093e\u0926 \u092a\u094d\u0930\u092e\u0941\u0916 \u0906\u0932\u094b\u091a\u0928\u093e \u092f\u0939 \u0925\u0940 \u0915\u093f \u0907\u0938\u0928\u0947 \u091c\u093e\u0928\u092c\u0942\u091d\u0915\u0930 \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0906\u0936\u094d\u0930\u092f, \u0915\u0943\u0924\u094d\u0930\u093f\u092e \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u0930\u0915\u094d\u0937\u093f\u0924 \u0918\u0930\u0947\u0932\u0942 \u092c\u093e\u091c\u093e\u0930 \u092c\u0928\u093e\u092f\u093e\u0964 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0915\u0930\u0928\u0947 \u0915\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0926\u092c\u093e\u0935 \u0915\u0947 \u092c\u093f\u0928\u093e, \u0918\u0930\u0947\u0932\u0942 \u092b\u0930\u094d\u092e\u094b\u0902 \u092e\u0947\u0902 \u0928\u0935\u093e\u091a\u093e\u0930 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u093f\u0938\u0940 \u092d\u0940 \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u0928 \u0915\u0940 \u0915\u092e\u0940 \u0925\u0940, \u091c\u093f\u0938\u0938\u0947 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940, \u0935\u094d\u092f\u093e\u092a\u0915 \u0905\u0915\u094d\u0937\u092e\u0924\u093e \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u092e\u093f\u0932\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q47.</b> Which of the following statements about light industries is correct? / \u0939\u0932\u094d\u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 (light industries) \u0915\u0947 \u092c\u093e\u0930\u0947 \u092e\u0947\u0902 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0915\u0925\u0928 \u0938\u0939\u0940 \u0939\u0948? [SSC CGL Tier 1, 12 Sep 2025, Shift-2]",
      "options": [
        "They process heavy ores and minerals. / \u0935\u0947 \u092d\u093e\u0930\u0940 \u0905\u092f\u0938\u094d\u0915\u094b\u0902 \u0914\u0930 \u0916\u0928\u093f\u091c\u094b\u0902 \u0915\u094b \u0938\u0902\u0938\u093e\u0927\u093f\u0924 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964",
        "They require bulky and heavy raw materials. / \u0909\u0928\u094d\u0939\u0947\u0902 \u092d\u093e\u0930\u0940-\u092d\u0930\u0915\u092e \u0915\u091a\u094d\u091a\u0947 \u092e\u093e\u0932 \u0915\u0940 \u0906\u0935\u0936\u094d\u092f\u0915\u0924\u093e \u0939\u094b\u0924\u0940 \u0939\u0948\u0964",
        "They produce large-scale industrial machinery. / \u0935\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u092e\u0936\u0940\u0928\u0930\u0940 \u0915\u093e \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964",
        "Use light materials to make consumer goods. / \u0935\u0947 \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0935\u0938\u094d\u0924\u0941\u090f\u0902 \u092c\u0928\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0939\u0932\u094d\u0915\u0940 \u0938\u093e\u092e\u0917\u094d\u0930\u0940 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964"
      ],
      "correctIndex": 3,
      "explanation": "In strict industrial classification, Light industries are exclusively characterized by the mass production of everyday consumer goods (like simple electronics or clothes) rather than massive business capital goods. They fundamentally and inherently use highly lightweight raw materials and are significantly more labor-intensive compared to heavy industries. / \u0938\u0916\u094d\u0924 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0935\u0930\u094d\u0917\u0940\u0915\u0930\u0923 \u092e\u0947\u0902, \u0939\u0932\u094d\u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0947 \u092c\u091c\u093e\u092f \u0930\u094b\u091c\u093c\u092e\u0930\u094d\u0930\u093e \u0915\u0940 \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0935\u0938\u094d\u0924\u0941\u0913\u0902 (\u091c\u0948\u0938\u0947 \u0938\u0930\u0932 \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u0949\u0928\u093f\u0915\u094d\u0938 \u092f\u093e \u0915\u092a\u0921\u093c\u0947) \u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0940 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0939\u0948\u0964 \u0935\u0947 \u092e\u094c\u0932\u093f\u0915 \u0914\u0930 \u0938\u094d\u0935\u093e\u092d\u093e\u0935\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0939\u0932\u094d\u0915\u0947 \u0915\u091a\u094d\u091a\u0947 \u092e\u093e\u0932 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0940 \u0924\u0941\u0932\u0928\u093e \u092e\u0947\u0902 \u0915\u093e\u092b\u0940 \u0905\u0927\u093f\u0915 \u0936\u094d\u0930\u092e-\u0917\u0939\u0928 \u0939\u094b\u0924\u0947 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q48.</b> Which of the following industry pairs is correctly grouped as heavy industries? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0909\u0926\u094d\u092f\u094b\u0917 \u092f\u0941\u0917\u094d\u092e \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0938\u0939\u0940 \u0922\u0902\u0917 \u0938\u0947 \u0938\u092e\u0942\u0939\u0940\u0915\u0943\u0924 \u0939\u0948? [SSC CGL Tier 1, 13 Sep 2025, Shift-2]",
      "options": [
        "Sewing machines and Paint brushes / \u0938\u093f\u0932\u093e\u0908 \u092e\u0936\u0940\u0928 \u0914\u0930 \u092a\u0947\u0902\u091f \u092c\u094d\u0930\u0936",
        "Electric bulbs and Fuse wires / \u0907\u0932\u0947\u0915\u094d\u091f\u094d\u0930\u093f\u0915 \u092c\u0932\u094d\u092c \u0914\u0930 \u092b\u094d\u092f\u0942\u091c \u0924\u093e\u0930",
        "Watches and Paint brushes / \u0918\u0921\u093c\u093f\u092f\u093e\u0901 \u0914\u0930 \u092a\u0947\u0902\u091f \u092c\u094d\u0930\u0936",
        "Shipbuilding and Automobile / \u091c\u0939\u093e\u091c \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0914\u0930 \u0911\u091f\u094b\u092e\u094b\u092c\u093e\u0907\u0932"
      ],
      "correctIndex": 3,
      "explanation": "Massive Shipbuilding and massive Automobile manufacturing are undeniably and perfectly correctly classified strictly as heavy industries. They inherently involve incredibly colossal capital investments, highly complex production processes, rely on massively heavy raw materials (like steel), and produce gigantic, extremely heavy physical final products. / \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u091c\u0939\u093e\u091c \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0911\u091f\u094b\u092e\u094b\u092c\u093e\u0907\u0932 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0915\u094b \u0928\u093f\u0930\u094d\u0935\u093f\u0935\u093e\u0926 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u0939\u0940 \u0922\u0902\u0917 \u0938\u0947 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948\u0964 \u0935\u0947 \u0938\u094d\u0935\u093e\u092d\u093e\u0935\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0940 \u092a\u0942\u0902\u091c\u0940 \u0928\u093f\u0935\u0947\u0936, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u091c\u091f\u093f\u0932 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e\u0913\u0902 \u0915\u094b \u0936\u093e\u092e\u093f\u0932 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092d\u093e\u0930\u0940 \u0915\u091a\u094d\u091a\u0947 \u092e\u093e\u0932 (\u091c\u0948\u0938\u0947 \u0938\u094d\u091f\u0940\u0932) \u092a\u0930 \u0928\u093f\u0930\u094d\u092d\u0930 \u0915\u0930\u0924\u0947 \u0

        "Export-led growth / \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0906\u0927\u093e\u0930\u093f\u0924 \u0935\u093f\u0915\u093e\u0938",
        "Poverty reduction and modernization / \u0917\u0930\u0940\u092c\u0940 \u0909\u0928\u094d\u092e\u0942\u0932\u0928 \u0914\u0930 \u0906\u0927\u0941\u0928\u093f\u0915\u0940\u0915\u0930\u0923"
      ],
      "correctIndex": 3,
      "explanation": "The highly ambitious Sixth Five-Year Plan (1980-85) resolutely aimed at launching a direct, aggressive attack on massive poverty. Its absolute main overarching objectives were strict poverty reduction (fulfilling the &quot;Garibi Hatao&quot; mandate) and heavy technological modernization to drastically improve core efficiency and agricultural productivity across the entire struggling economy. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u091b\u0920\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1980-85) \u0928\u0947 \u0926\u0943\u0922\u093c\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0917\u0930\u0940\u092c\u0940 \u092a\u0930 \u0938\u0940\u0927\u093e, \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0939\u092e\u0932\u093e \u0936\u0941\u0930\u0942 \u0915\u0930\u0928\u0947 \u0915\u093e \u0932\u0915\u094d\u0937\u094d\u092f \u0930\u0916\u093e\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092e\u0941\u0916\u094d\u092f \u0905\u0924\u093f\u0935\u094d\u092f\u093e\u092a\u0940 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0938\u0916\u094d\u0924 \u0917\u0930\u0940\u092c\u0940 \u092e\u0947\u0902 \u0915\u092e\u0940 (&quot;\u0917\u0930\u0940\u092c\u0940 \u0939\u091f\u093e\u0913&quot; \u091c\u0928\u093e\u0926\u0947\u0936 \u0915\u094b \u092a\u0942\u0930\u093e \u0915\u0930\u0928\u093e) \u0914\u0930 \u092a\u0942\u0930\u0940 \u0938\u0902\u0918\u0930\u094d\u0937\u0930\u0924 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u092e\u0947\u0902 \u092e\u0941\u0916\u094d\u092f \u0926\u0915\u094d\u0937\u0924\u093e \u0914\u0930 \u0915\u0943\u0937\u093f \u0909\u0924\u094d\u092a\u093e\u0926\u0915\u0924\u093e \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0938\u0941\u0927\u093e\u0930 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0940 \u0924\u0915\u0928\u0940\u0915\u0940 \u0906\u0927\u0941\u0928\u093f\u0915\u0940\u0915\u0930\u0923 \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q88.</b> Q110. What was the main focus of India&#x27;s Sixth Five-Year Plan (1980-1985)? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u091b\u0920\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1980-1985) \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u092b\u094b\u0915\u0938 \u0915\u094d\u092f\u093e \u0925\u093e? [SSC CGL Tier 1, 26 Sep 2025, Shift-1]",
      "options": [
        "Heavy industrialization / \u092d\u093e\u0930\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923",
        "Food self-sufficiency / \u0916\u093e\u0926\u094d\u092f \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e",
        "Economic liberalization / \u0906\u0930\u094d\u0925\u093f\u0915 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923",
        "Poverty alleviation and modernization / \u0917\u0930\u0940\u092c\u0940 \u0909\u0928\u094d\u092e\u0942\u0932\u0928 \u0914\u0930 \u0906\u0927\u0941\u0928\u093f\u0915\u0940\u0915\u0930\u0923"
      ],
      "correctIndex": 3,
      "explanation": "The absolute primary focus during the Sixth Plan was aggressively placed squarely on the massive removal of national poverty (Poverty Alleviation) and the urgent attainment of deep technological self-reliance (Modernization). It strategically introduced massive, historic poverty alleviation schemes like the highly renowned IRDP (Integrated Rural Development Programme). / \u091b\u0920\u0940 \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0927\u094d\u092f\u093e\u0928 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0917\u0930\u0940\u092c\u0940 (\u0917\u0930\u0940\u092c\u0940 \u0909\u0928\u094d\u092e\u0942\u0932\u0928) \u0915\u094b \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0939\u091f\u093e\u0928\u0947 \u0914\u0930 \u0917\u0939\u0928 \u0924\u0915\u0928\u0940\u0915\u0940 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e (\u0906\u0927\u0941\u0928\u093f\u0915\u0940\u0915\u0930\u0923) \u0915\u0940 \u0924\u0924\u094d\u0915\u093e\u0932 \u092a\u094d\u0930\u093e\u092a\u094d\u0924\u093f \u092a\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0930\u0916\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0928\u0947 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 IRDP (\u090f\u0915\u0940\u0915\u0943\u0924 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0935\u093f\u0915\u093e\u0938 \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e) \u091c\u0948\u0938\u0940 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0917\u0930\u0940\u092c\u0940 \u0909\u0928\u094d\u092e\u0942\u0932\u0928 \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 \u0915\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q89.</b> Q111. Which plan period is known as the &#x27;Plan Holiday&#x27;? / \u0915\u093f\u0938 \u092f\u094b\u091c\u0928\u093e \u0905\u0935\u0927\u093f \u0915\u094b &#x27;\u092f\u094b\u091c\u0928\u093e \u0905\u0935\u0915\u093e\u0936&#x27; (Plan Holiday) \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 14 Oct 2025]",
      "options": [
        "1961-66",
        "1969-74",
        "1974-79",
        "1966-69"
      ],
      "correctIndex": 3,
      "explanation": "The incredibly turbulent three-year period exactly from 1966 to 1969 is officially and historically called the &#x27;Plan Holiday&#x27;. Directly due to the devastating, catastrophic failure of the Third Plan (heavily caused by back-to-back wars and massive drought), the government forcefully suspended formal Five-Year Plans, implementing three short Annual Plans instead. / 1966 \u0938\u0947 1969 \u0924\u0915 \u0915\u0947 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0905\u0936\u093e\u0902\u0924 \u0924\u0940\u0928 \u0938\u093e\u0932 \u0915\u0940 \u0905\u0935\u0927\u093f \u0915\u094b \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0914\u0930 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 &#x27;\u092f\u094b\u091c\u0928\u093e \u0905\u0935\u0915\u093e\u0936&#x27; \u0915\u0939\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964 \u0938\u0940\u0927\u0947 \u0924\u0940\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e \u0915\u0940 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940, \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u0935\u093f\u092b\u0932\u0924\u093e \u0915\u0947 \u0915\u093e\u0930\u0923 (\u0932\u0917\u093e\u0924\u093e\u0930 \u092f\u0941\u0926\u094d\u0927\u094b\u0902 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0938\u0942\u0916\u0947 \u0915\u0947 \u0915\u093e\u0930\u0923), \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u092c\u0932\u092a\u0942\u0930\u094d\u0935\u0915 \u0914\u092a\u091a\u093e\u0930\u093f\u0915 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u094b \u0928\u093f\u0932\u0902\u092c\u093f\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e, \u0907\u0938\u0915\u0947 \u092c\u091c\u093e\u092f \u0924\u0940\u0928 \u091b\u094b\u091f\u0940 \u0935\u093e\u0930\u094d\u0937\u093f\u0915 \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u094b \u0932\u093e\u0917\u0942 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q90.</b> Q114. Who among the following was the deputy chairman of Planning Commission under the tenth five year plan? / \u0926\u0938\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0924\u0939\u0924 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0947 \u0909\u092a\u093e\u0927\u094d\u092f\u0915\u094d\u0937 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0925\u0947? [SSC CHSL, 12 Nov 2025, Shift-2]",
      "options": [
        "Shankarrao Chavan / \u0936\u0902\u0915\u0930\u0930\u093e\u0935 \u091a\u0935\u094d\u0939\u093e\u0923",
        "Yaswant Sinha / \u092f\u0936\u0935\u0902\u0924 \u0938\u093f\u0928\u094d\u0939\u093e",
        "Shiv Shankar / \u0936\u093f\u0935 \u0936\u0902\u0915\u0930",
        "C. Pant / \u0938\u0940. \u092a\u0902\u0924"
      ],
      "correctIndex": 3,
      "explanation": "The prominent statesman K.C. Pant officially and capably served as the Deputy Chairman of the highly influential Planning Commission precisely during the crucial formulation and initial long period of the Tenth Five-Year Plan (2002-2007). He steadily held this absolute top planning office directly from 1999 up to 2004. / \u092a\u094d\u0930\u092e\u0941\u0916 \u0930\u093e\u091c\u0928\u0947\u0924\u093e \u0915\u0947.\u0938\u0940. \u092a\u0902\u0924 \u0928\u0947 \u0926\u0938\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (2002-2007) \u0915\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0914\u0930 \u092a\u094d\u0930\u093e\u0930\u0902\u092d\u093f\u0915 \u0932\u0902\u092c\u0940 \u0905\u0935\u0927\u093f \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u092d\u093e\u0935\u0936\u093e\u0932\u0940 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0947 \u0909\u092a\u093e\u0927\u094d\u092f\u0915\u094d\u0937 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0914\u0930 \u0938\u0915\u094d\u0937\u092e \u0930\u0942\u092a \u0938\u0947 \u0915\u093e\u0930\u094d\u092f \u0915\u093f\u092f\u093e\u0964 \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 1999 \u0938\u0947 2004 \u0924\u0915 \u0932\u0917\u093e\u0924\u093e\u0930 \u0907\u0938 \u092a\u0942\u0930\u094d\u0923 \u0936\u0940\u0930\u094d\u0937 \u092f\u094b\u091c\u0928\u093e \u0915\u093e\u0930\u094d\u092f\u093e\u0932\u092f \u0915\u094b \u0938\u0940\u0927\u0947 \u0938\u0902\u092d\u093e\u0932\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q91.</b> Q115. Following the Industrial Policy of India ______ the government has set up a special board known as Foreign Investment Promotion Board. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f ______ \u0915\u0947 \u092c\u093e\u0926 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0938\u0902\u0935\u0930\u094d\u0927\u0928 \u092c\u094b\u0930\u094d\u0921 (FIPB) \u0928\u093e\u092e\u0915 \u090f\u0915 \u0935\u093f\u0936\u0947\u0937 \u092c\u094b\u0930\u094d\u0921 \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u0940\u0964 [SSC CHSL, 12 Nov 2025, Shift-3]",
      "options": [
        "1948",
        "1956",
        "1977",
        "1991"
      ],
      "correctIndex": 3,
      "explanation": "Immediately and strategically following the radical Industrial Policy of 1991, which aggressively liberalized massive foreign investment, the Indian government rapidly established the highly powerful Foreign Investment Promotion Board (FIPB). Its explicit primary purpose was to seamlessly negotiate with massive multinational firms and swiftly approve critical Foreign Direct Investment (FDI) proposals. / 1991 \u0915\u0940 \u0915\u091f\u094d\u091f\u0930\u092a\u0902\u0925\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0915\u0947 \u0924\u0941\u0930\u0902\u0924 \u0914\u0930 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u093e\u0932\u0928 \u0915\u0930\u0924\u0947 \u0939\u0941\u090f, \u091c\u093f\u0938\u0928\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0909\u0926\u093e\u0930 \u092c\u0928\u093e\u092f\u093e, \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0938\u0902\u0935\u0930\u094d\u0927\u0928 \u092c\u094b\u0930\u094d\u0921 (FIPB) \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u0940\u0964 \u0907\u0938\u0915\u093e \u0938\u094d\u092a\u0937\u094d\u091f \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092c\u0939\u0941\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092b\u0930\u094d\u092e\u094b\u0902 \u0915\u0947 \u0938\u093e\u0925 \u0928\u093f\u0930\u094d\u092c\u093e\u0927 \u0930\u0942\u092a \u0938\u0947 \u092c\u093e\u0924\u091a\u0940\u0924 \u0915\u0930\u0928\u093e \u0914\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 (FDI) \u092a\u094d\u0930\u0938\u094d\u0924\u093e\u0935\u094b\u0902 \u0915\u094b \u0924\u0947\u091c\u0940 \u0938\u0947 \u092e\u0902\u091c\u0942\u0930\u0940 \u0926\u0947\u0928\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q92.</b> Q116. What was the primary function of the Planning Commission of India? / \u092d\u093e\u0930\u0924 \u0915\u0947 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0915\u093e\u0930\u094d\u092f \u0915\u094d\u092f\u093e \u0925\u093e? [SSC CHSL, 12 Nov 2025, Shift-3]",
      "options": [
        "To control the inflation. / \u092e\u0941\u0926\u094d\u0930\u093e\u0938\u094d\u092b\u0940\u0924\u093f \u0915\u094b \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u0915\u0930\u0928\u093e\u0964",
        "To boost the foreign trade. / \u0935\u093f\u0926\u0947\u0936\u0940 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e\u0964",
        "To monitor the currency exchange system in India. / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092e\u0941\u0926\u094d\u0930\u093e \u0935\u093f\u0928\u093f\u092e\u092f \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0915\u0940 \u0928\u093f\u0917\u0930\u093e\u0928\u0940 \u0915\u0930\u0928\u093e\u0964",
        "To formulate and implement five year plans. / \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u090f\u0901 \u0924\u0948\u092f\u093e\u0930 \u0915\u0930\u0928\u093e \u0914\u0930 \u0932\u093e\u0917\u0942 \u0915\u0930\u0928\u093e\u0964"
      ],
      "correctIndex": 3,
      "explanation": "The highly influential Planning Commission of India (active strictly from 1950 to 2014) was a massive extra-constitutional advisory body. Its absolute, overriding primary function was to meticulously formulate highly detailed Five-Year Plans precisely aimed at the most effective, balanced, and strategic utilization of the entire country&#x27;s scarce resources. / \u092d\u093e\u0930\u0924 \u0915\u093e \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u092d\u093e\u0935\u0936\u093e\u0932\u0940 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 (\u0938\u0916\u094d\u0924\u0940 \u0938\u0947 1950 \u0938\u0947 2014 \u0924\u0915 \u0938\u0915\u094d\u0930\u093f\u092f) \u090f\u0915 \u0935\u093f\u0936\u093e\u0932 \u0905\u0924\u093f\u0930\u093f\u0915\u094d\u0924-\u0938\u0902\u0935\u0948\u0927\u093e\u0928\u093f\u0915 \u0938\u0932\u093e\u0939\u0915\u093e\u0930 \u0928\u093f\u0915\u093e\u092f \u0925\u093e\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923, \u0905\u0924\u093f\u0935\u094d\u092f\u093e\u092a\u0940 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0915\u093e\u0930\u094d\u092f \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092a\u0942\u0930\u0947 \u0926\u0947\u0936 \u0915\u0947 \u0926\u0941\u0930\u094d\u0932\u092d \u0938\u0902\u0938\u093e\u0927\u0928\u094b\u0902 \u0915\u0947 \u0938\u092c\u0938\u0947 \u092a\u094d\u0930\u092d\u093e\u0935\u0940, \u0938\u0902\u0924\u0941\u0932\u093f\u0924 \u0914\u0930 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0909\u092a\u092f\u094b\u0917 \u0915\u0947 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u093f\u0938\u094d\u0924\u0943\u0924 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u090f\u0902 \u0924\u0948\u092f\u093e\u0930 \u0915\u0930\u0928\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q93.</b> Q117. In which year was the Special Economic Zones (SEZs) policy launched in India? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0935\u093f\u0936\u0947\u0937 \u0906\u0930\u094d\u0925\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 (SEZ) \u0928\u0940\u0924\u093f \u0915\u093f\u0938 \u0935\u0930\u094d\u0937 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC CHSL, 13 Nov 2025, Shift-2]",
      "options": [
        "1998",
        "1999",
        "2002",
        "2000"
      ],
      "correctIndex": 3,
      "explanation": "The highly ambitious and strategically transformative Special Economic Zones (SEZ) Policy was officially announced by the Indian government precisely in April 2000. The absolute core objective was aggressively making massive Indian exports highly globally competitive by specifically providing a deeply hassle-free, business-friendly environment explicitly for major exporters. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0914\u0930 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940 \u0935\u093f\u0936\u0947\u0937 \u0906\u0930\u094d\u0925\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 (SEZ) \u0928\u0940\u0924\u093f \u0915\u0940 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0918\u094b\u0937\u0923\u093e \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u0920\u0940\u0915 \u0905\u092a\u094d\u0930\u0948\u0932 2000 \u092e\u0947\u0902 \u0915\u0940 \u0917\u0908 \u0925\u0940\u0964 \u092a\u0942\u0930\u094d\u0923 \u092e\u0941\u0916\u094d\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u092e\u0941\u0916 \u0928\u093f\u0930\u094d\u092f\u093e\u0924\u0915\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u090f\u0915 \u092a\u0930\u0947\u0936\u093e\u0928\u0940 \u092e\u0941\u0915\u094d\u0924, \u0935\u094d\u092f\u093e\u092a\u093e\u0930-\u0905\u0928\u0941\u0915\u0942\u0932 \u0935\u093e\u0924\u093e\u0935\u0930\u0923 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092d\u093e\u0930\u0924\u0940\u092f \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u0940 \u092c\u0928\u093e\u0928\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q94.</b> Q118. What is a capital goods industry? / \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0935\u0938\u094d\u0924\u0941 \u0909\u0926\u094d\u092f\u094b\u0917 (capital goods industry) \u0915\u094d\u092f\u093e \u0939\u0948? [SSC CHSL, 13 Nov 2025, Shift-2]",
      "options": [
        "Industry that deals in external commercial borrowings. / \u0909\u0926\u094d\u092f\u094b\u0917 \u091c\u094b \u092c\u093e\u0939\u0930\u0940 \u0935\u093e\u0923\u093f\u091c\u094d\u092f\u093f\u0915 \u0909\u0927\u093e\u0930\u0940 \u092e\u0947\u0902 \u0915\u093e\u092e \u0915\u0930\u0924\u093e \u0939\u0948\u0964",
        "Industry that exports food products. / \u0909\u0926\u094d\u092f\u094b\u0917 \u091c\u094b \u0916\u093e\u0926\u094d\u092f \u0909\u0924\u094d\u092a\u093e\u0926\u094b\u0902 \u0915\u093e \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u0930\u0924\u093e \u0939\u0948\u0964",
        "Industry that process raw agricultural product. / \u0909\u0926\u094d\u092f\u094b\u0917 \u091c\u094b \u0915\u091a\u094d\u091a\u0947 \u0915\u0943\u0937\u093f \u0909\u0924\u094d\u092a\u093e\u0926\u094b\u0902 \u0915\u094b \u0938\u0902\u0938\u093e\u0927\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948\u0964",
        "Industry producing machines and tools. / \u092e\u0936\u0940\u0928\u0947\u0902 \u0914\u0930 \u0909\u092a\u0915\u0930\u0923 \u092c\u0928\u093e\u0928\u0947 \u0935\u093e\u0932\u093e \u0909\u0926\u094d\u092f\u094b\u0917\u0964"
      ],
      "correctIndex": 3,
      "explanation": "A core Capital Goods Industry is fundamentally and strictly defined as one that aggressively produces massive physical goods (like heavy tools and complex equipment) that are subsequently used directly to manufacture other goods and services. These crucially include massive heavy engineering industries relentlessly manufacturing factory machines and vital transport equipment. / \u090f\u0915 \u092e\u0941\u0916\u094d\u092f \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0935\u0938\u094d\u0924\u0941 \u0909\u0926\u094d\u092f\u094b\u0917 \u0915\u094b \u092e\u094c\u0932\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u092a\u0930\u093f\u092d\u093e\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948 \u091c\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092d\u094c\u0924\u093f\u0915 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 (\u091c\u0948\u0938\u0947 \u092d\u093e\u0930\u0940 \u0909\u092a\u0915\u0930\u0923 \u0914\u0930 \u091c\u091f\u093f\u0932 \u0909\u092a\u0915\u0930\u0923) \u0915\u093e \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0930\u0924\u093e \u0939\u0948 \u091c\u094b \u092c\u093e\u0926 \u092e\u0947\u0902 \u0938\u0940\u0927\u0947 \u0905\u0928\u094d\u092f \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0914\u0930 \u0938\u0947\u0935\u093e\u0913\u0902 \u0915\u0947 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0915\u0947 \u0932\u093f\u090f \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u090f \u091c\u093e\u0924\u0947 \u0939\u0948\u0902\u0964 \u0907\u0928\u092e\u0947\u0902 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0930\u0942\u092a \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092d\u093e\u0930\u0940 \u0907\u0902\u091c\u0940\u0928\u093f\u092f\u0930\u093f\u0902\u0917 \u0909\u0926\u094d\u092f\u094b\u0917 \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0902 \u091c\u094b \u0932\u0917\u093e\u0924\u093e\u0930 \u0915\u093e\u0930\u0916\u093e\u0928\u0947 \u0915\u0940 \u092e\u0936\u0940\u0928\u0947\u0902 \u0914\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092a\u0930\u093f\u0935\u0939\u0928 \u0909\u092a\u0915\u0930\u0923 \u092c\u0928\u093e\u0924\u0947 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q95.</b> Q119. As of July 2025, the Bharat Sanchar Nigam Limited holds which of the following CPSE status? / \u091c\u0941\u0932\u093e\u0908 2025 \u0924\u0915, \u092d\u093e\u0930\u0924 \u0938\u0902\u091a\u093e\u0930 \u0928\u093f\u0917\u092e \u0932\u093f\u092e\u093f\u091f\u0947\u0921 (BSNL) \u0915\u094b \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e CPSE \u0926\u0930\u094d\u091c\u093e \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0939\u0948? [SSC CHSL, 25 Nov 2025, Shift-1]",
      "options": [
        "Maharatna / \u092e\u0939\u093e\u0930\u0924\u094d\u0928",
        "Navratna / \u0928\u0935\u0930\u0924\u094d\u0928",
        "Miniratna-II / \u092e\u093f\u0928\u0940\u0930\u0924\u094d\u0928-II",
        "Miniratna-I / \u092e\u093f\u0928\u0940\u0930\u0924\u094d\u0928-I"
      ],
      "correctIndex": 3,
      "explanation": "The massive state-owned telecommunications entity, BSNL, is officially classified strictly as a prestigious Miniratna Category-I Central Public Sector Enterprise. This highly coveted specific status directly grants the company&#x27;s board certain vital financial and operational autonomy, allowing it to rapidly incur massive capital expenditure without prior government approval. / \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0935\u093e\u0932\u0940 \u0935\u093f\u0936\u093e\u0932 \u0926\u0942\u0930\u0938\u0902\u091a\u093e\u0930 \u0907\u0915\u093e\u0908, BSNL \u0915\u094b \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u090f\u0915 \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 \u092e\u093f\u0928\u0940\u0930\u0924\u094d\u0928 \u0936\u094d\u0930\u0947\u0923\u0940-I \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u092e \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948\u0964 \u092f\u0939 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0926\u0930\u094d\u091c\u093e \u0938\u0940\u0927\u0947 \u0915\u0902\u092a\u0928\u0940 \u0915\u0947 \u092c\u094b\u0930\u094d\u0921 \u0915\u094b \u0915\u0941\u091b \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0914\u0930 \u092a\u0930\u093f\u091a\u093e\u0932\u0928 \u0938\u094d\u0935\u093e\u092f\u0924\u094d\u0924\u0924\u093e \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u093e \u0939\u0948, \u091c\u093f\u0938\u0938\u0947 \u0935\u0939 \u092a\u0942\u0930\u094d\u0935 \u0938\u0930\u0915\u093e\u0930\u0940 \u0905\u0928\u0941\u092e\u094b\u0926\u0928 \u0915\u0947 \u092c\u093f\u0928\u093e \u0924\u0947\u091c\u0940 \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0935\u094d\u092f\u092f \u0915\u0930 \u0938\u0915\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q96.</b> Q120. As per the Industrial policy resolution 1956 of India, industries were divided into how many categories? / \u092d\u093e\u0930\u0924 \u0915\u0947 1956 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a (IPR 1956) \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930, \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0915\u093f\u0924\u0928\u0940 \u0936\u094d\u0930\u0947\u0923\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0935\u093f\u092d\u093e\u091c\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e? [SSC CHSL, 25 Nov 2025, Shift-2]",
      "options": [
        "Eight / \u0906\u0920",
        "Two / \u0926\u094b",
        "Ten / \u0926\u0938",
        "Three / \u0924\u0940\u0928"
      ],
      "correctIndex": 3,
      "explanation": "The profoundly historic 1956 IPR highly strictly and rigidly classified all Indian industries entirely into exactly three detailed schedules. Schedule A represented 17 absolute strategic industries under completely exclusive state control. Schedule B had 12 industries meant to become state-owned, and Schedule C contained all remaining industries left for the highly regulated private sector. / \u0917\u0939\u0928 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 1956 IPR \u0928\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0914\u0930 \u0915\u0920\u094b\u0930\u0924\u093e \u0938\u0947 \u0938\u092d\u0940 \u092d\u093e\u0930\u0924\u0940\u092f \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0924\u0940\u0928 \u0935\u093f\u0938\u094d\u0924\u0943\u0924 \u0905\u0928\u0941\u0938\u0942\u091a\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e\u0964 \u0905\u0928\u0941\u0938\u0942\u091a\u0940 \u090f \u0928\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0905\u0928\u0928\u094d\u092f \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u0915\u0947 \u0924\u0939\u0924 17 \u092a\u0942\u0930\u094d\u0923 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u093e \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u093f\u092f\u093e\u0964 \u0905\u0928\u0941\u0938\u0942\u091a\u0940 \u092c\u0940 \u092e\u0947\u0902 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u092c\u0928\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f 12 \u0909\u0926\u094d\u092f\u094b\u0917 \u0925\u0947, \u0914\u0930 \u0905\u0928\u0941\u0938\u0942\u091a\u0940 \u0938\u0940 \u092e\u0947\u0902 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0932\u093f\u090f \u091b\u094b\u0921\u093c\u0947 \u0917\u090f \u0938\u092d\u0940 \u0936\u0947\u0937 \u0909\u0926\u094d\u092f\u094b\u0917 \u0936\u093e\u092e\u093f\u0932 \u0925\u0947\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q97.</b> Q121. Which of the following five year plan in India tried to build the basis for a socialist pattern of society? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0928\u0947 &#x27;\u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0938\u094d\u0935\u0930\u0942\u092a \u0915\u0947 \u0938\u092e\u093e\u091c&#x27; (socialist pattern of society) \u0915\u093e \u0906\u0927\u093e\u0930 \u092c\u0928\u093e\u0928\u0947 \u0915\u093e \u092a\u094d\u0930\u092f\u093e\u0938 \u0915\u093f\u092f\u093e? [SSC CHSL, 14 Nov 2025, Shift-1]",
      "options": [
        "Second / \u0926\u0942\u0938\u0930\u0940",
        "First / \u092a\u0939\u0932\u0940",
        "Tenth / \u0926\u0938\u0935\u0940\u0902",
        "Eleventh / \u0917\u094d\u092f\u093e\u0930\u0939\u0935\u0940\u0902"
      ],
      "correctIndex": 0,
      "explanation": "The historically significant Second Five-Year Plan (1956-61), meticulously drafted by the brilliant statistician P.C. Mahalanobis, officially and aggressively adopted the &quot;socialist pattern of society&quot; as its primary national goal. It heavily emphasized the massive development of the state-owned public sector and colossal heavy industries to rapidly reduce economic inequalities and build a highly robust domestic industrial base. / \u0936\u093e\u0928\u0926\u093e\u0930 \u0938\u093e\u0902\u0916\u094d\u092f\u093f\u0915\u0940\u0935\u093f\u0926\u094d \u092a\u0940.\u0938\u0940. \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u093e\u0935\u0927\u093e\u0928\u0940\u092a\u0942\u0930\u094d\u0935\u0915 \u0924\u0948\u092f\u093e\u0930 \u0915\u0940 \u0917\u0908 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-61) \u0928\u0947 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 &quot;\u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0938\u094d\u0935\u0930\u0942\u092a \u0915\u0947 \u0938\u092e\u093e\u091c&quot; \u0915\u094b \u0905\u092a\u0928\u0947 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0932\u0915\u094d\u0937\u094d\u092f \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0905\u092a\u0928\u093e\u092f\u093e\u0964 \u0907\u0938\u0928\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0905\u0938\u092e\u093e\u0928\u0924\u093e\u0913\u0902 \u0915\u094b \u0924\u0947\u091c\u0940 \u0938\u0947 \u0915\u092e \u0915\u0930\u0928\u0947 \u0914\u0930 \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u091c\u092c\u0942\u0924 \u0918\u0930\u0947\u0932\u0942 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0906\u0927\u093e\u0930 \u092c\u0928\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0914\u0930 \u0935\u093f\u0936\u093e\u0932 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u092d\u093e\u0930\u0940 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q98.</b> Q122. After which of the following five year plan in India, the emphasis on the public sector has become less pronounced? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u092c\u093e\u0926, \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u092a\u0930 \u091c\u094b\u0930 \u0915\u092e \u0939\u094b \u0917\u092f\u093e? [SSC CHSL, 14 Nov 2025, Shift-2]",
      "options": [
        "First / \u092a\u0939\u0932\u0940",
        "Third / \u0924\u0940\u0938\u0930\u0940",
        "Fifth / \u092a\u093e\u0902\u091a\u0935\u0940\u0902",
        "Ninth / \u0928\u094c\u0935\u0940\u0902"
      ],
      "correctIndex": 3,
      "explanation": "Immediately following the sweeping 1991 macroeconomic reforms and progressing steadily through the Eighth and Ninth Plans, India aggressively shifted towards a dynamic market-led economy. The Ninth Plan (1997-2002) specifically marked a deeply transformative period where the government started heavily prioritizing strategic privatization and private sector investment over the historical, rigid dominance of the public sector. / \u0935\u094d\u092f\u093e\u092a\u0915 1991 \u0938\u092e\u0937\u094d\u091f\u093f-\u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0924\u0941\u0930\u0902\u0924 \u092c\u093e\u0926 \u0914\u0930 \u0906\u0920\u0935\u0940\u0902 \u0914\u0930 \u0928\u094c\u0935\u0940\u0902 \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0932\u0917\u093e\u0924\u093e\u0930 \u0906\u0917\u0947 \u092c\u0922\u093c\u0924\u0947 \u0939\u0941\u090f, \u092d\u093e\u0930\u0924 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u0917\u0924\u093f\u0936\u0940\u0932 \u092c\u093e\u091c\u093e\u0930-\u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0935\u093e\u0932\u0940 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0940 \u0913\u0930 \u092c\u0922\u093c \u0917\u092f\u093e\u0964 \u0928\u094c\u0935\u0940\u0902 \u092f\u094b\u091c\u0928\u093e (1997-2002) \u0928\u0947 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940 \u0905\u0935\u0927\u093f \u0915\u094b \u091a\u093f\u0939\u094d\u0928\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u0939\u093e\u0902 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915, \u0915\u0920\u094b\u0930 \u092a\u094d\u0930\u092d\u0941\u0924\u094d\u0935 \u092a\u0930 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0928\u093f\u091c\u0940\u0915\u0930\u0923 \u0914\u0930 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0928\u093f\u0935\u0947\u0936 \u0915\u094b \u092d\u093e\u0930\u0940 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0947\u0928\u093e \u0936\u0941\u0930\u0942 \u0915\u0930 \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q99.</b> Q123. There are how many sectors covered in Production linked Incentive (PLI) Scheme launched in August 2023? / \u0905\u0917\u0938\u094d\u0924 2023 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 &#x27;\u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0906\u0927\u093e\u0930\u093f\u0924 \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u0928&#x27; (PLI) \u092f\u094b\u091c\u0928\u093e \u092e\u0947\u0902 \u0915\u093f\u0924\u0928\u0947 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0902? [SSC CHSL, 17 Nov 2025, Shift-1]",
      "options": [
        "11",
        "21",
        "14",
        "25"
      ],
      "correctIndex": 2,
      "explanation": "The highly ambitious Production Linked Incentive (PLI) scheme officially and comprehensively covers exactly 14 key strategic sectors, heavily including mobile manufacturing, advanced medical devices, and robust automobiles. Its absolute primary goal is to aggressively boost domestic manufacturing, attract massive foreign investment, and make Indian manufacturers globally competitive by providing lucrative financial incentives based directly on incremental sales. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0932\u093f\u0902\u0915\u094d\u0921 \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u0928 (PLI) \u092f\u094b\u091c\u0928\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0914\u0930 \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u0942\u092a \u0938\u0947 \u0920\u0940\u0915 14 \u092a\u094d\u0930\u092e\u0941\u0916 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u094b \u0915\u0935\u0930 \u0915\u0930\u0924\u0940 \u0939\u0948, \u091c\u093f\u0938\u092e\u0947\u0902 \u092e\u094b\u092c\u093e\u0907\u0932 \u0928\u093f\u0930\u094d\u092e\u093e\u0923, \u0909\u0928\u094d\u0928\u0924 \u091a\u093f\u0915\u093f\u0924\u094d\u0938\u093e \u0909\u092a\u0915\u0930\u0923 \u0914\u0930 \u092e\u091c\u092c\u0942\u0924 \u0911\u091f\u094b\u092e\u094b\u092c\u093e\u0907\u0932 \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0902\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0932\u0915\u094d\u0937\u094d\u092f \u0918\u0930\u0947\u0932\u0942 \u0935\u093f\u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u094b \u0906\u0915\u0930\u094d\u0937\u093f\u0924 \u0915\u0930\u0928\u093e \u0914\u0930 \u0938\u0940\u0927\u0947 \u0935\u0943\u0926\u094d\u0927\u093f\u0936\u0940\u0932 \u092c\u093f\u0915\u094d\u0930\u0940 \u0915\u0947 \u0906\u0927\u093e\u0930 \u092a\u0930 \u0906\u0915\u0930\u094d\u0937\u0915 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u0928 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0915\u0947 \u092d\u093e\u0930\u0924\u0940\u092f \u0928\u093f\u0930\u094d\u092e\u093e\u0924\u093e\u0913\u0902 \u0915\u094b \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u0940 \u092c\u0928\u093e\u0928\u093e \u0939\u0948\u0964",
      "reference": ""

    {
      "text": "<b>Q100.</b> Q124. Which of the following was NOT the goal of five year plans in India? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u093e \u0932\u0915\u094d\u0937\u094d\u092f \u0928\u0939\u0940\u0902 \u0925\u093e? [SSC CHSL, 20 Nov 2025, Shift-1]",
      "options": [
        "Growth / \u0935\u093f\u0915\u093e\u0938",
        "Dependency on foreign aid / \u0935\u093f\u0926\u0947\u0936\u0940 \u0938\u0939\u093e\u092f\u0924\u093e \u092a\u0930 \u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e",
        "Modernisation / \u0906\u0927\u0941\u0928\u093f\u0915\u0940\u0915\u0930\u0923",
        "Equity / \u0938\u092e\u093e\u0928\u0924\u093e (Equity)"
      ],
      "correctIndex": 1,
      "explanation": "The four absolute core, fundamental goals of historic Indian economic planning were unequivocally Growth, Modernization, Self-reliance, and Equity. Planners strictly viewed any dependency on foreign financial aid as a severe strategic weakness, and therefore early plans specifically and aggressively aimed at attaining &quot;Atmanirbharta&quot; or absolute self-reliance to permanently reduce such crippling external reliance. / \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u092d\u093e\u0930\u0924\u0940\u092f \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u093f\u092f\u094b\u091c\u0928 \u0915\u0947 \u091a\u093e\u0930 \u092a\u0942\u0930\u094d\u0923 \u092e\u0941\u0916\u094d\u092f, \u092e\u0942\u0932\u092d\u0942\u0924 \u0932\u0915\u094d\u0937\u094d\u092f \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0915\u093e\u0938, \u0906\u0927\u0941\u0928\u093f\u0915\u0940\u0915\u0930\u0923, \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0914\u0930 \u0938\u092e\u093e\u0928\u0924\u093e \u0925\u0947\u0964 \u092f\u094b\u091c\u0928\u093e\u0915\u093e\u0930\u094b\u0902 \u0928\u0947 \u0915\u093f\u0938\u0940 \u092d\u0940 \u0935\u093f\u0926\u0947\u0936\u0940 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0939\u093e\u092f\u0924\u093e \u092a\u0930 \u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0915\u094b \u090f\u0915 \u0917\u0902\u092d\u0940\u0930 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0915\u092e\u091c\u094b\u0930\u0940 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0926\u0947\u0916\u093e, \u0914\u0930 \u0907\u0938\u0932\u093f\u090f \u0936\u0941\u0930\u0941\u0906\u0924\u0940 \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u093e \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0910\u0938\u0940 \u0905\u092a\u0902\u0917 \u092c\u093e\u0939\u0930\u0940 \u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0915\u094b \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u0915\u092e \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f &quot;\u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e&quot; \u092f\u093e \u092a\u0942\u0930\u094d\u0923 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u0930\u0928\u093e \u0925\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q101.</b> Q125. Which of the following five year plan in India was thorough failure in reaching targets due to unforeseen events like Chinese aggression (1962)? / \u091a\u0940\u0928\u0940 \u0906\u0915\u094d\u0930\u092e\u0923 (1962) \u091c\u0948\u0938\u0940 \u0905\u092a\u094d\u0930\u0924\u094d\u092f\u093e\u0936\u093f\u0924 \u0918\u091f\u0928\u093e\u0913\u0902 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0932\u0915\u094d\u0937\u094d\u092f\u094b\u0902 \u0924\u0915 \u092a\u0939\u0941\u0901\u091a\u0928\u0947 \u092e\u0947\u0902 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0935\u093f\u092b\u0932 \u0930\u0939\u0940? [SSC CHSL, 20 Nov 2025, Shift-1]",
      "options": [

      ],
      "correctIndex": 0,
      "explanation": "The highly ambitious Third Five-Year Plan (1961-66) failed disastrously and significantly due to a series of catastrophic external shocks: the massive 1962 Sino-Indian War, the 1965 Indo-Pak War, and completely unprecedented severe droughts. These devastating events forcibly diverted crucial national resources heavily toward defense and ultimately led to a crippling three-year &quot;Plan Holiday&quot; from 1966 to 1969. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1961-66) \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u092c\u093e\u0939\u0930\u0940 \u091d\u091f\u0915\u094b\u0902 \u0915\u0940 \u090f\u0915 \u0936\u094d\u0930\u0943\u0902\u0916\u0932\u093e \u0915\u0947 \u0915\u093e\u0930\u0923 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u0914\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u092b\u0932 \u0930\u0939\u0940: \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 1962 \u0915\u093e \u091a\u0940\u0928-\u092d\u093e\u0930\u0924 \u092f\u0941\u0926\u094d\u0927, 1965 \u0915\u093e \u092d\u093e\u0930\u0924-\u092a\u093e\u0915 \u092f\u0941\u0926\u094d\u0927, \u0914\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0905\u092d\u0942\u0924\u092a\u0942\u0930\u094d\u0935 \u0917\u0902\u092d\u0940\u0930 \u0938\u0942\u0916\u093e\u0964 \u0907\u0928 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u0918\u091f\u0928\u093e\u0913\u0902 \u0928\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u0902\u0938\u093e\u0927\u0928\u094b\u0902 \u0915\u094b \u092c\u0932\u092a\u0942\u0930\u094d\u0935\u0915 \u0930\u0915\u094d\u0937\u093e \u0915\u0940 \u0913\u0930 \u092e\u094b\u0921\u093c \u0926\u093f\u092f\u093e \u0914\u0930 \u0905\u0902\u0924\u0924\u0903 1966 \u0938\u0947 1969 \u0924\u0915 \u090f\u0915 \u0905\u092a\u0902\u0917 \u0924\u0940\u0928 \u0938\u093e\u0932 \u0915\u0947 &quot;\u092f\u094b\u091c\u0928\u093e \u0905\u0935\u0915\u093e\u0936&quot; \u0915\u093e \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q102.</b> Q126. The AMUL milk cooperative was set up in: / \u0905\u092e\u0942\u0932 (AMUL) \u0926\u0941\u0917\u094d\u0927 \u0938\u0939\u0915\u093e\u0930\u0940 \u0938\u092e\u093f\u0924\u093f \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u092c \u0939\u0941\u0908 \u0925\u0940: [SSC CHSL, 20 Nov 2025, Shift-3]",
      "options": [
        "1957",
        "1979",
        "1992",
        "1946"
      ],
      "correctIndex": 3,
      "explanation": "The highly legendary Kaira District Co-operative Milk Producers&#x27; Union Limited, universally famous as Amul, was officially registered exactly in 1946 in the state of Gujarat. Powerfully led by Tribhuvandas Patel and later guided by the visionary Dr. Verghese Kurien, it majestically became the absolute rock-solid foundation for the historic White Revolution and India&#x27;s globally celebrated cooperative dairy model. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0915\u0948\u0930\u093e \u091c\u093f\u0932\u093e \u0938\u0939\u0915\u093e\u0930\u0940 \u0926\u0941\u0917\u094d\u0927 \u0909\u0924\u094d\u092a\u093e\u0926\u0915 \u0938\u0902\u0918 \u0932\u093f\u092e\u093f\u091f\u0947\u0921, \u091c\u093f\u0938\u0947 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u0905\u092e\u0942\u0932 \u0915\u0947 \u0928\u093e\u092e \u0938\u0947 \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948, \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0920\u0940\u0915 1946 \u092e\u0947\u0902 \u0917\u0941\u091c\u0930\u093e\u0924 \u0930\u093e\u091c\u094d\u092f \u092e\u0947\u0902 \u092a\u0902\u091c\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0924\u094d\u0930\u093f\u092d\u0941\u0935\u0928\u0926\u093e\u0938 \u092a\u091f\u0947\u0932 \u0915\u0947 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u092e\u0947\u0902 \u0914\u0930 \u092c\u093e\u0926 \u092e\u0947\u0902 \u0926\u0942\u0930\u0926\u0930\u094d\u0936\u0940 \u0921\u0949. \u0935\u0930\u094d\u0917\u0940\u0938 \u0915\u0941\u0930\u093f\u092f\u0928 \u0926\u094d\u0935\u093e\u0930\u093e \u0928\u093f\u0930\u094d\u0926\u0947\u0936\u093f\u0924, \u092f\u0939 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0936\u094d\u0935\u0947\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0914\u0930 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0935\u093f\u0936\u094d\u0935 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092e\u0928\u093e\u090f \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 \u0938\u0939\u0915\u093e\u0930\u0940 \u0921\u0947\u092f\u0930\u0940 \u092e\u0949\u0921\u0932 \u0915\u0947 \u0932\u093f\u090f \u092a\u0942\u0930\u094d\u0923 \u0930\u0942\u092a \u0938\u0947 \u0920\u094b\u0938 \u0906\u0927\u093e\u0930 \u092c\u0928 \u0917\u092f\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q103.</b> Q127. The Hill area development programme was initiated during the ______ five-year plan. / \u092a\u0939\u093e\u0921\u093c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0935\u093f\u0915\u093e\u0938 \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e (Hill area development programme) ______ \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 [SSC CHSL, 21 Nov 2025, Shift-3]",
      "options": [
        "10",
        "8",
        "5",
        "7"
      ],
      "correctIndex": 2,
      "explanation": "The highly specialized Hill Area Development Programme (HADP) was officially and strategically launched precisely during the Fifth Five-Year Plan (1974-78). It comprehensively aimed at the robust socio-economic development of extremely challenging, topographically difficult hilly regions while strictly preserving their fragile ecological balance through massive special central financial assistance allocated to specific highly vulnerable states. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u092a\u0939\u093e\u0921\u093c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0935\u093f\u0915\u093e\u0938 \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e (HADP) \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0914\u0930 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0920\u0940\u0915 \u092a\u093e\u0902\u091a\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1974-78) \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0915\u093e \u0935\u094d\u092f\u093e\u092a\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0905\u0924\u094d\u092f\u0902\u0924 \u091a\u0941\u0928\u094c\u0924\u0940\u092a\u0942\u0930\u094d\u0923, \u092d\u094c\u0917\u094b\u0932\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0915\u0920\u093f\u0928 \u092a\u0939\u093e\u0921\u093c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u093e \u092e\u091c\u092c\u0942\u0924 \u0938\u093e\u092e\u093e\u091c\u093f\u0915-\u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0915\u0930\u0928\u093e \u0925\u093e, \u091c\u092c\u0915\u093f \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u092e\u091c\u094b\u0930 \u0930\u093e\u091c\u094d\u092f\u094b\u0902 \u0915\u094b \u0906\u0935\u0902\u091f\u093f\u0924 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u093f\u0936\u0947\u0937 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0939\u093e\u092f\u0924\u093e \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0909\u0928\u0915\u0947 \u0928\u093e\u091c\u0941\u0915 \u092a\u093e\u0930\u093f\u0938\u094d\u0925\u093f\u0924\u093f\u0915 \u0938\u0902\u0924\u0941\u0932\u0928 \u0915\u094b \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0938\u0902\u0930\u0915\u094d\u0937\u093f\u0924 \u0915\u0930\u0928\u093e \u0925\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q104.</b> Q128. Who was the architect of Indian Planning? / \u092d\u093e\u0930\u0924\u0940\u092f \u0928\u093f\u092f\u094b\u091c\u0928 (Indian Planning) \u0915\u0947 \u0935\u093e\u0938\u094d\u0924\u0941\u0915\u093e\u0930 \u0915\u094c\u0928 \u0925\u0947? [SSC CHSL, 22 Nov 2025, Shift-2]",
      "options": [
        "Sardar Vallabh Bhai Patel / \u0938\u0930\u0926\u093e\u0930 \u0935\u0932\u094d\u0932\u092d \u092d\u093e\u0908 \u092a\u091f\u0947\u0932",
        "Prasanta Chandra Mahalanobis / \u092a\u094d\u0930\u0936\u093e\u0902\u0924 \u091a\u0902\u0926\u094d\u0930 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938",
        "Jawaharlal Nehru / \u091c\u0935\u093e\u0939\u0930\u0932\u093e\u0932 \u0928\u0947\u0939\u0930\u0942",
        "B.R. Ambedkar / \u092c\u0940.\u0906\u0930. \u0905\u0902\u092c\u0947\u0921\u0915\u0930"
      ],
      "correctIndex": 1,
      "explanation": "The brilliant and highly eminent statistician Prasanta Chandra Mahalanobis is universally celebrated and officially considered the absolute architect of Indian economic planning. He monumentally founded the elite Indian Statistical Institute and brilliantly formulated the famous Mahalanobis model, which became the exact structural blueprint for the Second Five-Year Plan&#x27;s massive focus on heavy, rapid industrialization. / \u0936\u093e\u0928\u0926\u093e\u0930 \u0914\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0916\u094d\u092f\u093e\u0924 \u0938\u093e\u0902\u0916\u094d\u092f\u093f\u0915\u0940\u0935\u093f\u0926\u094d \u092a\u094d\u0930\u0936\u093e\u0902\u0924 \u091a\u0902\u0926\u094d\u0930 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u0915\u094b \u0938\u093e\u0930\u094d\u0935\u092d\u094c\u092e\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092e\u0928\u093e\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 \u0914\u0930 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u092d\u093e\u0930\u0924\u0940\u092f \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u093f\u092f\u094b\u091c\u0928 \u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0935\u093e\u0938\u094d\u0924\u0941\u0915\u093e\u0930 \u092e\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964 \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u0941\u0932\u0940\u0928 \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u093e\u0902\u0916\u094d\u092f\u093f\u0915\u0940 \u0938\u0902\u0938\u094d\u0925\u093e\u0928 \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u0940 \u0914\u0930 \u0936\u093e\u0928\u0926\u093e\u0930 \u0922\u0902\u0917 \u0938\u0947 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u0924\u0948\u092f\u093e\u0930 \u0915\u093f\u092f\u093e, \u091c\u094b \u092d\u093e\u0930\u0940, \u0924\u0940\u0935\u094d\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u092a\u0930 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092b\u094b\u0915\u0938 \u0915\u0947 \u0932\u093f\u090f \u0938\u091f\u0940\u0915 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0916\u093e\u0915\u093e \u092c\u0928 \u0917\u092f\u093e\u0964",
      "reference": ""

      "text": "<b>Q105.</b> Q129. The planning in the real sense began with ______ five year plan in India. / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u0905\u0930\u094d\u0925\u094b\u0902 \u092e\u0947\u0902 \u0928\u093f\u092f\u094b\u091c\u0928 (planning) \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 ______ \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0938\u0947 \u0939\u0941\u0908\u0964 [SSC CHSL, 28 Nov 2025, Shift-3]",

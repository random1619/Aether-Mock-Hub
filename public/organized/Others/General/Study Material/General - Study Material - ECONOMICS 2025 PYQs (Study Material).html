      ],
      "correctIndex": 0,
      "explanation": "While the very first plan was largely a disjointed collection of immediate survival projects, &quot;planning in the real, structural sense&quot; forcefully began with the historic Second Plan (1956-61). It assertively adopted a highly clear, mathematically rigorous industrial strategy (the renowned Mahalanobis model) and aimed directly at a sweeping structural transformation towards a rigid socialist pattern. / \u091c\u092c\u0915\u093f \u092a\u0939\u0932\u0940 \u092f\u094b\u091c\u0928\u093e \u0915\u093e\u092b\u0940 \u0939\u0926 \u0924\u0915 \u0924\u0924\u094d\u0915\u093e\u0932 \u0905\u0938\u094d\u0924\u093f\u0924\u094d\u0935 \u092a\u0930\u093f\u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u093e \u090f\u0915 \u0905\u0938\u0902\u092c\u0926\u094d\u0927 \u0938\u0902\u0917\u094d\u0930\u0939 \u0925\u0940, &quot;\u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915, \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0905\u0930\u094d\u0925\u094b\u0902 \u092e\u0947\u0902 \u092f\u094b\u091c\u0928\u093e&quot; \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0926\u0942\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e (1956-61) \u0915\u0947 \u0938\u093e\u0925 \u092c\u0932\u092a\u0942\u0930\u094d\u0935\u0915 \u0936\u0941\u0930\u0942 \u0939\u0941\u0908\u0964 \u0907\u0938\u0928\u0947 \u0926\u0943\u0922\u093c\u0924\u093e \u0938\u0947 \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u094d\u092a\u0937\u094d\u091f, \u0917\u0923\u093f\u0924\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u0920\u094b\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f (\u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932) \u0915\u094b \u0905\u092a\u0928\u093e\u092f\u093e \u0914\u0930 \u0907\u0938\u0915\u093e \u0938\u0940\u0927\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u090f\u0915 \u0915\u0920\u094b\u0930 \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u092a\u0948\u091f\u0930\u094d\u0928 \u0915\u0940 \u0913\u0930 \u090f\u0915 \u0935\u094d\u092f\u093e\u092a\u0915 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q106.</b> Q132. What was the growth target for the twelfth five year plan in India? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092c\u093e\u0930\u0939\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0932\u093f\u090f \u0935\u093f\u0915\u093e\u0938 \u0932\u0915\u094d\u0937\u094d\u092f (growth target) \u0915\u094d\u092f\u093e \u0925\u093e? [SSC CHSL, 29 Nov 2025, Shift-1]",
      "options": [
        "2%",
        "5%",
        "13%",
        "8%"
      ],
      "correctIndex": 3,
      "explanation": "The highly significant Twelfth Five-Year Plan (2012-17), which historically served as the absolute last Five-Year Plan of India, initially set a highly ambitious growth target of exactly 9%, which was later officially revised downwards to 8%. Its overarching and famous driving motto was &quot;Faster, Sustainable, and More Inclusive Growth.&quot; / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092c\u093e\u0930\u0939\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (2012-17), \u091c\u093f\u0938\u0928\u0947 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0905\u0902\u0924\u093f\u092e \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u093f\u092f\u093e, \u0928\u0947 \u0936\u0941\u0930\u0941\u0906\u0924 \u092e\u0947\u0902 \u0920\u0940\u0915 9% \u0915\u093e \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0935\u093f\u0915\u093e\u0938 \u0932\u0915\u094d\u0937\u094d\u092f \u0928\u093f\u0930\u094d\u0927\u093e\u0930\u093f\u0924 \u0915\u093f\u092f\u093e \u0925\u093e, \u091c\u093f\u0938\u0947 \u092c\u093e\u0926 \u092e\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0928\u0940\u091a\u0947 \u0915\u0940 \u0913\u0930 \u0938\u0902\u0936\u094b\u0927\u093f\u0924 \u0915\u0930 8% \u0915\u0930 \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0915\u093e \u0935\u094d\u092f\u093e\u092a\u0915 \u0914\u0930 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u092a\u094d\u0930\u0947\u0930\u0915 \u0906\u0926\u0930\u094d\u0936 \u0935\u093e\u0915\u094d\u092f &quot;\u0924\u0947\u091c, \u0938\u0924\u0924 \u0914\u0930 \u0905\u0927\u093f\u0915 \u0938\u092e\u093e\u0935\u0947\u0936\u0940 \u0935\u093f\u0915\u093e\u0938&quot; \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q107.</b> Q133. The Government introduced the &#x27;Navratna&#x27; scheme in ______ to identify and support CPSEs with competitive advantages. / \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u0940 \u0932\u093e\u092d \u0935\u093e\u0932\u0947 \u0938\u0940\u092a\u0940\u090f\u0938\u0908 (CPSEs) \u0915\u0940 \u092a\u0939\u091a\u093e\u0928 \u0915\u0930\u0928\u0947 \u0914\u0930 \u0909\u0928\u0915\u093e \u0938\u092e\u0930\u094d\u0925\u0928 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f ______ \u092e\u0947\u0902 &#x27;\u0928\u0935\u0930\u0924\u094d\u0928&#x27; \u092f\u094b\u091c\u0928\u093e \u0936\u0941\u0930\u0942 \u0915\u0940\u0964 [SSC CHSL, 29 Nov 2025, Shift-3]",
      "options": [
        "2001",
        "1993",
        "1997",
        "1999"
      ],
      "correctIndex": 2,
      "explanation": "The highly prestigious Navratna scheme was officially and strategically introduced exactly in 1997 explicitly to identify nine elite, high-performing Central Public Sector Enterprises (CPSEs) that possessed massive potential to become absolute global giants. These firms were dynamically granted vastly greater financial and operational autonomy to compete fiercely in the international market without rigid bureaucratic delays. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 \u0928\u0935\u0930\u0924\u094d\u0928 \u092f\u094b\u091c\u0928\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0914\u0930 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0920\u0940\u0915 1997 \u092e\u0947\u0902 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0928\u094c \u0915\u0941\u0932\u0940\u0928, \u0909\u091a\u094d\u091a-\u092a\u094d\u0930\u0926\u0930\u094d\u0936\u0928 \u0935\u093e\u0932\u0947 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u092e\u094b\u0902 (CPSE) \u0915\u0940 \u092a\u0939\u091a\u093e\u0928 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092a\u0947\u0936 \u0915\u0940 \u0917\u0908 \u0925\u0940, \u091c\u093f\u0928\u092e\u0947\u0902 \u092a\u0942\u0930\u094d\u0923 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0926\u093f\u0917\u094d\u0917\u091c \u092c\u0928\u0928\u0947 \u0915\u0940 \u0935\u093f\u0936\u093e\u0932 \u0915\u094d\u0937\u092e\u0924\u093e \u0925\u0940\u0964 \u0907\u0928 \u092b\u0930\u094d\u092e\u094b\u0902 \u0915\u094b \u0915\u0920\u094b\u0930 \u0928\u094c\u0915\u0930\u0936\u093e\u0939\u0940 \u0926\u0947\u0930\u0940 \u0915\u0947 \u092c\u093f\u0928\u093e \u0905\u0902\u0924\u0930\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092c\u093e\u091c\u093e\u0930 \u092e\u0947\u0902 \u091c\u092e\u0915\u0930 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0917\u0924\u093f\u0936\u0940\u0932 \u0930\u0942\u092a \u0938\u0947 \u0915\u093e\u092b\u0940 \u0905\u0927\u093f\u0915 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0914\u0930 \u092a\u0930\u093f\u091a\u093e\u0932\u0928 \u0938\u094d\u0935\u093e\u092f\u0924\u094d\u0924\u0924\u093e \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0940 \u0917\u0908 \u0925\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q108.</b> Q134. Who was the Chairperson of the Planning Commission when it was formed? / \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0947 \u0917\u0920\u0928 \u0915\u0947 \u0938\u092e\u092f \u0909\u0938\u0915\u0947 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0915\u094c\u0928 \u0925\u0947? [SSC CHSL, 29 Nov 2025, Shift-3]",
      "options": [
        "Morarji Desai / \u092e\u094b\u0930\u093e\u0930\u091c\u0940 \u0926\u0947\u0938\u093e\u0908",
        "Jawaharlal Nehru / \u091c\u0935\u093e\u0939\u0930\u0932\u093e\u0932 \u0928\u0947\u0939\u0930\u0942",
        "Sardar Vallabh Bhai Patel / \u0938\u0930\u0926\u093e\u0930 \u0935\u0932\u094d\u0932\u092d \u092d\u093e\u0908 \u092a\u091f\u0947\u0932",
        "K Kamraj / \u0915\u0947. \u0915\u093e\u092e\u0930\u093e\u091c"
      ],
      "correctIndex": 1,
      "explanation": "The highly powerful Planning Commission of India was officially established in March 1950. By strict constitutional convention, the sitting Prime Minister of India permanently served as the ex-officio Chairman of this massive body. Therefore, the visionary Jawaharlal Nehru, being the very first PM, was undeniably the commission&#x27;s absolute first Chairperson. / \u092d\u093e\u0930\u0924 \u0915\u093e \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u092e\u093e\u0930\u094d\u091a 1950 \u092e\u0947\u0902 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0938\u0916\u094d\u0924 \u0938\u0902\u0935\u0948\u0927\u093e\u0928\u093f\u0915 \u092a\u0930\u093f\u092a\u093e\u091f\u0940 \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930, \u092d\u093e\u0930\u0924 \u0915\u0947 \u0924\u0924\u094d\u0915\u093e\u0932\u0940\u0928 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0928\u0947 \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u0907\u0938 \u0935\u093f\u0936\u093e\u0932 \u0928\u093f\u0915\u093e\u092f \u0915\u0947 \u092a\u0926\u0947\u0928 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u093f\u092f\u093e\u0964 \u0907\u0938\u0932\u093f\u090f, \u0926\u0942\u0930\u0926\u0930\u094d\u0936\u0940 \u091c\u0935\u093e\u0939\u0930\u0932\u093e\u0932 \u0928\u0947\u0939\u0930\u0942, \u092a\u0939\u0932\u0947 \u092a\u0940\u090f\u092e \u0939\u094b\u0928\u0947 \u0915\u0947 \u0928\u093e\u0924\u0947, \u0928\u093f\u0930\u094d\u0935\u093f\u0935\u093e\u0926 \u0930\u0942\u092a \u0938\u0947 \u0906\u092f\u094b\u0917 \u0915\u0947 \u092a\u0942\u0930\u094d\u0923 \u092a\u0939\u0932\u0947 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0925\u0947\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q109.</b> Q135. Which of the following five year plans of India commenced at a time when the global economy was going through a second financial crisis? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0910\u0938\u0947 \u0938\u092e\u092f \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0939\u0941\u0908 \u091c\u092c \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0926\u0942\u0938\u0930\u0947 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0902\u0915\u091f \u0938\u0947 \u0917\u0941\u091c\u0930 \u0930\u0939\u0940 \u0925\u0940? [SSC CHSL, 29 Nov 2025, Shift-3]",
      "options": [
        "Twelfth / \u092c\u093e\u0930\u0939\u0935\u0940\u0902",
        "Third / \u0924\u0940\u0938\u0930\u0940",
        "Fourth / \u091a\u094c\u0925\u0940",
        "First / \u092a\u0939\u0932\u0940"
      ],
      "correctIndex": 0,
      "explanation": "The monumental Twelfth Five-Year Plan (2012-17) began exactly amidst the severe, highly damaging global economic slowdown directly following the catastrophic 2008 financial crisis and the deeply subsequent, crippling Eurozone debt crisis, which heavily and negatively affected India&#x27;s massive export growth and overall domestic investment climate. / \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u092c\u093e\u0930\u0939\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (2012-17) \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 2008 \u0915\u0947 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0902\u0915\u091f \u0914\u0930 \u0909\u0938\u0915\u0947 \u092c\u093e\u0926 \u0915\u0947 \u0905\u092a\u0902\u0917 \u092f\u0942\u0930\u094b\u091c\u093c\u094b\u0928 \u090b\u0923 \u0938\u0902\u0915\u091f \u0915\u0947 \u0920\u0940\u0915 \u092c\u093e\u0926 \u0917\u0902\u092d\u0940\u0930, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0939\u093e\u0928\u093f\u0915\u093e\u0930\u0915 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0906\u0930\u094d\u0925\u093f\u0915 \u092e\u0902\u0926\u0940 \u0915\u0947 \u092c\u0940\u091a \u0936\u0941\u0930\u0942 \u0939\u0941\u0908, \u091c\u093f\u0938\u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0935\u093f\u0915\u093e\u0938 \u0914\u0930 \u0938\u092e\u0917\u094d\u0930 \u0918\u0930\u0947\u0932\u0942 \u0928\u093f\u0935\u0947\u0936 \u0915\u0947 \u092e\u093e\u0939\u094c\u0932 \u0915\u094b \u092d\u093e\u0930\u0940 \u0914\u0930 \u0928\u0915\u093e\u0930\u093e\u0924\u094d\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u092d\u093e\u0935\u093f\u0924 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q110.</b> Q136. Which of the following five year plans of India started in 1969? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e 1969 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0939\u0941\u0908 \u0925\u0940? [SSC CHSL, 30 Nov 2025, Shift-1]",
      "options": [
        "First / \u092a\u0939\u0932\u0940",
        "Second / \u0926\u0942\u0938\u0930\u0940",
        "Sixth / \u091b\u0920\u0940",
        "Fourth / \u091a\u094c\u0925\u0940"
      ],
      "correctIndex": 3,
      "explanation": "Immediately after the turbulent, three-year gap period of Annual Plans (famously known as the 1966-69 Plan Holiday), the highly anticipated Fourth Five-Year Plan was officially and strongly launched exactly in 1969 and successfully continued until 1974. It aggressively focused on the profound &quot;Self-reliance&quot; goal and witnessed the historic, massive nationalization of 14 major commercial banks. / \u0935\u093e\u0930\u094d\u0937\u093f\u0915 \u092f\u094b\u091c\u0928\u093e\u0913\u0902 (\u091c\u093f\u0938\u0947 1966-69 \u092f\u094b\u091c\u0928\u093e \u0905\u0935\u0915\u093e\u0936 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948) \u0915\u0940 \u0905\u0936\u093e\u0902\u0924, \u0924\u0940\u0928 \u0938\u093e\u0932 \u0915\u0947 \u0905\u0902\u0924\u0930\u093e\u0932 \u0905\u0935\u0927\u093f \u0915\u0947 \u0924\u0941\u0930\u0902\u0924 \u092c\u093e\u0926, \u092c\u0939\u0941\u092a\u094d\u0930\u0924\u0940\u0915\u094d\u0937\u093f\u0924 \u091a\u094c\u0925\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0914\u0930 \u092e\u091c\u092c\u0942\u0924\u0940 \u0938\u0947 1969 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940 \u0914\u0930 1974 \u0924\u0915 \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u091c\u093e\u0930\u0940 \u0930\u0939\u0940\u0964 \u0907\u0938\u0928\u0947 \u0917\u0939\u0928 &quot;\u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e&quot; \u0932\u0915\u094d\u0937\u094d\u092f \u092a\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u093f\u092f\u093e \u0914\u0930 14 \u092a\u094d\u0930\u092e\u0941\u0916 \u0935\u093e\u0923\u093f\u091c\u094d\u092f\u093f\u0915 \u092c\u0948\u0902\u0915\u094b\u0902 \u0915\u0947 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f\u0915\u0930\u0923 \u0915\u094b \u0926\u0947\u0916\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q111.</b> Q138. The Foreign Investment Promotion Board (FIPB) was initially constituted in India under the: / \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0938\u0902\u0935\u0930\u094d\u0927\u0928 \u092c\u094b\u0930\u094d\u0921 (FIPB) \u0915\u093e \u0917\u0920\u0928 \u0936\u0941\u0930\u0941\u0906\u0924 \u092e\u0947\u0902 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0915\u093f\u0938\u0915\u0947 \u0905\u0927\u0940\u0928 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e: [SSC CHSL, 30 Nov 2025, Shift-2]",
      "options": [
        "Parliament of India / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0938\u0902\u0938\u0926",
        "Finance Commission / \u0935\u093f\u0924\u094d\u0924 \u0906\u092f\u094b\u0917",
        "Prime Minister&#x27;s Office / \u092a\u094d\u0930\u0927\u093e\u0928\u092e\u0902\u0924\u094d\u0930\u0940 \u0915\u093e\u0930\u094d\u092f\u093e\u0932\u092f",
        "President of India / \u092d\u093e\u0930\u0924 \u0915\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u092a\u0924\u093f"
      ],
      "correctIndex": 2,
      "explanation": "The highly pivotal Foreign Investment Promotion Board (FIPB) was strategically and initially set up directly under the absolute, powerful oversight of the Prime Minister&#x27;s Office (PMO) in the historic year 1991 to aggressively expedite crucial foreign direct investment approvals. It was later formally transferred to the DIPP and finally permanently abolished in 2017. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0938\u0902\u0935\u0930\u094d\u0927\u0928 \u092c\u094b\u0930\u094d\u0921 (FIPB) \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0936\u0941\u0930\u0941\u0906\u0924 \u092e\u0947\u0902 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0935\u0930\u094d\u0937 1991 \u092e\u0947\u0902 \u092a\u094d\u0930\u0927\u093e\u0928\u092e\u0902\u0924\u094d\u0930\u0940 \u0915\u093e\u0930\u094d\u092f\u093e\u0932\u092f (PMO) \u0915\u0940 \u092a\u0942\u0930\u094d\u0923, \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0928\u093f\u0917\u0930\u093e\u0928\u0940 \u0915\u0947 \u0924\u0939\u0924 \u0938\u0940\u0927\u0947 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e \u0924\u093e\u0915\u093f \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936 \u0905\u0928\u0941\u092e\u094b\u0926\u0928 \u092e\u0947\u0902 \u0924\u0947\u091c\u0940 \u0932\u093e\u0908 \u091c\u093e \u0938\u0915\u0947\u0964 \u0907\u0938\u0947 \u092c\u093e\u0926 \u092e\u0947\u0902 \u0914\u092a\u091a\u093e\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 DIPP \u092e\u0947\u0902 \u0938\u094d\u0925\u093e\u0928\u093e\u0902\u0924\u0930\u093f\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0914\u0930 \u0905\u0902\u0924\u0924\u0903 2017 \u092e\u0947\u0902 \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e \u0917\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q112.</b> Q139. In India, the second five year plan ended in which year? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902, \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u093f\u0938 \u0935\u0930\u094d\u0937 \u0938\u092e\u093e\u092a\u094d\u0924 \u0939\u0941\u0908? [SSC CHSL, 30 Nov 2025, Shift-2]",
      "options": [
        "1950",
        "1961",
        "1955",
        "1972"
      ],
      "correctIndex": 1,
      "explanation": "The monumental and highly structural Second Five-Year Plan of India precisely covered the crucial period from 1956 to 1961. It officially ended exactly in March 1961, proudly marking the successful completion of India&#x27;s profoundly ambitious first phase of heavy industrialization specifically focused entirely on heavily building massive core infrastructure and giant steel plants. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0914\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u0920\u0940\u0915 1956 \u0938\u0947 1961 \u0924\u0915 \u0915\u0940 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0905\u0935\u0927\u093f \u0915\u094b \u0915\u0935\u0930 \u0915\u093f\u092f\u093e\u0964 \u092f\u0939 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0920\u0940\u0915 \u092e\u093e\u0930\u094d\u091a 1961 \u092e\u0947\u0902 \u0938\u092e\u093e\u092a\u094d\u0924 \u0939\u094b \u0917\u0908, \u091c\u094b \u092d\u093e\u0930\u0924 \u0915\u0947 \u092d\u093e\u0930\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0915\u0947 \u0917\u0939\u0928 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u092a\u0939\u0932\u0947 \u091a\u0930\u0923 \u0915\u0947 \u0938\u092b\u0932 \u0938\u092e\u093e\u092a\u0928 \u0915\u094b \u0917\u0930\u094d\u0935 \u0938\u0947 \u091a\u093f\u0939\u094d\u0928\u093f\u0924 \u0915\u0930\u0924\u0940 \u0939\u0948, \u091c\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092e\u0941\u0916\u094d\u092f \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u0947 \u0914\u0930 \u0935\u093f\u0936\u093e\u0932 \u0938\u094d\u091f\u0940\u0932 \u0938\u0902\u092f\u0902\u0924\u094d\u0930\u094b\u0902 \u0915\u0947 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u092a\u0930 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q113.</b> Q140. On whose ideas was the second five year plan based? / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u093f\u0938\u0915\u0947 \u0935\u093f\u091a\u093e\u0930\u094b\u0902 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0925\u0940? [SSC CHSL, 30 Nov 2025, Shift-3]",
      "options": [
        "Prasanta Chandra Mahalanobis / \u092a\u094d\u0930\u0936\u093e\u0902\u0924 \u091a\u0902\u0926\u094d\u0930 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938",
        "Chaudhari Charan Singh / \u091a\u094c\u0927\u0930\u0940 \u091a\u0930\u0923 \u0938\u093f\u0902\u0939",
        "Sardar Vallabh Bhai Patel / \u0938\u0930\u0926\u093e\u0930 \u0935\u0932\u094d\u0932\u092d \u092d\u093e\u0908 \u092a\u091f\u0947\u0932",
        "K Kamraj / \u0915\u0947. \u0915\u093e\u092e\u0930\u093e\u091c"
      ],
      "correctIndex": 0,
      "explanation": "The incredibly historic Second Five-Year Plan was heavily, entirely based precisely on the complex Mahalanobis Model, brilliantly formulated by P.C. Mahalanobis. It powerfully and structurally argued for a massive, radical shift in state investment directly toward the heavy capital goods sector to aggressively achieve long-term economic growth and absolute industrial self-sufficiency. / \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947, \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u091c\u091f\u093f\u0932 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u092a\u0930 \u0906\u0927\u093e\u0930\u093f\u0924 \u0925\u0940, \u091c\u093f\u0938\u0947 \u092a\u0940.\u0938\u0940. \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u0926\u094d\u0935\u093e\u0930\u093e \u0936\u093e\u0928\u0926\u093e\u0930 \u0922\u0902\u0917 \u0938\u0947 \u0924\u0948\u092f\u093e\u0930 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0928\u0947 \u0932\u0902\u092c\u0947 \u0938\u092e\u092f \u0924\u0915 \u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0914\u0930 \u092a\u0942\u0930\u094d\u0923 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0940 \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0935\u0938\u094d\u0924\u0941 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u0913\u0930 \u0938\u0940\u0927\u0947 \u0930\u093e\u091c\u094d\u092f \u0928\u093f\u0935\u0947\u0936 \u092e\u0947\u0902 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u0915\u091f\u094d\u091f\u0930\u092a\u0902\u0925\u0940 \u092c\u0926\u0932\u093e\u0935 \u0915\u0947 \u0932\u093f\u090f \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0914\u0930 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0924\u0930\u094d\u0915 \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q114.</b> Q142. Who among the following was the chairman of Planning Commission under the tenth five year plan? / \u0926\u0938\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0947 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0925\u0947? [SSC CHSL, 14 Nov 2025, Shift-2]",
      "options": [
        "K. Gujral / \u0915\u0947. \u0917\u0941\u091c\u0930\u093e\u0932",
        "D. Deve Gowda / \u090f\u091a. \u0921\u0940. \u0926\u0947\u0935\u0947\u0917\u094c\u0921\u093c\u093e",
        "V. Narasimha Rao / \u092a\u0940.\u0935\u0940. \u0928\u0930\u0938\u093f\u092e\u094d\u0939\u093e \u0930\u093e\u0935",
        "Atal Bihari Vajpayee / \u0905\u091f\u0932 \u092c\u093f\u0939\u093e\u0930\u0940 \u0935\u093e\u091c\u092a\u0947\u092f\u0940"
      ],
      "correctIndex": 3,
      "explanation": "According to extremely strict constitutional protocol, the sitting Prime Minister acts as the ex-officio Chairman of the massive Planning Commission. Therefore, Atal Bihari Vajpayee, gracefully serving as the Prime Minister of India, was unequivocally the Chairman of the Planning Commission exactly during the highly crucial launch and entire first half of the Tenth Five-Year Plan (2002-2007). / \u0905\u0924\u094d\u092f\u0902\u0924 \u0938\u0916\u094d\u0924 \u0938\u0902\u0935\u0948\u0927\u093e\u0928\u093f\u0915 \u092a\u094d\u0930\u094b\u091f\u094b\u0915\u0949\u0932 \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930, \u0924\u0924\u094d\u0915\u093e\u0932\u0940\u0928 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0935\u093f\u0936\u093e\u0932 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0947 \u092a\u0926\u0947\u0928 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u0907\u0938\u0932\u093f\u090f, \u092d\u093e\u0930\u0924 \u0915\u0947 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0936\u093e\u0928\u0926\u093e\u0930 \u0922\u0902\u0917 \u0938\u0947 \u0938\u0947\u0935\u093e \u0915\u0930 \u0930\u0939\u0947 \u0905\u091f\u0932 \u092c\u093f\u0939\u093e\u0930\u0940 \u0935\u093e\u091c\u092a\u0947\u092f\u0940, \u0926\u0938\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (2002-2007) \u0915\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0932\u0949\u0928\u094d\u091a \u0914\u0930 \u092a\u0942\u0930\u0947 \u092a\u0939\u0932\u0947 \u092d\u093e\u0917 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0928\u093f\u0930\u094d\u0935\u093f\u0935\u093e\u0926 \u0930\u0942\u092a \u0938\u0947 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0915\u0947 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0925\u0947\u0964",

    {
      "text": "<b>Q115.</b> Q143. Which of the following five year plan of India had the main focus on &quot;Growth with Social Justice and Equality&quot;? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u092b\u094b\u0915\u0938 &quot;\u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u0928\u094d\u092f\u093e\u092f \u0914\u0930 \u0938\u092e\u093e\u0928\u0924\u093e \u0915\u0947 \u0938\u093e\u0925 \u0935\u093f\u0915\u093e\u0938&quot; (Growth with Social Justice and Equality) \u092a\u0930 \u0925\u093e? [SSC MTS, 17 Feb 2026, Shift-2]",
      "options": [
        "First / \u092a\u0939\u0932\u0940",
        "Second / \u0926\u0942\u0938\u0930\u0940",
        "Ninth / \u0928\u094c\u0935\u0940\u0902",
        "Third / \u0924\u0940\u0938\u0930\u0940"
      ],
      "correctIndex": 2,
      "explanation": "The highly pivotal Ninth Five-Year Plan of India (1997\u20132002), proudly launched exactly during the 50th year of national independence, explicitly and prominently had its absolute main overarching focus strictly on &quot;Growth with Social Justice and Equality&quot;. It strategically aimed to heavily prioritize agriculture, mass employment generation, and massive poverty alleviation. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0928\u094c\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1997-2002), \u091c\u094b \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930\u0924\u093e \u0915\u0947 50\u0935\u0947\u0902 \u0935\u0930\u094d\u0937 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0917\u0930\u094d\u0935 \u0938\u0947 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940, \u0915\u093e \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u092a\u094d\u0930\u092e\u0941\u0916 \u0930\u0942\u092a \u0938\u0947 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092e\u0941\u0916\u094d\u092f \u0905\u0924\u093f\u0935\u094d\u092f\u093e\u092a\u0940 \u092b\u094b\u0915\u0938 &quot;\u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u0928\u094d\u092f\u093e\u092f \u0914\u0930 \u0938\u092e\u093e\u0928\u0924\u093e \u0915\u0947 \u0938\u093e\u0925 \u0935\u093f\u0915\u093e\u0938&quot; \u092a\u0930 \u0925\u093e\u0964 \u0907\u0938\u0915\u093e \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u0943\u0937\u093f, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0930\u094b\u091c\u0917\u093e\u0930 \u0938\u0943\u091c\u0928 \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0917\u0930\u0940\u092c\u0940 \u0909\u0928\u094d\u092e\u0942\u0932\u0928 \u0915\u094b \u092d\u093e\u0930\u0940 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0947\u0928\u093e \u0925\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q116.</b> Q144. The Rourkela steel plant was set up in _____. / \u0930\u093e\u0909\u0930\u0915\u0947\u0932\u093e \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\u0930 (Rourkela steel plant) \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e _____ \u092e\u0947\u0902 \u0915\u0940 \u0917\u0908 \u0925\u0940\u0964 [SSC MTS, 20 Feb 2026, Shift-2]",
      "options": [
        "1950",
        "1959",
        "1975",
        "1990"
      ],
      "correctIndex": 1,
      "explanation": "The massive, historically renowned Rourkela Steel Plant (RSP) in Odisha was the absolute first fully integrated steel plant in the public sector in independent India, becoming officially and fully operational exactly in 1959. It was strategically established with crucial technical and massive financial collaboration heavily from West Germany during the Second Five-Year Plan. / \u0913\u0921\u093f\u0936\u093e \u092e\u0947\u0902 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0930\u093e\u0909\u0930\u0915\u0947\u0932\u093e \u0938\u094d\u091f\u0940\u0932 \u092a\u094d\u0932\u093e\u0902\u091f (RSP) \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u092e\u0947\u0902 \u092a\u0942\u0930\u094d\u0923 \u092a\u0939\u0932\u093e \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u090f\u0915\u0940\u0915\u0943\u0924 \u0938\u094d\u091f\u0940\u0932 \u092a\u094d\u0932\u093e\u0902\u091f \u0925\u093e, \u091c\u094b \u0920\u0940\u0915 1959 \u092e\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0914\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u091a\u093e\u0932\u0942 \u0939\u094b \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0947 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u092a\u0936\u094d\u091a\u093f\u092e \u091c\u0930\u094d\u092e\u0928\u0940 \u0915\u0947 \u092d\u093e\u0930\u0940 \u0924\u0915\u0928\u0940\u0915\u0940 \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0939\u092f\u094b\u0917 \u0915\u0947 \u0938\u093e\u0925 \u0       "text": "<b>Q117.</b> Q145. Which of the following five year plan of India was launched after the initiation of structural adjustment policies? / \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0938\u092e\u093e\u092f\u094b\u091c\u0928 \u0928\u0940\u0924\u093f\u092f\u094b\u0902 \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 \u0915\u0947 \u092c\u093e\u0926 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC MTS, 04 Feb 2026, Shift-3]",
      "options": [

      ],
      "correctIndex": 0,
      "explanation": "The massive structural adjustment policies, universally widely known as the sweeping LPG (Liberalization, Privatization, Globalization) reforms, were desperately initiated in India in July 1991. Consequently, the highly anticipated Eighth Five Year Plan was severely delayed and eventually launched exactly in 1992 (running 1992-1997), making it the absolute first plan fully implemented after these landmark economic reforms. / \u0935\u094d\u092f\u093e\u092a\u0915 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0938\u092e\u093e\u092f\u094b\u091c\u0928 \u0928\u0940\u0924\u093f\u092f\u093e\u0902, \u091c\u093f\u0928\u094d\u0939\u0947\u0902 \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u0942\u092a \u0938\u0947 \u090f\u0932\u092a\u0940\u091c\u0940 (\u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923, \u0928\u093f\u091c\u0940\u0915\u0930\u0923, \u0935\u0948\u0936\u094d\u0935\u0940\u0915\u0930\u0923) \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948, \u091c\u0941\u0932\u093e\u0908 1991 \u092e\u0947\u0902 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940\u0902\u0964 \u0928\u0924\u0940\u091c\u0924\u0928, \u092c\u0939\u0941\u092a\u094d\u0930\u0924\u0940\u0915\u094d\u0937\u093f\u0924 \u0906\u0920\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092e\u0947\u0902 \u0917\u0902\u092d\u0940\u0930 \u0930\u0942\u092a \u0938\u0947 \u0926\u0947\u0930\u0940 \u0939\u0941\u0908 \u0914\u0930 \u0905\u0902\u0924\u0924\u0903 \u0920\u0940\u0915 1992 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 (1992-1997 \u0924\u0915 \u091a\u0932 \u0930\u0939\u0940), \u091c\u093f\u0938\u0938\u0947 \u092f\u0939 \u0907\u0928 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u       "explanation": "The highly historic Industrial Policy Resolution of 1956 rigidly classified all Indian industries entirely into three extremely strict schedules. Schedule B (the second category) explicitly consisted of 12 crucial industries where the powerful state would increasingly establish new giant units, but the private sector was legally and actively allowed to heavily supplement the massive efforts of the state. / 1956 \u0915\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a \u0928\u0947 \u0938\u092d\u0940 \u092d\u093e\u0930\u0924\u0940\u092f \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0924\u0940\u0928 \u0905\u0924\u094d\u092f\u0902\u0924 \u0938\u0916\u094d\u0924 \u0905\u0928\u0941\u0938\u0942\u091a\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e\u0964 \u0905\u0928\u0941\u0938\u0942\u091a\u0940 \u092c\u0940 (\u0926\u0942\u0938\u0930\u0940 \u0936\u094d\u0930\u0947\u0923\u0940) \u092e\u0947\u0902 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 12 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0909\u0926\u094d\u092f\u094b\u0917 \u0936\u093e\u092e\u093f\u0932 \u0925\u0947 \u091c\u0939\u093e\u0902 \u0936\u0915\u094d\u0924\u093f\u0936\u093e\u0932\u0940 \u0930\u093e\u091c\u094d\u092f \u0924\u0947\u091c\u0940 \u0938\u0947 \u0928\u0908 \u0935\u093f\u0936\u093e\u0932 \u0907\u0915\u093e\u0907\u092f\u093e\u0902 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u0930\u0947\u0917\u093e, \u0932\u0947\u0915\u093f\u0928 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u094b \u0915\u093e\u0928\u0942\u0928\u0940 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0938\u0915\u094d\u0930\u093f\u092f \u0930\u0942\u092       "text": "<b>Q119.</b> Q150. The Durgapur steel plant was set up in collaboration with the government of the ____. / \u0926\u0941\u0930\u094d\u0917\u093e\u092a\u0941\u0930 \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\u0930 \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u093f\u0938 \u0938\u0930\u0915\u093e\u0930 \u0915\u0947 \u0938\u0939\u092f\u094b\u0917 \u0938\u0947 \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC MTS, 06 Feb 2026, Shift-2]",

      "correctIndex": 2,
      "explanation": "The monumental and highly productive Durgapur Steel Plant, strategically located in West Bengal, was proudly established in the late 1950s (specifically during the heavy-industry-focused Second Five Year Plan) with robust, massive technological and critical financial collaboration exclusively from the United Kingdom (Britain). / \u092a\u0936\u094d\u091a\u093f\u092e \u092c\u0902\u0917\u093e\u0932 \u092e\u0947\u0902 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u094d\u0925\u093f\u0924 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0914\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0915 \u0926\u0941\u0930\u094d\u0917\u093e\u092a\u0941\u0930 \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\u0930, 1950 \u0915\u0947 \u0926\u0936\u0915 \u0915\u0947 \u0909\u0924\u094d\u0924\u0930\u093e\u0930\u094d\u0927 \u092e\u0947\u0902 (\u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0940-\u0909\u0926\u094d\u092f\u094b\u0917-\u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0926\u094c\u0930\u093e\u0928) \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092f\u0942\u0928\u093e\u0907\u091f\u0947\u0921 \u0915\u093f\u0902\u0917\u0921\u092e (\u092c\u094d\u0930\u093f\u091f\u0947\u0928) \u0938\u0947 \u092e\u091c\u092c\u0942\u0924, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0924\u0915\u0928\u0940\u0915\u0940 \u0914\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u0939\u092f\u094b\u0917 \u0915\u0947 \u0938\u093e\u0925 \u0917\u0930\u094d\u0935 \u0938\u0947 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",

      "text": "<b>Q120.</b> Q152. Coal Mines Authority Limited (CMAL) with headquarters at Calcutta, was set up by the Government in May, _____ to manage non-coking coal mines. / \u0915\u0932\u0915\u0924\u094d\u0924\u093e \u092e\u0947\u0902 \u092e\u0941\u0916\u094d\u092f\u093e\u0932\u092f \u0935\u093e\u0932\u0947 \u0915\u094b\u0932 \u092e\u093e\u0907\u0928\u094d\u0938 \u0905\u0925\u0949\u0930\u093f\u091f\u0940 \u0932\u093f\u092e\u093f\u091f\u0947\u0921 (CMAL) \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0938\u0930\u0915\u093e\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u092e\u0908, _____ \u092e\u0947\u0902 \u0917\u0948\u0930-\u0915\u094b\u0915\u093f\u0902\u0917 \u0915\u094b\u092f\u0932\u093e \u0916\u0926\u093e\u0928\u094b\u0902 \u0915\u0947 \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u0915\u0947 \u0932\u093f\u090f \u0915\u0940 \u0917\u0908 \u0925\u0940\u0964 [SSC MTS, 10 Feb 2026, Shift-1]",

      "correctIndex": 1,
      "explanation": "The massive and highly influential Coal Mines Authority Limited (CMAL) was officially and strategically established entirely by the Government of India exactly in May 1973. Its absolute primary mandate was to strictly take over and completely manage the recently and fully nationalized non-coking coal mines nationwide. / \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0914\u0930 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u092d\u093e\u0935\u0936\u093e\u0932\u0940 \u0915\u094b\u0932 \u092e\u093e\u0907\u0928\u094d\u0938 \u0905\u0925\u0949\u0930\u093f\u091f\u0940 \u0932\u093f\u092e\u093f\u091f\u0947\u0921 (CMAL) \u0915\u094b \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0914\u0930 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u0920\u0940\u0915 \u092e\u0908 1973 \u092e\u0947\u0902 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u091c\u0928\u093e\u0926\u0947\u0936 \u0926\u0947\u0936 \u092d\u0930 \u092e\u0947\u0902 \u0939\u093e\u0932 \u0939\u0940 \u092e\u0947\u0902 \u0914\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f\u0915\u0943\u0924 \u0917\u0948\u0930-\u0915\u094b\u0915\u093f\u0902\u0917 \u0915\u094b\u092f\u0932\u093e \u0916\u0926\u093e\u0928\u094b\u0902 \u0915\u094b \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u0905\u092a\u0928\u0947 \u0939\u093e\u0925 \u092e\u0947\u0902 \u0932\u0947\u0928\u093e \u0914\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092a\u094d\u0930\u092c\u0902\u0927\u093f\u0924 \u0915\u0930\u0928\u093e \u0925\u093e\u0964",

      "text": "<b>Q122.</b> Q155. Which of the following five year plan had the theme &quot;Towards Faster and More Inclusive Growth&quot;? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u0935\u093f\u0937\u092f &quot;\u0924\u0947\u091c \u0914\u0930 \u0905\u0927\u093f\u0915 \u0938\u092e\u093e\u0935\u0947\u0936\u0940 \u0935\u093f\u0915\u093e\u0938 \u0915\u0940 \u0913\u0930&quot; (Towards Faster and More Inclusive Growth) \u0925\u093e? [SSC MTS, 10 Feb 2026, Shift-3]",

      "correctIndex": 3,
      "explanation": "The highly ambitious theme &quot;Towards Faster and More Inclusive Growth&quot; was the absolute central, driving objective explicitly of the Eleventh Five Year Plan of India. Spanning exactly from 2007 to 2012 under Prime Minister Manmohan Singh, it aimed to comprehensively ensure the massive benefits of rapid economic expansion successfully reached all deeply marginalized sections. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0935\u093f\u0937\u092f &quot;\u0924\u0947\u091c \u0914\u0930 \u0905\u0927\u093f\u0915 \u0938\u092e\u093e\u0935\u0947\u0936\u0940 \u0935\u093f\u0915\u093e\u0938 \u0915\u0940 \u0913\u0930&quot; \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0917\u094d\u092f\u093e\u0930\u0939\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f, \u092a\u094d\u0930\u0947\u0930\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0925\u093e\u0964 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u092e\u0928\u092e\u094b\u0939\u0928 \u0938\u093f\u0902\u0939 \u0915\u0947 \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u092e\u0947\u0902 \u0920\u0940\u0915 2007 \u0938\u0947 2012 \u0924\u0915 \u092b\u0948\u0932\u0947, \u0907\u0938\u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u0942\u092a \u0938\u0947 \u092f\u0939 \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0928\u093e \u0925\u093e \u0915\u093f \u0924\u0940\u0935\u094d\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0915\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0932\u093e\u092d \u0938\u092d\u0940 \u0917\u0939\u0930\u093e\u0908 \u0938\u0947 \u0939\u093e\u0936\u093f\u090f \u0935\u093e\u0932\u0947 \u0935\u0930\u094d\u0917\u094b\u0902 \u0924\u0915 \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u092a\u0939\u0941\u0902\u091a\u0947\u0902\u0964",

    {
      "text": "<b>Q123.</b> Q156. The Seventh five year plan was started in _____. / \u0938\u093e\u0924\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e _____ \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940\u0964 [SSC MTS, 11 Feb 2026, Shift-1]",
      "options": [
        "1972",

      ],
      "correctIndex": 2,
      "explanation": "The highly transformative Seventh Five-Year Plan of India was officially and ambitiously launched exactly in the year 1985 and lasted robustly until 1990, functioning dynamically under the leadership of Prime Minister Rajiv Gandhi. Its central objectives were aggressively focused heavily on drastically improving industrial productivity and massively accelerating food grain production through advanced technological upgrades. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940 \u0938\u093e\u0924\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0914\u0930 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0930\u0942\u092a \u0938\u0947 \u0920\u0940\u0915 \u0935\u0930\u094d\u0937 1985 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940 \u0914\u0930 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0930\u093e\u091c\u0940\u0935 \u0917\u093e\u0902\u0927\u0940 \u0915\u0947 \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u092e\u0947\u0902 \u0917\u0924\u093f\u0936\u0940\u0932 \u0930\u0942\u092a \u0938\u0947 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u0947 \u0939\u0941\u090f 1990 \u0924\u0915 \u092e\u091c\u092c\u0942\u0924\u0940 \u0938\u0947 \u091a\u0932\u0940\u0964 \u0907\u0938\u0915\u0947 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f\u094b\u0902 \u0928\u0947 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0915\u0924\u093e \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0938\u0941\u0927\u093e\u0930 \u0915\u0930\u0928\u0947 \u0914\u0930 \u0909\u0928\u094d\u0928\u0924 \u0924\u0915\u0928\u0940\u0915\u09       "reference": ""

    {
      "text": "<b>Q124.</b> Q157. The second five year plan of India was completed in ____. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e ____ \u092e\u0947\u0902 \u092a\u0942\u0930\u0940 \u0939\u0941\u0908 \u0925\u0940\u0964 [SSC MTS, 11 Feb 2026, Shift-3]",
      "options": [
        "1956",
        "1961",
        "1965",
        "1969"
      ],
      "correctIndex": 1,
      "explanation": "The profoundly historic and monumentally structural Second Five-Year Plan of India was officially launched in 1956 and was successfully and completely concluded exactly in 1961. This highly ambitious plan, drafted masterfully by P.C. Mahalanobis, radically prioritized rapid heavy industrialization and saw the massive establishment of gigantic public sector steel plants in Bhilai, Durgapur, and Rourkela. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0917\u0939\u0928 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0914\u0930 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 1956 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940 \u0914\u0930 1961 \u092e\u0947\u0902 \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u0914\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u0902\u092a\u0928\u094d\u0928 \u0939\u0941\u0908 \u0925\u0940\u0964 \u092a\u0940.\u0938\u0940. \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u0926\u094d\u0935\u093e\u0930\u093e \u0909\u0924\u094d\u0915\u0943\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0924\u0948\u092f\u093e\u0930 \u0915\u0940 \u0917\u0908 \u0907\u0938 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u0924\u0947\u091c\u0940 \u0938\u0947 \u092d\u093e\u0930\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0915\u094b \u092e\u094c\u0932\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0940 \u0914\u0930 \u092d\u093f\u0932\u093e\u0908, \u0926\u0941\u0930\u094d\u0917\u093e\u092a\u0941\u0930 \u0914\u0930 \u0930\u093e\u0909\u0930\u0915\u0947\u0932\u093e \u092e\u0947\u0902 \u0935\u093f\u0936\u093e\u0932 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\u0930\u094b\u0902 \u0915\u0940 \u092d\u093e\u0930\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0926\u0947\u0916\u0940\u0964",
      "reference": ""

    {
      "text": "<b>Q125.</b> Q158. As per the Industrial Policy Statement, 1977 a tiny unit was one which has an investment of Rs. ____ lakh. / \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0935\u0915\u094d\u0924\u0935\u094d\u092f, 1977 \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930 \u090f\u0915 \u0905\u0924\u094d\u092f\u0902\u0924 \u091b\u094b\u091f\u0940 \u0907\u0915\u093e\u0908 (tiny unit) \u0935\u0939 \u0925\u0940 \u091c\u093f\u0938\u092e\u0947\u0902 ____ \u0932\u093e\u0916 \u0930\u0941\u092a\u092f\u0947 \u0915\u093e \u0928\u093f\u0935\u0947\u0936 \u0925\u093e\u0964 [SSC MTS, 11 Feb 2026, Shift-3]",
      "options": [
        "1",
        "5",
        "10",
        "15"
      ],
      "correctIndex": 0,
      "explanation": "According exactly to the highly specific provisions of the Industrial Policy Statement of 1977, a &quot;tiny unit&quot; was officially and legally defined strictly as a business enterprise having an absolute maximum total investment of just Rs. 1 lakh in core machinery and equipment, purposefully aimed to radically decentralize and aggressively promote massive rural cottage industries. / 1977 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0935\u0915\u094d\u0924\u0935\u094d\u092f \u0915\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u092a\u094d\u0930\u093e\u0935\u0927\u093e\u0928\u094b\u0902 \u0915\u0947 \u0920\u0940\u0915 \u0905\u0928\u0941\u0938\u093e\u0930, \u090f\u0915 &quot;\u0905\u0924\u094d\u092f\u0902\u0924 \u091b\u094b\u091f\u0940 \u0907\u0915\u093e\u0908&quot; (tiny unit) \u0915\u094b \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0914\u0930 \u0915\u093e\u0928\u0942\u0928\u0940 \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u0910\u0938\u0947 \u0935\u094d\u092f\u093e\u0935\u0938\u093e\u092f\u093f\u0915 \u0909\u0926\u094d\u092f\u092e \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u092a\u0930\u093f\u092d\u093e\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e, \u091c\u093f\u0938\u0915\u093e \u092e\u0941\u0916\u094d\u092f \u092e\u0936\u0940\u0928\u0930\u0940 \u0914\u0930 \u0909\u092a\u0915\u0930\u0923\u094b\u0902 \u092e\u0947\u0902 \u092a\u0942\u0930\u094d\u0923 \u0905\u0927\u093f\u0915\u0924\u092e \u0915\u0941\u0932 \u0928\u093f\u0935\u0947\u0936 \u0915\u0947\u0935\u0932 1 \u0932\u093e\u0916 \u0930\u0941\u092a\u092f\u0947 \u0925\u093e, \u091c\u093f\u0938\u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0915\u0941\u091f\u0940\u0930 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u092e\u094c\u0932\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0915\u0947\u0902\u0926\u094d\u0930\u0940\u0915\u0943\u0924 \u0915\u0930\u0928\u093e \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q126.</b> Q159. Which of the following was time period of Seventh five year plan of India? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0938\u093e\u0924\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0940 \u0938\u092e\u092f\u093e\u0935\u0927\u093f \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u0925\u0940? [SSC MTS, 12 Feb 2026, Shift-2]",
      "options": [
        "1972-1977",
        "1975-1980",
        "1995-2000",
        "1985-1990"
      ],
      "correctIndex": 3,
      "explanation": "The highly technology-driven Seventh Five-Year Plan of India, energetically spearheaded by Prime Minister Rajiv Gandhi, was fully and officially implemented spanning exactly from the year 1985 to 1990. This crucially important economic plan strategically and heavily focused on accelerating massive foodgrain production and dramatically improving overall national industrial productivity through rapid computerization and modernization. / \u092d\u093e\u0930\u0924 \u0915\u0940 \u0909\u091a\u094d\u091a \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940-\u0938\u0902\u091a\u093e\u0932\u093f\u0924 \u0938\u093e\u0924\u0935\u0940\u0902 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e, \u091c\u093f\u0938\u0915\u093e \u0909\u0924\u094d\u0938\u093e\u0939\u092a\u0942\u0930\u094d\u0935\u0915 \u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0930\u093e\u091c\u0940\u0935 \u0917\u093e\u0902\u0927\u0940 \u0928\u0947 \u0915\u093f\u092f\u093e \u0925\u093e, \u0935\u0930\u094d\u0937 1985 \u0938\u0947 1990 \u0924\u0915 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0914\u0930 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0932\u093e\u0917\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940\u0964 \u0907\u0938 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0906\u0930\u094d\u0925\u093f\u0915 \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0914\u0930 \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0916\u093e\u0926\u094d\u092f\u093e\u0928\u094d\u0928 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u092e\u0947\u0902 \u0924\u0947\u091c\u0940 \u0932\u093e\u0928\u0947 \u0914\u0930 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0915\u092e\u094d\u092a\u094d\u092f\u0942\u091f\u0930\u0940\u0915\u0930\u0923 \u0914\u0930 \u0906\u0927\u0941\u0928\u093f\u0915\u0940\u0915\u0930\u0923 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0938\u092e\u0917\u094d\u0930 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0915\u0924\u093e \u092e\u0947\u0902 \u0928\u093e\u091f\u0915\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0938\u0941\u0927\u093e\u0930 \u0915\u0930\u0928\u0947 \u092a\u0930 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q127.</b> Q160. The Durgapur steel plant was set up in collaboration with the government of the ____. / \u0926\u0941\u0930\u094d\u0917\u093e\u092a\u0941\u0930 \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\u0930 \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u093f\u0938 \u0938\u0930\u0915\u093e\u0930 \u0915\u0947 \u0938\u0939\u092f\u094b\u0917 \u0938\u0947 \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC MTS, 06 Feb 2026, Shift-2]",

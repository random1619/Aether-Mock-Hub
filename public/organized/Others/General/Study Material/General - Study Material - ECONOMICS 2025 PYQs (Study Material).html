939\u0948\u0902, \u0914\u0930 \u0935\u093f\u0936\u093e\u0932, \u092c\u0947\u0939\u0926 \u092d\u093e\u0930\u0940 \u092d\u094c\u0924\u093f\u0915 \u0905\u0902\u0924\u093f\u092e \u0909\u0924\u094d\u092a\u093e\u0926\u094b\u0902 \u0915\u093e \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q49.</b> Which of the following pairs correctly represents agro-based industries? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u092f\u0941\u0917\u094d\u092e \u0915\u0943\u0937\u093f-\u0906\u0927\u093e\u0930\u093f\u0924 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u093e \u0938\u0939\u0940 \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f\u0924\u094d\u0935 \u0915\u0930\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 15 Sep 2025, Shift-3]",
      "options": [
        "Edible oil and Aluminium / \u0916\u093e\u0926\u094d\u092f \u0924\u0947\u0932 \u0914\u0930 \u090f\u0932\u094d\u092f\u0941\u092e\u093f\u0928\u093f\u092f\u092e",
        "Jute textiles and Steel / \u091c\u0942\u091f \u0915\u092a\u0921\u093c\u093e \u0914\u0930 \u0938\u094d\u091f\u0940\u0932",
        "Cement and Petrochemicals / \u0938\u0940\u092e\u0947\u0902\u091f \u0914\u0930 \u092a\u0947\u091f\u094d\u0930\u094b\u0915\u0947\u092e\u093f\u0915\u0932\u094d\u0938",
        "Cotton textiles and Sugar / \u0938\u0942\u0924\u0940 \u0935\u0938\u094d\u0924\u094d\u0930 \u0914\u0930 \u091a\u0940\u0928\u0940"
      ],
      "correctIndex": 3,
      "explanation": "In basic economic geography, Agro-based industries are those that absolutely derive their primary raw materials strictly from direct agricultural produce. Massive Cotton textiles exclusively use raw cotton crops, and the massive Sugar industry relies entirely on raw sugarcane crops. Therefore, this specific pair is perfectly correct. / \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0906\u0930\u094d\u0925\u093f\u0915 \u092d\u0942\u0917\u094b\u0932 \u092e\u0947\u0902, \u0915\u0943\u0937\u093f-\u0906\u0927\u093e\u0930\u093f\u0924 \u0909\u0926\u094d\u092f\u094b\u0917 \u0935\u0947 \u0939\u0948\u0902 \u091c\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0905\u092a\u0928\u0947 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0915\u091a\u094d\u091a\u0947 \u092e\u093e\u0932 \u0915\u094b \u0938\u0940\u0927\u0947 \u0915\u0943\u0937\u093f \u0909\u092a\u091c \u0938\u0947 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0938\u0942\u0924\u0940 \u0935\u0938\u094d\u0924\u094d\u0930 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0915\u091a\u094d\u091a\u0947 \u0915\u092a\u093e\u0938 \u0915\u0940 \u092b\u0938\u0932\u094b\u0902 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902, \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u091a\u0940\u0928\u0940 \u0909\u0926\u094d\u092f\u094b\u0917 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0915\u091a\u094d\u091a\u0947 \u0917\u0928\u094d\u0928\u0947 \u0915\u0940 \u092b\u0938\u0932\u094b\u0902 \u092a\u0930 \u0928\u093f\u0930\u094d\u092d\u0930 \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u0907\u0938\u0932\u093f\u090f, \u092f\u0939 \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u091c\u094b\u0921\u093c\u0940 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u0939\u0940 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q50.</b> Q61. The Sindri fertilizer plant, one of India&#x27;s oldest, is located in which state, utilizing its proximity to a major coal-producing region? / \u0938\u093f\u0902\u0926\u0930\u0940 \u0909\u0930\u094d\u0935\u0930\u0915 \u0938\u0902\u092f\u0902\u0924\u094d\u0930, \u091c\u094b \u092d\u093e\u0930\u0924 \u0915\u0947 \u0938\u092c\u0938\u0947 \u092a\u0941\u0930\u093e\u0928\u0947 \u0938\u0902\u092f\u0902\u0924\u094d\u0930\u094b\u0902 \u092e\u0947\u0902 \u0938\u0947 \u090f\u0915 \u0939\u0948, \u0915\u093f\u0938 \u0930\u093e\u091c\u094d\u092f \u092e\u0947\u0902 \u0938\u094d\u0925\u093f\u0924 \u0939\u0948, \u091c\u094b \u090f\u0915 \u092a\u094d\u0930\u092e\u0941\u0916 \u0915\u094b\u092f\u0932\u093e \u0909\u0924\u094d\u092a\u093e\u0926\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0938\u0947 \u0905\u092a\u0928\u0940 \u0928\u093f\u0915\u091f\u0924\u093e \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 16 Sep 2025, Shift-3]",
      "options": [
        "West Bengal / \u092a\u0936\u094d\u091a\u093f\u092e \u092c\u0902\u0917\u093e\u0932",
        "Odisha / \u0913\u0921\u093f\u0936\u093e",
        "Jharkhand / \u091d\u093e\u0930\u0916\u0902\u0921",
        "Bihar / \u092c\u093f\u0939\u093e\u0930"
      ],
      "correctIndex": 2,
      "explanation": "The Sindri Fertilizer Plant, established in 1951 as the absolutely first Public Sector Undertaking (PSU) in newly independent India, is geographically located in Jharkhand (formerly part of undivided Bihar). It was strategically established near the Jharia coalfields to efficiently utilize vast coal/coke and water from the Damodar river for ammonium sulphate production. / \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092a\u0939\u0932\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u092a\u0915\u094d\u0930\u092e (PSU) \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 1951 \u092e\u0947\u0902 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0938\u093f\u0902\u0926\u0930\u0940 \u0909\u0930\u094d\u0935\u0930\u0915 \u0938\u0902\u092f\u0902\u0924\u094d\u0930, \u092d\u094c\u0917\u094b\u0932\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u091d\u093e\u0930\u0916\u0902\u0921 (\u092a\u0942\u0930\u094d\u0935 \u092e\u0947\u0902 \u0905\u0935\u093f\u092d\u093e\u091c\u093f\u0924 \u092c\u093f\u0939\u093e\u0930 \u0915\u093e \u0939\u093f\u0938\u094d\u0938\u093e) \u092e\u0947\u0902 \u0938\u094d\u0925\u093f\u0924 \u0939\u0948\u0964 \u0907\u0938\u0947 \u0905\u092e\u094b\u0928\u093f\u092f\u092e \u0938\u0932\u094d\u092b\u0947\u091f \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0947 \u0932\u093f\u090f \u091d\u0930\u093f\u092f\u093e \u0915\u094b\u092f\u0932\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u0947 \u092a\u093e\u0938 \u0926\u093e\u092e\u094b\u0926\u0930 \u0928\u0926\u0940 \u0938\u0947 \u0935\u093f\u0936\u093e\u0932 \u0915\u094b\u092f\u0932\u093e/\u0915\u094b\u0915 \u0914\u0930 \u092a\u093e\u0928\u0940 \u0915\u093e \u0915\u0941\u0936\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q51.</b> Q63. Which of the following correctly describes cooperative sector industries? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0939\u0915\u093e\u0930\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 (cooperative sector industries) \u0915\u093e \u0938\u0939\u0940 \u0935\u0930\u094d\u0923\u0928 \u0915\u0930\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 12 Sep 2025, Shift-1]",
      "options": [
        "Owned by workers/suppliers sharing profits / \u0932\u093e\u092d \u0938\u093e\u091d\u093e \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0947 \u0936\u094d\u0930\u092e\u093f\u0915\u094b\u0902/\u0906\u092a\u0942\u0930\u094d\u0924\u093f\u0915\u0930\u094d\u0924\u093e\u0913\u0902 \u0915\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u092e\u0947\u0902",
        "Owned by central government agencies / \u0915\u0947\u0902\u0926\u094d\u0930 \u0938\u0930\u0915\u093e\u0930\u0940 \u090f\u091c\u0947\u0902\u0938\u093f\u092f\u094b\u0902 \u0915\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u092e\u0947\u0902",
        "Maintained by foreign companies / \u0935\u093f\u0926\u0947\u0936\u0940 \u0915\u0902\u092a\u0928\u093f\u092f\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0905\u0928\u0941\u0930\u0915\u094d\u0937\u093f\u0924",
        "Operated solely for export purposes / \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0938\u0902\u091a\u093e\u0932\u093f\u0924"
      ],
      "correctIndex": 0,
      "explanation": "Cooperative sector industries are uniquely owned and democratically operated directly by the producers or suppliers of raw materials, workers, or both. They effectively pool in their resources and equitably share the profits (or losses) proportionately, with classic successful examples being the massive sugar industry in Maharashtra and Anand Milk Union Limited (Amul). / \u0938\u0939\u0915\u093e\u0930\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0932\u094b\u0915\u0924\u093e\u0902\u0924\u094d\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u0940\u0927\u0947 \u0909\u0924\u094d\u092a\u093e\u0926\u0915\u094b\u0902 \u092f\u093e \u0915\u091a\u094d\u091a\u0947 \u092e\u093e\u0932 \u0915\u0947 \u0906\u092a\u0942\u0930\u094d\u0924\u093f\u0915\u0930\u094d\u0924\u093e\u0913\u0902, \u0936\u094d\u0930\u092e\u093f\u0915\u094b\u0902 \u092f\u093e \u0926\u094b\u0928\u094b\u0902 \u0915\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0914\u0930 \u0938\u0902\u091a\u093e\u0932\u0928 \u092e\u0947\u0902 \u0939\u094b\u0924\u0947 \u0939\u0948\u0902\u0964 \u0935\u0947 \u092a\u094d\u0930\u092d\u093e\u0935\u0940 \u0922\u0902\u0917 \u0938\u0947 \u0905\u092a\u0928\u0947 \u0938\u0902\u0938\u093e\u0927\u0928\u094b\u0902 \u0915\u094b \u090f\u0915\u0924\u094d\u0930\u093f\u0924 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u0906\u0928\u0941\u092a\u093e\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0932\u093e\u092d (\u092f\u093e \u0939\u093e\u0928\u093f) \u0915\u094b \u0938\u092e\u093e\u0928 \u0930\u0942\u092a \u0938\u0947 \u0938\u093e\u091d\u093e \u0915\u0930\u0924\u0947 \u0939\u0948\u0902, \u091c\u093f\u0938\u0915\u0947 \u0915\u094d\u0932\u093e\u0938\u093f\u0915 \u0938\u092b\u0932 \u0909\u0926\u093e\u0939\u0930\u0923 \u092e\u0939\u093e\u0930\u093e\u0937\u094d\u091f\u094d\u0930 \u092e\u0947\u0902 \u0935\u093f\u0936\u093e\u0932 \u091a\u0940\u0928\u0940 \u0909\u0926\u094d\u092f\u094b\u0917 \u0914\u0930 \u0906\u0928\u0902\u0926 \u092e\u093f\u0932\u094d\u0915 \u092f\u0942\u0928\u093f\u092f\u0928 \u0932\u093f\u092e\u093f\u091f\u0947\u0921 (\u0905\u092e\u0942\u0932) \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q52.</b> Q65. The Agriculture Infrastructure Fund (AIF) provides support for? / \u0915\u0943\u0937\u093f \u0905\u0935\u0938\u0902\u0930\u091a\u0928\u093e \u0915\u094b\u0937 (AIF) \u0915\u093f\u0938\u0915\u0947 \u0932\u093f\u090f \u0938\u0939\u093e\u092f\u0924\u093e \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 13 Sep 2025, Shift-1]",
      "options": [
        "MGNREGA work / \u092e\u0928\u0930\u0947\u0917\u093e \u0915\u093e \u0915\u093e\u092e",
        "Agri-logistics and cold chains / \u0915\u0943\u0937\u093f-\u0930\u0938\u0926 (Agri-logistics) \u0914\u0930 \u0915\u094b\u0932\u094d\u0921 \u091a\u0947\u0928",
        "Cash transfers / \u0928\u0915\u0926 \u0939\u0938\u094d\u0924\u093e\u0902\u0924\u0930\u0923",
        "Free fertilizers / \u092e\u0941\u092b\u094d\u0924 \u0909\u0930\u094d\u0935\u0930\u0915"
      ],
      "correctIndex": 1,
      "explanation": "The Agriculture Infrastructure Fund (AIF) is a highly strategic financing facility officially launched in 2020. Its absolute primary objective is to robustly provide long-term debt financing explicitly for post-harvest management infrastructure, including heavily investing in vital agri-logistics and cold chains to drastically reduce severe post-harvest losses. / \u0915\u0943\u0937\u093f \u0905\u0935\u0938\u0902\u0930\u091a\u0928\u093e \u0915\u094b\u0937 (AIF) 2020 \u092e\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0935\u093f\u0924\u094d\u0924\u092a\u094b\u0937\u0923 \u0938\u0941\u0935\u093f\u0927\u093e \u0939\u0948\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092b\u0938\u0932 \u0915\u0947 \u092c\u093e\u0926 \u0915\u0947 \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u0947 \u0915\u0947 \u0932\u093f\u090f \u092e\u091c\u092c\u0942\u0924\u0940 \u0938\u0947 \u0926\u0940\u0930\u094d\u0918\u0915\u093e\u0932\u093f\u0915 \u090b\u0923 \u0935\u093f\u0924\u094d\u0924\u092a\u094b\u0937\u0923 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u093e \u0939\u0948, \u091c\u093f\u0938\u092e\u0947\u0902 \u092b\u0938\u0932 \u0915\u0947 \u092c\u093e\u0926 \u0915\u0947 \u0917\u0902\u092d\u0940\u0930 \u0928\u0941\u0915\u0938\u093e\u0928 \u0915\u094b \u0915\u093e\u092b\u0940 \u0915\u092e \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0915\u0943\u0937\u093f-\u0930\u0938\u0926 \u0914\u0930 \u0915\u094b\u0932\u094d\u0921 \u091a\u0947\u0928 \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0928\u093f\u0935\u0947\u0936 \u0915\u0930\u0928\u093e \u0936\u093e\u092e\u093f\u0932 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q53.</b> Q67. Which of the following correctly highlights a unique feature of India&#x27;s textile industry? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u092d\u093e\u0930\u0924 \u0915\u0947 \u0915\u092a\u0921\u093c\u093e \u0909\u0926\u094d\u092f\u094b\u0917 \u0915\u0940 \u090f\u0915 \u0905\u0928\u0942\u0920\u0940 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0915\u094b \u0938\u0939\u0940 \u0922\u0902\u0917 \u0938\u0947 \u0909\u091c\u093e\u0917\u0930 \u0915\u0930\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 13 Sep 2025, Shift-1]",
      "options": [
        "Partially self-reliant, imports final products / \u0906\u0902\u0936\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930, \u0905\u0902\u0924\u093f\u092e \u0909\u0924\u094d\u092a\u093e\u0926\u094b\u0902 \u0915\u093e \u0906\u092f\u093e\u0924 \u0915\u0930\u0924\u093e \u0939\u0948",
        "Only caters to domestic markets / \u0915\u0947\u0935\u0932 \u0918\u0930\u0947\u0932\u0942 \u092c\u093e\u091c\u093e\u0930\u094b\u0902 \u0915\u0940 \u091c\u0930\u0942\u0930\u0924\u094b\u0902 \u0915\u094b \u092a\u0942\u0930\u093e \u0915\u0930\u0924\u093e \u0939\u0948",
        "Focuses only on raw material exports / \u0915\u0947\u0935\u0932 \u0915\u091a\u094d\u091a\u0947 \u092e\u093e\u0932 \u0915\u0947 \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u092a\u0930 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948",
        "Self-reliant across the full value chain / \u0938\u0902\u092a\u0942\u0930\u094d\u0923 \u092e\u0942\u0932\u094d\u092f \u0936\u094d\u0930\u0943\u0902\u0916\u0932\u093e (value chain) \u092e\u0947\u0902 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930"
      ],
      "correctIndex": 3,
      "explanation": "A highly unique and massive structural strength of the Indian textile industry is that it is largely completely self-reliant and entirely complete in the value chain. This specifically means India possesses the rare, immense capacity to produce absolutely everything internally\u2014from raw materials (cotton, silk) to spinning, weaving, and final garmenting. / \u092d\u093e\u0930\u0924\u0940\u092f \u0915\u092a\u0921\u093c\u093e \u0909\u0926\u094d\u092f\u094b\u0917 \u0915\u0940 \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0905\u0928\u0942\u0920\u0940 \u0914\u0930 \u0935\u093f\u0936\u093e\u0932 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0924\u093e\u0915\u0924 \u092f\u0939 \u0939\u0948 \u0915\u093f \u092f\u0939 \u0915\u093e\u092b\u0940 \u0939\u0926 \u0924\u0915 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930 \u0939\u0948 \u0914\u0930 \u092e\u0942\u0932\u094d\u092f \u0936\u094d\u0930\u0943\u0902\u0916\u0932\u093e \u092e\u0947\u0902 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092a\u0942\u0930\u094d\u0923 \u0939\u0948\u0964 \u0907\u0938\u0915\u093e \u0935\u093f\u0936\u0947\u0937 \u0905\u0930\u094d\u0925 \u092f\u0939 \u0939\u0948 \u0915\u093f \u092d\u093e\u0930\u0924 \u0915\u0947 \u092a\u093e\u0938 \u0915\u091a\u094d\u091a\u0947 \u092e\u093e\u0932 (\u0915\u092a\u093e\u0938, \u0930\u0947\u0936\u092e) \u0938\u0947 \u0932\u0947\u0915\u0930 \u0915\u0924\u093e\u0908, \u092c\u0941\u0928\u093e\u0908 \u0914\u0930 \u0905\u0902\u0924\u093f\u092e \u092a\u0930\u093f\u0927\u093e\u0928 \u092c\u0928\u093e\u0928\u0947 \u0924\u0915 \u0938\u092c \u0915\u0941\u091b \u0906\u0902\u0924\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0909\u0924\u094d\u092a\u093e\u0926\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0940 \u0926\u0941\u0930\u094d\u0932\u092d, \u0905\u092a\u093e\u0930 \u0915\u094d\u0937\u092e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q54.</b> Q69. Which of the following is correctly classified as a consumer goods industry? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u093f\u0938\u0947 \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0935\u0938\u094d\u0924\u0941 \u0909\u0926\u094d\u092f\u094b\u0917 (consumer goods industry) \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0938\u0939\u0940 \u0922\u0902\u0917 \u0938\u0947 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948? [SSC CGL Tier 1, 14 Sep 2025, Shift-1]",
      "options": [
        "Iron and steel / \u0932\u094b\u0939\u093e \u0914\u0930 \u0907\u0938\u094d\u092a\u093e\u0924",
        "Aluminium smelting / \u090f\u0932\u094d\u092f\u0941\u092e\u093f\u0928\u093f\u092f\u092e \u092a\u094d\u0930\u0917\u0932\u0928",
        "Toothpaste / \u091f\u0942\u0925\u092a\u0947\u0938\u094d\u091f",
        "Copper smelting / \u0924\u093e\u0902\u092c\u093e \u092a\u094d\u0930\u0917\u0932\u0928"
      ],
      "correctIndex": 2,
      "explanation": "Consumer goods industries are definitively characterized by aggressively producing finished goods entirely for direct, everyday use by end consumers. Toothpaste is a classic, textbook final product used daily by households. Iron, steel, and aluminium smelting are foundational basic industries strictly providing raw materials to other heavy industries. / \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0935\u0938\u094d\u0924\u0941 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0905\u0902\u0924\u093f\u092e \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e\u0913\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937, \u0930\u094b\u091c\u093c\u092e\u0930\u094d\u0930\u093e \u0915\u0947 \u0909\u092a\u092f\u094b\u0917 \u0915\u0947 \u0932\u093f\u090f \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0924\u0948\u092f\u093e\u0930 \u092e\u093e\u0932 \u0915\u0947 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0926\u094d\u0935\u093e\u0930\u093e \u092a\u0939\u091a\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964 \u091f\u0942\u0925\u092a\u0947\u0938\u094d\u091f \u090f\u0915 \u0915\u094d\u0932\u093e\u0938\u093f\u0915, \u092a\u093e\u0920\u094d\u092f\u092a\u0941\u0938\u094d\u0924\u0915 \u0905\u0902\u0924\u093f\u092e \u0909\u0924\u094d\u092a\u093e\u0926 \u0939\u0948 \u091c\u093f\u0938\u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0918\u0930\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u092a\u094d\u0930\u0924\u093f\u0926\u093f\u0928 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964 \u0932\u094b\u0939\u093e, \u0907\u0938\u094d\u092a\u093e\u0924 \u0914\u0930 \u090f\u0932\u094d\u092f\u0941\u092e\u0940\u0928\u093f\u092f\u092e \u092a\u094d\u0930\u0917\u0932\u0928 \u0906\u0927\u093e\u0930\u092d\u0942\u0924 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0909\u0926\u094d\u092f\u094b\u0917 \u0939\u0948\u0902 \u091c\u094b \u0905\u0928\u094d\u092f \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0915\u091a\u094d\u091a\u093e \u092e\u093e\u0932 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q55.</b> Q70. Which of the following statements best defines joint sector industries? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u0915\u0925\u0928 \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 (joint sector industries) \u0915\u094b \u0938\u092c\u0938\u0947 \u0905\u091a\u094d\u091b\u0940 \u0924\u0930\u0939 \u092a\u0930\u093f\u092d\u093e\u0937\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 14 Sep 2025, Shift-2]",
      "options": [
        "Run by village panchayats and municipalities / \u0917\u094d\u0930\u093e\u092e \u092a\u0902\u091a\u093e\u092f\u0924\u094b\u0902 \u0914\u0930 \u0928\u0917\u0930 \u092a\u093e\u0932\u093f\u0915\u093e\u0913\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u0902\u091a\u093e\u0932\u093f\u0924",
        "Fully financed by foreign companies / \u0935\u093f\u0926\u0947\u0936\u0940 \u0915\u0902\u092a\u0928\u093f\u092f\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0935\u093f\u0924\u094d\u0924\u092a\u094b\u0937\u093f\u0924",
        "Operated only by self-help groups / \u0915\u0947\u0935\u0932 \u0938\u094d\u0935\u092f\u0902 \u0938\u0939\u093e\u092f\u0924\u093e \u0938\u092e\u0942\u0939\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u0902\u091a\u093e\u0932\u093f\u0924",
        "Jointly owned by public and private sectors / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0914\u0930 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u0947 \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0935\u093e\u0932\u093e"
      ],
      "correctIndex": 3,
      "explanation": "Joint Sector Industries are specifically those vast enterprises which are jointly, equitably owned and cooperatively managed by the sovereign state (public sector) alongside private individuals or corporate entities. The government and private entrepreneurs explicitly share the massive capital investments and structural management responsibilities. / \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0935\u0947 \u0935\u093f\u0936\u093e\u0932 \u0909\u0926\u094d\u092f\u092e \u0939\u0948\u0902 \u091c\u094b \u0928\u093f\u091c\u0940 \u0935\u094d\u092f\u0915\u094d\u0924\u093f\u092f\u094b\u0902 \u092f\u093e \u0915\u0949\u0930\u094d\u092a\u094b\u0930\u0947\u091f \u0938\u0902\u0938\u094d\u0925\u093e\u0913\u0902 \u0915\u0947 \u0938\u093e\u0925-\u0938\u093e\u0925 \u0938\u0902\u092a\u094d\u0930\u092d\u0941 \u0930\u093e\u091c\u094d\u092f (\u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930) \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u0902\u092f\u0941\u0915\u094d\u0924 \u0930\u0942\u092a \u0938\u0947, \u0938\u092e\u093e\u0928 \u0930\u0942\u092a \u0938\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0914\u0930 \u0938\u0939\u0915\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u092c\u0902\u0927\u093f\u0924 \u0939\u094b\u0924\u0947 \u0939\u0948\u0902\u0964 \u0938\u0930\u0915\u093e\u0930 \u0914\u0930 \u0928\u093f\u091c\u0940 \u0909\u0926\u094d\u092f\u092e\u0940 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u0942\u0902\u091c\u0940 \u0928\u093f\u0935\u0947\u0936 \u0914\u0930 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u092a\u094d\u0930\u092c\u0902\u0927\u0928 \u091c\u093f\u092e\u094d\u092e\u0947\u0926\u093e\u0930\u093f\u092f\u094b\u0902 \u0915\u094b \u0938\u093e\u091d\u093e \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q56.</b> Q71. Which of these schemes is implemented to promote organic farming? / \u091c\u0948\u0935\u093f\u0915 \u0916\u0947\u0924\u0940 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0907\u0928\u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u0940 \u092f\u094b\u091c\u0928\u093e \u0932\u093e\u0917\u0942 \u0915\u0940 \u0917\u0908 \u0939\u0948? [SSC CGL Tier 1, 14 Sep 2025, Shift-3]",
      "options": [
        "PM-KMY / \u092a\u0940\u090f\u092e-\u0915\u0947\u090f\u092e\u0935\u093e\u0908 (PM-KMY)",
        "PKVY / \u092a\u0940\u0915\u0947\u0935\u0940\u0935\u093e\u0908 (PKVY)",
        "SHC / \u090f\u0938\u090f\u091a\u0938\u0940 (SHC)",
        "ATMA / \u0906\u0924\u094d\u092e\u093e (ATMA)"
      ],
      "correctIndex": 1,
      "explanation": "The Paramparagat Krishi Vikas Yojana (PKVY) is a massive, highly strategic centrally sponsored scheme officially launched in 2015 to aggressively promote sustainable organic farming nationwide. It heavily encourages rural farmers to rapidly adopt eco-friendly traditional farming practices and form highly organized clusters for organic production and formal certification. / \u092a\u0930\u0902\u092a\u0930\u093e\u0917\u0924 \u0915\u0943\u0937\u093f \u0935\u093f\u0915\u093e\u0938 \u092f\u094b\u091c\u0928\u093e (PKVY) \u090f\u0915 \u0935\u093f\u0936\u093e\u0932, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0915\u0947\u0902\u0926\u094d\u0930 \u092a\u094d\u0930\u093e\u092f\u094b\u091c\u093f\u0924 \u092f\u094b\u091c\u0928\u093e \u0939\u0948 \u091c\u093f\u0938\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0935\u094d\u092f\u093e\u092a\u0940 \u091f\u093f\u0915\u093e\u090a \u091c\u0948\u0935\u093f\u0915 \u0916\u0947\u0924\u0940 \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f 2015 \u092e\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u092f\u0939 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0915\u093f\u0938\u093e\u0928\u094b\u0902 \u0915\u094b \u092a\u0930\u094d\u092f\u093e\u0935\u0930\u0923 \u0915\u0947 \u0905\u0928\u0941\u0915\u0942\u0932 \u092a\u093e\u0930\u0902\u092a\u0930\u093f\u0915 \u0915\u0943\u0937\u093f \u092a\u0926\u094d\u0927\u0924\u093f\u092f\u094b\u0902 \u0915\u094b \u0924\u0947\u091c\u0940 \u0938\u0947 \u0905\u092a\u0928\u093e\u0928\u0947 \u0914\u0930 \u091c\u0948\u0935\u093f\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0914\u0930 \u0914\u092a\u091a\u093e\u0930\u093f\u0915 \u092a\u094d\u0930\u092e\u093e\u0923\u0940\u0915\u0930\u0923 \u0915\u0947 \u0932\u093f\u090f \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0938\u0902\u0917\u0920\u093f\u0924 \u0915\u094d\u0932\u0938\u094d\u091f\u0930 \u092c\u0928\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q57.</b> Q76. Which scheme promotes crop diversification through cluster-based planning? / \u0915\u094c\u0928 \u0938\u0940 \u092f\u094b\u091c\u0928\u093e \u0915\u094d\u0932\u0938\u094d\u091f\u0930-\u0906\u0927\u093e\u0930\u093f\u0924 \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u092b\u0938\u0932 \u0935\u093f\u0935\u093f\u0927\u0940\u0915\u0930\u0923 (crop diversification) \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0924\u0940 \u0939\u0948? [SSC CGL Tier 1, 16 Sep 2025, Shift-2]",
      "options": [
        "RKVY (Rashtriya Krishi Vikas Yojana) / RKVY (\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0915\u0943\u0937\u093f \u0935\u093f\u0915\u093e\u0938 \u092f\u094b\u091c\u0928\u093e)",
        "PM-AASHA / \u092a\u0940\u090f\u092e-\u0906\u0936\u093e (PM-AASHA)",
        "AIF / \u090f\u0906\u0908\u090f\u092b (AIF)",
        "SMAM / \u090f\u0938\u090f\u092e\u090f\u090f\u092e (SMAM)"
      ],
      "correctIndex": 0,
      "explanation": "A highly critical sub-scheme under the overarching Rashtriya Krishi Vikas Yojana (RKVY) is the specific Crop Diversification Programme (CDP). This strategic initiative explicitly and vigorously promotes shifting away from intensive water-guzzling crops (like traditional paddy) to highly sustainable alternative crops directly using advanced cluster-based planning. / \u0935\u094d\u092f\u093e\u092a\u0915 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0915\u0943\u0937\u093f \u0935\u093f\u0915\u093e\u0938 \u092f\u094b\u091c\u0928\u093e (RKVY) \u0915\u0947 \u0924\u0939\u0924 \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0909\u092a-\u092f\u094b\u091c\u0928\u093e \u0935\u093f\u0936\u093f\u0937\u094d\u091f \u092b\u0938\u0932 \u0935\u093f\u0935\u093f\u0927\u0940\u0915\u0930\u0923 \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e (CDP) \u0939\u0948\u0964 \u092f\u0939 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u092a\u0939\u0932 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u091c\u094b\u0930\u0926\u093e\u0930 \u0922\u0902\u0917 \u0938\u0947 \u0909\u0928\u094d\u0928\u0924 \u0915\u094d\u0932\u0938\u094d\u091f\u0930-\u0906\u0927\u093e\u0930\u093f\u0924 \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u0938\u0940\u0927\u0947 \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0915\u0947 \u0917\u0939\u0928 \u092a\u093e\u0928\u0940 \u0915\u0940 \u0916\u092a\u0924 \u0935\u093e\u0932\u0940 \u092b\u0938\u0932\u094b\u0902 (\u091c\u0948\u0938\u0947 \u092a\u093e\u0930\u0902\u092a\u0930\u093f\u0915 \u0927\u093e\u0928) \u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u091f\u093f\u0915\u093e\u090a \u0935\u0948\u0915\u0932\u094d\u092a\u093f\u0915 \u092b\u0938\u0932\u094b\u0902 \u0915\u0940 \u0913\u0930 \u092c\u0922\u093c\u0928\u0947 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0924\u0940 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q58.</b> Q78. Which Five-Year Plan focused on heavy industries? / \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u092a\u0930 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e? [SSC CGL Tier 1, 17 Sep 2025, Shift-1]",
      "options": [
        "First / \u092a\u0939\u0932\u0940",
        "Fourth / \u091a\u094c\u0925\u0940",
        "Second / \u0926\u0942\u0938\u0930\u0940",
        "Third / \u0924\u0940\u0938\u0930\u0940"
      ],
      "correctIndex": 2,
      "explanation": "The incredibly monumental Second Five-Year Plan (1956-1961) marked a stark, definitive structural shift from agriculture directly to rapid industry. Heavily influenced by the visionary P.C. Mahalanobis, it absolutely prioritized the massive development of heavy and basic industries (like steel and power) to firmly establish India&#x27;s core industrial base. / \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-1961) \u0928\u0947 \u0915\u0943\u0937\u093f \u0938\u0947 \u0938\u0940\u0927\u0947 \u0924\u0940\u0935\u094d\u0930 \u0909\u0926\u094d\u092f\u094b\u0917 \u0915\u0940 \u0913\u0930 \u090f\u0915 \u0938\u094d\u092a\u0937\u094d\u091f, \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u092c\u0926\u0932\u093e\u0935 \u0915\u094b \u091a\u093f\u0939\u094d\u0928\u093f\u0924 \u0915\u093f\u092f\u093e\u0964 \u0926\u0942\u0930\u0926\u0930\u094d\u0936\u0940 \u092a\u0940.\u0938\u0940. \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u0938\u0947 \u092d\u093e\u0930\u0940 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u092d\u093e\u0935\u093f\u0924, \u0907\u0938\u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 \u092e\u0941\u0916\u094d\u092f \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0906\u0927\u093e\u0930 \u0915\u094b \u092e\u091c\u092c\u0942\u0924\u0940 \u0938\u0947 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0940 \u0914\u0930 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 (\u091c\u0948\u0938\u0947 \u0938\u094d\u091f\u0940\u0932 \u0914\u0930 \u092c\u093f\u091c\u0932\u0940) \u0915\u0947 \u0935\u093f\u0936\u093e\u0932 \u0935\u093f\u0915\u093e\u0938 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q59.</b> Q79. The Mahalanobis Model was used in which plan? / \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u0938 \u092f\u094b\u091c\u0928\u093e \u092e\u0947\u0902 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e? [SSC CGL Tier 1, 17 Sep 2025, Shift-3]",
      "options": [
        "Second / \u0926\u0942\u0938\u0930\u0940",
        "First / \u092a\u0939\u0932\u0940",
        "Fourth / \u091a\u094c\u0925\u0940",
        "Fifth / \u092a\u093e\u0902\u091a\u0935\u0940\u0902"
      ],
      "correctIndex": 0,
      "explanation": "The profoundly influential Mahalanobis Model, a highly sophisticated four-sector economic growth model heavily emphasizing the foundational capital goods sector, served absolutely as the core theoretical foundation for the historic Second Five-Year Plan (1956-61), aiming to aggressively make India completely self-reliant in heavy machinery. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u092d\u093e\u0935\u0936\u093e\u0932\u0940 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u092e\u0949\u0921\u0932, \u090f\u0915 \u0909\u091a\u094d\u091a \u092a\u0930\u093f\u0937\u094d\u0915\u0943\u0924 \u091a\u093e\u0930-\u0915\u094d\u0937\u0947\u0924\u094d\u0930\u0940\u092f \u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u092e\u0949\u0921\u0932 \u091c\u094b \u092e\u0942\u0932\u092d\u0942\u0924 \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0935\u0938\u094d\u0924\u0941 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u092a\u0930 \u092d\u093e\u0930\u0940 \u091c\u094b\u0930 \u0926\u0947\u0924\u093e \u0939\u0948, \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-61) \u0915\u0947 \u0932\u093f\u090f \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u092e\u0941\u0916\u094d\u092f \u0938\u0948\u0926\u094d\u0927\u093e\u0902\u0924\u093f\u0915 \u0928\u0940\u0902\u0935 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u0930\u0924\u093e \u0939\u0948, \u091c\u093f\u0938\u0915\u093e \u0932\u0915\u094d\u0937\u094d\u092f \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0924 \u0915\u094b \u092d\u093e\u0930\u0940 \u092e\u0936\u0940\u0928\u0930\u0940 \u092e\u0947\u0902 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930 \u092c\u0928\u093e\u0928\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q60.</b> Q80. When was the first Industrial Policy announced in independent India? / \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u092a\u0939\u0932\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0915\u092c \u0918\u094b\u0937\u093f\u0924 \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC CGL Tier 1, 18 Sep 2025, Shift-2]",
      "options": [
        "1950 / 1950",
        "1948 / 1948",
        "1951 / 1951",
        "1952 / 1952"
      ],
      "correctIndex": 1,
      "explanation": "The absolute historic, foundational first Industrial Policy Resolution of newly independent India was formally and officially announced precisely on April 6, 1948, by the then prominent Industry Minister Dr. Shyama Prasad Mukherjee, explicitly laying the vital groundwork for India&#x27;s mixed economy framework. / \u0928\u0935 \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930 \u092d\u093e\u0930\u0924 \u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915, \u0906\u0927\u093e\u0930\u092d\u0942\u0924 \u092a\u0939\u0932\u093e \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u092a\u094d\u0930\u0938\u094d\u0924\u093e\u0935 \u0914\u092a\u091a\u093e\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0920\u0940\u0915 6 \u0905\u092a\u094d\u0930\u0948\u0932, 1948 \u0915\u094b \u0924\u0924\u094d\u0915\u093e\u0932\u0940\u0928 \u092a\u094d\u0930\u092e\u0941\u0916 \u0909\u0926\u094d\u092f\u094b\u0917 \u092e\u0902\u0924\u094d\u0930\u0940 \u0921\u0949. \u0936\u094d\u092f\u093e\u092e\u093e \u092a\u094d\u0930\u0938\u093e\u0926 \u092e\u0941\u0916\u0930\u094d\u091c\u0940 \u0926\u094d\u0935\u093e\u0930\u093e \u0918\u094b\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e, \u091c\u093f\u0938\u0928\u0947 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 \u092e\u093f\u0936\u094d\u0930\u093f\u0924 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0922\u093e\u0902\u091a\u0947 \u0915\u0947 \u0932\u093f\u090f \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0906\u0927\u093e\u0930 \u0924\u0948\u092f\u093e\u0930 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q61.</b> Q82. Which of the following correctly describes a heavy industry? / \u0928\u093f\u092e\u094d\u0928\u0932\u093f\u0916\u093f\u0924 \u092e\u0947\u0902 \u0938\u0947 \u0915\u094c\u0928 \u0938\u093e \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917 (heavy industry) \u0915\u093e \u0938\u0939\u0940 \u0935\u0930\u094d\u0923\u0928 \u0915\u0930\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 20 Sept 2025, Shift-2]",
      "options": [
        "Uses light raw materials like cotton / \u0915\u092a\u093e\u0938 \u091c\u0948\u0938\u0947 \u0939\u0932\u094d\u0915\u0947 \u0915\u091a\u094d\u091a\u0947 \u092e\u093e\u0932 \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0924\u093e \u0939\u0948",
        "Produces light consumer goods / \u0939\u0932\u094d\u0915\u0947 \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0938\u093e\u092e\u093e\u0928 \u0915\u093e \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0930\u0924\u093e \u0939\u0948",
        "Uses bulky inputs to produce heavy goods / \u092d\u093e\u0930\u0940 \u092e\u093e\u0932 \u0915\u0947 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0940 \u0907\u0928\u092a\u0941\u091f \u0915\u093e \u0909\u092a\u092f\u094b\u0917 \u0915\u0930\u0924\u093e \u0939\u0948",
        "Manufactures cosmetics and toiletries / \u0938\u094c\u0902\u0926\u0930\u094d\u092f \u092a\u094d\u0930\u0938\u093e\u0927\u0928 \u0914\u0930 \u092a\u094d\u0930\u0938\u093e\u0927\u0928 \u0938\u093e\u092e\u0917\u094d\u0930\u0940 \u0915\u093e \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0915\u0930\u0924\u093e \u0939\u0948"
      ],
      "correctIndex": 2,
      "explanation": "Heavy industries (like gigantic Iron &amp; Steel plants or massive Shipbuilding yards) are definitively characterized by their intense use of highly bulky, extremely heavy raw materials (like massive iron ores and coal) to relentlessly manufacture massive, heavy finished goods through incredibly complex industrial processes. / \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 (\u091c\u0948\u0938\u0947 \u0935\u093f\u0936\u093e\u0932 \u0932\u094b\u0939\u093e \u0914\u0930 \u0907\u0938\u094d\u092a\u093e\u0924 \u0938\u0902\u092f\u0902\u0924\u094d\u0930 \u092f\u093e \u0935\u093f\u0936\u093e\u0932 \u091c\u0939\u093e\u091c \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u092f\u093e\u0930\u094d\u0921) \u0915\u094b \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u091c\u091f\u093f\u0932 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e\u0913\u0902 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u092d\u093e\u0930\u0940 \u0924\u0948\u092f\u093e\u0930 \u092e\u093e\u0932 \u0915\u0947 \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0915\u0947 \u0932\u093f\u090f \u092d\u093e\u0930\u0940 \u092d\u0930\u0915\u092e \u0915\u091a\u094d\u091a\u0947 \u092e\u093e\u0932 (\u091c\u0948\u0938\u0947 \u092d\u093e\u0930\u0940 \u0932\u094c\u0939 \u0905\u092f\u0938\u094d\u0915 \u0914\u0930 \u0915\u094b\u092f\u0932\u093e) \u0915\u0947 \u0924\u0940\u0935\u094d\u0930 \u0909\u092a\u092f\u094b\u0917 \u0926\u094d\u0935\u093e\u0930\u093e \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u092a\u0939\u091a\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q62.</b> Q83. In the context of Five Year Plans, what does the term &quot;plan holiday&quot; refer to? / \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u0947 \u0938\u0902\u0926\u0930\u094d\u092d \u092e\u0947\u0902 &quot;\u092f\u094b\u091c\u0928\u093e \u0905\u0935\u0915\u093e\u0936&quot; (plan holiday) \u0936\u092c\u094d\u0926 \u0915\u093e \u0915\u094d\u092f\u093e \u0905\u0930\u094d\u0925 \u0939\u0948? [SSC CGL Tier 1, 20 Sept 2024, Shift-3]",
      "options": [
        "Emergency loan disbursements / \u0906\u092a\u093e\u0924\u0915\u093e\u0932\u0940\u0928 \u090b\u0923 \u0938\u0902\u0935\u093f\u0924\u0930\u0923",
        "Discontinuity in five-year planning / \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092e\u0947\u0902 \u0928\u093f\u0930\u0902\u0924\u0930\u0924\u093e \u0915\u093e \u0905\u092d\u093e\u0935 (\u0905\u0938\u0902\u0924\u0924\u0924\u093e)",
        "Suspension of annual budgets / \u0935\u093e\u0930\u094d\u0937\u093f\u0915 \u092c\u091c\u091f \u0915\u093e \u0928\u093f\u0932\u0902\u092c\u0928",
        "Switch from socialism to capitalism / \u0938\u092e\u093e\u091c\u0935\u093e\u0926 \u0938\u0947 \u092a\u0942\u0902\u091c\u0940\u0935\u093e\u0926 \u092e\u0947\u0902 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928"
      ],
      "correctIndex": 1,
      "explanation": "The highly famous &quot;Plan Holiday&quot; accurately refers to the absolute discontinuity in the continuous Five-Year Planning process strictly from 1966 to 1969. Plagued by catastrophic economic crises caused by severe wars (1962, 1965) and massive drought, the government suspended the Fourth Plan entirely for three consecutive Annual Plans. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 &quot;\u092f\u094b\u091c\u0928\u093e \u0905\u0935\u0915\u093e\u0936&quot; 1966 \u0938\u0947 1969 \u0924\u0915 \u0928\u093f\u0930\u0902\u0924\u0930 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e \u092e\u0947\u0902 \u092a\u0942\u0930\u094d\u0923 \u0905\u0938\u0902\u0924\u0924\u0924\u093e (\u0928\u093f\u0930\u0902\u0924\u0930\u0924\u093e \u0915\u0940 \u0915\u092e\u0940) \u0915\u094b \u0938\u091f\u0940\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u0926\u0930\u094d\u092d\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948\u0964 \u0917\u0902\u092d\u0940\u0930 \u092f\u0941\u0926\u094d\u0927\u094b\u0902 (1962, 1965) \u0914\u0930 \u092d\u093e\u0930\u0940 \u0938\u0942\u0916\u0947 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0939\u094b\u0928\u0947 \u0935\u093e\u0932\u0947 \u0935\u093f\u0928\u093e\u0936\u0915\u093e\u0930\u0940 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0902\u0915\u091f\u094b\u0902 \u0938\u0947 \u0924\u094d\u0930\u0938\u094d\u0924, \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0924\u0940\u0928 \u0932\u0917\u093e\u0924\u093e\u0930 \u0935\u093e\u0930\u094d\u0937\u093f\u0915 \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u0947 \u0932\u093f\u090f \u091a\u094c\u0925\u0940 \u092f\u094b\u091c\u0928\u093e \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0928\u093f\u0932\u0902\u092c\u093f\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q63.</b> Q84. Which government initiative focuses on improving the road connectivity in rural areas? / \u0915\u094c\u0928 \u0938\u0940 \u0938\u0930\u0915\u093e\u0930\u0940 \u092a\u0939\u0932 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u092e\u0947\u0902 \u0938\u0921\u093c\u0915 \u0938\u0902\u092a\u0930\u094d\u0915 (\u0938\u0921\u093c\u0915 \u0915\u0928\u0947\u0915\u094d\u091f\u093f\u0935\u093f\u091f\u0940) \u092e\u0947\u0902 \u0938\u0941\u0927\u093e\u0930 \u092a\u0930 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0939\u0948? [SSC CGL Tier 1, 21 Sep 2025, Shift-1]",
      "options": [
        "Bharatmala Pariyojana / \u092d\u093e\u0930\u0924\u092e\u093e\u0932\u093e \u092a\u0930\u093f\u092f\u094b\u091c\u0928\u093e",
        "NHDP / \u090f\u0928\u090f\u091a\u0921\u0940\u092a\u0940 (NHDP)",
        "Setu Bharatam Programme / \u0938\u0947\u0924\u0941 \u092d\u093e\u0930\u0924\u092e \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e",
        "PMGSY / \u092a\u0940\u090f\u092e\u091c\u0940\u090f\u0938\u0935\u093e\u0908 (PMGSY)"
      ],
      "correctIndex": 3,
      "explanation": "The highly ambitious Pradhan Mantri Gram Sadak Yojana (PMGSY), officially launched in 2000, specifically and aggressively focuses entirely on robustly providing critical all-weather road connectivity exclusively to unconnected rural habitations to massively improve vital rural infrastructure. / 2000 \u092e\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0917\u094d\u0930\u093e\u092e \u0938\u0921\u093c\u0915 \u092f\u094b\u091c\u0928\u093e (PMGSY), \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u0922\u093e\u0902\u091a\u0947 \u092e\u0947\u0902 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0938\u0941\u0927\u093e\u0930 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0905\u0938\u0902\u092c\u0926\u094d\u0927 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u092c\u0938\u094d\u0924\u093f\u092f\u094b\u0902 \u0915\u094b \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0938\u092d\u0940 \u092e\u094c\u0938\u092e\u094b\u0902 \u092e\u0947\u0902 \u0938\u0921\u093c\u0915 \u0938\u0902\u092a\u0930\u094d\u0915 \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u0947 \u092a\u0930 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0927\u094d\u092f\u093e\u0928 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q64.</b> Q85. What led to regional disparity despite the overall success of the Green Revolution? / \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0915\u0940 \u0938\u092e\u0917\u094d\u0930 \u0938\u092b\u0932\u0924\u093e \u0915\u0947 \u092c\u093e\u0935\u091c\u0942\u0926 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u0940\u092f \u0905\u0938\u092e\u093e\u0928\u0924\u093e \u0915\u093e \u0915\u094d\u092f\u093e \u0915\u093e\u0930\u0923 \u0925\u093e? [SSC CGL Tier 1, 21 Sep 2025, Shift-1]",
      "options": [
        "Uneven price controls / \u0905\u0938\u092e\u093e\u0928 \u092e\u0942\u0932\u094d\u092f \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923",
        "HYV seed access restricted to well-irrigated regions / HYV \u092c\u0940\u091c\u094b\u0902 \u0915\u0940 \u092a\u0939\u0941\u0902\u091a \u0915\u0947\u0935\u0932 \u0905\u091a\u094d\u091b\u0940 \u0938\u093f\u0902\u091a\u093e\u0908 \u0935\u093e\u0932\u0947 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0924\u0915 \u0938\u0940\u092e\u093f\u0924",
        "Unequal land ownership / \u0905\u0938\u092e\u093e\u0928 \u092d\u0942\u092e\u093f \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935",
        "Neglect of fertilizers / \u0909\u0930\u094d\u0935\u0930\u0915\u094b\u0902 \u0915\u0940 \u0909\u092a\u0947\u0915\u094d\u0937\u093e"
      ],
      "correctIndex": 1,
      "explanation": "The highly advanced Green Revolution technologies fundamentally required absolutely assured water supply. Consequently, since exclusive access to HYV seeds and massive agricultural success were strictly restricted to heavily well-irrigated regions like Punjab and Haryana, massive regional disparities rapidly widened against dry, rain-fed areas. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0909\u0928\u094d\u0928\u0924 \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u093f\u092f\u094b\u0902 \u0915\u094b \u092e\u0942\u0932 \u0930\u0942\u092a \u0938\u0947 \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u091c\u0932 \u0906\u092a\u0942\u0930\u094d\u0924\u093f \u0915\u0940 \u0906\u0935\u0936\u094d\u092f\u0915\u0924\u093e \u0925\u0940\u0964 \u0928\u0924\u0940\u091c\u0924\u0928, \u091a\u0942\u0902\u0915\u093f \u090f\u091a\u0935\u093e\u0908\u0935\u0940 (HYV) \u092c\u0940\u091c\u094b\u0902 \u0924\u0915 \u0935\u093f\u0936\u0947\u0937 \u092a\u0939\u0941\u0902\u091a \u0914\u0930 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0915\u0943\u0937\u093f \u0938\u092b\u0932\u0924\u093e \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u092a\u0902\u091c\u093e\u092c \u0914\u0930 \u0939\u0930\u093f\u092f\u093e\u0923\u093e \u091c\u0948\u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0905\u091a\u094d\u091b\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u093f\u0902\u091a\u093f\u0924 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0924\u0915 \u0938\u0940\u092e\u093f\u0924 \u0925\u0940, \u0907\u0938\u0932\u093f\u090f \u0936\u0941\u0937\u094d\u0915, \u0935\u0930\u094d\u0937\u093e-\u0938\u093f\u0902\u091a\u093f\u0924 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u0947 \u092e\u0941\u0915\u093e\u092c\u0932\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u0940\u092f \u0905\u0938\u092e\u093e\u0928\u0924\u093e\u090f\u0902 \u0924\u0947\u091c\u0940 \u0938\u0947 \u092c\u0922\u093c \u0917\u0908\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q65.</b> Q86. Why did the Indian government resort to licensing even for expanding existing private sector industries under IPR 1956? / IPR 1956 \u0915\u0947 \u0924\u0939\u0924 \u092e\u094c\u091c\u0942\u0926\u093e \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u0947 \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0915\u0947 \u0932\u093f\u090f \u092d\u0940 \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0915\u093e \u0938\u0939\u093e\u0930\u093e \u0915\u094d\u092f\u094b\u0902 \u0932\u093f\u092f\u093e? [SSC CGL Tier 1, 21 Sep 2025, Shift-2]",
      "options": [
        "To keep production under government control / \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u094b \u0938\u0930\u0915\u093e\u0930\u0940 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u092e\u0947\u0902 \u0930\u0916\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f",
        "To promote export competition / \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093e \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f",
        "To prevent technological innovation / \u0924\u0915\u0928\u0940\u0915\u0940 \u0928\u0935\u093e\u091a\u093e\u0930 \u0915\u094b \u0930\u094b\u0915\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f",
        "To encourage luxury production / \u0932\u0915\u094d\u091c\u0930\u0940 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u094b \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f"
      ],
      "correctIndex": 0,
      "explanation": "Under the highly stringent IPR 1956 and IDRA Act, the government aggressively used mandatory licensing to strictly regulate the private sector&#x27;s physical capacity. The absolute overarching aim was to strictly keep total production under absolute government control to forcefully ensure resources were allocated according to socialist plan priorities. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u0920\u094b\u0930 IPR 1956 \u0914\u0930 IDRA \u0905\u0927\u093f\u0928\u093f\u092f\u092e \u0915\u0947 \u0924\u0939\u0924, \u0938\u0930\u0915\u093e\u0930 \u0928\u0947 \u0928\u093f\u091c\u0940 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u092d\u094c\u0924\u093f\u0915 \u0915\u094d\u0937\u092e\u0924\u093e \u0915\u094b \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0935\u093f\u0928\u093f\u092f\u092e\u093f\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0915\u093e \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0909\u092a\u092f\u094b\u0917 \u0915\u093f\u092f\u093e\u0964 \u092a\u0942\u0930\u094d\u0923 \u0935\u094d\u092f\u093e\u092a\u0915 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u0941\u0932 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u094b \u092a\u0942\u0930\u094d\u0923 \u0938\u0930\u0915\u093e\u0930\u0940 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u092e\u0947\u0902 \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u0930\u0916\u0928\u093e \u0925\u093e \u0924\u093e\u0915\u093f \u092f\u0939 \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e \u0938\u0915\u0947 \u0915\u093f \u0938\u0902\u0938\u093e\u0927\u0928 \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u092f\u094b\u091c\u0928\u093e \u0915\u0940 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e\u0913\u0902 \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930 \u0906\u0935\u0902\u091f\u093f\u0924 \u0915\u093f\u090f \u0917\u090f \u0925\u0947\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q66.</b> Q87. Why were fertilizer subsidies a double-edged policy instrument during 1960-1990? / 1960-1990 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0909\u0930\u094d\u0935\u0930\u0915 \u0938\u092c\u094d\u0938\u093f\u0921\u0940 \u090f\u0915 \u0926\u094b\u0927\u093e\u0930\u0940 \u0928\u0940\u0924\u093f\u0917\u0924 \u0909\u092a\u0915\u0930\u0923 \u0915\u094d\u092f\u094b\u0902 \u0925\u0940? [SSC CGL Tier 1, 21 Sep 2025, Shift-3]",
      "options": [
        "They promoted global trade / \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u093f\u092f\u093e",
        "They reduced rural employment / \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0930\u094b\u091c\u0917\u093e\u0930 \u0915\u094b \u0915\u092e \u0915\u093f\u092f\u093e",
        "Discouraged use of HYV seeds / \u090f\u091a\u0935\u093e\u0908\u0935\u0940 (HYV) \u092c\u0940\u091c\u094b\u0902 \u0915\u0947 \u0909\u092a\u092f\u094b\u0917 \u0915\u094b \u0939\u0924\u094b\u0924\u094d\u0938\u093e\u0939\u093f\u0924 \u0915\u093f\u092f\u093e",
        "Benefited richer farmers but supported productivity / \u0905\u092e\u0940\u0930 \u0915\u093f\u0938\u093e\u0928\u094b\u0902 \u0915\u094b \u092b\u093e\u092f\u0926\u093e \u0939\u0941\u0906 \u0932\u0947\u0915\u093f\u0928 \u0909\u0924\u094d\u092a\u093e\u0926\u0915\u0924\u093e \u0915\u094b \u0938\u092e\u0930\u094d\u0925\u0928 \u092e\u093f\u0932\u093e"
      ],
      "correctIndex": 3,
      "explanation": "Massive fertilizer subsidies successfully and critically boosted massive food grain productivity during the Green Revolution. However, they were heavily criticized as a double-edged sword because the immense financial benefits were largely and unequally appropriated by already richer farmers in well-irrigated regions, heavily straining the national exchequer. / \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0909\u0930\u094d\u0935\u0930\u0915 \u0938\u092c\u094d\u0938\u093f\u0921\u0940 \u0928\u0947 \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u0914\u0930 \u0917\u0902\u092d\u0940\u0930 \u0930\u0942\u092a \u0938\u0947 \u0935\u093f\u0936\u093e\u0932 \u0916\u093e\u0926\u094d\u092f\u093e\u0928\u094d\u0928 \u0909\u0924\u094d\u092a\u093e\u0926\u0915\u0924\u093e \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u093f\u092f\u093e\u0964 \u0939\u093e\u0932\u093e\u0902\u0915\u093f, \u090f\u0915 \u0926\u094b\u0927\u093e\u0930\u0940 \u0924\u0932\u0935\u093e\u0930 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0909\u0928\u0915\u0940 \u092d\u093e\u0930\u0940 \u0906\u0932\u094b\u091a\u0928\u093e \u0915\u0940 \u0917\u0908 \u0915\u094d\u092f\u094b\u0902\u0915\u093f \u0905\u092a\u093e\u0930 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0932\u093e\u092d \u0915\u093e\u092b\u0940 \u0939\u0926 \u0924\u0915 \u0914\u0930 \u0905\u0938\u092e\u093e\u0928 \u0930\u0942\u092a \u0938\u0947 \u0905\u091a\u094d\u091b\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0938\u093f\u0902\u091a\u093f\u0924 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u092e\u0947\u0902 \u092a\u0939\u0932\u0947 \u0938\u0947 \u0939\u0940 \u0905\u092e\u0940\u0930 \u0915\u093f\u0938\u093e\u0928\u094b\u0902 \u0926\u094d\u0935\u093e\u0930\u093e \u0935\u093f\u0928\u093f\u092f\u094b\u091c\u093f\u0924 \u0915\u093f\u090f \u0917\u090f \u0925\u0947, \u091c\u093f\u0938\u0938\u0947 \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0930\u093e\u091c\u0915\u094b\u0937 \u092a\u0930 \u092d\u093e\u0930\u0940 \u0926\u092c\u093e\u0935 \u092a\u0921\u093c\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q67.</b> Q88. The term &#x27;Navratnas&#x27; in public sector reform refers to: / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930 \u092e\u0947\u0902 &#x27;\u0928\u0935\u0930\u0924\u094d\u0928&#x27; (Navratnas) \u0936\u092c\u094d\u0926 \u0915\u093e \u0924\u093e\u0924\u094d\u092a\u0930\u094d\u092f \u0939\u0948: [SSC CGL Tier 1, 21 Sep 2025, Shift-3]",
      "options": [
        "Public enterprises given full privatization / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0909\u0926\u094d\u092f\u092e \u091c\u093f\u0928\u094d\u0939\u0947\u0902 \u092a\u0942\u0930\u094d\u0923 \u0928\u093f\u091c\u0940\u0915\u0930\u0923 \u0926\u093f\u092f\u093e \u0917\u092f\u093e",
        "Public enterprises granted autonomy / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0909\u0926\u094d\u092f\u092e \u091c\u093f\u0928\u094d\u0939\u0947\u0902 \u0938\u094d\u0935\u093e\u092f\u0924\u094d\u0924\u0924\u093e \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0940 \u0917\u0908",
        "Subsidy-driven rural firms / \u0938\u092c\u094d\u0938\u093f\u0921\u0940-\u0938\u0902\u091a\u093e\u0932\u093f\u0924 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u092b\u0930\u094d\u092e\u0947\u0902",
        "Firms eligible for WTO support / \u0935\u093f\u0936\u094d\u0935 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u0938\u0902\u0917\u0920\u0928 (WTO) \u0915\u0947 \u0938\u092e\u0930\u094d\u0925\u0928 \u0915\u0947 \u0932\u093f\u090f \u092a\u093e\u0924\u094d\u0930 \u092b\u0930\u094d\u092e\u0947\u0902"
      ],
      "correctIndex": 1,
      "explanation": "The highly prestigious &#x27;Navratna&#x27; status was officially introduced precisely in 1997 explicitly to identify elite, high-performing Central Public Sector Enterprises (CPSEs) and boldly grant them significant operational and financial autonomy (like investing massive funds without government approval) to competitively help them become global giants. / \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 &#x27;\u0928\u0935\u0930\u0924\u094d\u0928&#x27; \u0915\u093e \u0926\u0930\u094d\u091c\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 1997 \u092e\u0947\u0902 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0909\u091a\u094d\u091a-\u092a\u094d\u0930\u0926\u0930\u094d\u0936\u0928 \u0935\u093e\u0932\u0947 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0947 \u0909\u0926\u094d\u092f\u092e\u094b\u0902 (CPSE) \u0915\u0940 \u092a\u0939\u091a\u093e\u0928 \u0915\u0930\u0928\u0947 \u0914\u0930 \u0909\u0928\u094d\u0939\u0947\u0902 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u0940 \u0930\u0942\u092a \u0938\u0947 \u0935\u0948\u0936\u094d\u0935\u093f\u0915 \u0926\u093f\u0917\u094d\u0917\u091c \u092c\u0928\u0928\u0947 \u092e\u0947\u0902 \u092e\u0926\u0926 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092a\u0930\u093f\u091a\u093e\u0932\u0928 \u0914\u0930 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u0938\u094d\u0935\u093e\u092f\u0924\u094d\u0924\u0924\u093e (\u091c\u0948\u0938\u0947 \u0938\u0930\u0915\u093e\u0930\u0940 \u0905\u0928\u0941\u092e\u094b\u0926\u0928 \u0915\u0947 \u092c\u093f\u0928\u093e \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0927\u0928 \u0915\u093e \u0928\u093f\u0935\u0947\u0936) \u092a\u094d\u0930\u0926\u093e\u0928 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092a\u0947\u0936 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q68.</b> Q89. Which statement best reflects the failure of structural transformation in Indian agriculture between 1950-1990? / 1950-1990 \u0915\u0947 \u092c\u0940\u091a \u092d\u093e\u0930\u0924\u0940\u092f \u0915\u0943\u0937\u093f \u092e\u0947\u0902 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 \u0915\u0940 \u0935\u093f\u092b\u0932\u0924\u093e \u0915\u094b \u0915\u094c\u0928 \u0938\u093e \u0915\u0925\u0928 \u0938\u092c\u0938\u0947 \u0905\u091a\u094d\u091b\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0926\u0930\u094d\u0936\u093e\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 22 Sep 2025, Shift-1]",
      "options": [
        "Agricultural GDP doubled / \u0915\u0943\u0937\u093f \u091c\u0940\u0921\u0940\u092a\u0940 \u0926\u094b\u0917\u0941\u0928\u0940 \u0939\u094b \u0917\u0908",
        "Agricultural workforce declined rapidly / \u0915\u0943\u0937\u093f \u0915\u093e\u0930\u094d\u092f\u092c\u0932 \u092e\u0947\u0902 \u0924\u0947\u091c\u0940 \u0938\u0947 \u0917\u093f\u0930\u093e\u0935\u091f \u0906\u0908",
        "65% of population remained in agriculture / 65% \u0906\u092c\u093e\u0926\u0940 \u0915\u0943\u0937\u093f \u092e\u0947\u0902 \u092c\u0928\u0940 \u0930\u0939\u0940",
        "Industrial sector absorbed excess labour / \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0928\u0947 \u0905\u0924\u093f\u0930\u093f\u0915\u094d\u0924 \u0936\u094d\u0930\u092e \u0915\u094b \u0905\u0935\u0936\u094b\u0937\u093f\u0924 \u0915\u0930 \u0932\u093f\u092f\u093e"
      ],
      "correctIndex": 2,
      "explanation": "A truly successful economic structural transformation strictly demands drastically shifting the workforce away from agriculture. While agriculture&#x27;s absolute share in India&#x27;s total GDP significantly declined, a shockingly high 65% of the massive workforce remained stubbornly trapped in agriculture by 1990, highlighting a colossal failure in industrial job creation. / \u0935\u093e\u0938\u094d\u0924\u0935 \u092e\u0947\u0902 \u090f\u0915 \u0938\u092b\u0932 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928 \u0915\u0947 \u0932\u093f\u090f \u0915\u093e\u0930\u094d\u092f\u092c\u0932 \u0915\u094b \u0915\u0943\u0937\u093f \u0938\u0947 \u0926\u0942\u0930 \u0932\u0947 \u091c\u093e\u0928\u0947 \u0915\u0940 \u0938\u0916\u094d\u0924 \u0906\u0935\u0936\u094d\u092f\u0915\u0924\u093e \u0939\u0948\u0964 \u091c\u092c\u0915\u093f \u092d\u093e\u0930\u0924 \u0915\u0947 \u0915\u0941\u0932 \u0938\u0915\u0932 \u0918\u0930\u0947\u0932\u0942 \u0909\u0924\u094d\u092a\u093e\u0926 \u092e\u0947\u0902 \u0915\u0943\u0937\u093f \u0915\u0940 \u092a\u0942\u0930\u094d\u0923 \u0939\u093f\u0938\u094d\u0938\u0947\u0926\u093e\u0930\u0940 \u0915\u093e\u092b\u0940 \u0915\u092e \u0939\u094b \u0917\u0908, 1990 \u0924\u0915 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0915\u093e\u0930\u094d\u092f\u092c\u0932 \u0915\u093e 65% \u0906\u0936\u094d\u091a\u0930\u094d\u092f\u091c\u0928\u0915 \u0930\u0942\u092a \u0938\u0947 \u0915\u0943\u0937\u093f \u092e\u0947\u0902 \u091c\u093f\u0926\u094d\u0926\u0940 \u0930\u0942\u092a \u0938\u0947 \u092b\u0902\u0938\u093e \u0930\u0939\u093e, \u091c\u094b \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u094c\u0915\u0930\u0940 \u0938\u0943\u091c\u0928 \u092e\u0947\u0902 \u090f\u0915 \u092c\u0921\u093c\u0940 \u0935\u093f\u092b\u0932\u0924\u093e \u0915\u094b \u0909\u091c\u093e\u0917\u0930 \u0915\u0930\u0924\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q69.</b> Q90. How did licensing policy under the planning era affect the emergence of large industrial conglomerates? / \u0928\u093f\u092f\u094b\u091c\u0928 \u092f\u0941\u0917 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0928\u0940\u0924\u093f \u0928\u0947 \u092c\u0921\u093c\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0938\u092e\u0942\u0939\u094b\u0902 \u0915\u0947 \u0909\u0926\u092f \u0915\u094b \u0915\u0948\u0938\u0947 \u092a\u094d\u0930\u092d\u093e\u0935\u093f\u0924 \u0915\u093f\u092f\u093e? [SSC CGL Tier 1, 22 Sep 2025, Shift-2]",
      "options": [
        "It increased FDI inflow / \u0907\u0938\u0928\u0947 FDI (\u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0935\u093f\u0926\u0947\u0936\u0940 \u0928\u093f\u0935\u0947\u0936) \u0905\u0902\u0924\u0930\u094d\u0935\u093e\u0939 \u092e\u0947\u0902 \u0935\u0943\u0926\u094d\u0927\u093f \u0915\u0940",
        "Allowed firms to block competitors by hoarding licenses / \u092b\u0930\u094d\u092e\u094b\u0902 \u0915\u094b \u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u091c\u092e\u093e \u0915\u0930\u0915\u0947 \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093f\u092f\u094b\u0902 \u0915\u094b \u0930\u094b\u0915\u0928\u0947 \u0915\u0940 \u0905\u0928\u0941\u092e\u0924\u093f \u0926\u0940",
        "It prevented market dominance / \u0907\u0938\u0928\u0947 \u092c\u093e\u091c\u093e\u0930 \u0915\u0947 \u092a\u094d\u0930\u092d\u0941\u0924\u094d\u0935 \u0915\u094b \u0930\u094b\u0915\u093e",
        "It enhanced rural employment / \u0907\u0938\u0928\u0947 \u0917\u094d\u0930\u093e\u092e\u0940\u0923 \u0930\u094b\u091c\u0917\u093e\u0930 \u092e\u0947\u0902 \u0935\u0943\u0926\u094d\u0927\u093f \u0915\u0940"
      ],
      "correctIndex": 1,
      "explanation": "Ironically, the incredibly strict industrial licensing policy deeply aimed at preventing monopolies heavily benefited existing massive industrial houses. Wealthy conglomerates ruthlessly exploited the system by pre-emptively obtaining and hoarding licenses without actually producing, effectively creating massive entry barriers to maliciously block new competitors. / \u0935\u093f\u0921\u0902\u092c\u0928\u093e \u092f\u0939 \u0939\u0948 \u0915\u093f \u090f\u0915\u093e\u0927\u093f\u0915\u093e\u0930 \u0915\u094b \u0930\u094b\u0915\u0928\u0947 \u0915\u0947 \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0938\u0947 \u092c\u0928\u093e\u0908 \u0917\u0908 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0938\u0916\u094d\u0924 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0928\u0940\u0924\u093f \u0938\u0947 \u092e\u094c\u091c\u0942\u0926\u093e \u092c\u0921\u093c\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0918\u0930\u093e\u0928\u094b\u0902 \u0915\u094b \u092d\u093e\u0930\u0940 \u092b\u093e\u092f\u0926\u093e \u0939\u0941\u0906\u0964 \u0927\u0928\u0940 \u0938\u092e\u0942\u0939\u094b\u0902 \u0928\u0947 \u0935\u093e\u0938\u094d\u0924\u0935 \u092e\u0947\u0902 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u093f\u090f \u092c\u093f\u0928\u093e \u092a\u0942\u0930\u094d\u0935-\u0916\u093e\u0932\u0940 \u0930\u0942\u092a \u0938\u0947 \u0932\u093e\u0907\u0938\u0947\u0902\u0938 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0914\u0930 \u091c\u092e\u093e \u0915\u0930\u0915\u0947 \u0938\u093f\u0938\u094d\u091f\u092e \u0915\u093e \u092c\u0947\u0930\u0939\u092e\u0940 \u0938\u0947 \u0936\u094b\u0937\u0923 \u0915\u093f\u092f\u093e, \u091c\u093f\u0938\u0938\u0947 \u0928\u090f \u092a\u094d\u0930\u0924\u093f\u0938\u094d\u092a\u0930\u094d\u0927\u093f\u092f\u094b\u0902 \u0915\u094b \u0926\u0941\u0930\u094d\u092d\u093e\u0935\u0928\u093e\u092a\u0942\u0930\u094d\u0923 \u0924\u0930\u0940\u0915\u0947 \u0938\u0947 \u0930\u094b\u0915\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u094d\u0930\u0935\u0947\u0936 \u092c\u093e\u0927\u093e\u090f\u0902 \u092a\u0948\u0926\u093e \u0939\u0941\u0908\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q70.</b> Q91. How does Indian planning demonstrate responsiveness to feedback? / \u092d\u093e\u0930\u0924\u0940\u092f \u0928\u093f\u092f\u094b\u091c\u0928 \u092b\u0940\u0921\u092c\u0948\u0915 (\u092a\u094d\u0930\u0924\u093f\u0915\u094d\u0930\u093f\u092f\u093e) \u0915\u0947 \u092a\u094d\u0930\u0924\u093f \u091c\u0935\u093e\u092c\u0926\u0947\u0939\u0940 \u0915\u0948\u0938\u0947 \u092a\u094d\u0930\u0926\u0930\u094d\u0936\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 22 Sep 2025, Shift-3]",
      "options": [
        "Finalizing plans before public opinion / \u091c\u0928\u092e\u0924 \u0938\u0947 \u092a\u0939\u0932\u0947 \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u094b \u0905\u0902\u0924\u093f\u092e \u0930\u0942\u092a \u0926\u0947\u0928\u093e",
        "Discarding public suggestions entirely / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0938\u0941\u091d\u093e\u0935\u094b\u0902 \u0915\u094b \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0916\u093e\u0930\u093f\u091c \u0915\u0930\u0928\u093e",
        "Consulting only foreign agencies / \u0915\u0947\u0935\u0932 \u0935\u093f\u0926\u0947\u0936\u0940 \u090f\u091c\u0947\u0902\u0938\u093f\u092f\u094b\u0902 \u0938\u0947 \u092a\u0930\u093e\u092e\u0930\u094d\u0936 \u0915\u0930\u0928\u093e",
        "Modifying drafts based on criticism / \u0906\u0932\u094b\u091a\u0928\u093e \u0915\u0947 \u0906\u0927\u093e\u0930 \u092a\u0930 \u0921\u094d\u0930\u093e\u092b\u094d\u091f \u092e\u0947\u0902 \u0938\u0902\u0936\u094b\u0927\u0928 \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "Historic Indian economic planning, despite being highly centralized, actively involved a democratic feedback process. Extensive Draft plans were officially published for massive public discussion and heavily debated. The Planning Commission routinely demonstrated high responsiveness by carefully modifying drafts based on constructive criticism from states, experts, and civil society. / \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u092d\u093e\u0930\u0924\u0940\u092f \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u093f\u092f\u094b\u091c\u0928, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u0915\u0943\u0924 \u0939\u094b\u0928\u0947 \u0915\u0947 \u092c\u093e\u0935\u091c\u0942\u0926, \u0938\u0915\u094d\u0930\u093f\u092f \u0930\u0942\u092a \u0938\u0947 \u090f\u0915 \u0932\u094b\u0915\u0924\u093e\u0902\u0924\u094d\u0930\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u0915\u094d\u0930\u093f\u092f\u093e \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e \u092e\u0947\u0902 \u0936\u093e\u092e\u093f\u0932 \u0925\u093e\u0964 \u0935\u094d\u092f\u093e\u092a\u0915 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u091a\u0930\u094d\u091a\u093e \u0914\u0930 \u092d\u093e\u0930\u0940 \u092c\u0939\u0938 \u0915\u0947 \u0932\u093f\u090f \u0935\u094d\u092f\u093e\u092a\u0915 \u0921\u094d\u0930\u093e\u092b\u094d\u091f \u092f\u094b\u091c\u0928\u093e\u090f\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u092a\u094d\u0930\u0915\u093e\u0936\u093f\u0924 \u0915\u0940 \u0917\u0908\u0902\u0964 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0928\u0947 \u0928\u093f\u092f\u092e\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0930\u093e\u091c\u094d\u092f\u094b\u0902, \u0935\u093f\u0936\u0947\u0937\u091c\u094d\u091e\u094b\u0902 \u0914\u0930 \u0928\u093e\u0917\u0930\u093f\u0915 \u0938\u092e\u093e\u091c \u0915\u0940 \u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0906\u0932\u094b\u091a\u0928\u093e \u0915\u0947 \u0906\u0927\u093e\u0930 \u092a\u0930 \u0921\u094d\u0930\u093e\u092b\u094d\u091f \u0915\u094b \u0938\u093e\u0935\u0927\u093e\u0928\u0940\u092a\u0942\u0930\u094d\u0935\u0915 \u0938\u0902\u0936\u094b\u0927\u093f\u0924 \u0915\u0930\u0915\u0947 \u0909\u091a\u094d\u091a \u092a\u094d\u0930\u0924\u093f\u0915\u094d\u0930\u093f\u092f\u093e \u0915\u093e \u092a\u094d\u0930\u0926\u0930\u094d\u0936\u0928 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q71.</b> Q92. What was the main objective of the Industrial Policy of 1956? / 1956 \u0915\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u094d\u092f\u093e \u0925\u093e? [SSC CGL Tier 1, 23 Sep 2025, Shift-1]",
      "options": [
        "Profit Maximization / \u0932\u093e\u092d \u0905\u0927\u093f\u0915\u0924\u092e\u0915\u0930\u0923",
        "Growth with equity / \u0938\u092e\u093e\u0928\u0924\u093e \u0915\u0947 \u0938\u093e\u0925 \u0935\u093f\u0915\u093e\u0938 (Growth with equity)",
        "Laissez-faire policy / \u0905\u0939\u0938\u094d\u0924\u0915\u094d\u0937\u0947\u092a \u0928\u0940\u0924\u093f",
        "Open market reforms / \u0916\u0941\u0932\u0947 \u092c\u093e\u091c\u093e\u0930 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930"
      ],
      "correctIndex": 1,
      "explanation": "The highly foundational Industrial Policy Resolution (IPR) 1956 was formally adopted to aggressively achieve the ambitious goal of a &quot;socialist pattern of society.&quot; Its absolute main objective was to drastically accelerate massive economic growth and rapid industrialization while ensuring deep social justice and sharply reducing inequalities (Growth with equity). / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0906\u0927\u093e\u0930\u092d\u0942\u0924 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a (IPR) 1956 \u0915\u094b \u0914\u092a\u091a\u093e\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 &quot;\u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0938\u092e\u093e\u091c \u0915\u0947 \u092a\u0948\u091f\u0930\u094d\u0928&quot; \u0915\u0947 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 \u0932\u0915\u094d\u0937\u094d\u092f \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u093e\u092a\u094d\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0905\u092a\u0928\u093e\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092e\u0941\u0916\u094d\u092f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0917\u0939\u0928 \u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u0928\u094d\u092f\u093e\u092f \u0938\u0941\u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0915\u0930\u0924\u0947 \u0939\u0941\u090f \u0914\u0930 \u0905\u0938\u092e\u093e\u0928\u0924\u093e\u0913\u0902 \u0915\u094b \u0924\u0947\u091c\u0940 \u0938\u0947 \u0915\u092e \u0915\u0930\u0924\u0947 \u0939\u0941\u090f (\u0938\u092e\u093e\u0928\u0924\u093e \u0915\u0947 \u0938\u093e\u0925 \u0935\u093f\u0915\u093e\u0938) \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u0914\u0930 \u0924\u0940\u0935\u094d\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0924\u0947\u091c\u0940 \u0932\u093e\u0928\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q72.</b> Q93. Which plan gave prominence to the Industrial Policy Resolution of 1956, emphasizing the &#x27;commanding heights&#x27; doctrine? / \u0915\u093f\u0938 \u092f\u094b\u091c\u0928\u093e \u0928\u0947 1956 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a \u0915\u094b \u092a\u094d\u0930\u092e\u0941\u0916\u0924\u093e \u0926\u0940, \u091c\u093f\u0938\u092e\u0947\u0902 &#x27;\u0915\u092e\u093e\u0902\u0921\u093f\u0902\u0917 \u0939\u093e\u0907\u091f\u094d\u0938&#x27; (commanding heights) \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u092a\u0930 \u091c\u094b\u0930 \u0926\u093f\u092f\u093e \u0917\u092f\u093e? [SSC CGL Tier 1, 23 Sep 2025, Shift-1]",
      "options": [
        "First Five Year Plan / \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Third Five Year Plan / \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Fourth Five Year Plan / \u091a\u094c\u0925\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e",
        "Second Five Year Plan / \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "The highly historic Second Five-Year Plan (1956-61) was explicitly formulated based entirely on the rigid principles of the IPR 1956. It robustly operationalized the strict doctrine that the public sector absolutely must occupy the exclusive &quot;commanding heights&quot; of the economy to strictly drive rapid state-led industrialization. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-61) \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 IPR 1956 \u0915\u0947 \u0915\u0920\u094b\u0930 \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924\u094b\u0902 \u0915\u0947 \u0906\u0927\u093e\u0930 \u092a\u0930 \u0924\u0948\u092f\u093e\u0930 \u0915\u0940 \u0917\u0908 \u0925\u0940\u0964 \u0907\u0938\u0928\u0947 \u0907\u0938 \u0938\u0916\u094d\u0924 \u0938\u093f\u0926\u094d\u0927\u093e\u0902\u0924 \u0915\u094b \u092e\u091c\u092c\u0942\u0924\u0940 \u0938\u0947 \u0932\u093e\u0917\u0942 \u0915\u093f\u092f\u093e \u0915\u093f \u0924\u0940\u0935\u094d\u0930 \u0930\u093e\u091c\u094d\u092f-\u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0915\u094b \u0938\u0916\u094d\u0924\u0940 \u0938\u0947 \u091a\u0932\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u094b \u0928\u093f\u0936\u094d\u091a\u093f\u0924 \u0930\u0942\u092a \u0938\u0947 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0940 \u0935\u093f\u0936\u0947\u0937 &quot;\u0915\u092e\u093e\u0902\u0921\u093f\u0902\u0917 \u0939\u093e\u0907\u091f\u094d\u0938&quot; \u092a\u0930 \u0915\u092c\u094d\u091c\u093e \u0915\u0930\u0928\u093e \u091a\u093e\u0939\u093f\u090f\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q73.</b> Q94. What was a key feature of the Industrial Policy Resolution of 1956? / 1956 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a \u0915\u0940 \u090f\u0915 \u092a\u094d\u0930\u092e\u0941\u0916 \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0915\u094d\u092f\u093e \u0925\u0940? [SSC CGL Tier 1, 23 Sep 2025, Shift-2]",
      "options": [
        "Full privatization / \u092a\u0942\u0930\u094d\u0923 \u0928\u093f\u091c\u0940\u0915\u0930\u0923",
        "Expansion of public sector / \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u093e \u0935\u093f\u0938\u094d\u0924\u093e\u0930",
        "Abolition of licensing / \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0915\u093e \u0909\u0928\u094d\u092e\u0942\u0932\u0928",
        "Emphasis on small-scale industry / \u0932\u0918\u0941 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u092a\u0930 \u091c\u094b\u0930"
      ],
      "correctIndex": 1,
      "explanation": "An absolute defining, monumental feature of the highly restrictive IPR 1956 was the massive, unparalleled expansion of the state-owned public sector. It aggressively classified industries into three strict schedules, permanently reserving the absolute most critical core industries exclusively for the state and establishing state dominance over future industrial growth. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u0924\u093f\u092c\u0902\u0927\u093e\u0924\u094d\u092e\u0915 IPR 1956 \u0915\u0940 \u090f\u0915 \u092a\u0942\u0930\u094d\u0923 \u092a\u093e\u0930\u093f\u092d\u093e\u0937\u093f\u0915, \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0935\u093f\u0936\u0947\u0937\u0924\u093e \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0938\u094d\u0935\u093e\u092e\u093f\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u093e \u0935\u093f\u0936\u093e\u0932, \u0905\u0926\u094d\u0935\u093f\u0924\u0940\u092f \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0925\u093e\u0964 \u0907\u0938\u0928\u0947 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0924\u0940\u0928 \u0938\u0916\u094d\u0924 \u0905\u0928\u0941\u0938\u0942\u091a\u093f\u092f\u094b\u0902 \u092e\u0947\u0902 \u0935\u0930\u094d\u0917\u0940\u0915\u0943\u0924 \u0915\u093f\u092f\u093e, \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u0938\u092c\u0938\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092e\u0941\u0916\u094d\u092f \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0932\u093f\u090f \u0906\u0930\u0915\u094d\u0937\u093f\u0924 \u0915\u093f\u092f\u093e \u0914\u0930 \u092d\u0935\u093f\u0937\u094d\u092f \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0935\u093f\u0915\u093e\u0938 \u092a\u0930 \u0930\u093e\u091c\u094d\u092f \u0915\u093e \u092a\u094d\u0930\u092d\u0941\u0924\u094d\u0935 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q74.</b> Q96. The rolling plan concept was introduced during which Prime Minister&#x27;s tenure? / \u0930\u094b\u0932\u093f\u0902\u0917 \u092a\u094d\u0932\u093e\u0928 (rolling plan) \u0915\u0940 \u0905\u0935\u0927\u093e\u0930\u0923\u093e \u0915\u093f\u0938 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u0915\u0947 \u0915\u093e\u0930\u094d\u092f\u0915\u093e\u0932 \u092e\u0947\u0902 \u092a\u0947\u0936 \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC CGL Tier 1, 23 Sep 2025, Shift-3]",

      ],
      "correctIndex": 1,
      "explanation": "The highly innovative concept of the Rolling Plan was directly introduced by the newly elected Janata Party government, powerfully led by Prime Minister Morarji Desai exactly in 1978. They abruptly terminated the existing Fifth Plan a year early and strategically introduced the Rolling Plan system to allow dynamic annual assessments. / \u0930\u094b\u0932\u093f\u0902\u0917 \u092a\u094d\u0932\u093e\u0928 \u0915\u0940 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0928\u0935\u0940\u0928 \u0905\u0935\u0927\u093e\u0930\u0923\u093e \u0915\u094b \u0938\u0940\u0927\u0947 \u0928\u0935 \u0928\u093f\u0930\u094d\u0935\u093e\u091a\u093f\u0924 \u091c\u0928\u0924\u093e \u092a\u093e\u0930\u094d\u091f\u0940 \u0938\u0930\u0915\u093e\u0930 \u0926\u094d\u0935\u093e\u0930\u093e \u092a\u0947\u0936 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e, \u091c\u093f\u0938\u0915\u093e \u0928\u0947\u0924\u0943\u0924\u094d\u0935 1978 \u092e\u0947\u0902 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u092e\u094b\u0930\u093e\u0930\u091c\u0940 \u0926\u0947\u0938\u093e\u0908 \u0928\u0947 \u092e\u091c\u092c\u0942\u0924\u0940 \u0938\u0947 \u0915\u093f\u092f\u093e \u0925\u093e\u0964 \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u092e\u094c\u091c\u0942\u0926\u093e \u092a\u093e\u0902\u091a\u0935\u0940\u0902 \u092f\u094b\u091c\u0928\u093e \u0915\u094b \u090f\u0915 \u0938\u093e\u0932 \u092a\u0939\u0932\u0947 \u0905\u091a\u093e\u0928\u0915 \u0938\u092e\u093e\u092a\u094d\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e \u0914\u0930 \u0917\u0924\u093f\u0936\u0940\u0932 \u0935\u093e\u0930\u094d\u0937\u093f\u0915 \u0906\u0915\u0932\u0928 \u0915\u0940 \u0905\u0928\u0941\u092e\u0924\u093f \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0930\u094b\u0932\u093f\u0902\u0917 \u092a\u094d\u0932\u093e\u0928 \u092a\u094d\u0930\u0923\u093e\u0932\u0940 \u0936\u0941\u0930\u0942 \u0915\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q75.</b> Q97. What was the central theme of the Industrial Policy Resolution of 1956? / 1956 \u0915\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0928\u0940\u0924\u093f \u0938\u0902\u0915\u0932\u094d\u092a \u0915\u093e \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f \u0935\u093f\u0937\u092f \u0915\u094d\u092f\u093e \u0925\u093e? [SSC CGL Tier 1, 23 Sep 2025, Shift-3]",
      "options": [
        "Full privatisation / \u092a\u0942\u0930\u094d\u0923 \u0928\u093f\u091c\u0940\u0915\u0930\u0923",
        "Import-led growth strategy / \u0906\u092f\u093e\u0924-\u0906\u0927\u093e\u0930\u093f\u0924 \u0935\u093f\u0915\u093e\u0938 \u0930\u0923\u0928\u0940\u0924\u093f",
        "Promoting consumer goods industry / \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0935\u0938\u094d\u0924\u0941 \u0909\u0926\u094d\u092f\u094b\u0917 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e",
        "State control of commanding heights / \u0915\u092e\u093e\u0902\u0921\u093f\u0902\u0917 \u0939\u093e\u0907\u091f\u094d\u0938 \u092a\u0930 \u0930\u093e\u091c\u094d\u092f \u0915\u093e \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923"
      ],
      "correctIndex": 3,
      "explanation": "The absolute central, overriding theme of the foundational IPR 1956 was forcefully establishing supreme state control over the exact &quot;commanding heights&quot; of the national economy. This famous socialist phrase explicitly refers to the absolutely strategic sectors (heavy industry, transport) that structurally control the crucial levers of the entire economy. / \u092e\u0942\u0932\u092d\u0942\u0924 IPR 1956 \u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u0915\u0947\u0902\u0926\u094d\u0930\u0940\u092f, \u0905\u0924\u093f\u0935\u094d\u092f\u093e\u092a\u0940 \u0935\u093f\u0937\u092f \u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0947 \u0938\u091f\u0940\u0915 &quot;\u0915\u092e\u093e\u0902\u0921\u093f\u0902\u0917 \u0939\u093e\u0907\u091f\u094d\u0938&quot; \u092a\u0930 \u0938\u0930\u094d\u0935\u094b\u091a\u094d\u091a \u0930\u093e\u091c\u094d\u092f \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u0915\u094b \u092c\u0932\u092a\u0942\u0930\u094d\u0935\u0915 \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u0930\u0928\u093e \u0925\u093e\u0964 \u092f\u0939 \u092a\u094d\u0930\u0938\u093f\u0926\u094d\u0927 \u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0935\u093e\u0915\u094d\u092f\u093e\u0902\u0936 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0909\u0928 \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 (\u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917, \u092a\u0930\u093f\u0935\u0939\u0928) \u0915\u094b \u0938\u0902\u0926\u0930\u094d\u092d\u093f\u0924 \u0915\u0930\u0924\u093e \u0939\u0948 \u091c\u094b \u092a\u0942\u0930\u0940 \u0905\u0930\u094d\u0925\u0935\u094d\u092f\u0935\u0938\u094d\u0925\u093e \u0915\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0932\u0940\u0935\u0930 \u0915\u094b \u0938\u0902\u0930\u091a\u0928\u093e\u0924\u094d\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u093f\u0924 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q76.</b> Q98. The Planning Commission was established in which year? / \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 (Planning Commission) \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u093f\u0938 \u0935\u0930\u094d\u0937 \u0939\u0941\u0908 \u0925\u0940? [SSC CGL Tier 1, 24 Sep 2025, Shift-1]",
      "options": [
        "1947 / 1947",
        "1950 / 1950",
        "1949 / 1949",
        "1952 / 1952"
      ],
      "correctIndex": 1,
      "explanation": "The highly influential Planning Commission of India was officially established precisely on March 15, 1950, exclusively by a direct executive resolution of the Government of India. The visionary Prime Minister Jawaharlal Nehru prominently served as its absolute first Chairman. It was monumentally dissolved in 2014 to create NITI Aayog. / \u092d\u093e\u0930\u0924 \u0915\u093e \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u094d\u0930\u092d\u093e\u0935\u0936\u093e\u0932\u0940 \u092f\u094b\u091c\u0928\u093e \u0906\u092f\u094b\u0917 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 \u0920\u0940\u0915 15 \u092e\u093e\u0930\u094d\u091a 1950 \u0915\u094b \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u092d\u093e\u0930\u0924 \u0938\u0930\u0915\u093e\u0930 \u0915\u0947 \u090f\u0915 \u092a\u094d\u0930\u0924\u094d\u092f\u0915\u094d\u0937 \u0915\u093e\u0930\u094d\u092f\u0915\u093e\u0930\u0940 \u092a\u094d\u0930\u0938\u094d\u0924\u093e\u0935 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u094d\u0925\u093e\u092a\u093f\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0926\u0942\u0930\u0926\u0930\u094d\u0936\u0940 \u092a\u094d\u0930\u0927\u093e\u0928 \u092e\u0902\u0924\u094d\u0930\u0940 \u091c\u0935\u093e\u0939\u0930\u0932\u093e\u0932 \u0928\u0947\u0939\u0930\u0942 \u0928\u0947 \u092a\u094d\u0930\u092e\u0941\u0916 \u0930\u0942\u092a \u0938\u0947 \u0907\u0938\u0915\u0947 \u092a\u0942\u0930\u094d\u0923 \u092a\u0939\u0932\u0947 \u0905\u0927\u094d\u092f\u0915\u094d\u0937 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093e\u0930\u094d\u092f \u0915\u093f\u092f\u093e\u0964 \u0928\u0940\u0924\u093f \u0906\u092f\u094b\u0917 (NITI Aayog) \u092c\u0928\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0907\u0938\u0947 2014 \u092e\u0947\u0902 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u092d\u0902\u0917 \u0915\u0930 \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q77.</b> Q99. Which Five Year Plan laid the foundation of India&#x27;s socialist pattern of society? / \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0928\u0947 \u092d\u093e\u0930\u0924 \u0915\u0947 &#x27;\u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0938\u094d\u0935\u0930\u0942\u092a \u0915\u0947 \u0938\u092e\u093e\u091c&#x27; (socialist pattern of society) \u0915\u0940 \u0928\u0940\u0902\u0935 \u0930\u0916\u0940? [SSC CGL Tier 1, 24 Sep 2025, Shift-2]",
      "options": [
        "First Plan / \u092a\u0939\u0932\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Third Plan / \u0924\u0940\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Second Plan / \u0926\u0942\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Fourth Plan / \u091a\u094c\u0925\u0940 \u092f\u094b\u091c\u0928\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The Indian Parliament formally adopted the highly ambitious &quot;socialist pattern of society&quot; explicitly as the supreme objective of social and economic policy in 1954. Consequently, the historic Second Five-Year Plan (1956-61) was meticulously drafted to physically lay the absolute foundation for this vision through rapid public-sector-led industrialization. / \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u0902\u0938\u0926 \u0928\u0947 1954 \u092e\u0947\u0902 \u0914\u092a\u091a\u093e\u0930\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u093e\u092e\u093e\u091c\u093f\u0915 \u0914\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u0928\u0940\u0924\u093f \u0915\u0947 \u0938\u0930\u094d\u0935\u094b\u091a\u094d\u091a \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u093e\u0915\u093e\u0902\u0915\u094d\u0937\u0940 &quot;\u0938\u092e\u093e\u091c\u0935\u093e\u0926\u0940 \u0938\u092e\u093e\u091c \u0915\u0947 \u092a\u0948\u091f\u0930\u094d\u0928&quot; \u0915\u094b \u0905\u092a\u0928\u093e\u092f\u093e\u0964 \u0928\u0924\u0940\u091c\u0924\u0928, \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0926\u0942\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1956-61) \u0915\u094b \u0924\u0940\u0935\u094d\u0930 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915-\u0915\u094d\u0937\u0947\u0924\u094d\u0930-\u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0935\u093e\u0932\u0947 \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0915\u0947 \u092e\u093e\u0927\u094d\u092f\u092e \u0938\u0947 \u0907\u0938 \u0926\u0943\u0937\u094d\u091f\u093f \u0915\u0947 \u0932\u093f\u090f \u092a\u0942\u0930\u094d\u0923 \u0906\u0927\u093e\u0930 \u092d\u094c\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0924\u0948\u092f\u093e\u0930 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u093e\u0935\u0927\u093e\u0928\u0940\u092a\u0942\u0930\u094d\u0935\u0915 \u0924\u0948\u092f\u093e\u0930 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q78.</b> Q100. Which sectors were largely excluded from industrial licensing after 1991? / 1991 \u0915\u0947 \u092c\u093e\u0926 \u0915\u093f\u0928 \u0915\u094d\u0937\u0947\u0924\u094d\u0930\u094b\u0902 \u0915\u094b \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0938\u0947 \u092c\u093e\u0939\u0930 \u0930\u0916\u093e \u0917\u092f\u093e \u0925\u093e? [SSC CGL Tier 1, 24 Sep 2025, Shift-2]",
      "options": [
        "Defense and Telecom / \u0930\u0915\u094d\u0937\u093e \u0914\u0930 \u0926\u0942\u0930\u0938\u0902\u091a\u093e\u0930",
        "Textiles and Fertilizers / \u0915\u092a\u0921\u093c\u093e \u0914\u0930 \u0909\u0930\u094d\u0935\u0930\u0915",
        "Alcohol, Cigarettes, Explosives / \u0936\u0930\u093e\u092c, \u0938\u093f\u0917\u0930\u0947\u091f, \u0935\u093f\u0938\u094d\u092b\u094b\u091f\u0915",
        "Agriculture and Education / \u0915\u0943\u0937\u093f \u0914\u0930 \u0936\u093f\u0915\u094d\u0937\u093e"
      ],
      "correctIndex": 1,
      "explanation": "The incredibly sweeping 1991 reforms radically and permanently delicensed almost all major industries to rapidly boost growth. Massive industries like Textiles, Fertilizers, Cement, and Automobiles were completely excluded from oppressive licensing. However, strict licensing was deliberately retained exclusively for a very short list of highly hazardous items like explosives and alcohol. / \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0935\u094d\u092f\u093e\u092a\u0915 1991 \u0915\u0947 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0928\u0947 \u0935\u093f\u0915\u093e\u0938 \u0915\u094b \u0924\u0947\u091c\u0940 \u0938\u0947 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0932\u0917\u092d\u0917 \u0938\u092d\u0940 \u092a\u094d\u0930\u092e\u0941\u0916 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u092e\u094c\u0932\u093f\u0915 \u0914\u0930 \u0938\u094d\u0925\u093e\u092f\u0940 \u0930\u0942\u092a \u0938\u0947 \u0928\u093f\u092f\u0902\u0924\u094d\u0930\u0923 \u092e\u0941\u0915\u094d\u0924 \u0915\u0930 \u0926\u093f\u092f\u093e\u0964 \u0915\u092a\u0921\u093c\u093e, \u0909\u0930\u094d\u0935\u0930\u0915, \u0938\u0940\u092e\u0947\u0902\u091f \u0914\u0930 \u0911\u091f\u094b\u092e\u094b\u092c\u093e\u0907\u0932 \u091c\u0948\u0938\u0947 \u092c\u0921\u093c\u0947 \u0909\u0926\u094d\u092f\u094b\u0917\u094b\u0902 \u0915\u094b \u0926\u092e\u0928\u0915\u093e\u0930\u0940 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u0938\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u092c\u093e\u0939\u0930 \u0915\u0930 \u0926\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u0939\u093e\u0932\u093e\u0902\u0915\u093f, \u0935\u093f\u0938\u094d\u092b\u094b\u091f\u0915 \u0914\u0930 \u0936\u0930\u093e\u092c \u091c\u0948\u0938\u0947 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0916\u0924\u0930\u0928\u093e\u0915 \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0940 \u090f\u0915 \u092c\u0939\u0941\u0924 \u091b\u094b\u091f\u0940 \u0938\u0942\u091a\u0940 \u0915\u0947 \u0932\u093f\u090f \u091c\u093e\u0928\u092c\u0942\u091d\u0915\u0930 \u0938\u0916\u094d\u0924 \u0932\u093e\u0907\u0938\u0947\u0902\u0938\u093f\u0902\u0917 \u092c\u0930\u0915\u0930\u093e\u0930 \u0930\u0916\u0940 \u0917\u0908 \u0925\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q79.</b> Q101. What is the primary goal of the &quot;Production Linked Incentive (PLI) scheme&quot;? / &quot;\u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0906\u0927\u093e\u0930\u093f\u0924 \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u0928 (PLI) \u092f\u094b\u091c\u0928\u093e&quot; \u0915\u093e \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0932\u0915\u094d\u0937\u094d\u092f \u0915\u094d\u092f\u093e \u0939\u0948? [SSC CGL Tier 1, 24 Sep 2025, Shift-3]",
      "options": [
        "To reduce fiscal deficit / \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0918\u093e\u091f\u0947 \u0915\u094b \u0915\u092e \u0915\u0930\u0928\u093e",
        "To promote exports of agricultural / \u0915\u0943\u0937\u093f \u0928\u093f\u0930\u094d\u092f\u093e\u0924 \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e",
        "To boost domestic manufacturing / \u0918\u0930\u0947\u0932\u0942 \u0935\u093f\u0928\u093f\u0930\u094d\u092e\u093e\u0923 (manufacturing) \u0915\u094b \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e",
        "To improve skill development / \u0915\u094c\u0936\u0932 \u0935\u093f\u0915\u093e\u0938 \u092e\u0947\u0902 \u0938\u0941\u0927\u093e\u0930 \u0915\u0930\u0928\u093e"
      ],
      "correctIndex": 2,
      "explanation": "The massive, highly strategic Production Linked Incentive (PLI) scheme explicitly aims to generously give large companies lucrative financial incentives directly based on their exact incremental sales. Its absolute primary goal is to aggressively boost advanced domestic manufacturing under the &quot;Make in India&quot; initiative and drastically reduce critical import dependence. / \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0932\u093f\u0902\u0915\u094d\u0921 \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u0928 (PLI) \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u0938\u094d\u092a\u0937\u094d\u091f \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u092c\u0921\u093c\u0940 \u0915\u0902\u092a\u0928\u093f\u092f\u094b\u0902 \u0915\u094b \u0938\u0940\u0927\u0947 \u0909\u0928\u0915\u0940 \u0938\u091f\u0940\u0915 \u0935\u0943\u0926\u094d\u0927\u093f\u0936\u0940\u0932 \u092c\u093f\u0915\u094d\u0930\u0940 \u0915\u0947 \u0906\u0927\u093e\u0930 \u092a\u0930 \u0906\u0915\u0930\u094d\u0937\u0915 \u0935\u093f\u0924\u094d\u0924\u0940\u092f \u092a\u094d\u0930\u094b\u0924\u094d\u0938\u093e\u0939\u0928 \u0926\u0947\u0928\u093e \u0939\u0948\u0964 \u0907\u0938\u0915\u093e \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915 \u0932\u0915\u094d\u0937\u094d\u092f &quot;\u092e\u0947\u0915 \u0907\u0928 \u0907\u0902\u0921\u093f\u092f\u093e&quot; \u092a\u0939\u0932 \u0915\u0947 \u0924\u0939\u0924 \u0909\u0928\u094d\u0928\u0924 \u0918\u0930\u0947\u0932\u0942 \u0935\u093f\u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0915\u094b \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092c\u0922\u093c\u093e\u0935\u093e \u0926\u0947\u0928\u093e \u0914\u0930 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0906\u092f\u093e\u0924 \u0928\u093f\u0930\u094d\u092d\u0930\u0924\u093e \u0915\u094b \u0915\u093e\u092b\u0940 \u0915\u092e \u0915\u0930\u0928\u093e \u0939\u0948\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q80.</b> Q102. What was the main focus of the First Five-Year Plan? / \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u092b\u094b\u0915\u0938 \u0915\u094d\u092f\u093e \u0925\u093e? [SSC CGL Tier 1, 24 Sep 2025, Shift-3]",
      "options": [
        "Heavy industries / \u092d\u093e\u0930\u0940 \u0909\u0926\u094d\u092f\u094b\u0917",
        "Urbanization / \u0936\u0939\u0930\u0940\u0915\u0930\u0923",
        "Agriculture / \u0915\u0943\u0937\u093f",
        "Information Technology / \u0938\u0942\u091a\u0928\u093e \u092a\u094d\u0930\u094c\u0926\u094d\u092f\u094b\u0917\u093f\u0915\u0940 (IT)"
      ],
      "correctIndex": 2,
      "explanation": "The highly crucial First Five-Year Plan (1951-56) primarily and aggressively focused entirely on the massive Agricultural Sector, including building monumental irrigation and power dams. The newly independent country was facing an agonizingly acute food shortage; hence, the absolute priority was to instantly solve the food crisis before industrializing. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u092a\u0939\u0932\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e (1951-56) \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0935\u093f\u0936\u093e\u0932 \u0915\u0943\u0937\u093f \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u092a\u0930 \u0915\u0947\u0902\u0926\u094d\u0930\u093f\u0924 \u0925\u0940, \u091c\u093f\u0938\u092e\u0947\u0902 \u0938\u094d\u092e\u093e\u0930\u0915\u0940\u092f \u0938\u093f\u0902\u091a\u093e\u0908 \u0914\u0930 \u092c\u093f\u091c\u0932\u0940 \u092c\u093e\u0902\u0927\u094b\u0902 \u0915\u093e \u0928\u093f\u0930\u094d\u092e\u093e\u0923 \u0936\u093e\u092e\u093f\u0932 \u0925\u093e\u0964 \u0928\u0935 \u0938\u094d\u0935\u0924\u0902\u0924\u094d\u0930 \u0926\u0947\u0936 \u0915\u094b \u092d\u094b\u091c\u0928 \u0915\u0940 \u092d\u093e\u0930\u0940 \u0915\u092e\u0940 \u0915\u093e \u0938\u093e\u092e\u0928\u093e \u0915\u0930\u0928\u093e \u092a\u0921\u093c \u0930\u0939\u093e \u0925\u093e; \u0907\u0938\u0932\u093f\u090f, \u0914\u0926\u094d\u092f\u094b\u0917\u0940\u0915\u0930\u0923 \u0938\u0947 \u092a\u0939\u0932\u0947 \u0916\u093e\u0926\u094d\u092f \u0938\u0902\u0915\u091f \u0915\u094b \u0924\u0941\u0930\u0902\u0924 \u0939\u0932 \u0915\u0930\u0928\u093e \u092a\u0942\u0930\u094d\u0923 \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0925\u0940\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q81.</b> Q103. Who is known as the architect of India&#x27;s Five-Year Plans? / \u092d\u093e\u0930\u0924 \u0915\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u0947 \u0935\u093e\u0938\u094d\u0924\u0941\u0915\u093e\u0930 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u0915\u093f\u0938\u0947 \u091c\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948? [SSC CGL Tier 1, 25 Sep 2025, Shift-1]",
      "options": [
        "Sardar Patel / \u0938\u0930\u0926\u093e\u0930 \u092a\u091f\u0947\u0932",
        "Jawaharlal Nehru / \u091c\u0935\u093e\u0939\u0930\u0932\u093e\u0932 \u0928\u0947\u0939\u0930\u0942",
        "R. Ambedkar / \u0906\u0930. \u0905\u0902\u092c\u0947\u0921\u0915\u0930",
        "C. Mahalanobis / \u0938\u0940. \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938"
      ],
      "correctIndex": 3,
      "explanation": "The brilliant statistician Prasanta Chandra Mahalanobis (P.C. Mahalanobis) is universally and highly regarded strictly as the chief architect of Indian economic planning. He notably founded the elite Indian Statistical Institute (ISI) and masterfully formulated the incredibly structured Second Five-Year Plan model, firmly defining India&#x27;s state-led industrial strategy. / \u0936\u093e\u0928\u0926\u093e\u0930 \u0938\u093e\u0902\u0916\u094d\u092f\u093f\u0915\u0940\u0935\u093f\u0926\u094d \u092a\u094d\u0930\u0936\u093e\u0902\u0924 \u091a\u0902\u0926\u094d\u0930 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 (P.C. Mahalanobis) \u0915\u094b \u0938\u093e\u0930\u094d\u0935\u092d\u094c\u092e\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0909\u091a\u094d\u091a \u0930\u0942\u092a \u0938\u0947 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u092d\u093e\u0930\u0924\u0940\u092f \u0906\u0930\u094d\u0925\u093f\u0915 \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u092e\u0941\u0916\u094d\u092f \u0935\u093e\u0938\u094d\u0924\u0941\u0915\u093e\u0930 \u0915\u0947 \u0930\u0942\u092a \u092e\u0947\u0902 \u092e\u093e\u0928\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964 \u0909\u0928\u094d\u0939\u094b\u0902\u0928\u0947 \u0935\u093f\u0936\u0947\u0937 \u0930\u0942\u092a \u0938\u0947 \u0915\u0941\u0932\u0940\u0928 \u092d\u093e\u0930\u0924\u0940\u092f \u0938\u093e\u0902\u0916\u094d\u092f\u093f\u0915\u0940 \u0938\u0902\u0938\u094d\u0925\u093e\u0928 (ISI) \u0915\u0940 \u0938\u094d\u0925\u093e\u092a\u0928\u093e \u0915\u0940 \u0914\u0930 \u092d\u093e\u0930\u0924 \u0915\u0940 \u0930\u093e\u091c\u094d\u092f-\u0928\u0947\u0924\u0943\u0924\u094d\u0935 \u0935\u093e\u0932\u0940 \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f \u0915\u094b \u0926\u0943\u0922\u093c\u0924\u093e \u0938\u0947 \u092a\u0930\u093f\u092d\u093e\u0937\u093f\u0924 \u0915\u0930\u0924\u0947 \u0939\u0941\u090f \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0938\u0902\u0930\u091a\u093f\u0924 \u0926\u094d\u0935\u093f\u0924\u0940\u092f \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u092e\u0949\u0921\u0932 \u0924\u0948\u092f\u093e\u0930 \u0915\u093f\u092f\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q82.</b> Q104. According to Mahalanobis strategy, growth should primarily be driven by investment in: / \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u0930\u0923\u0928\u0940\u0924\u093f \u0915\u0947 \u0905\u0928\u0941\u0938\u093e\u0930, \u0935\u093f\u0915\u093e\u0938 \u092e\u0941\u0916\u094d\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u093f\u0938\u092e\u0947\u0902 \u0928\u093f\u0935\u0947\u0936 \u0926\u094d\u0935\u093e\u0930\u093e \u0938\u0902\u091a\u093e\u0932\u093f\u0924 \u0939\u094b\u0928\u093e \u091a\u093e\u0939\u093f\u090f: [SSC CGL Tier 1, 25 Sep 2025, Shift-1]",
      "options": [
        "Agricultural inputs / \u0915\u0943\u0937\u093f \u0907\u0928\u092a\u0941\u091f",
        "Consumer goods sector / \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0935\u0938\u094d\u0924\u0941 \u0915\u094d\u0937\u0947\u0924\u094d\u0930",
        "Import-led services sector / \u0906\u092f\u093e\u0924-\u0906\u0927\u093e\u0930\u093f\u0924 \u0938\u0947\u0935\u093e \u0915\u094d\u0937\u0947\u0924\u094d\u0930",
        "Capital goods sector / \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0935\u0938\u094d\u0924\u0941 \u0915\u094d\u0937\u0947\u0924\u094d\u0930"
      ],
      "correctIndex": 3,
      "explanation": "The visionary Mahalanobis strategy explicitly and aggressively prioritized massive, unyielding investment strictly in the Capital Goods sector (heavy foundational industries like massive steel plants and power grids). The strict logic was that producing basic machines domestically would absolutely guarantee incredibly faster, self-reliant production of consumer goods later. / \u0926\u0942\u0930\u0926\u0930\u094d\u0936\u0940 \u092e\u0939\u093e\u0932\u0928\u094b\u092c\u093f\u0938 \u0930\u0923\u0928\u0940\u0924\u093f \u0928\u0947 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0914\u0930 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u092a\u0942\u0902\u091c\u0940\u0917\u0924 \u0935\u0938\u094d\u0924\u0941 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 (\u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0938\u094d\u091f\u0940\u0932 \u092a\u094d\u0932\u093e\u0902\u091f \u0914\u0930 \u092a\u093e\u0935\u0930 \u0917\u094d\u0930\u093f\u0921 \u091c\u0948\u0938\u0947 \u092d\u093e\u0930\u0940 \u092e\u0942\u0932\u092d\u0942\u0924 \u0909\u0926\u094d\u092f\u094b\u0917) \u092e\u0947\u0902 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930, \u0905\u0921\u093f\u0917 \u0928\u093f\u0935\u0947\u0936 \u0915\u094b \u092a\u094d\u0930\u093e\u0925\u092e\u093f\u0915\u0924\u093e \u0926\u0940\u0964 \u0938\u0916\u094d\u0924 \u0924\u0930\u094d\u0915 \u092f\u0939 \u0925\u093e \u0915\u093f \u0918\u0930\u0947\u0932\u0942 \u0938\u094d\u0924\u0930 \u092a\u0930 \u092c\u0941\u0928\u093f\u092f\u093e\u0926\u0940 \u092e\u0936\u0940\u0928\u094b\u0902 \u0915\u093e \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u092c\u093e\u0926 \u092e\u0947\u0902 \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e \u0935\u0938\u094d\u0924\u0941\u0913\u0902 \u0915\u0947 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0924\u0947\u091c, \u0906\u0924\u094d\u092e\u0928\u093f\u0930\u094d\u092d\u0930 \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0915\u0940 \u092a\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u0917\u093e\u0930\u0902\u091f\u0940 \u0926\u0947\u0917\u093e\u0964",
      "reference": ""
    },
    {
      "text": "<b>Q83.</b> Q105. What does &quot;P&quot; in LPG reforms stand for? / LPG \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u092e\u0947\u0902 &quot;P&quot; \u0915\u093e \u0915\u094d\u092f\u093e \u0905\u0930\u094d\u0925 \u0939\u0948? [SSC CGL Tier 1, 25 Sep 2025, Shift-2]",
      "options": [
        "Planning / \u092a\u094d\u0932\u093e\u0928\u093f\u0902\u0917 (\u0928\u093f\u092f\u094b\u091c\u0928)",
        "Production / \u092a\u094d\u0930\u094b\u0921\u0915\u094d\u0936\u0928 (\u0909\u0924\u094d\u092a\u093e\u0926\u0928)",
        "Privatisation / \u092a\u094d\u0930\u093e\u0907\u0935\u0947\u091f\u093e\u0907\u091c\u0947\u0936\u0928 (\u0928\u093f\u091c\u0940\u0915\u0930\u0923)",
        "Poverty / \u092a\u093e\u0935\u0930\u094d\u091f\u0940 (\u0917\u0930\u0940\u092c\u0940)"
      ],
      "correctIndex": 2,
      "explanation": "In the incredibly historic context of the sweeping 1991 economic reforms, the iconic acronym LPG explicitly stands for Liberalisation, Privatisation, and Globalisation. &quot;P&quot; strictly stands for Privatisation, a highly critical macroeconomic strategy that aggressively involves massively reducing the dominant role of the state public sector in business. / \u0935\u094d\u092f\u093e\u092a\u0915 1991 \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0915\u0947 \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0938\u0902\u0926\u0930\u094d\u092d \u092e\u0947\u0902, \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093f\u0924 \u0938\u0902\u0915\u094d\u0937\u093f\u092a\u094d\u0924 \u0928\u093e\u092e \u090f\u0932\u092a\u0940\u091c\u0940 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u0909\u0926\u093e\u0930\u0940\u0915\u0930\u0923, \u0928\u093f\u091c\u0940\u0915\u0930\u0923 \u0914\u0930 \u0935\u0948\u0936\u094d\u0935\u0940\u0915\u0930\u0923 \u0915\u0947 \u0932\u093f\u090f \u0939\u0948\u0964 &quot;P&quot; \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u0928\u093f\u091c\u0940\u0915\u0930\u0923 (Privatisation) \u0915\u0947 \u0932\u093f\u090f \u0939\u0948, \u091c\u094b \u090f\u0915 \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0938\u092e\u0937\u094d\u091f\u093f-\u0906\u0930\u094d\u0925\u093f\u0915 \u0930\u0923\u0928\u0940\u0924\u093f \u0939\u0948 \u091c\u093f\u0938\u092e\u0947\u0902 \u0935\u094d\u092f\u093e\u092a\u093e\u0930 \u092e\u0947\u0902 \u0930\u093e\u091c\u094d\u092f \u0915\u0947 \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u0940 \u092a\u094d\u0930\u092e\u0941\u0916 \u092d\u0942\u092e\u093f\u0915\u093e \u0915\u094b \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928       "reference": ""

    {
      "text": "<b>Q84.</b> Q106. The Green Revolution in India was introduced during which plan? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f (Green Revolution) \u0915\u093f\u0938 \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC CGL Tier 1, 25 Sep 2025, Shift-3]",
      "options": [
        "Second / \u0926\u0942\u0938\u0930\u0940",

        "Fifth / \u092a\u093e\u0902\u091a\u0935\u0940\u0902"
      ],
      "correctIndex": 2,
      "explanation": "The highly transformative Green Revolution was officially initiated in India precisely in 1966, aggressively following severe back-to-back droughts. While its massive full-scale implementation happened immediately during the subsequent Annual Plans, the critical strategic policy shift and foundational pilot projects actually began directly towards the turbulent end of the Third Five-Year Plan. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092a\u0930\u093f\u0935\u0930\u094d\u0924\u0928\u0915\u093e\u0930\u0940 \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0915\u094b \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u094c\u0930 \u092a\u0930 1966 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e, \u091c\u094b \u0932\u0917\u093e\u0924\u093e\u0930 \u092d\u092f\u0902\u0915\u0930 \u0938\u0942\u0916\u0947 \u0915\u0947 \u092c\u093e\u0926 \u0906\u0915\u094d\u0930\u093e\u092e\u0915 \u0930\u0942\u092a \u0938\u0947 \u0936\u0941\u0930\u0942 \u0939\u0941\u0906 \u0925\u093e\u0964 \u091c\u092c\u0915\u093f \u0907\u0938\u0915\u093e \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u092a\u0942\u0930\u094d\u0923 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0915\u093e\u0930\u094d\u092f\u093e\u0928\u094d\u0935\u092f\u0928 \u092c\u093e\u0926 \u0915\u0940 \u0935\u093e\u0930\u094d\u0937\u093f\u0915 \u092f\u094b\u091c\u0928\u093e\u0913\u0902 \u0915\u0947 \u0926\u094c\u0930\u093e\u0928 \u0939\u0941\u0906, \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0928\u0940\u0924\u093f \u092c\u0926\u0932\u093e\u0935 \u0914\u0930 \u092e\u0942\u0932\u092d\u0942\u0924 \u092a\u093e\u092f\u0932\u091f \u092a\u0930\u093f\u092f\u094b\u091c\u0928\u093e\u090f\u0902 \u0935\u093e\u0938\u094d\u0924\u0935 \u092e\u0947\u0902 \u0924\u0940\u0938\u0930\u0940 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0905\u0936\u093e\u0902\u0924 \u0905\u0902\u0924 \u0915\u0940 \u0913\u0930 \u0938\u0940\u0927\u0947 \u0936\u0941\u0930\u0942 \u0939\u0941\u0908\u0902\u0964",

    {
      "text": "<b>Q85.</b> Q107. Under which Five Year Plan was the Green Revolution introduced in India? / \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0915\u093f\u0938 \u092a\u0902\u091a\u0935\u0930\u094d\u0937\u0940\u092f \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0905\u0902\u0924\u0930\u094d\u0917\u0924 \u0936\u0941\u0930\u0942 \u0915\u0940 \u0917\u0908 \u0925\u0940? [SSC CGL Tier 1, 25 Sep 2025, Shift-3]",
      "options": [

        "Fourth Plan / \u091a\u094c\u0925\u0940 \u092f\u094b\u091c\u0928\u093e",
        "Third Plan / \u0924\u0940\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e"
      ],
      "correctIndex": 3,
      "explanation": "The highly disrupted Third Plan (1961-1966) is historically cited exactly because the crucial Intensive Agricultural District Programme (IADP) \u2013 the absolute foundational pilot program for the upcoming Green Revolution \u2013 was strategically started in 1961. The full, massive HYV seed strategy was urgently adopted directly at the very end of this Plan in 1966. / \u0905\u0924\u094d\u092f\u0927\u093f\u0915 \u092c\u093e\u0927\u093f\u0924 \u0924\u0940\u0938\u0930\u0940 \u092f\u094b\u091c\u0928\u093e (1961-1966) \u0915\u094b \u0910\u0924\u093f\u0939\u093e\u0938\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 \u0938\u091f\u0940\u0915 \u0930\u0942\u092a \u0938\u0947 \u0909\u0926\u094d\u0927\u0943\u0924 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0939\u0948 \u0915\u094d\u092f\u094b\u0902\u0915\u093f \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0917\u0939\u0928 \u0915\u0943\u0937\u093f \u091c\u093f\u0932\u093e \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e (IADP) - \u0906\u0917\u093e\u092e\u0940 \u0939\u0930\u093f\u0924 \u0915\u094d\u0930\u093e\u0902\u0924\u093f \u0915\u0947 \u0932\u093f\u090f \u092a\u0942\u0930\u094d\u0923 \u092e\u0942\u0932\u092d\u0942\u0924 \u092a\u093e\u092f\u0932\u091f \u0915\u093e\u0930\u094d\u092f\u0915\u094d\u0930\u092e - \u0930\u0923\u0928\u0940\u0924\u093f\u0915 \u0930\u0942\u092a \u0938\u0947 1961 \u092e\u0947\u0902 \u0936\u0941\u0930\u0942 \u0915\u093f\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964 \u092a\u0942\u0930\u094d\u0923, \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 HYV \u092c\u0940\u091c \u0930\u0923\u0928\u0940\u0924\u093f \u0915\u094b 1966 \u092e\u0947\u0902 \u0907\u0938 \u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0905\u0902\u0924 \u092e\u0947\u0902 \u0924\u0924\u094d\u0915\u093e\u0932 \u0905\u092a\u0928\u093e\u092f\u093e \u0917\u092f\u093e \u0925\u093e\u0964",
      "reference": ""

    {
      "text": "<b>Q86.</b> Q108. Which sector suffered due to reduction in fertilizer subsidies post-1991? / 1991 \u0915\u0947 \u092c\u093e\u0926 \u0909\u0930\u094d\u0935\u0930\u0915 \u0938\u092c\u094d\u0938\u093f\u0921\u0940 \u092e\u0947\u0902 \u0915\u092e\u0940 \u0915\u0947 \u0915\u093e\u0930\u0923 \u0915\u093f\u0938 \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u094b \u0928\u0941\u0915\u0938\u093e\u0928 \u0939\u0941\u0906? [SSC CGL Tier 1, 25 Sep 2025, Shift-3]",
      "options": [
        "Industrial / \u0914\u0926\u094d\u092f\u094b\u0917\u093f\u0915",
        "Banking / \u092c\u0948\u0902\u0915\u093f\u0902\u0917",
        "Service / \u0938\u0947\u0935\u093e",
        "Agriculture / \u0915\u0943\u0937\u093f"

      "correctIndex": 3,
      "explanation": "The incredibly rigorous post-1991 economic reforms strictly mandated massive fiscal consolidation, which unfortunately led directly to a severe, abrupt reduction in vital agricultural fertilizer subsidies. This drastic cut heavily increased production costs for struggling farmers, consequently causing the massive Agriculture sector to suffer significantly as public support drastically declined. / \u0905\u0935\u093f\u0936\u094d\u0935\u0938\u0928\u0940\u092f \u0930\u0942\u092a \u0938\u0947 \u0915\u0920\u094b\u0930 1991 \u0915\u0947 \u092c\u093e\u0926 \u0915\u0947 \u0906\u0930\u094d\u0925\u093f\u0915 \u0938\u0941\u0927\u093e\u0930\u094b\u0902 \u0928\u0947 \u0915\u0921\u093c\u093e\u0908 \u0938\u0947 \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0930\u093e\u091c\u0915\u094b\u0937\u0940\u092f \u0938\u092e\u0947\u0915\u0928 \u0915\u094b \u0905\u0928\u093f\u0935\u093e\u0930\u094d\u092f \u0915\u0930 \u0926\u093f\u092f\u093e, \u091c\u094b \u0926\u0941\u0930\u094d\u092d\u093e\u0917\u094d\u092f \u0938\u0947 \u0938\u0940\u0927\u0947 \u092e\u0939\u0924\u094d\u0935\u092a\u0942\u0930\u094d\u0923 \u0915\u0943\u0937\u093f \u0909\u0930\u094d\u0935\u0930\u0915 \u0938\u092c\u094d\u0938\u093f\u0921\u0940 \u092e\u0947\u0902 \u090f\u0915 \u0917\u0902\u092d\u0940\u0930, \u0905\u091a\u093e\u0928\u0915 \u0915\u092e\u0940 \u0915\u093e \u0915\u093e\u0930\u0923 \u092c\u0928\u093e\u0964 \u0907\u0938 \u092d\u093e\u0930\u0940 \u0915\u091f\u094c\u0924\u0940 \u0928\u0947 \u0938\u0902\u0918\u0930\u094d\u0937\u0930\u0924 \u0915\u093f\u0938\u093e\u0928\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0909\u0924\u094d\u092a\u093e\u0926\u0928 \u0932\u093e\u0917\u0924 \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0935\u0943\u0926\u094d\u0927\u093f \u0915\u0940, \u091c\u093f\u0938\u0915\u0947 \u092a\u0930\u093f\u0923\u093e\u092e\u0938\u094d\u0935\u0930\u0942\u092a \u092c\u0921\u093c\u0947 \u092a\u0948\u092e\u093e\u0928\u0947 \u092a\u0930 \u0915\u0943\u0937\u093f \u0915\u094d\u0937\u0947\u0924\u094d\u0930 \u0915\u094b \u0915\u093e\u092b\u0940 \u0928\u0941\u0915\u0938\u093e\u0928 \u0909\u0920\u093e\u0928\u093e \u092a\u0921\u093c\u093e \u0915\u094d\u092f\u094b\u0902\u0915\u093f \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0938\u092e\u0930\u094d\u0925\u0928 \u092e\u0947\u0902 \u092d\u093e\u0930\u0940 \u0917\u093f\u0930\u093e\u0935\u091f \u0906\u0908\u0964",

    {
      "text": "<b>Q87.</b> Q109. What was the aim of the Sixth Plan (1980-85)? / \u091b\u0920\u0940 \u092f\u094b\u091c\u0928\u093e (1980-85) \u0915\u093e \u0909\u0926\u094d\u0926\u0947\u0936\u094d\u092f \u0915\u094d\u092f\u093e \u0925\u093e? [SSC CGL Tier 1, 26 Sep 2025, Shift-1]",
      "options": [

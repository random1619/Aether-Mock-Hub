<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Synonyms Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+Devanagari:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#1b1a17;
    --paper:#f6f1e6;
    --card:#fffdf8;

    --accent:#8a5a2b;
    --correct:#2f6b3f;
    --correct-bg:#e4f2e6;
    --wrong:#a13d2e;
    --wrong-bg:#f8e6e2;
    --muted:#726b5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:32px 16px 80px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:3px double var(--rule);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(36px,7vw,56px);
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--muted);font-size:14px;}
  #tgBtn{
    display:inline-flex;align-items:center;gap:9px;
    margin-top:16px;
    background:#29a9eb;
    color:#fff;
    text-decoration:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 20px;
    border-radius:30px;
    box-shadow:0 3px 10px rgba(41,169,235,0.35);
    transition:transform .15s, box-shadow .15s;
  }
  #tgBtn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(41,169,235,0.45);}
  #tgBtn svg{flex-shrink:0;}
  #topicLine{
    margin-top:14px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--accent);
    background:var(--card);
    display:inline-block;
    padding:6px 18px;
    border:1px solid var(--rule);
    border-radius:20px;
  }

  #scoreBar{
    position:sticky;top:12px;z-index:10;
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:10px 18px;
    margin-bottom:26px;
    font-size:14px;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
  }
  #scoreBar b{font-family:'Fraunces',serif;font-size:17px;}
  #resetBtn{
    background:none;border:1px solid var(--rule);border-radius:6px;
    padding:5px 12px;font-size:12px;cursor:pointer;color:var(--muted);
    font-family:'Inter',sans-serif;
  }
  #resetBtn:hover{border-color:var(--accent);color:var(--accent);}

  .qcard{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:22px 22px 18px;
    margin-bottom:18px;
    position:relative;
  }
  .qnum{
    font-family:'Fraunces',serif;
    font-size:13px;
    color:var(--accent);
    font-weight:700;
    margin-bottom:4px;
  }
  .qtag{
    float:right;
    font-size:10.5px;
    color:var(--muted);
    background:var(--paper);
    border:1px solid var(--rule);
    padding:2px 8px;
    border-radius:20px;
  }
  .qtext{
    font-size:17px;
    line-height:1.5;
    margin:6px 0 14px;
  }
  .qtext .word{font-weight:700;color:var(--accent);}
  .options{display:grid;gap:9px;}
  .opt{
    display:flex;gap:10px;align-items:flex-start;
    text-align:left;
    background:var(--paper);
    border:1.5px solid var(--rule);
    border-radius:8px;
    padding:11px 14px;
    font-size:15px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .opt:hover:not(.locked){border-color:var(--accent);background:#fff;}
  .opt .lab{
    font-weight:700;
    color:var(--accent);
    min-width:18px;
  }
  .opt.correct{background:var(--correct-bg);border-color:var(--correct);}
  .opt.correct .lab{color:var(--correct);}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);}
  .opt.wrong .lab{color:var(--wrong);}
  .opt.locked{cursor:default;}
  .mark{margin-left:auto;font-weight:700;font-size:15px;}
  .mark.c{color:var(--correct);}
  .mark.w{color:var(--wrong);}

  .solution{
    display:none;
    margin-top:14px;
    padding:14px 16px;
    background:#fbf7ee;
    border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0;
    font-size:14.5px;
    line-height:1.65;
  }
  .solution.show{display:block;}
  .solution .hindi{
    font-family:'Noto Sans Devanagari','Inter',sans-serif;
  }
  .solution b{color:var(--accent);}
  .solution .lbl{
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin-bottom:6px;
  }

  footer{
    text-align:center;color:var(--muted);font-size:13px;margin-top:30px;
  }
</style>
</head>

const labels=['A','B','C','D'];
let score=0;
const answered=new Array(questions.length).fill(false);

function render(){
  const quiz=document.getElementById('quiz');
  quiz.innerHTML='';
  questions.forEach((item,qi)=>{
    const card=document.createElement('div');
    card.className='qcard';
    card.innerHTML=`
      <span class="qtag">${item.tag}</span>
      <div class="qnum">Question ${qi+1}</div>
      <div class="qtext">${item.q}</div>
      <div class="options" id="opts-${qi}"></div>
      <div class="solution" id="sol-${qi}">
        <div class="lbl">Solution</div>
        ${item.sol}
      </div>
    `;
    quiz.appendChild(card);
    const optsDiv=card.querySelector(`#opts-${qi}`);
    item.opts.forEach((opt,oi)=>{
      const btn=document.createElement('div');
      btn.className='opt';
      btn.innerHTML=`<span class="lab">${labels[oi]}</span><span>${opt}</span>`;
      btn.onclick=()=>selectOption(qi,oi);
      optsDiv.appendChild(btn);
    });
  });
  updateScore();
}

function selectOption(qi,oi){
  if(answered[qi]) return;
  answered[qi]=true;
  const item=questions[qi];
  const optsDiv=document.getElementById(`opts-${qi}`);
  const opts=optsDiv.querySelectorAll('.opt');
  opts.forEach((o,idx)=>{
    o.classList.add('locked');
    if(idx===item.ans){
      o.classList.add('correct');
      o.insertAdjacentHTML('beforeend','<span class="mark c">✓</span>');
    } else if(idx===oi){
      o.classList.add('wrong');
      o.insertAdjacentHTML('beforeend','<span class="mark w">✗</span>');
    }
  });
  if(oi===item.ans) score++;
  document.getElementById(`sol-${qi}`).classList.add('show');
  updateScore();
}

function updateScore(){
  document.getElementById('scoreVal').textContent=score;
}

function resetQuiz(){
  score=0;
  answered.fill(false);
  render();
}

render();
</script>
